<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D47A1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E676;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="80" r="220" fill="white" fill-opacity="0.05" />
  <circle cx="100" cy="560" r="180" fill="white" fill-opacity="0.05" />

  <!-- Site badge -->
  <rect x="80" y="60" width="220" height="44" rx="22" fill="white" fill-opacity="0.15" />
  <text x="190" y="88" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">BonsPlansMania.fr</text>

  <!-- Category badge -->
  <rect x="80" y="128" width="210" height="36" rx="18" fill="url(#badge)" />
  <text x="185" y="152" font-family="Arial, sans-serif" font-size="16" fill="#5B1A00" text-anchor="middle" font-weight="700">🧪 TEST PRODUIT</text>

  <!-- Keep badge -->
  <rect x="310" y="128" width="200" height="36" rx="18" fill="url(#keep)" />
  <text x="410" y="152" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">✅ Vous le gardez</text>

  <!-- Title -->
  <text x="80" y="248" font-family="Georgia, serif" font-size="50" fill="white" font-weight="400" fill-opacity="0.9">Philips</text>
  <text x="80" y="338" font-family="Georgia, serif" font-size="90" fill="white" font-weight="700">Product</text>

  <rect x="80" y="356" width="100" height="3" rx="2" fill="#FFD700" fill-opacity="0.8" />

  <text x="80" y="402" font-family="Arial, sans-serif" font-size="26" fill="white" fill-opacity="0.95" font-weight="600">Tester · Programme Officiel France</text>

  <!-- Info box -->
  <rect x="80" y="426" width="780" height="64" rx="12" fill="white" fill-opacity="0.12" />
  <text x="100" y="450" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.85">💆 Épilateurs · Brosses Sonicare · Robots · Cafetières · Rasoirs</text>
  <text x="100" y="478" font-family="Arial, sans-serif" font-size="22" fill="#FFD700" font-weight="700">Test 14 jours · Avis honnête · Produit offert définitivement</text>

  <!-- Badge -->
  <rect x="80" y="524" width="310" height="44" rx="10" fill="white" fill-opacity="0.15" />
  <text x="100" y="551" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">Gratuit · 3 à 6 questions · Livraison</text>

  <text x="80" y="606" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7">Mars 2026 · Programme officiel Philips</text>
</svg>
