<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="wel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5F0"/>
      <stop offset="100%" style="stop-color:#D0E8E0"/>
    </linearGradient>
    <linearGradient id="wel-teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5BA89A"/>
      <stop offset="100%" style="stop-color:#4A8A7A"/>
    </linearGradient>
    <linearGradient id="wel-soap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D8A8"/>
      <stop offset="100%" style="stop-color:#D4C490"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#wel-bg)"/>
  <!-- Product box -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="250" height="300" rx="8" fill="#8BBAB0" opacity="0.85"/>
    <!-- White label area -->
    <rect x="15" y="50" width="220" height="150" rx="4" fill="white" opacity="0.9"/>
    <!-- Brand -->
    <text x="125" y="85" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#2A5A4A" text-anchor="middle">WELEDA</text>
    <text x="125" y="102" font-family="Georgia, serif" font-size="9" fill="#5A8A7A" text-anchor="middle">Seit 1921</text>
    <!-- Product info -->
    <text x="125" y="125" font-family="Poppins, sans-serif" font-size="9" fill="#333" text-anchor="middle" font-weight="700">SHAMPOOING SOLIDE</text>
    <text x="125" y="142" font-family="Poppins, sans-serif" font-size="10" fill="#2A7A5A" text-anchor="middle" font-weight="800">HYDRATATION & BRILLANCE</text>
    <text x="125" y="160" font-family="Poppins, sans-serif" font-size="8" fill="#2A7A5A" text-anchor="middle">ALOE VERA + HUILE DE COCO</text>
    <text x="125" y="178" font-family="Poppins, sans-serif" font-size="7" fill="#666" text-anchor="middle">Sans silicone</text>
    <!-- Bottom band -->
    <rect x="15" y="210" width="220" height="30" rx="4" fill="#2A7A5A" opacity="0.8"/>
    <text x="125" y="230" font-family="Poppins, sans-serif" font-size="8" fill="white" text-anchor="middle">Cheveux normaux a secs</text>
    <!-- Bio badges -->
    <circle cx="80" cy="270" r="18" fill="#2A7A5A" opacity="0.7"/>
    <text x="80" y="273" font-family="Poppins, sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="bold">100%</text>
    <text x="80" y="281" font-family="Poppins, sans-serif" font-size="4" fill="white" text-anchor="middle">naturel</text>
    <circle cx="130" cy="270" r="18" fill="#2A7A5A" opacity="0.7"/>
    <text x="130" y="275" font-family="Poppins, sans-serif" font-size="6" fill="white" text-anchor="middle" font-weight="bold">BIO</text>
    <circle cx="180" cy="270" r="18" fill="#2A7A5A" opacity="0.7"/>
    <text x="180" y="273" font-family="Poppins, sans-serif" font-size="5" fill="white" text-anchor="middle" font-weight="bold">NATRUE</text>
  </g>
  <!-- Solid soap bar -->
  <g transform="translate(350, 140)">
    <ellipse cx="90" cy="90" rx="90" ry="85" fill="url(#wel-soap)"/>
    <ellipse cx="90" cy="85" rx="75" ry="20" fill="#D4C490" opacity="0.3"/>
    <text x="90" y="85" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#B0A070" text-anchor="middle" opacity="0.6">WELEDA</text>
  </g>
  <!-- Right side content -->
  <text x="540" y="70" font-family="Poppins, sans-serif" font-size="14" fill="#4A8A7A" font-weight="700">NOTRE AVIS</text>
  <text x="540" y="105" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#2A3A30">Weleda</text>
  <text x="540" y="135" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#2A3A30">Shampooing Solide</text>
  <text x="540" y="162" font-family="Georgia, serif" font-size="16" fill="#4A8A7A" font-style="italic">Hydratation & Brillance</text>
  <!-- Stars -->
  <g transform="translate(540, 180)">
    <polygon points="12,0 15,8 24,8 17,14 19,22 12,17 5,22 7,14 0,8 9,8" fill="#FFB800"/>
    <polygon points="37,0 40,8 49,8 42,14 44,22 37,17 30,22 32,14 25,8 34,8" fill="#FFB800"/>
    <polygon points="62,0 65,8 74,8 67,14 69,22 62,17 55,22 57,14 50,8 59,8" fill="#FFB800"/>
    <polygon points="87,0 90,8 99,8 92,14 94,22 87,17 80,22 82,14 75,8 84,8" fill="#FFB800"/>
    <polygon points="112,0 115,8 124,8 117,14 119,22 112,17 105,22 107,14 100,8 109,8" fill="#FFB800" opacity="0.5"/>
  </g>
  <text x="680" y="198" font-family="Poppins, sans-serif" font-size="14" fill="#888">4,5/5</text>
  <!-- Key points -->
  <g transform="translate(540, 225)">
    <circle cx="8" cy="8" r="8" fill="#2A7A5A" opacity="0.8"/>
    <text x="8" y="12" font-family="Poppins, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
    <text x="25" y="13" font-family="Poppins, sans-serif" font-size="12" fill="#2A3A30">100% naturel, certifie NATRUE</text>
  </g>
  <g transform="translate(540, 253)">
    <circle cx="8" cy="8" r="8" fill="#2A7A5A" opacity="0.8"/>
    <text x="8" y="12" font-family="Poppins, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
    <text x="25" y="13" font-family="Poppins, sans-serif" font-size="12" fill="#2A3A30">Aloe vera bio + huile coco bio</text>
  </g>
  <g transform="translate(540, 281)">
    <circle cx="8" cy="8" r="8" fill="#2A7A5A" opacity="0.8"/>
    <text x="8" y="12" font-family="Poppins, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
    <text x="25" y="13" font-family="Poppins, sans-serif" font-size="12" fill="#2A3A30">Cheveux normaux a secs</text>
  </g>
  <rect x="540" y="320" width="120" height="40" rx="20" fill="url(#wel-teal)"/>
  <text x="600" y="346" font-family="Poppins, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">~ 7 €</text>
  <text x="680" y="346" font-family="Poppins, sans-serif" font-size="12" fill="#888">sur Amazon</text>
  <!-- B Corp badge -->
  <rect x="540" y="380" width="100" height="24" rx="12" fill="#2A7A5A" opacity="0.2"/>
  <text x="590" y="396" font-family="Poppins, sans-serif" font-size="9" fill="#2A7A5A" text-anchor="middle" font-weight="700">Certifie B Corp</text>
</svg>