<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf6e3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5efe0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8d6e4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8956a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bio" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6a994e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8cb369;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Subtle argan leaf decorations -->
  <ellipse cx="720" cy="70" rx="30" ry="50" fill="#8cb369" opacity="0.08" transform="rotate(20, 720, 70)"/>
  <ellipse cx="750" cy="90" rx="25" ry="45" fill="#8cb369" opacity="0.06" transform="rotate(-15, 750, 90)"/>
  <ellipse cx="60" cy="390" rx="25" ry="40" fill="#8cb369" opacity="0.06" transform="rotate(30, 60, 390)"/>

  <!-- Badge TEST GRATUIT -->
  <rect x="40" y="25" width="200" height="36" rx="18" fill="url(#bio)"/>
  <text x="140" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">TEST GRATUIT BIO</text>

  <!-- Brand -->
  <text x="260" y="49" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#8d6e4a">Marilou Bio</text>

  <!-- Main title -->
  <text x="40" y="110" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#3d2e1e">ROUTINE</text>
  <text x="40" y="150" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#3d2e1e">PEAU NEUVE</text>
  <text x="40" y="185" font-family="Arial, sans-serif" font-size="18" fill="#8d6e4a">a l'huile d'argan bio</text>

  <!-- 3 products -->
  <text x="40" y="230" font-family="Arial, sans-serif" font-size="15" fill="#555">
    <tspan x="40" dy="0">&#x2714; Creme de jour — beurre de karite</tspan>
    <tspan x="40" dy="26">&#x2714; Creme de nuit — huile de jojoba</tspan>
    <tspan x="40" dy="26">&#x2714; Serum yeux eclat</tspan>
  </text>

  <!-- Deadline -->
  <rect x="40" y="320" width="280" height="40" rx="8" fill="url(#badge)"/>
  <text x="180" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Candidature jusqu'au 5 avril 2026</text>

  <!-- Product tubes illustration (right side) -->
  <!-- Tube 1 - creme de jour -->
  <rect x="520" y="100" width="55" height="160" rx="20" fill="white" stroke="#d4c5a0" stroke-width="1.5"/>
  <rect x="520" y="100" width="55" height="40" rx="20" fill="#f5e6c8"/>
  <text x="547" y="125" font-family="Arial, sans-serif" font-size="8" fill="#8d6e4a" text-anchor="middle">JOUR</text>
  <rect x="530" y="155" width="35" height="6" rx="3" fill="#d4c5a0" opacity="0.5"/>
  <rect x="530" y="170" width="35" height="6" rx="3" fill="#d4c5a0" opacity="0.3"/>
  <text x="547" y="210" font-family="Georgia, serif" font-size="9" fill="#8d6e4a" text-anchor="middle" font-style="italic">Marilou</text>
  <text x="547" y="222" font-family="Arial, sans-serif" font-size="7" fill="#6a994e" text-anchor="middle">BIO</text>

  <!-- Tube 2 - creme de nuit -->
  <rect x="595" y="85" width="55" height="175" rx="20" fill="white" stroke="#d4c5a0" stroke-width="1.5"/>
  <rect x="595" y="85" width="55" height="40" rx="20" fill="#e8dcc8"/>
  <text x="622" y="110" font-family="Arial, sans-serif" font-size="8" fill="#8d6e4a" text-anchor="middle">NUIT</text>
  <rect x="605" y="140" width="35" height="6" rx="3" fill="#d4c5a0" opacity="0.5"/>
  <rect x="605" y="155" width="35" height="6" rx="3" fill="#d4c5a0" opacity="0.3"/>
  <text x="622" y="200" font-family="Georgia, serif" font-size="9" fill="#8d6e4a" text-anchor="middle" font-style="italic">Marilou</text>
  <text x="622" y="212" font-family="Arial, sans-serif" font-size="7" fill="#6a994e" text-anchor="middle">BIO</text>

  <!-- Tube 3 - serum yeux -->
  <rect x="670" y="110" width="45" height="140" rx="16" fill="white" stroke="#d4c5a0" stroke-width="1.5"/>
  <rect x="670" y="110" width="45" height="35" rx="16" fill="#ddd5c0"/>
  <text x="692" y="132" font-family="Arial, sans-serif" font-size="7" fill="#8d6e4a" text-anchor="middle">YEUX</text>
  <rect x="680" y="160" width="25" height="5" rx="2.5" fill="#d4c5a0" opacity="0.5"/>
  <text x="692" y="200" font-family="Georgia, serif" font-size="8" fill="#8d6e4a" text-anchor="middle" font-style="italic">Marilou</text>
  <text x="692" y="210" font-family="Arial, sans-serif" font-size="6" fill="#6a994e" text-anchor="middle">BIO</text>

  <!-- Bio certification badge -->
  <circle cx="730" cy="90" r="22" fill="#6a994e"/>
  <text x="730" y="87" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">BIO</text>
  <text x="730" y="100" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">certifie</text>

  <!-- Ambassadrice badge -->
  <rect x="540" y="295" width="200" height="50" rx="10" fill="white" stroke="#8d6e4a" stroke-width="1.5"/>
  <text x="640" y="315" font-family="Arial, sans-serif" font-size="11" fill="#8d6e4a" text-anchor="middle">Devenez</text>
  <text x="640" y="333" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#8d6e4a" text-anchor="middle" font-style="italic">ambassadrice</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#d4c5a0"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#999" text-anchor="middle">bonsplansmania.fr — Marilou Bio, cosmetique bio francaise</text>
</svg>
