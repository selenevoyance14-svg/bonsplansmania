<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#2d1b3d"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#F5E6A3"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E8C"/>
      <stop offset="100%" style="stop-color:#C2185B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="150" cy="315" r="200" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.3"/>
  <circle cx="1050" cy="315" r="250" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.2"/>
  <circle cx="600" cy="315" r="350" fill="none" stroke="url(#gold)" stroke-width="0.3" opacity="0.15"/>
  <!-- Perfume bottle silhouette left -->
  <g transform="translate(120, 180)" opacity="0.6">
    <rect x="30" y="0" width="40" height="15" rx="3" fill="url(#gold)" opacity="0.7"/>
    <rect x="20" y="15" width="60" height="120" rx="8" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <rect x="35" y="25" width="30" height="80" rx="4" fill="url(#gold)" opacity="0.15"/>
  </g>
  <!-- Perfume bottle silhouette right -->
  <g transform="translate(1000, 200)" opacity="0.5">
    <rect x="25" y="0" width="30" height="12" rx="2" fill="url(#gold)" opacity="0.7"/>
    <rect x="10" y="12" width="60" height="100" rx="10" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <ellipse cx="40" cy="62" rx="20" ry="35" fill="url(#gold)" opacity="0.1"/>
  </g>
  <!-- Badge -75% -->
  <circle cx="950" cy="130" r="55" fill="url(#pink)"/>
  <text x="950" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="white">-75%</text>
  <text x="950" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.9">MAX</text>
  <!-- Main text -->
  <text x="600" y="220" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="url(#gold)" letter-spacing="8" opacity="0.8">PARFUMSMOINSCHER</text>
  <text x="600" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="900" fill="white">Parfums de Luxe</text>
  <text x="600" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="url(#gold)">jusqu'a -75%</text>
  <!-- Brand names -->
  <text x="600" y="420" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="white" opacity="0.7" letter-spacing="3">Guerlain · Boss · Issey Miyake · Calvin Klein · Givenchy</text>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="#D4AF37" opacity="0.9"/>
  <text x="600" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1a1a2e">+ de 5000 parfums 100% authentiques a prix casses</text>
  <!-- Top decorative line -->
  <line x1="350" y1="240" x2="850" y2="240" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
  <!-- Stars decoration -->
  <text x="280" y="295" font-size="16" fill="url(#gold)" opacity="0.4">✦</text>
  <text x="920" y="295" font-size="16" fill="url(#gold)" opacity="0.4">✦</text>
  <text x="310" y="360" font-size="12" fill="url(#gold)" opacity="0.3">✦</text>
  <text x="890" y="360" font-size="12" fill="url(#gold)" opacity="0.3">✦</text>
</svg>
