<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce4ec;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e84393;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative -->
  <circle cx="700" cy="70" r="80" fill="#ffd700" opacity="0.1"/>
  <circle cx="80" cy="390" r="50" fill="#e84393" opacity="0.06"/>

  <!-- Badge -->
  <rect x="40" y="25" width="340" height="36" rx="18" fill="url(#badge)"/>
  <text x="210" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">OFFRE SPECIALE PAQUES</text>

  <!-- Brand -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#2d3436">BIOTYFULL Box</text>
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="16" fill="#e84393" font-weight="bold">Eclosion Radieuse - Nouveaute 100% Innovation</text>

  <!-- Price -->
  <rect x="40" y="165" width="250" height="60" rx="12" fill="white" stroke="#e84393" stroke-width="2"/>
  <text x="55" y="192" font-family="Arial, sans-serif" font-size="16" fill="#636e72"><tspan text-decoration="line-through">39,90E</tspan></text>
  <text x="145" y="195" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#e84393">19,90E</text>
  <text x="165" y="216" font-family="Arial, sans-serif" font-size="12" fill="#636e72" text-anchor="middle">Valeur reelle : 129E</text>

  <!-- FOREO bonus -->
  <rect x="40" y="245" width="400" height="70" rx="12" fill="#ffd700" fill-opacity="0.15" stroke="#ffd700" stroke-width="1"/>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="14" fill="#2d3436" font-weight="bold">+ Brosse FOREO LUNA mini 2 OFFERTE</text>
  <text x="60" y="292" font-family="Arial, sans-serif" font-size="13" fill="#636e72">Valeur reelle : 149E - 100% offerte</text>
  <text x="60" y="308" font-family="Arial, sans-serif" font-size="11" fill="#e84393">8 intensites - nettoyage sur-mesure en profondeur</text>

  <!-- Total value -->
  <text x="40" y="355" font-family="Arial, sans-serif" font-size="15" fill="#444">Valeur totale : <tspan font-weight="bold" fill="#e84393">278E</tspan> pour <tspan font-weight="bold" fill="#e84393">19,90E</tspan></text>

  <!-- Box illustration (right side) -->
  <rect x="520" y="70" width="130" height="170" rx="12" fill="white" stroke="#ffc8dd" stroke-width="2"/>
  <rect x="520" y="70" width="130" height="40" rx="12" fill="#ffc8dd" opacity="0.5"/>
  <text x="585" y="96" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e84393" text-anchor="middle">BIOTYFULL</text>
  <rect x="538" y="125" width="18" height="50" rx="4" fill="#a8e6cf" opacity="0.5"/>
  <rect x="562" y="130" width="16" height="45" rx="4" fill="#ffd3b6" opacity="0.5"/>
  <rect x="584" y="120" width="20" height="55" rx="4" fill="#dcedc1" opacity="0.5"/>
  <rect x="610" y="128" width="16" height="47" rx="4" fill="#fab1a0" opacity="0.4"/>

  <!-- FOREO illustration -->
  <circle cx="710" cy="180" r="55" fill="#ffd700" opacity="0.3"/>
  <circle cx="710" cy="180" r="40" fill="#ffd700" opacity="0.25"/>
  <text x="710" y="175" font-family="Arial, sans-serif" font-size="10" fill="#2d3436" text-anchor="middle" font-weight="bold">FOREO</text>
  <text x="710" y="190" font-family="Arial, sans-serif" font-size="9" fill="#2d3436" text-anchor="middle">LUNA mini 2</text>

  <!-- Value sticker -->
  <circle cx="660" cy="330" r="42" fill="#e84393"/>
  <text x="660" y="322" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">VALEUR</text>
  <text x="660" y="342" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">278E</text>
  <text x="660" y="358" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">pour 19,90E</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#f0c0d0"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#b0b0b0" text-anchor="middle">bonsplansmania.fr — Biotyfull Box</text>
</svg>