<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Tablette -->
  <rect x="240" y="80" width="260" height="180" rx="10" fill="#333"/>
  <rect x="248" y="88" width="244" height="164" rx="6" fill="#1A237E"/>
  <!-- Écran contenu -->
  <rect x="252" y="92" width="236" height="156" rx="4" fill="#263238"/>
  <text x="370" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#64B5F6">Android 15</text>
  <text x="370" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#90A4AE">24GB + 128GB</text>
  <text x="370" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#78909C">Octa-Core • 10.1" HD IPS</text>
  <!-- Clavier détaché en dessous -->
  <rect x="230" y="275" width="280" height="60" rx="6" fill="#444"/>
  <rect x="235" y="280" width="270" height="50" rx="4" fill="#4A4A4A"/>
  <!-- Rangées de touches -->
  <rect x="245" y="287" width="250" height="8" rx="2" fill="#555"/>
  <rect x="245" y="299" width="250" height="8" rx="2" fill="#555"/>
  <rect x="245" y="311" width="250" height="8" rx="2" fill="#555"/>
  <rect x="275" y="323" width="190" height="5" rx="2" fill="#555"/>
  <!-- Souris -->
  <ellipse cx="570" cy="300" rx="22" ry="30" fill="#444"/>
  <ellipse cx="570" cy="295" rx="20" ry="27" fill="#4A4A4A"/>
  <line x1="570" y1="275" x2="570" y2="295" stroke="#555" stroke-width="1"/>
  <!-- Badge -18% -->
  <circle cx="700" cy="80" r="45" fill="#F44336"/>
  <text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF">-18%</text>
  <text x="700" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFCDD2">89,99€</text>
  <!-- Badge specs -->
  <rect x="30" y="60" width="130" height="40" rx="8" fill="#1565C0"/>
  <text x="95" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">24GB + 128GB</text>
  <text x="95" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#BBDEFB">Clavier + Souris inclus</text>
  <!-- Titre -->
  <rect x="120" y="360" width="560" height="70" rx="10" fill="rgba(21,101,192,0.85)"/>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">Aobante Tablette Android 15 10,1"</text>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#BBDEFB">Octa-Core — 6000 mAh — Widevine L1 — Clavier + Souris</text>
</svg>
