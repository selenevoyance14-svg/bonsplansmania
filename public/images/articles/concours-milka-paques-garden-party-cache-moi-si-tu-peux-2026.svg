<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b4fbe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a87fd4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0c040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative -->
  <circle cx="680" cy="80" r="80" fill="white" opacity="0.05"/>
  <circle cx="100" cy="380" r="60" fill="white" opacity="0.04"/>
  <circle cx="400" cy="20" r="6" fill="white" opacity="0.15"/>
  <circle cx="500" cy="35" r="4" fill="white" opacity="0.12"/>
  <circle cx="300" cy="25" r="5" fill="white" opacity="0.1"/>

  <!-- Badge -->
  <rect x="40" y="25" width="220" height="36" rx="18" fill="url(#badge)"/>
  <text x="150" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7b4fbe" text-anchor="middle" letter-spacing="1">JEU CONCOURS</text>

  <!-- Brand -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="40" font-weight="900" fill="white">Milka</text>
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.8">Cache-moi si tu peux !</text>

  <!-- Main title -->
  <text x="40" y="195" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="white">Gagne ta</text>
  <text x="40" y="230" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#ffd700">GARDEN PARTY</text>
  <text x="40" y="265" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="white">de reve</text>

  <!-- Info -->
  <rect x="40" y="290" width="420" height="55" rx="12" fill="white" fill-opacity="0.12"/>
  <text x="60" y="313" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.9">Reception en plein air jusqu'a 10 personnes</text>
  <text x="60" y="333" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.9">Scannez le QR code ou rendez-vous sur milka.com</text>

  <!-- How to play -->
  <text x="40" y="380" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.7">Achetez un chocolat Milka Paques en magasin</text>

  <!-- Bunny illustration (right side) -->
  <!-- Body -->
  <ellipse cx="640" cy="240" rx="50" ry="70" fill="#9b6fc0" opacity="0.5"/>
  <!-- Head -->
  <circle cx="640" cy="155" r="35" fill="#9b6fc0" opacity="0.5"/>
  <!-- Ears -->
  <ellipse cx="620" cy="100" rx="12" ry="35" fill="#9b6fc0" opacity="0.4"/>
  <ellipse cx="660" cy="105" rx="12" ry="32" fill="#9b6fc0" opacity="0.4"/>
  <ellipse cx="620" cy="100" rx="6" ry="20" fill="white" opacity="0.1"/>
  <ellipse cx="660" cy="105" rx="6" ry="18" fill="white" opacity="0.1"/>
  <!-- Bow -->
  <rect x="618" y="182" width="44" height="12" rx="6" fill="#ffd700" opacity="0.5"/>

  <!-- Eggs -->
  <ellipse cx="570" cy="340" rx="16" ry="20" fill="#9b6fc0" opacity="0.3"/>
  <ellipse cx="710" cy="350" rx="14" ry="18" fill="#c8a0e0" opacity="0.25"/>
  <ellipse cx="680" cy="330" rx="12" ry="15" fill="#ffd700" opacity="0.15"/>

  <!-- Garden party badge -->
  <circle cx="720" cy="160" r="40" fill="white" opacity="0.15"/>
  <text x="720" y="155" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">JUSQU'A</text>
  <text x="720" y="172" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">10 PERS.</text>

  <!-- Footer -->
  <rect x="40" y="408" width="720" height="1" fill="white" opacity="0.1"/>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.3" text-anchor="middle">bonsplansmania.fr — Milka Paques 2026</text>
</svg>