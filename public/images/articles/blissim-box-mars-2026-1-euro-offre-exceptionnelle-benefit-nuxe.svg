<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5e6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4d6d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff758f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="60" fill="#c8b6ff" opacity="0.2"/>
  <circle cx="720" cy="350" r="90" fill="#ffc8dd" opacity="0.2"/>
  <circle cx="100" cy="380" r="50" fill="#bde0fe" opacity="0.3"/>

  <!-- Badge "OFFRE EXCEPTIONNELLE" -->
  <rect x="40" y="30" width="280" height="36" rx="18" fill="url(#badge)"/>
  <text x="180" y="54" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">OFFRE EXCEPTIONNELLE</text>

  <!-- Main title -->
  <text x="40" y="115" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#1a1a2e">BOX BLISSIM</text>
  <text x="40" y="170" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#1a1a2e">DE MARS</text>

  <!-- Price highlight -->
  <rect x="40" y="195" width="200" height="65" rx="10" fill="#1a1a2e"/>
  <text x="140" y="238" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="white" text-anchor="middle">A 1 EURO</text>

  <!-- Old price -->
  <text x="260" y="238" font-family="Arial, sans-serif" font-size="22" fill="#888" text-anchor="start">au lieu de</text>
  <text x="370" y="238" font-family="Arial, sans-serif" font-size="22" fill="#888" text-anchor="start" text-decoration="line-through">17,90E</text>

  <!-- Features -->
  <text x="40" y="300" font-family="Arial, sans-serif" font-size="16" fill="#444">
    <tspan x="40" dy="0">&#x2714; 5 produits beaute, livraison incluse</tspan>
    <tspan x="40" dy="28">&#x2714; Benefit, La Roche-Posay, Nuxe ou Umberto Gianini au choix</tspan>
    <tspan x="40" dy="28">&#x2714; Serum Garancia offert</tspan>
  </text>

  <!-- Box illustration (right side) -->
  <rect x="530" y="100" width="220" height="260" rx="16" fill="white" stroke="#e0d4f5" stroke-width="2" opacity="0.9"/>
  <rect x="530" y="100" width="220" height="50" rx="16" fill="#c8b6ff" opacity="0.5"/>
  <text x="640" y="132" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4a3580" text-anchor="middle">Blissim</text>

  <!-- Products inside box -->
  <rect x="555" y="170" width="40" height="80" rx="8" fill="#ffc8dd"/>
  <rect x="605" y="180" width="35" height="70" rx="6" fill="#bde0fe"/>
  <rect x="650" y="165" width="30" height="85" rx="6" fill="#d4a5ff"/>
  <rect x="690" y="175" width="38" height="75" rx="8" fill="#ffd6a5"/>

  <!-- Price sticker on box -->
  <circle cx="710" cy="130" r="35" fill="#ff4d6d"/>
  <text x="710" y="125" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">1E</text>
  <text x="710" y="145" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">seulement</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#ddd"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#999" text-anchor="middle">bonsplansmania.fr — Offre sous engagement 12 mois</text>
</svg>
