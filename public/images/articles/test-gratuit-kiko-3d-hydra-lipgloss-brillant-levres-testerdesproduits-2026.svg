<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF2F8"/>
      <stop offset="50%" style="stop-color:#FCE7F3"/>
      <stop offset="100%" style="stop-color:#FBE0EC"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E05A6D"/>
      <stop offset="100%" style="stop-color:#D94462"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6A3"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#DB2777"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Lipgloss tube illustration -->
  <g transform="translate(110, 180)" opacity="0.3">
    <ellipse cx="25" cy="10" rx="18" ry="10" fill="url(#gold)"/>
    <rect x="7" y="10" width="36" height="100" rx="14" fill="url(#gold)" opacity="0.6"/>
    <rect x="12" y="30" width="26" height="50" rx="10" fill="url(#pink)" opacity="0.3"/>
    <line x1="25" y1="0" x2="25" y2="-20" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="25" cy="-22" r="5" fill="url(#gold)" opacity="0.7"/>
  </g>
  <!-- Sparkles -->
  <text x="200" y="200" font-size="16" fill="url(#pink)" opacity="0.3">&#10022;</text>
  <text x="1000" y="180" font-size="20" fill="url(#pink)" opacity="0.25">&#10022;</text>
  <text x="150" y="400" font-size="12" fill="url(#pink)" opacity="0.2">&#10022;</text>
  <text x="1050" y="350" font-size="14" fill="url(#pink)" opacity="0.2">&#10022;</text>
  <!-- Badge TEST GRATUIT -->
  <rect x="370" y="50" width="460" height="52" rx="26" fill="url(#red)"/>
  <text x="600" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="white">TEST GRATUIT · 18 EXEMPLAIRES</text>
  <!-- Brand -->
  <text x="600" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="url(#pink)" opacity="0.6" letter-spacing="6">KIKO MILANO</text>
  <!-- Main text -->
  <text x="600" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="50" font-weight="900" fill="#1F2937">3D Hydra Lipgloss</text>
  <text x="600" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="url(#pink)">Brillant à Lèvres Hydratant</text>
  <!-- Features -->
  <g transform="translate(230, 365)">
    <rect x="0" y="0" width="140" height="38" rx="19" fill="url(#pink)" opacity="0.1"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#DB2777">Effet 3D</text>
  </g>
  <g transform="translate(390, 365)">
    <rect x="0" y="0" width="140" height="38" rx="19" fill="url(#pink)" opacity="0.1"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#DB2777">Hydratant</text>
  </g>
  <g transform="translate(550, 365)">
    <rect x="0" y="0" width="160" height="38" rx="19" fill="url(#pink)" opacity="0.1"/>
    <text x="80" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#DB2777">Non collant</text>
  </g>
  <g transform="translate(730, 365)">
    <rect x="0" y="0" width="190" height="38" rx="19" fill="url(#pink)" opacity="0.1"/>
    <text x="95" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#DB2777">Ultra-brillant</text>
  </g>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="url(#red)" opacity="0.95"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">Tirage au sort le 8 juin 2026 — Inscription gratuite — Tester des Produits</text>
</svg>
