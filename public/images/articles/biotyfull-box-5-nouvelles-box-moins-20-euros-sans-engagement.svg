<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5f5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0e6f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce4ec;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Title banner -->
  <rect x="180" y="20" width="440" height="30" rx="15" fill="url(#purple)" opacity="0.8"/>
  <text x="400" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" letter-spacing="2">CÉLÉBREZ LE 20</text>

  <!-- Main title -->
  <text x="400" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#4a148c">5 Nouvelles Box</text>
  <text x="400" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#666">pour moins de <tspan font-weight="bold" fill="#9c27b0" font-size="28">20€</tspan></text>

  <!-- Sans engagement -->
  <rect x="250" y="140" width="300" height="28" rx="4" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="400" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" letter-spacing="1">ABONNEMENT SANS ENGAGEMENT</text>

  <!-- Central box - Fraîcheur Florale -->
  <g transform="translate(270, 185)">
    <!-- Box shape -->
    <rect x="0" y="0" width="260" height="160" rx="12" fill="white" opacity="0.9" stroke="#b2dfdb" stroke-width="2"/>

    <!-- Floral/citrus decorative pattern -->
    <circle cx="40" cy="30" r="12" fill="#fff59d" opacity="0.4"/>
    <circle cx="220" cy="25" r="10" fill="#fff59d" opacity="0.35"/>
    <circle cx="130" cy="20" r="8" fill="#c8e6c9" opacity="0.4"/>
    <ellipse cx="60" cy="55" rx="15" ry="7" fill="#81c784" opacity="0.3" transform="rotate(-20 60 55)"/>
    <ellipse cx="200" cy="50" rx="12" ry="6" fill="#81c784" opacity="0.25" transform="rotate(15 200 50)"/>
    <ellipse cx="160" cy="35" rx="10" ry="5" fill="#a5d6a7" opacity="0.3" transform="rotate(-10 160 35)"/>

    <!-- Products inside -->
    <rect x="30" y="45" width="24" height="65" rx="5" fill="#e8f5e9" opacity="0.8"/>
    <rect x="62" y="38" width="20" height="72" rx="4" fill="white" stroke="#ccc" stroke-width="0.5"/>
    <rect x="90" y="42" width="22" height="66" rx="5" fill="#1565c0" opacity="0.5"/>
    <circle cx="101" cy="52" r="6" fill="white" opacity="0.3"/>
    <rect x="120" y="35" width="18" height="75" rx="4" fill="#fff9c4" opacity="0.8"/>
    <rect x="146" y="40" width="24" height="68" rx="5" fill="white" stroke="#ccc" stroke-width="0.5"/>
    <rect x="178" y="45" width="20" height="62" rx="4" fill="#a5d6a7" opacity="0.6"/>
    <rect x="206" y="42" width="22" height="66" rx="5" fill="#ffcc80" opacity="0.6"/>

    <!-- Biotyfull Box label -->
    <text x="130" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a148c">BIOTYFULL</text>
    <text x="130" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7b1fa2" font-style="italic">box</text>
  </g>

  <!-- Flower decoration top -->
  <circle cx="250" cy="210" r="10" fill="#f48fb1" opacity="0.35"/>
  <circle cx="238" cy="200" r="7" fill="#f8bbd0" opacity="0.3"/>
  <circle cx="555" cy="195" r="8" fill="#ce93d8" opacity="0.3"/>
  <circle cx="565" cy="208" r="6" fill="#e1bee7" opacity="0.25"/>

  <!-- 5 box count badge -->
  <circle cx="115" cy="260" r="42" fill="url(#purple)"/>
  <text x="115" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">5</text>
  <text x="115" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">BOX</text>

  <!-- Value badge right -->
  <circle cx="685" cy="260" r="42" fill="url(#purple)"/>
  <text x="685" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">357€</text>
  <text x="685" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">de produits</text>

  <!-- Box names list -->
  <rect x="140" y="365" width="520" height="65" rx="10" fill="white" opacity="0.85"/>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#9c27b0" font-weight="bold" letter-spacing="1">VOS 5 BOX</text>
  <text x="400" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Fraîcheur Florale (inédite) - Prim Aloé - Prim Aloé x Belle</text>
  <text x="400" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">100% Marques Stars (+ bijou) - Masques et Soins</text>

  <!-- Bio badge -->
  <rect x="330" y="340" width="140" height="22" rx="11" fill="#43a047"/>
  <text x="400" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">100% BIO et NATUREL</text>
</svg>