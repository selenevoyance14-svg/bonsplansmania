<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dce8c8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d6a3f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a9c5f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative -->
  <circle cx="700" cy="80" r="60" fill="#2d6a3f" opacity="0.06"/>
  <circle cx="80" cy="390" r="40" fill="#4a9c5f" opacity="0.05"/>

  <!-- Badge -->
  <rect x="40" y="25" width="280" height="36" rx="18" fill="url(#badge)"/>
  <text x="180" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">FORTE DEMANDE AMAZON</text>

  <!-- Brand -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2d3436">Natural Elements</text>
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="16" fill="#636e72">Chardon Marie + Artichaut + Pissenlit</text>

  <!-- Price -->
  <rect x="40" y="165" width="200" height="65" rx="12" fill="white" stroke="#2d6a3f" stroke-width="2"/>
  <text x="55" y="190" font-family="Arial, sans-serif" font-size="14" fill="#636e72"><tspan text-decoration="line-through">16,99E</tspan></text>
  <text x="155" y="195" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#2d6a3f">12,90E</text>
  <text x="140" y="220" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" text-anchor="middle" font-weight="bold">-24%</text>

  <!-- Rating -->
  <text x="260" y="190" font-family="Arial, sans-serif" font-size="15" fill="#f39c12" font-weight="bold">4,4/5</text>
  <text x="260" y="210" font-family="Arial, sans-serif" font-size="12" fill="#636e72">(21 946 avis)</text>
  <text x="260" y="230" font-family="Arial, sans-serif" font-size="12" fill="#2d6a3f" font-weight="bold">400+ achetes/mois</text>

  <!-- Specs -->
  <text x="40" y="270" font-family="Arial, sans-serif" font-size="14" fill="#444">
    <tspan x="40" dy="0">120 gelules - Cure de 4 mois</tspan>
    <tspan x="40" dy="24">80% silymarine - Vegan - Sans stearate</tspan>
    <tspan x="40" dy="24">Elu produit de l'annee 2026 - 0,11E/gelule</tspan>
  </text>

  <!-- Bottle illustration (right side) -->
  <rect x="580" y="80" width="100" height="180" rx="12" fill="#1a1a1a" opacity="0.8"/>
  <rect x="595" y="70" width="70" height="20" rx="6" fill="#2d3436" opacity="0.6"/>
  <!-- Label -->
  <rect x="590" y="110" width="80" height="100" rx="6" fill="#2d6a3f" opacity="0.6"/>
  <text x="630" y="140" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">natural</text>
  <text x="630" y="153" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">elements</text>
  <text x="630" y="175" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" fill-opacity="0.8">Chardon Marie</text>
  <text x="630" y="188" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" fill-opacity="0.8">Artichaut</text>
  <text x="630" y="201" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle" fill-opacity="0.8">Pissenlit</text>

  <!-- Leaf decorations -->
  <ellipse cx="720" cy="150" rx="20" ry="8" fill="#4a9c5f" opacity="0.2" transform="rotate(-30 720 150)"/>
  <ellipse cx="730" cy="180" rx="18" ry="7" fill="#4a9c5f" opacity="0.15" transform="rotate(20 730 180)"/>
  <ellipse cx="710" cy="210" rx="16" ry="6" fill="#4a9c5f" opacity="0.18" transform="rotate(-10 710 210)"/>

  <!-- Award badge -->
  <circle cx="660" cy="320" r="38" fill="#c8960c" opacity="0.8"/>
  <text x="660" y="313" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">ELU PRODUIT</text>
  <text x="660" y="328" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">DE L'ANNEE</text>
  <text x="660" y="343" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">2026</text>

  <!-- Choix Amazon -->
  <rect x="540" y="380" width="160" height="30" rx="8" fill="#232f3e" opacity="0.8"/>
  <text x="620" y="400" font-family="Arial, sans-serif" font-size="12" fill="#f39c12" text-anchor="middle" font-weight="bold">Choix d'Amazon</text>

  <!-- Footer -->
  <rect x="40" y="400" width="470" height="1" fill="#b8c8a0"/>
  <text x="250" y="430" font-family="Arial, sans-serif" font-size="13" fill="#a0b090" text-anchor="middle">bonsplansmania.fr — Amazon</text>
</svg>