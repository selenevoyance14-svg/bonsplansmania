<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF0EB"/>
      <stop offset="100%" stop-color="#FFE4D9"/>
    </linearGradient>
  </defs>
  <!-- Fond pêche doux -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Confettis décoratifs -->
  <circle cx="100" cy="60" r="5" fill="#F8B4B4" opacity="0.5"/>
  <circle cx="200" cy="40" r="4" fill="#A7D8DE" opacity="0.5"/>
  <circle cx="650" cy="50" r="6" fill="#F8B4B4" opacity="0.4"/>
  <circle cx="720" cy="90" r="4" fill="#B8D4A8" opacity="0.5"/>
  <circle cx="80" cy="380" r="5" fill="#F6D6AD" opacity="0.4"/>
  <circle cx="700" cy="300" r="4" fill="#D4B4D8" opacity="0.4"/>
  <rect x="300" y="30" width="8" height="8" rx="1" fill="#F8B4B4" opacity="0.3" transform="rotate(30 304 34)"/>
  <rect x="550" y="70" width="7" height="7" rx="1" fill="#A7D8DE" opacity="0.3" transform="rotate(-20 553 73)"/>
  <!-- Box principale -->
  <rect x="250" y="100" width="300" height="200" rx="15" fill="#FFFFFF" stroke="#F0D0C0" stroke-width="2"/>
  <!-- Intérieur box -->
  <rect x="260" y="110" width="280" height="180" rx="12" fill="#FFF8F5"/>
  <!-- Produits dans la box -->
  <!-- Brillant à lèvres -->
  <rect x="285" y="150" width="16" height="50" rx="5" fill="#E8687D"/>
  <rect x="288" y="140" width="10" height="14" rx="3" fill="#D05A6E"/>
  <!-- Collier -->
  <circle cx="340" cy="185" r="12" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="340" cy="173" r="4" fill="#FFF0E0" stroke="#D4AF37" stroke-width="1"/>
  <!-- Gel -->
  <rect x="375" y="145" width="22" height="60" rx="6" fill="#B8E6D0" stroke="#80C4A0" stroke-width="1"/>
  <rect x="378" y="138" width="16" height="10" rx="3" fill="#80C4A0"/>
  <!-- Livre -->
  <rect x="420" y="155" width="40" height="50" rx="3" fill="#E8E4F0" stroke="#C8C0D8" stroke-width="1"/>
  <text x="440" y="178" text-anchor="middle" font-family="Georgia" font-size="7" fill="#8070A0" font-style="italic">Les</text>
  <text x="440" y="188" text-anchor="middle" font-family="Georgia" font-size="7" fill="#8070A0" font-style="italic">beaux</text>
  <text x="440" y="198" text-anchor="middle" font-family="Georgia" font-size="7" fill="#8070A0" font-style="italic">jours</text>
  <!-- Chips -->
  <ellipse cx="490" cy="180" rx="18" ry="22" fill="#F6D6AD" stroke="#E8C090" stroke-width="1"/>
  <text x="490" y="183" text-anchor="middle" font-family="Arial" font-size="6" fill="#A08060">chips</text>
  <!-- Déco vélo -->
  <circle cx="310" cy="240" r="10" fill="none" stroke="#FF6B9D" stroke-width="2"/>
  <circle cx="310" cy="240" r="4" fill="none" stroke="#FF6B9D" stroke-width="1"/>
  <line x1="310" y1="230" x2="310" y2="250" stroke="#FF6B9D" stroke-width="0.5"/>
  <line x1="300" y1="240" x2="320" y2="240" stroke="#FF6B9D" stroke-width="0.5"/>
  <!-- Texte "Box d'Avril" -->
  <text x="400" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#D4765B" font-style="italic">La box d'Avril</text>
  <!-- Badge 6 pépites -->
  <circle cx="680" cy="100" r="42" fill="#D4765B"/>
  <text x="680" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF">6</text>
  <text x="680" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFE0D0">pépites</text>
  <!-- Badge prix -->
  <rect x="30" y="70" width="120" height="45" rx="8" fill="#80BFA8"/>
  <text x="90" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF">dès 33,40€</text>
  <text x="90" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E0FFF0">/mois</text>
  <!-- Titre -->
  <rect x="140" y="340" width="520" height="80" rx="12" fill="rgba(212,118,91,0.85)"/>
  <text x="400" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#FFFFFF" font-style="italic">Mademoiselle Confettis</text>
  <text x="400" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FFE0D0">Box Bien-être &amp; Lifestyle — Avril 2026</text>
</svg>
