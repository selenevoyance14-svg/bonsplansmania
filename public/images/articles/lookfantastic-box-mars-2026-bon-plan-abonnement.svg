<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#be185d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="16"/>
  <circle cx="660" cy="80" r="140" fill="white" opacity="0.06"/>
  <circle cx="110" cy="390" r="100" fill="white" opacity="0.05"/>
  <!-- Value badge -->
  <rect x="40" y="40" width="160" height="38" rx="19" fill="#f59e0b" opacity="0.95"/>
  <text x="120" y="64" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="white" text-anchor="middle">Valeur ~70€</text>
  <!-- Price badge -->
  <rect x="215" y="40" width="200" height="38" rx="19" fill="white" opacity="0.2"/>
  <text x="315" y="64" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Dès 16,66€/mois</text>
  <!-- Card -->
  <rect x="40" y="100" width="720" height="230" rx="16" fill="url(#card)"/>
  <!-- Icon -->
  <rect x="60" y="120" width="80" height="80" rx="12" fill="white" opacity="0.15"/>
  <text x="100" y="172" font-family="Arial, sans-serif" font-size="36" text-anchor="middle">💄</text>
  <!-- Brand -->
  <text x="165" y="148" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white" opacity="0.75">LOOKFANTASTIC BEAUTY BOX</text>
  <!-- Title -->
  <text x="165" y="183" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="white">Box Mars 2026</text>
  <text x="165" y="213" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white">6 produits haut de gamme</text>
  <!-- Subtitle -->
  <text x="165" y="250" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.85">Marques premium · K-beauty · Soins niche</text>
  <!-- Features -->
  <rect x="60" y="295" width="210" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="165" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ 3× la valeur payée</text>
  <rect x="285" y="295" width="200" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="385" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Sans engagement</text>
  <rect x="500" y="295" width="240" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="620" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Livraison incluse</text>
  <!-- Bottom -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.5" text-anchor="middle">bonsplansmania.fr</text>
</svg>
