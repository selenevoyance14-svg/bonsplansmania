  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="180" fill="#fff" opacity=".22"/>
  <circle cx="105" cy="590" r="210" fill="#d8291e" opacity=".12"/>
