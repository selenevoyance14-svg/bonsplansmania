<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1917;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#292524;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44403C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B45309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="100" r="200" fill="white" fill-opacity="0.03"/>
  <circle cx="100" cy="540" r="160" fill="white" fill-opacity="0.03"/>
  <rect x="60" y="60" width="700" height="510" rx="24" fill="url(#card)" stroke="url(#gold)" stroke-opacity="0.4" stroke-width="1"/>
  <!-- Badge -->
  <rect x="100" y="100" width="200" height="36" rx="18" fill="url(#gold)"/>
  <text x="200" y="123" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">ANNIVERSAIRE</text>
  <!-- Title -->
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="white">Nespresso</text>
  <text x="100" y="260" font-family="Arial, sans-serif" font-size="60" font-weight="900" fill="#F59E0B">40 ans</text>
  <!-- Subtitle -->
  <text x="100" y="320" font-family="Arial, sans-serif" font-size="22" fill="white" fill-opacity="0.85">Grand jeu-concours anniversaire</text>
  <!-- Prize box -->
  <rect x="100" y="350" width="600" height="55" rx="14" fill="white" fill-opacity="0.1" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
  <text x="400" y="372" font-family="Arial, sans-serif" font-size="16" fill="#F59E0B" text-anchor="middle" font-weight="600">🏆 Machines Vertuo · Capsules · Séjours</text>
  <text x="400" y="396" font-family="Arial, sans-serif" font-size="15" fill="white" fill-opacity="0.7" text-anchor="middle">Des milliers de lots à gagner</text>
  <!-- Check -->
  <text x="100" y="460" font-family="Arial, sans-serif" font-size="19" fill="white">✅ Gratuit · Participation en ligne</text>
  <!-- Site tag -->
  <text x="100" y="530" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.5">nespresso.com</text>
  <!-- Right decoration -->
  <text x="920" y="340" font-family="Arial, sans-serif" font-size="140" text-anchor="middle" opacity="0.2">☕</text>
  <text x="920" y="200" font-family="Arial, sans-serif" font-size="70" text-anchor="middle" opacity="0.15">🎉</text>
  <!-- BonsPlansMania tag -->
  <rect x="900" y="560" width="240" height="40" rx="20" fill="url(#gold)" fill-opacity="0.3"/>
  <text x="1020" y="585" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">bonsplansmania.fr</text>
</svg>
