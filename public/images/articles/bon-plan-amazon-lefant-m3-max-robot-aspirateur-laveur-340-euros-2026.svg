<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
  </defs>
  <!-- Fond gris clair -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Sol -->
  <rect x="0" y="280" width="800" height="170" fill="#B0BEC5" opacity="0.15"/>
  <!-- Station de base -->
  <rect x="150" y="90" width="100" height="180" rx="10" fill="#555"/>
  <rect x="155" y="95" width="90" height="40" rx="6" fill="#444"/>
  <!-- Bac transparent bleu -->
  <rect x="160" y="140" width="80" height="60" rx="6" fill="#64B5F6" opacity="0.4"/>
  <rect x="165" y="145" width="70" height="50" rx="4" fill="#90CAF9" opacity="0.3"/>
  <!-- Sacs à poussière (côtés) -->
  <rect x="80" y="100" width="40" height="60" rx="6" fill="#E0E0E0"/>
  <rect x="85" y="105" width="30" height="15" rx="3" fill="#BDBDBD"/>
  <rect x="60" y="110" width="40" height="60" rx="6" fill="#E0E0E0"/>
  <rect x="65" y="115" width="30" height="15" rx="3" fill="#BDBDBD"/>
  <!-- Robot -->
  <ellipse cx="420" cy="235" rx="85" ry="25" fill="#555"/>
  <circle cx="420" cy="218" r="72" fill="#666"/>
  <circle cx="420" cy="218" r="67" fill="#6E6E6E"/>
  <!-- Lidar -->
  <circle cx="420" cy="195" r="16" fill="#777"/>
  <circle cx="420" cy="195" r="12" fill="#888"/>
  <!-- Double serpillière -->
  <ellipse cx="395" cy="250" rx="25" ry="8" fill="#90CAF9" opacity="0.5"/>
  <ellipse cx="445" cy="250" rx="25" ry="8" fill="#90CAF9" opacity="0.5"/>
  <!-- Traces de lavage -->
  <path d="M520 260 Q570 255 620 260" fill="none" stroke="#90CAF9" stroke-width="2" opacity="0.3"/>
  <path d="M530 272 Q580 267 630 272" fill="none" stroke="#90CAF9" stroke-width="2" opacity="0.25"/>
  <!-- WiFi 5G -->
  <path d="M410 170 Q420 158 430 170" fill="none" stroke="#4CAF50" stroke-width="1.5" opacity="0.5"/>
  <path d="M405 163 Q420 148 435 163" fill="none" stroke="#4CAF50" stroke-width="1.5" opacity="0.4"/>
  <path d="M400 156 Q420 138 440 156" fill="none" stroke="#4CAF50" stroke-width="1.5" opacity="0.3"/>
  <!-- Badge -62% -->
  <circle cx="700" cy="80" r="45" fill="#F44336"/>
  <text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF">-62%</text>
  <text x="700" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFCDD2">339,99€</text>
  <!-- Badge 6 309 avis -->
  <rect x="30" y="60" width="130" height="40" rx="8" fill="#FF6F00"/>
  <text x="95" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">6 309 avis</text>
  <text x="95" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFE0B2">4,2/5 — 20 000 Pa</text>
