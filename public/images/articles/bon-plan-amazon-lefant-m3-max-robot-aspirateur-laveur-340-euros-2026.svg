  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">Lefant M3 Max Robot Aspirateur Laveur</text>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#BDBDBD">20 000 Pa — Double serpillière — Navigation dToF — 220 min</text>
