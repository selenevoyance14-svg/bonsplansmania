<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="evo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F5FA"/>
      <stop offset="100%" style="stop-color:#E0EAF4"/>
    </linearGradient>
    <linearGradient id="evo-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90C8"/>
      <stop offset="100%" style="stop-color:#3A78B0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#evo-bg)"/>
  <!-- Product bottle -->
  <g transform="translate(100, 50)">
    <rect x="40" y="30" width="120" height="280" rx="20" fill="white" stroke="#D0DDE8" stroke-width="2"/>
    <rect x="55" y="0" width="90" height="40" rx="8" fill="url(#evo-blue)"/>
    <text x="100" y="25" font-family="Poppins, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">EVOLUDERM</text>
    <rect x="55" y="80" width="90" height="100" rx="6" fill="#E8F0F8" opacity="0.8"/>
    <text x="100" y="110" font-family="Georgia, serif" font-size="10" fill="#3A78B0" text-anchor="middle" font-weight="bold">LAIT</text>
    <text x="100" y="125" font-family="Georgia, serif" font-size="9" fill="#3A78B0" text-anchor="middle">DEMAQUILLANT</text>
    <text x="100" y="145" font-family="Poppins, sans-serif" font-size="8" fill="#4A90C8" text-anchor="middle">DOUX</text>
    <text x="100" y="170" font-family="Poppins, sans-serif" font-size="7" fill="#888" text-anchor="middle">250 ml</text>
  </g>
  <!-- Right content -->
  <text x="380" y="80" font-family="Poppins, sans-serif" font-size="14" fill="#4A90C8" font-weight="700">NOTRE AVIS</text>
  <text x="380" y="120" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#2A3A50">Evoluderm</text>
  <text x="380" y="155" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2A3A50">Lait Demaquillant</text>
  <text x="380" y="185" font-family="Georgia, serif" font-size="18" fill="#4A90C8" font-style="italic">Doux</text>
  <g transform="translate(380, 210)">
    <polygon points="12,0 15,8 24,8 17,14 19,22 12,17 5,22 7,14 0,8 9,8" fill="#FFB800"/>
    <polygon points="37,0 40,8 49,8 42,14 44,22 37,17 30,22 32,14 25,8 34,8" fill="#FFB800"/>
    <polygon points="62,0 65,8 74,8 67,14 69,22 62,17 55,22 57,14 50,8 59,8" fill="#FFB800"/>
    <polygon points="87,0 90,8 99,8 92,14 94,22 87,17 80,22 82,14 75,8 84,8" fill="#FFB800" opacity="0.5"/>
  </g>
  <text x="490" y="228" font-family="Poppins, sans-serif" font-size="14" fill="#888">3,5/5</text>
  <g transform="translate(380, 260)">
    <circle cx="8" cy="8" r="8" fill="#4A90C8" opacity="0.8"/>
    <text x="8" y="12" font-family="Poppins, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
    <text x="25" y="13" font-family="Poppins, sans-serif" font-size="13" fill="#2A3A50">Petit prix, grande contenance</text>
  </g>
  <g transform="translate(380, 290)">
    <circle cx="8" cy="8" r="8" fill="#4A90C8" opacity="0.8"/>
    <text x="8" y="12" font-family="Poppins, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
    <text x="25" y="13" font-family="Poppins, sans-serif" font-size="13" fill="#2A3A50">Demaquillage en douceur</text>
  </g>
  <g transform="translate(380, 320)">
    <circle cx="8" cy="8" r="8" fill="#4A90C8" opacity="0.8"/>
    <text x="8" y="12" font-family="Poppins, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
    <text x="25" y="13" font-family="Poppins, sans-serif" font-size="13" fill="#2A3A50">Tous types de peau</text>
  </g>
  <rect x="380" y="360" width="120" height="40" rx="20" fill="url(#evo-blue)"/>
  <text x="440" y="386" font-family="Poppins, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">~ 3 €</text>
  <text x="520" y="386" font-family="Poppins, sans-serif" font-size="12" fill="#888">sur Amazon</text>
</svg>