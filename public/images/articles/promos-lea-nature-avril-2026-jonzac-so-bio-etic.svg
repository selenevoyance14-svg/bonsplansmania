  <!-- Two promo boxes -->
  <rect x="60" y="140" width="320" height="130" rx="14" fill="#fff" stroke="#D94F3B" stroke-width="2"/>
  <text x="220" y="180" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" fill="#D94F3B">-20%</text>
  <text x="220" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#333">Douches et Deodorants</text>
  <text x="220" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">Eau Thermale Jonzac</text>
  <text x="220" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#999">des 30 euros — jusqu'au 13 avril</text>
  <rect x="420" y="140" width="320" height="130" rx="14" fill="#fff" stroke="#C8963E" stroke-width="2"/>
  <text x="580" y="180" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" fill="#C8963E">-30%</text>
  <text x="580" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#333">Precieux Argan</text>
  <text x="580" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666">SO BiO etic</text>
  <text x="580" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#999">anti-age — jusqu'au 17 mai</text>
  <!-- Marques -->
