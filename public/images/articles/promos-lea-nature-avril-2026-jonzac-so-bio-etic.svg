  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#666">Soins bio certifies, fabriques en France</text>
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#999">E-boutique Lea Nature</text>
