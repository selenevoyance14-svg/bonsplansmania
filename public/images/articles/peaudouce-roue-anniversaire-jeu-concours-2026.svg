<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="pdc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B5D5D1"/>
      <stop offset="100%" style="stop-color:#9DC5C0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#pdc-bg)"/>
  <!-- Sun -->
  <circle cx="700" cy="70" r="30" fill="#F4A96B" opacity="0.8"/>
  <line x1="700" y1="25" x2="700" y2="15" stroke="#F4A96B" stroke-width="3" opacity="0.6"/>
  <line x1="730" y1="40" x2="738" y2="33" stroke="#F4A96B" stroke-width="3" opacity="0.6"/>
  <line x1="745" y1="70" x2="755" y2="70" stroke="#F4A96B" stroke-width="3" opacity="0.6"/>
  <!-- Cloud -->
  <ellipse cx="120" cy="60" rx="50" ry="25" fill="white" opacity="0.5"/>
  <ellipse cx="145" cy="50" rx="35" ry="20" fill="white" opacity="0.5"/>
  <!-- Wheel segments -->
  <g transform="translate(250, 225)">
    <circle cx="0" cy="0" r="150" fill="#3B5998" opacity="0.7"/>
    <path d="M0,0 L0,-150 A150,150 0 0,1 130,75 Z" fill="#D4956B" opacity="0.8"/>
    <path d="M0,0 L130,75 A150,150 0 0,1 -130,75 Z" fill="#3B5998" opacity="0.6"/>
    <path d="M0,0 L-130,75 A150,150 0 0,1 -130,-75 Z" fill="#D4956B" opacity="0.6"/>
    <path d="M0,0 L-130,-75 A150,150 0 0,1 0,-150 Z" fill="#4A6FA8" opacity="0.7"/>
    <circle cx="0" cy="0" r="30" fill="white"/>
    <!-- Dots on wheel -->
    <circle cx="0" cy="-150" r="6" fill="#CCC"/>
    <circle cx="130" cy="75" r="6" fill="#CCC"/>
    <circle cx="-130" cy="75" r="6" fill="#CCC"/>
    <circle cx="-130" cy="-75" r="6" fill="#CCC"/>
  </g>
  <!-- Text -->
  <text x="500" y="140" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#3B5998" text-anchor="middle">Tournez la roue</text>
  <text x="500" y="180" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#3B5998" text-anchor="middle">Anniversaire !</text>
  <!-- Brand -->
  <text x="500" y="230" font-family="Poppins, sans-serif" font-size="22" font-weight="bold" fill="#3B5998" text-anchor="middle" opacity="0.9">Peaudouce</text>
  <!-- Prizes -->
  <text x="500" y="275" font-family="Poppins, sans-serif" font-size="14" fill="#3B5998" text-anchor="middle" opacity="0.8">2 mois de couches offerts</text>
  <text x="500" y="298" font-family="Poppins, sans-serif" font-size="14" fill="#3B5998" text-anchor="middle" opacity="0.8">Lingettes, pochon, -10%...</text>
  <!-- CTA button -->
  <rect x="420" y="330" width="220" height="48" rx="24" fill="#5B6FAE" opacity="0.9"/>
  <text x="530" y="360" font-family="Poppins, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Je tente ma chance !</text>
  <!-- Hearts bottom -->
  <g opacity="0.3">
    <path d="M100,420 C97,415 90,416 90,420 C90,424 100,430 100,430 C100,430 110,424 110,420 C110,416 103,415 100,420Z" fill="#E88BA0"/>
    <path d="M200,410 C197,405 190,406 190,410 C190,414 200,420 200,420 C200,420 210,414 210,410 C210,406 203,405 200,410Z" fill="#E88BA0"/>
    <path d="M680,425 C677,420 670,421 670,425 C670,429 680,435 680,435 C680,435 690,429 690,425 C690,421 683,420 680,425Z" fill="#E88BA0"/>
  </g>
  <!-- Leaves bottom -->
  <g opacity="0.4" fill="white">
    <path d="M350,440 C350,430 340,420 330,420 C340,425 345,435 350,440Z"/>
    <path d="M350,440 C350,430 360,420 370,420 C360,425 355,435 350,440Z"/>
    <line x1="350" y1="440" x2="350" y2="450" stroke="white" stroke-width="2"/>
    <path d="M550,440 C550,430 540,420 530,420 C540,425 545,435 550,440Z"/>
    <path d="M550,440 C550,430 560,420 570,420 C560,425 555,435 550,440Z"/>
    <line x1="550" y1="440" x2="550" y2="450" stroke="white" stroke-width="2"/>
  </g>
