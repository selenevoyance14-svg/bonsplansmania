<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="gas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6D0"/>
      <stop offset="100%" style="stop-color:#E8D4B8"/>
    </linearGradient>
    <linearGradient id="gas-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A86C"/>
      <stop offset="100%" style="stop-color:#B08D50"/>
    </linearGradient>
    <linearGradient id="gas-bottle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AA60"/>
      <stop offset="50%" style="stop-color:#C49850"/>
      <stop offset="100%" style="stop-color:#B08840"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#gas-bg)"/>
  <!-- Palm shadow decorative -->
  <g opacity="0.06">
    <path d="M600,0 Q650,100 700,50 Q750,0 800,80 L800,0 Z" fill="#8B7355"/>
    <path d="M650,0 Q700,150 780,80 L800,0 Z" fill="#8B7355"/>
  </g>
  <!-- Podium -->
  <rect x="280" y="300" width="240" height="150" rx="4" fill="white" opacity="0.9"/>
  <rect x="250" y="310" width="300" height="8" rx="2" fill="#E8D4B8"/>
  <!-- Main bottle -->
  <g transform="translate(340, 100)">
    <rect x="20" y="0" width="80" height="200" rx="16" fill="url(#gas-bottle)"/>
    <ellipse cx="60" cy="0" rx="20" ry="8" fill="url(#gas-gold)"/>
    <circle cx="60" cy="-12" r="14" fill="url(#gas-gold)"/>
    <!-- Label -->
    <rect x="30" y="40" width="60" height="80" rx="4" fill="white" opacity="0.85"/>
    <text x="60" y="60" font-family="Arial, sans-serif" font-size="5" fill="#2A7A4A" text-anchor="middle" font-weight="bold">GARNIER</text>
    <text x="60" y="70" font-family="Arial, sans-serif" font-size="5" fill="#2A7A4A" text-anchor="middle" font-weight="bold">AMBRE SOLAIRE</text>
    <text x="60" y="85" font-family="Georgia, serif" font-size="8" fill="#333" text-anchor="middle" font-weight="bold">NATURAL</text>
    <text x="60" y="96" font-family="Georgia, serif" font-size="7" fill="#333" text-anchor="middle">bronzer</text>
    <text x="60" y="108" font-family="Poppins, sans-serif" font-size="4.5" fill="#C9A86C" text-anchor="middle" font-weight="bold">LAIT AUTOBRONZANT</text>
  </g>
  <!-- Serum bottle left -->
  <g transform="translate(180, 160)">
    <rect x="15" y="20" width="45" height="120" rx="8" fill="#C49850" opacity="0.8"/>
    <rect x="28" y="0" width="20" height="30" rx="3" fill="white" opacity="0.6"/>
    <text x="37" y="70" font-family="Poppins, sans-serif" font-size="4" fill="white" text-anchor="middle" font-weight="bold">SERUM</text>
  </g>
  <!-- Spray bottle right -->
  <g transform="translate(520, 170)">
    <rect x="10" y="20" width="45" height="110" rx="8" fill="white" opacity="0.9" stroke="#DDD" stroke-width="1"/>
    <rect x="20" y="0" width="25" height="25" rx="4" fill="#CCC"/>
    <text x="32" y="55" font-family="Poppins, sans-serif" font-size="4" fill="#2A7A4A" text-anchor="middle" font-weight="bold">NATURAL</text>
    <text x="32" y="63" font-family="Poppins, sans-serif" font-size="4" fill="#333" text-anchor="middle">bronzer</text>
    <text x="32" y="75" font-family="Poppins, sans-serif" font-size="3.5" fill="#C9A86C" text-anchor="middle">BRUME</text>
  </g>
  <!-- Mousse bottle far right -->
  <g transform="translate(610, 180)">
    <rect x="10" y="15" width="40" height="100" rx="8" fill="white" opacity="0.85" stroke="#DDD" stroke-width="1"/>
    <rect x="18" y="0" width="24" height="20" rx="4" fill="#C9A86C"/>
    <text x="30" y="50" font-family="Poppins, sans-serif" font-size="3.5" fill="#2A7A4A" text-anchor="middle" font-weight="bold">NATURAL</text>
    <text x="30" y="58" font-family="Poppins, sans-serif" font-size="3.5" fill="#333" text-anchor="middle">bronzer</text>
    <text x="30" y="70" font-family="Poppins, sans-serif" font-size="3" fill="#C9A86C" text-anchor="middle">MOUSSE</text>
  </g>
  <!-- Price badge -->
  <circle cx="680" cy="80" r="50" fill="#E63946"/>
  <text x="680" y="72" font-family="Poppins, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">12,89</text>
  <text x="680" y="92" font-family="Poppins, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">euros</text>
  <!-- Stars rating -->
  <g transform="translate(300, 360)">
    <polygon points="10,0 13,7 20,7 14,12 16,20 10,15 4,20 6,12 0,7 7,7" fill="#FFB800"/>
    <polygon points="35,0 38,7 45,7 39,12 41,20 35,15 29,20 31,12 25,7 32,7" fill="#FFB800"/>
    <polygon points="60,0 63,7 70,7 64,12 66,20 60,15 54,20 56,12 50,7 57,7" fill="#FFB800"/>
    <polygon points="85,0 88,7 95,7 89,12 91,20 85,15 79,20 81,12 75,7 82,7" fill="#FFB800"/>
    <polygon points="110,0 113,7 120,7 114,12 116,20 110,15 104,20 106,12 100,7 107,7" fill="#FFB800" opacity="0.5"/>
  </g>
  <text x="440" y="376" font-family="Poppins, sans-serif" font-size="12" fill="#888" text-anchor="start">4,5/5 — plus de 1000 avis</text>
  <!-- Bottom text -->
  <text x="400" y="420" font-family="Poppins, sans-serif" font-size="14" fill="#8B7355" text-anchor="middle" font-weight="600">Best-seller Amazon — Livraison Prime</text>
  <!-- Top left category badge -->
  <rect x="40" y="20" width="130" height="30" rx="4" fill="#E63946"/>
  <text x="105" y="41" font-family="Poppins, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">BON PLAN</text>
</svg>