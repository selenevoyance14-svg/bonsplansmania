<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8e8d0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0c8d0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8a0c0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c2185b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a01050;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Adopt logo -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#c2185b" letter-spacing="2">adopt'</text>
  <text x="400" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#c2185b" letter-spacing="1">PARFUMS FRANCAIS</text>

  <!-- LE JEU -->
  <text x="400" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c2185b" letter-spacing="3">LE JEU</text>

  <!-- GIRL POWER -->
  <text x="400" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#c2185b" letter-spacing="5">GIRL</text>
  <text x="400" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="55" font-style="italic" fill="#c2185b">power</text>

  <!-- Description -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b4060">A la recherche de nos pistaches iconiques</text>
  <text x="400" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8b4060">Dans l'univers Girl Secret</text>

  <!-- Prize -->
  <rect x="230" y="330" width="340" height="40" rx="8" fill="rgba(255,255,255,0.5)"/>
  <text x="400" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Une surprise parfumee a gagner</text>

  <!-- CTA -->
  <rect x="300" y="390" width="200" height="36" rx="18" fill="url(#pink)"/>
  <text x="400" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Participer !</text>

  <text x="400" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#b08090">Jeu gratuit - Adopt Parfums</text>
</svg>