<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0e8e0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8e0d0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0c8b8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b71c1c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Lookfantastic -->
  <text x="400" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888" letter-spacing="3">LOOKFANTASTIC</text>

  <!-- Title -->
  <text x="400" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#333">Edition Tendances Beaute</text>
  <text x="400" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#888" font-style="italic">Trending Beauty Edit</text>

  <!-- Coffret box -->
  <g transform="translate(250, 110)">
    <rect x="0" y="0" width="300" height="180" rx="8" fill="url(#box)" stroke="#e0c8b8" stroke-width="1"/>
    <!-- Gradient shine -->
    <rect x="0" y="0" width="150" height="180" rx="8" fill="white" opacity="0.15"/>
    <!-- LF logo -->
    <text x="270" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c8a898" font-style="italic">LF</text>
    <!-- Script text on box -->
    <text x="150" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#a08070" font-style="italic">Trending Beauty Edit</text>
  </g>

  <!-- Products -->
  <!-- La Roche-Posay -->
  <rect x="135" y="155" width="22" height="70" rx="4" fill="white" stroke="#ddd" stroke-width="0.5"/>
  <rect x="138" y="158" width="16" height="22" rx="2" fill="#e91e63" opacity="0.5"/>

  <!-- Caudalie -->
  <rect x="168" y="148" width="20" height="75" rx="4" fill="white" stroke="#ddd" stroke-width="0.5"/>
  <rect x="171" y="151" width="14" height="20" rx="2" fill="#c8963c" opacity="0.4"/>

  <!-- Gatineau -->
  <rect x="200" y="160" width="24" height="62" rx="4" fill="#f5e6d3" stroke="#ddd" stroke-width="0.5"/>

  <!-- bareMinerals -->
  <rect x="235" y="152" width="18" height="72" rx="4" fill="white" stroke="#ddd" stroke-width="0.5"/>
  <rect x="238" y="155" width="12" height="18" rx="2" fill="#333" opacity="0.3"/>

  <!-- Sol de Janeiro -->
  <rect x="575" y="150" width="22" height="72" rx="4" fill="#42a5f5" opacity="0.6"/>
  <text x="586" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">76</text>

  <!-- Kate Somerville -->
  <rect x="608" y="158" width="20" height="65" rx="10" fill="white" stroke="#ddd" stroke-width="0.5"/>
  <circle cx="618" cy="170" r="5" fill="#ff8a65" opacity="0.5"/>

  <!-- Price section -->
  <rect x="160" y="310" width="200" height="55" rx="10" fill="white" opacity="0.9" stroke="#ccc" stroke-width="1"/>
  <text x="260" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999" text-decoration="line-through">50,00€</text>
  <text x="260" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#333">30,00€</text>

  <rect x="440" y="310" width="200" height="55" rx="10" fill="url(#red)"/>
  <text x="540" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Economisez</text>
  <text x="540" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">-40%</text>

  <!-- Brands -->
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999" letter-spacing="1">LA ROCHE-POSAY - CAUDALIE - BAREMINERALS</text>
  <text x="400" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999" letter-spacing="1">SOL DE JANEIRO - KATE SOMERVILLE - GATINEAU</text>

  <!-- Value -->
  <text x="400" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Valeur 145€+ — Disponible — Expedition 24h</text>
</svg>