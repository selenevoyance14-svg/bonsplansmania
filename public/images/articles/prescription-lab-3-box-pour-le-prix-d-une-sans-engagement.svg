<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b3d9f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f0f8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d5c0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="navyBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="300" fill="url(#sky)"/>
  <!-- Sand/beach -->
  <rect y="280" width="800" height="170" fill="url(#sand)"/>
  <ellipse cx="400" cy="285" rx="420" ry="20" fill="#e8d5c0"/>

  <!-- Clouds -->
  <ellipse cx="150" cy="60" rx="50" ry="20" fill="white" opacity="0.6"/>
  <ellipse cx="180" cy="55" rx="35" ry="18" fill="white" opacity="0.5"/>
  <ellipse cx="600" cy="80" rx="45" ry="16" fill="white" opacity="0.5"/>
  <ellipse cx="630" cy="75" rx="30" ry="14" fill="white" opacity="0.4"/>

  <!-- Title background -->
  <rect x="170" y="20" width="460" height="45" rx="8" fill="white"/>
  <text x="400" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1a237e">3 Box pour le prix d'1</text>

  <!-- Sans engagement badge -->
  <rect x="250" y="72" width="300" height="28" rx="5" fill="url(#navyBadge)"/>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" letter-spacing="2">ABONNEMENT SANS ENGAGEMENT</text>

  <!-- Box 1 - Floral / Naturelle -->
  <g transform="translate(55, 130)">
    <rect x="0" y="0" width="200" height="170" rx="10" fill="white" opacity="0.9" stroke="#f48fb1" stroke-width="1.5"/>
    <!-- Floral pattern -->
    <circle cx="30" cy="30" r="10" fill="#f48fb1" opacity="0.3"/>
    <circle cx="60" cy="20" r="8" fill="#ef5350" opacity="0.25"/>
    <circle cx="45" cy="50" r="7" fill="#f48fb1" opacity="0.2"/>
    <circle cx="150" cy="35" r="9" fill="#ef5350" opacity="0.2"/>
    <circle cx="170" cy="55" r="7" fill="#f48fb1" opacity="0.25"/>
    <!-- Products -->
    <rect x="40" y="45" width="22" height="55" rx="4" fill="#8d6e63" opacity="0.7"/>
    <rect x="70" y="40" width="18" height="60" rx="3" fill="#ffcc80" opacity="0.7"/>
    <rect x="95" y="50" width="20" height="48" rx="4" fill="#1a237e" opacity="0.6"/>
    <rect x="125" y="42" width="22" height="55" rx="4" fill="#fff9c4" opacity="0.8"/>
    <!-- Nouveauté tag -->
    <rect x="55" y="5" width="90" height="20" rx="10" fill="#43a047"/>
    <text x="100" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">NOUVEAUTÉ</text>
    <!-- Label -->
    <text x="100" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#333">Rentrée Naturelle</text>
    <text x="100" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">et Éclatante</text>
    <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a237e">Valeur : 83€</text>
  </g>

  <!-- Box 2 - Normandie -->
  <g transform="translate(300, 130)">
    <rect x="0" y="0" width="200" height="170" rx="10" fill="white" opacity="0.9" stroke="#5c6bc0" stroke-width="1.5"/>
    <!-- Marine pattern - sailboat stripes -->
    <line x1="60" y1="25" x2="60" y2="60" stroke="#1a237e" stroke-width="2" opacity="0.3"/>
    <line x1="65" y1="25" x2="65" y2="60" stroke="#1a237e" stroke-width="2" opacity="0.3"/>
    <line x1="140" y1="30" x2="140" y2="55" stroke="#1a237e" stroke-width="2" opacity="0.3"/>
    <line x1="145" y1="30" x2="145" y2="55" stroke="#1a237e" stroke-width="2" opacity="0.3"/>
    <!-- Seagull -->
    <path d="M95 30 Q100 22 105 30" stroke="#333" stroke-width="1.5" fill="none"/>
    <path d="M88 35 Q95 28 102 35" stroke="#333" stroke-width="1.2" fill="none"/>
    <!-- Products -->
    <rect x="35" y="48" width="24" height="50" rx="4" fill="#7986cb" opacity="0.6"/>
    <rect x="65" y="42" width="18" height="56" rx="3" fill="#c5cae9" opacity="0.7"/>
    <rect x="90" y="50" width="20" height="45" rx="4" fill="#e8eaf6" opacity="0.8"/>
    <rect x="120" y="55" width="6" height="40" rx="3" fill="#a5d6a7" opacity="0.7"/>
    <!-- Nouveauté tag -->
    <rect x="55" y="5" width="90" height="20" rx="10" fill="#43a047"/>
    <text x="100" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">NOUVEAUTÉ</text>
    <!-- Label -->
    <text x="100" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#333">Week-end</text>
    <text x="100" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#333">en Normandie</text>
    <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a237e">Valeur : 107€</text>
  </g>

  <!-- Box 3 - Marques Stars -->
  <g transform="translate(545, 130)">
    <rect x="0" y="0" width="200" height="170" rx="10" fill="#1a237e" opacity="0.9"/>
    <rect x="10" y="10" width="180" height="90" rx="6" fill="white" opacity="0.15"/>
    <!-- Stars -->
    <text x="30" y="45" font-size="12" fill="white" opacity="0.4">★</text>
    <text x="80" y="35" font-size="10" fill="white" opacity="0.3">★</text>
    <text x="160" y="50" font-size="14" fill="white" opacity="0.35">★</text>
    <!-- Products -->
    <rect x="35" y="45" width="22" height="50" rx="4" fill="white" opacity="0.5"/>
    <rect x="65" y="40" width="20" height="55" rx="3" fill="#c5cae9" opacity="0.5"/>
    <rect x="95" y="48" width="18" height="45" rx="4" fill="white" opacity="0.4"/>
    <rect x="125" y="42" width="24" height="52" rx="4" fill="#e8eaf6" opacity="0.45"/>
    <!-- Nouveauté tag -->
    <rect x="55" y="5" width="90" height="20" rx="10" fill="#43a047"/>
    <text x="100" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">NOUVEAUTÉ</text>
    <!-- Label -->
    <text x="100" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="white">100% Marques</text>
    <text x="100" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="white">Stars</text>
    <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffcc80">Valeur : 145€</text>
  </g>

  <!-- Prescription Lab branding -->
  <text x="400" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1a237e" letter-spacing="2">PRESCRIPTION LAB</text>
  <text x="400" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5c6bc0" font-style="italic">ma parenthèse beauté</text>

  <!-- Total value -->
  <rect x="280" y="370" width="240" height="35" rx="8" fill="url(#navyBadge)"/>
  <text x="400" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">335€ de valeur totale</text>

  <!-- Seashells decoration -->
  <circle cx="50" cy="380" r="8" fill="#e8d5c0" stroke="#d7ccc8" stroke-width="1"/>
  <circle cx="75" cy="395" r="6" fill="#f5e6d3" stroke="#d7ccc8" stroke-width="1"/>
  <circle cx="730" cy="375" r="7" fill="#e8d5c0" stroke="#d7ccc8" stroke-width="1"/>
  <circle cx="750" cy="395" r="5" fill="#f5e6d3" stroke="#d7ccc8" stroke-width="1"/>
</svg>