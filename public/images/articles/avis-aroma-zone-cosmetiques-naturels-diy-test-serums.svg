<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4f7f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8eddf;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a8a3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d6b24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8860a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Leaf decoration -->
  <g opacity="0.08">
    <ellipse cx="120" cy="80" rx="60" ry="30" fill="#3d6b24" transform="rotate(-30 120 80)"/>
    <ellipse cx="680" cy="370" rx="50" ry="25" fill="#3d6b24" transform="rotate(20 680 370)"/>
    <ellipse cx="700" cy="60" rx="40" ry="20" fill="#3d6b24" transform="rotate(-15 700 60)"/>
  </g>

  <!-- Brand -->
  <rect x="250" y="18" width="300" height="45" rx="4" fill="url(#green)"/>
  <text x="400" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" letter-spacing="3">AROMA-ZONE</text>

  <!-- Subtitle -->
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5a8a3c" letter-spacing="2">COSMETIQUES NATURELS DEPUIS 2000</text>

  <!-- 3 product cards -->
  <g transform="translate(65, 115)">
    <rect x="0" y="0" width="200" height="200" rx="10" fill="white" stroke="#ddd" stroke-width="1"/>
    <!-- Serum bottle icon -->
    <rect x="85" y="25" width="30" height="80" rx="5" fill="url(#amber)"/>
    <rect x="90" y="15" width="20" height="15" rx="3" fill="#888"/>
    <circle cx="100" cy="8" r="5" fill="#aaa"/>
    <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Serum Vitamine C</text>
    <text x="100" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Eclat du teint</text>
    <rect x="55" y="165" width="90" height="22" rx="11" fill="url(#green)"/>
    <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">~8 EUR</text>
  </g>

  <g transform="translate(300, 115)">
    <rect x="0" y="0" width="200" height="200" rx="10" fill="white" stroke="#ddd" stroke-width="1"/>
    <!-- Serum bottle icon -->
    <rect x="85" y="25" width="30" height="80" rx="5" fill="#88bbdd"/>
    <rect x="90" y="15" width="20" height="15" rx="3" fill="#888"/>
    <circle cx="100" cy="8" r="5" fill="#aaa"/>
    <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Acide Hyaluronique</text>
    <text x="100" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Hydratation intense</text>
    <rect x="55" y="165" width="90" height="22" rx="11" fill="url(#green)"/>
    <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">~6 EUR</text>
  </g>

  <g transform="translate(535, 115)">
    <rect x="0" y="0" width="200" height="200" rx="10" fill="white" stroke="#ddd" stroke-width="1"/>
    <!-- Oil bottle icon -->
    <rect x="85" y="25" width="30" height="80" rx="5" fill="#d4a94a"/>
    <rect x="90" y="15" width="20" height="15" rx="3" fill="#888"/>
    <circle cx="100" cy="8" r="5" fill="#aaa"/>
    <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Huile de Jojoba</text>
    <text x="100" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Regulateur sebum</text>
    <rect x="55" y="165" width="90" height="22" rx="11" fill="url(#green)"/>
    <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">~8 EUR</text>
  </g>

  <!-- Yuka badge -->
  <rect x="310" y="340" width="180" height="30" rx="15" fill="white" stroke="#5a8a3c" stroke-width="1.5"/>
  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#5a8a3c">100/100 sur Yuka</text>

  <!-- Bottom -->
  <rect x="250" y="390" width="300" height="30" rx="15" fill="url(#green)"/>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">NOTRE AVIS + TEST COMPLET</text>

  <!-- Tagline -->
  <text x="400" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">+1800 references naturelles et bio</text>
</svg>