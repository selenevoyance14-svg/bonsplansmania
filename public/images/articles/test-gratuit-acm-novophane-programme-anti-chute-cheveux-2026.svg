<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A5C"/>
      <stop offset="50%" style="stop-color:#1E4D7A"/>
      <stop offset="100%" style="stop-color:#0F2B47"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8A030"/>
      <stop offset="100%" style="stop-color:#F5C563"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle circles -->
  <circle cx="300" cy="315" r="280" fill="none" stroke="white" stroke-width="0.5" opacity="0.08"/>
  <circle cx="900" cy="315" r="320" fill="none" stroke="white" stroke-width="0.5" opacity="0.06"/>
  <!-- Product bottles illustration -->
  <g transform="translate(100, 160)">
    <!-- Bottle 1 - shampoo -->
    <rect x="0" y="30" width="55" height="130" rx="8" fill="url(#bottle)" opacity="0.7"/>
    <rect x="10" y="0" width="35" height="35" rx="4" fill="url(#bottle)" opacity="0.8"/>
    <rect x="8" y="50" width="39" height="60" rx="3" fill="white" opacity="0.2"/>
    <!-- Bottle 2 - lotion -->
    <rect x="70" y="40" width="50" height="120" rx="8" fill="url(#bottle)" opacity="0.6"/>
    <rect x="80" y="15" width="30" height="30" rx="3" fill="url(#bottle)" opacity="0.7"/>
    <rect x="78" y="60" width="34" height="50" rx="3" fill="white" opacity="0.2"/>
    <!-- Bottle 3 - supplement -->
    <rect x="135" y="50" width="45" height="100" rx="10" fill="url(#accent)" opacity="0.7"/>
    <rect x="143" y="35" width="29" height="20" rx="3" fill="url(#accent)" opacity="0.8"/>
    <rect x="143" y="65" width="29" height="45" rx="3" fill="white" opacity="0.2"/>
  </g>
  <!-- Badge TEST GRATUIT -->
  <rect x="820" y="60" width="280" height="50" rx="25" fill="url(#accent)"/>
  <text x="960" y="93" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#1B3A5C">TEST GRATUIT</text>
  <!-- Main text -->
  <text x="600" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white" opacity="0.6" letter-spacing="6">ACM LABORATOIRE DERMATOLOGIQUE</text>
  <text x="600" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="900" fill="white">Programme Novophane</text>
  <text x="600" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="800" fill="url(#accent)">Anti-Chute Complet</text>
  <!-- Subtitle -->
  <text x="600" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="white" opacity="0.7">Shampoing + Lotion + Complement alimentaire</text>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="white" opacity="0.95"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1B3A5C">Candidatures jusqu'au 8 avril 2026 — #ACMAntiChute</text>
  <!-- Hair strand decorations -->
  <path d="M 850 160 Q 870 200, 860 260 Q 850 320, 870 380" stroke="url(#accent)" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M 880 170 Q 900 220, 890 280 Q 880 340, 900 400" stroke="url(#accent)" stroke-width="1" fill="none" opacity="0.2"/>
  <path d="M 910 180 Q 930 230, 920 290 Q 910 350, 930 410" stroke="url(#accent)" stroke-width="1" fill="none" opacity="0.15"/>
</svg>
