<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="rep-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F0F8"/>
      <stop offset="100%" style="stop-color:#EDE0F0"/>
    </linearGradient>
    <linearGradient id="rep-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B2D8E"/>
      <stop offset="100%" style="stop-color:#7A1F6E"/>
    </linearGradient>
    <linearGradient id="rep-soft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A8D0"/>
      <stop offset="100%" style="stop-color:#C490C0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#rep-bg)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="100" r="120" fill="#9B2D8E" opacity="0.06"/>
  <circle cx="700" cy="350" r="80" fill="#9B2D8E" opacity="0.04"/>
  <circle cx="100" cy="400" r="60" fill="#9B2D8E" opacity="0.05"/>
  <!-- Product shape -->
  <g transform="translate(500, 80)">
    <rect x="40" y="30" width="70" height="180" rx="20" fill="url(#rep-soft)" opacity="0.7"/>
    <rect x="45" y="20" width="60" height="30" rx="10" fill="url(#rep-accent)" opacity="0.8"/>
    <rect x="55" y="80" width="40" height="60" rx="4" fill="white" opacity="0.5"/>
    <text x="75" y="108" font-family="Poppins, sans-serif" font-size="8" fill="#7A1F6E" text-anchor="middle" font-weight="bold">Replens</text>
    <text x="75" y="120" font-family="Poppins, sans-serif" font-size="6" fill="#7A1F6E" text-anchor="middle">Gel</text>
  </g>
  <!-- Second tube -->
  <g transform="translate(570, 100) rotate(12)">
    <rect x="40" y="30" width="60" height="160" rx="18" fill="url(#rep-accent)" opacity="0.25"/>
    <rect x="45" y="22" width="50" height="26" rx="8" fill="url(#rep-accent)" opacity="0.4"/>
  </g>
  <!-- Brand -->
  <text x="60" y="100" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#7A1F6E">Replens</text>
  <text x="60" y="135" font-family="Poppins, sans-serif" font-size="18" fill="#9B2D8E" opacity="0.8">Confort intime au quotidien</text>
  <!-- Main text -->
  <text x="60" y="210" font-family="Poppins, sans-serif" font-size="26" font-weight="bold" fill="#4A1040">Echantillon gratuit</text>
  <text x="60" y="250" font-family="Poppins, sans-serif" font-size="20" fill="#4A1040">Gel vaginal hydratant</text>
  <!-- Badge -->
  <rect x="60" y="290" width="160" height="44" rx="22" fill="url(#rep-accent)" opacity="0.9"/>
  <text x="140" y="318" font-family="Poppins, sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">100% GRATUIT</text>
  <!-- Heart -->
  <g transform="translate(260, 295)" opacity="0.7">
    <path d="M12 4C8 -2 0 2 0 8c0 6 12 14 12 14s12-8 12-14c0-6-8-10-12-4z" fill="#D4619C"/>
  </g>
  <!-- Bottom bar -->
  <rect x="0" y="410" width="800" height="40" fill="#9B2D8E" opacity="0.1"/>
  <text x="400" y="436" font-family="Poppins, sans-serif" font-size="13" fill="#7A1F6E" text-anchor="middle" opacity="0.7">Remplissez le formulaire - Livraison offerte</text>
</svg>