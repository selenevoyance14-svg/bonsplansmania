<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0055A4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2878C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6AAFE6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="80" r="220" fill="white" fill-opacity="0.05" />
  <circle cx="100" cy="560" r="180" fill="white" fill-opacity="0.05" />

  <!-- Site badge -->
  <rect x="80" y="60" width="220" height="44" rx="22" fill="white" fill-opacity="0.15" />
  <text x="190" y="88" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">BonsPlansMania.fr</text>

  <!-- Category badge -->
  <rect x="80" y="128" width="180" height="36" rx="18" fill="url(#badge)" />
  <text x="170" y="152" font-family="Arial, sans-serif" font-size="16" fill="#5B1A00" text-anchor="middle" font-weight="700">BON PLAN</text>

  <!-- Title -->
  <text x="80" y="248" font-family="Georgia, serif" font-size="48" fill="white" font-weight="400" fill-opacity="0.9">Operation Bebe</text>
  <text x="80" y="330" font-family="Georgia, serif" font-size="84" fill="white" font-weight="700">E.Leclerc</text>

  <rect x="80" y="350" width="100" height="3" rx="2" fill="#FFD700" fill-opacity="0.8" />

  <text x="80" y="400" font-family="Arial, sans-serif" font-size="28" fill="white" fill-opacity="0.95" font-weight="600">Prix barres sur toute la puericulture</text>

  <!-- Details -->
  <rect x="80" y="430" width="740" height="64" rx="12" fill="white" fill-opacity="0.12" />
  <text x="100" y="455" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.85">Sieges auto · Poussettes · Matelas · Equipement bebe</text>
  <text x="100" y="482" font-family="Arial, sans-serif" font-size="22" fill="#FFD700" font-weight="700">En ligne et en magasin · Grandes marques</text>

  <!-- Badge -->
  <rect x="80" y="524" width="380" height="44" rx="10" fill="white" fill-opacity="0.15" />
  <text x="100" y="551" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">Du 06 au 19 avril 2026</text>

  <text x="80" y="606" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7">Avril 2026 · E.Leclerc Puericulture</text>
</svg>
