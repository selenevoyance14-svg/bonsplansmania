  <text x="180" y="152" font-family="Arial, sans-serif" font-size="16" fill="#5B1A00" text-anchor="middle" font-weight="700">🎁 TEST GRATUIT</text>

  <!-- Title -->
  <text x="80" y="258" font-family="Georgia, serif" font-size="90" fill="white" font-weight="700">milan</text>
  <text x="80" y="326" font-family="Georgia, serif" font-size="44" fill="white" font-weight="400" fill-opacity="0.9">jeunesse</text>

  <rect x="80" y="346" width="100" height="3" rx="2" fill="#FFD700" fill-opacity="0.8" />

  <text x="80" y="390" font-family="Arial, sans-serif" font-size="26" fill="white" fill-opacity="0.95" font-weight="600">Programme Ambassadeur Parents</text>

