  <rect x="80" y="414" width="620" height="64" rx="12" fill="white" fill-opacity="0.12" />
  <text x="100" y="438" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.85">Wapiti · Wakou · Julie · 1jour1actu · Toupie...</text>
