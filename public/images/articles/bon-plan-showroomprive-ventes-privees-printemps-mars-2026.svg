<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff0f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d32f2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b71c1c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" rx="12" fill="url(#dark)"/>
  <rect x="0" y="30" width="800" height="30" fill="url(#dark)"/>
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" letter-spacing="2">SHOWROOMPRIVE</text>

  <!-- Coups de coeur title -->
  <text x="400" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" letter-spacing="1">NOS COUPS DE COEUR</text>
  <circle cx="520" cy="89" r="5" fill="url(#red)"/>

  <!-- Brand cards grid -->
  <!-- Row 1 -->
  <rect x="60" y="115" width="210" height="90" rx="8" fill="white" stroke="#eee" stroke-width="1"/>
  <text x="165" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Stella McCartney</text>
  <rect x="100" y="165" width="130" height="24" rx="12" fill="url(#dark)"/>
  <text x="165" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">jusqu'a -75%</text>

  <rect x="295" y="115" width="210" height="90" rx="8" fill="white" stroke="#eee" stroke-width="1"/>
  <text x="400" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Skechers</text>
  <rect x="335" y="165" width="130" height="24" rx="12" fill="url(#dark)"/>
  <text x="400" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">jusqu'a -78%</text>

  <rect x="530" y="115" width="210" height="90" rx="8" fill="white" stroke="#eee" stroke-width="1"/>
  <text x="635" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Columbia</text>
  <rect x="570" y="165" width="130" height="24" rx="12" fill="url(#red)"/>
  <text x="635" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">jusqu'a -60%</text>

  <!-- Row 2 -->
  <rect x="60" y="220" width="210" height="90" rx="8" fill="white" stroke="#eee" stroke-width="1"/>
  <text x="165" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Timberland</text>
  <rect x="100" y="270" width="130" height="24" rx="12" fill="url(#dark)"/>
  <text x="165" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">jusqu'a -55%</text>

  <rect x="295" y="220" width="210" height="90" rx="8" fill="white" stroke="#eee" stroke-width="1"/>
  <text x="400" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Arthur Martin</text>
  <rect x="335" y="270" width="130" height="24" rx="12" fill="url(#red)"/>
  <text x="400" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">jusqu'a -90%</text>

  <rect x="530" y="220" width="210" height="90" rx="8" fill="white" stroke="#eee" stroke-width="1"/>
  <text x="635" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Diesel</text>
  <rect x="570" y="270" width="130" height="24" rx="12" fill="url(#dark)"/>
  <text x="635" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">jusqu'a -65%</text>

  <!-- Bottom banner -->
  <rect x="150" y="340" width="500" height="45" rx="22" fill="url(#red)"/>
  <text x="400" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">EXPEDITION 72H -- VENTES PRIVEES</text>

  <!-- Subtitle -->
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#999">Mars 2026 -- Offres limitees dans le temps</text>
</svg>