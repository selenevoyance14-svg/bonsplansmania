<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="ari-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EDE5"/>
      <stop offset="100%" style="stop-color:#E8DDD0"/>
    </linearGradient>
    <linearGradient id="ari-taupe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C0A898"/>
      <stop offset="100%" style="stop-color:#A89080"/>
    </linearGradient>
    <linearGradient id="ari-soap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D0B8A8"/>
      <stop offset="100%" style="stop-color:#C0A898"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ari-bg)"/>
  <!-- Product box -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="240" height="280" rx="6" fill="url(#ari-taupe)" opacity="0.9"/>
    <text x="120" y="50" font-family="Georgia, serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">Shampoo bar</text>
    <text x="120" y="75" font-family="Georgia, serif" font-size="16" fill="white" text-anchor="middle">Shampoing solide</text>
    <line x1="40" y1="95" x2="80" y2="95" stroke="white" stroke-width="2" opacity="0.6"/>
    <text x="120" y="120" font-family="Poppins, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Curly hair</text>
    <text x="120" y="140" font-family="Poppins, sans-serif" font-size="12" fill="white" text-anchor="middle" opacity="0.9">Cheveux boucles</text>
    <line x1="40" y1="160" x2="80" y2="160" stroke="white" stroke-width="2" opacity="0.6"/>
    <text x="120" y="185" font-family="Poppins, sans-serif" font-size="11" fill="white" text-anchor="middle" opacity="0.85">Almond Oil</text>
    <text x="120" y="205" font-family="Poppins, sans-serif" font-size="11" fill="white" text-anchor="middle" opacity="0.85">Reetha</text>
    <text x="120" y="260" font-family="Poppins, sans-serif" font-size="11" fill="white" text-anchor="middle" opacity="0.7">Hair care</text>
  </g>
  <!-- Solid soap bar -->
  <g transform="translate(310, 100)">
    <circle cx="95" cy="95" r="95" fill="url(#ari-soap)"/>
    <!-- Speckles -->
    <circle cx="60" cy="60" r="1.5" fill="#A89080" opacity="0.4"/>
    <circle cx="80" cy="40" r="1" fill="#A89080" opacity="0.3"/>
    <circle cx="120" cy="70" r="1.5" fill="#A89080" opacity="0.4"/>
    <circle cx="100" cy="120" r="1" fill="#A89080" opacity="0.3"/>
    <circle cx="70" cy="110" r="1.5" fill="#A89080" opacity="0.4"/>
    <circle cx="130" cy="100" r="1" fill="#A89080" opacity="0.3"/>
    <circle cx="50" cy="90" r="1" fill="#A89080" opacity="0.3"/>
    <circle cx="140" cy="55" r="1.5" fill="#A89080" opacity="0.4"/>
    <!-- Brand embossed -->
    <text x="95" y="100" font-family="Georgia, serif" font-size="28" fill="#B0988A" text-anchor="middle" font-style="italic" opacity="0.7">arista</text>
  </g>
  <!-- Right side content -->
  <text x="540" y="70" font-family="Poppins, sans-serif" font-size="14" fill="#A89080" font-weight="700">NOTRE AVIS</text>
  <text x="540" y="105" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#4A3A30" font-style="italic">arista</text>
  <text x="540" y="135" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#4A3A30">Shampooing Solide</text>
  <text x="540" y="162" font-family="Georgia, serif" font-size="16" fill="#A89080" font-style="italic">Cheveux Boucles</text>
  <!-- Stars -->
  <g transform="translate(540, 180)">
    <polygon points="12,0 15,8 24,8 17,14 19,22 12,17 5,22 7,14 0,8 9,8" fill="#FFB800"/>
    <polygon points="37,0 40,8 49,8 42,14 44,22 37,17 30,22 32,14 25,8 34,8" fill="#FFB800"/>
    <polygon points="62,0 65,8 74,8 67,14 69,22 62,17 55,22 57,14 50,8 59,8" fill="#FFB800"/>
    <polygon points="87,0 90,8 99,8 92,14 94,22 87,17 80,22 82,14 75,8 84,8" fill="#FFB800"/>
    <polygon points="112,0 115,8 124,8 117,14 119,22 112,17 105,22 107,14 100,8 109,8" fill="#FFB800" opacity="0.3"/>
  </g>
  <text x="680" y="198" font-family="Poppins, sans-serif" font-size="14" fill="#888">4/5</text>
  <!-- Key points -->
  <g transform="translate(540, 225)">
    <circle cx="8" cy="8" r="8" fill="#A89080" opacity="0.8"/>
    <text x="8" y="12" font-family="Poppins, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
    <text x="25" y="13" font-family="Poppins, sans-serif" font-size="12" fill="#4A3A30">Sans sulfate, silicone, paraben</text>
  </g>
  <g transform="translate(540, 253)">
    <circle cx="8" cy="8" r="8" fill="#A89080" opacity="0.8"/>
    <text x="8" y="12" font-family="Poppins, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
    <text x="25" y="13" font-family="Poppins, sans-serif" font-size="12" fill="#4A3A30">Amande douce + karite + reetha</text>
  </g>
  <g transform="translate(540, 281)">
    <circle cx="8" cy="8" r="8" fill="#A89080" opacity="0.8"/>
    <text x="8" y="12" font-family="Poppins, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
    <text x="25" y="13" font-family="Poppins, sans-serif" font-size="12" fill="#4A3A30">Ingredients ayurvediques</text>
  </g>
  <rect x="540" y="320" width="120" height="40" rx="20" fill="url(#ari-taupe)"/>
  <text x="600" y="346" font-family="Poppins, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">~ 10 €</text>
  <text x="680" y="346" font-family="Poppins, sans-serif" font-size="12" fill="#888">sur Amazon</text>
  <!-- Curly hair badge -->
  <rect x="540" y="380" width="130" height="24" rx="12" fill="#A89080" opacity="0.2"/>
  <text x="605" y="396" font-family="Poppins, sans-serif" font-size="9" fill="#A89080" text-anchor="middle" font-weight="700">Special boucles</text>
</svg>