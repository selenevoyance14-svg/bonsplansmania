<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
  <!-- Fond vert doux -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Feuilles déco -->
  <ellipse cx="50" cy="100" rx="60" ry="25" fill="#4CAF50" opacity="0.2" transform="rotate(-30 50 100)"/>
  <ellipse cx="750" cy="80" rx="55" ry="22" fill="#4CAF50" opacity="0.2" transform="rotate(25 750 80)"/>
  <ellipse cx="70" cy="350" rx="50" ry="20" fill="#4CAF50" opacity="0.15" transform="rotate(-45 70 350)"/>
  <ellipse cx="730" cy="320" rx="45" ry="18" fill="#4CAF50" opacity="0.15" transform="rotate(40 730 320)"/>
  <!-- Bouteille Pêche Rose -->
  <rect x="260" y="100" width="70" height="170" rx="20" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
  <rect x="275" y="85" width="40" height="25" rx="5" fill="#E0E0E0"/>
  <rect x="282" y="75" width="26" height="15" rx="4" fill="#BDBDBD"/>
  <!-- Etiquette pêche rose -->
  <rect x="268" y="140" width="54" height="60" rx="4" fill="#FF8A80"/>
  <text x="295" y="160" text-anchor="middle" font-family="Arial" font-size="8" fill="#FFFFFF" font-weight="bold">fuze</text>
  <text x="295" y="172" text-anchor="middle" font-family="Arial" font-size="9" fill="#FFFFFF" font-weight="bold">tea</text>
  <text x="295" y="190" text-anchor="middle" font-family="Arial" font-size="6" fill="#FFFFFF">Pêche Rose</text>
  <!-- Liquide -->
  <rect x="270" y="210" width="50" height="50" rx="15" fill="#FFAB91" opacity="0.4"/>
  <!-- Bouteille Citron Citronnelle -->
  <rect x="470" y="100" width="70" height="170" rx="20" fill="#C8E6C9" stroke="#A5D6A7" stroke-width="1.5"/>
  <rect x="485" y="85" width="40" height="25" rx="5" fill="#A5D6A7"/>
  <rect x="492" y="75" width="26" height="15" rx="4" fill="#81C784"/>
  <!-- Etiquette citron -->
  <rect x="478" y="140" width="54" height="60" rx="4" fill="#66BB6A"/>
  <text x="505" y="160" text-anchor="middle" font-family="Arial" font-size="8" fill="#FFFFFF" font-weight="bold">fuze</text>
  <text x="505" y="172" text-anchor="middle" font-family="Arial" font-size="9" fill="#FFFFFF" font-weight="bold">tea</text>
  <text x="505" y="190" text-anchor="middle" font-family="Arial" font-size="6" fill="#FFFFFF">Citron Citron.</text>
  <!-- Liquide -->
  <rect x="480" y="210" width="50" height="50" rx="15" fill="#A5D6A7" opacity="0.4"/>
  <!-- Rose déco -->
  <circle cx="210" cy="200" r="15" fill="#F48FB1" opacity="0.5"/>
  <circle cx="210" cy="200" r="8" fill="#F06292" opacity="0.5"/>
  <!-- Citron déco -->
  <ellipse cx="590" cy="200" rx="18" ry="14" fill="#FFF176" opacity="0.6" stroke="#FFEE58" stroke-width="1"/>
  <!-- Badge GRATUIT -->
  <circle cx="690" cy="80" r="45" fill="#4CAF50"/>
  <text x="690" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF">TEST</text>
  <text x="690" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF">GRATUIT</text>
  <!-- Badge 1000 testeurs -->
  <rect x="30" y="55" width="120" height="45" rx="8" fill="#2E7D32"/>
  <text x="90" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF">1000 testeurs</text>
  <text x="90" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C8E6C9">recherchés</text>
  <!-- Titre -->
  <rect x="140" y="340" width="520" height="80" rx="12" fill="rgba(46,125,50,0.85)"/>
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF">Fuze Tea — Nouvelles Saveurs</text>
  <text x="400" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#C8E6C9">Test gratuit sur trnd — Pêche Rose et Citron Citronnelle</text>
</svg>
