<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="vp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EDE4"/>
      <stop offset="100%" style="stop-color:#E8DDD4"/>
    </linearGradient>
    <linearGradient id="vp-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="100%" style="stop-color:#6B4F10"/>
    </linearGradient>
    <linearGradient id="vp-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A4C639"/>
      <stop offset="100%" style="stop-color:#8DB62A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vp-bg)"/>
  <!-- Paw circle (Vista Pets inspired) -->
  <circle cx="130" cy="140" r="55" fill="url(#vp-green)" opacity="0.9"/>
  <circle cx="130" cy="140" r="42" fill="#F5EDE4"/>
  <circle cx="130" cy="140" r="35" fill="url(#vp-green)" opacity="0.8"/>
  <!-- Paw print -->
  <ellipse cx="130" cy="148" rx="14" ry="11" fill="url(#vp-accent)"/>
  <circle cx="115" cy="132" r="6" fill="url(#vp-accent)"/>
  <circle cx="130" cy="126" r="6" fill="url(#vp-accent)"/>
  <circle cx="145" cy="132" r="6" fill="url(#vp-accent)"/>
  <!-- Brand name -->
  <text x="70" y="230" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#6B4F10">Vista Pets</text>
  <!-- Cat silhouette -->
  <g transform="translate(540, 60)" opacity="0.12">
    <ellipse cx="80" cy="200" rx="70" ry="45" fill="#6B4F10"/>
    <circle cx="80" cy="140" r="40" fill="#6B4F10"/>
    <polygon points="52,115 45,70 70,105" fill="#6B4F10"/>
    <polygon points="108,115 115,70 90,105" fill="#6B4F10"/>
    <ellipse cx="130" cy="220" rx="25" ry="12" fill="#6B4F10" transform="rotate(-20, 130, 220)"/>
  </g>
  <!-- Toothbrush icon -->
  <g transform="translate(520, 140)">
    <rect x="0" y="25" width="160" height="12" rx="6" fill="#7BBFEA" opacity="0.8"/>
    <rect x="140" y="18" width="40" height="26" rx="4" fill="white" stroke="#7BBFEA" stroke-width="2"/>
    <rect x="145" y="22" width="4" height="18" rx="1" fill="#7BBFEA" opacity="0.6"/>
    <rect x="152" y="22" width="4" height="18" rx="1" fill="#7BBFEA" opacity="0.6"/>
    <rect x="159" y="22" width="4" height="18" rx="1" fill="#7BBFEA" opacity="0.6"/>
    <rect x="166" y="22" width="4" height="18" rx="1" fill="#7BBFEA" opacity="0.6"/>
  </g>
  <!-- Test badge -->
  <rect x="480" y="240" width="260" height="50" rx="25" fill="url(#vp-accent)" opacity="0.9"/>
  <text x="610" y="272" font-family="Poppins, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">TEST PRODUIT GRATUIT</text>
  <!-- Main text -->
  <text x="60" y="290" font-family="Poppins, sans-serif" font-size="18" fill="#6B4F10" opacity="0.9">Panel consommateur</text>
  <text x="60" y="330" font-family="Poppins, sans-serif" font-size="22" font-weight="bold" fill="#4A3A10">Testez 2 dentifrices</text>
  <text x="60" y="362" font-family="Poppins, sans-serif" font-size="22" font-weight="bold" fill="#4A3A10">pour chats</text>
  <!-- Duration badge -->
  <rect x="60" y="385" width="140" height="34" rx="17" fill="url(#vp-green)" opacity="0.85"/>
  <text x="130" y="408" font-family="Poppins, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">16 jours d'étude</text>
  <!-- Date badge -->
  <rect x="215" y="385" width="120" height="34" rx="17" fill="url(#vp-accent)" opacity="0.7"/>
  <text x="275" y="408" font-family="Poppins, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Mars 2026</text>
</svg>