  <text x="100" y="382" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">-40% sur votre commande</text>

  <rect x="80" y="412" width="520" height="50" rx="10" fill="white" fill-opacity="0.10" />
  <text x="100" y="444" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="600">ENVOIOFFERT : livraison gratuite</text>

  <rect x="80" y="474" width="520" height="50" rx="10" fill="white" fill-opacity="0.08" />
  <text x="100" y="506" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="600">Soldes : jusqu'a -50%</text>

  <!-- Date -->
  <text x="80" y="590" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7">Mars 2026 - Codes verifies</text>
