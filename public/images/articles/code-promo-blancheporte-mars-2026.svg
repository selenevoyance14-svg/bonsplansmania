      <stop offset="0%" style="stop-color:#1B4D6E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2A7AB5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4AA3D8;stop-opacity:1" />
