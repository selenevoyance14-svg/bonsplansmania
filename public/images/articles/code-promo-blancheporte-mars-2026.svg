  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="white" fill-opacity="0.05" />
  <circle cx="150" cy="530" r="160" fill="white" fill-opacity="0.05" />
  <circle cx="1100" cy="500" r="120" fill="white" fill-opacity="0.04" />
  <circle cx="600" cy="-50" r="250" fill="white" fill-opacity="0.04" />

  <!-- Clothing hanger decoration -->
  <path d="M1000 220 Q1020 180 1040 220" stroke="white" stroke-width="3" fill="none" stroke-opacity="0.15" />
  <line x1="1020" y1="180" x2="1020" y2="170" stroke="white" stroke-width="3" stroke-opacity="0.15" />
  <circle cx="1020" cy="167" r="5" fill="white" fill-opacity="0.15" />

  <!-- Site badge -->
