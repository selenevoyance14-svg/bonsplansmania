<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d6a4f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#40916c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#52b788;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f77f00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Fond -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Cercles déco -->
  <circle cx="1050" cy="100" r="180" fill="white" fill-opacity="0.05" />
  <circle cx="150" cy="530" r="220" fill="white" fill-opacity="0.05" />
  <circle cx="600" cy="315" r="400" fill="white" fill-opacity="0.03" />
  <!-- Feuille déco -->
  <ellipse cx="980" cy="480" rx="60" ry="30" fill="#95d5b2" fill-opacity="0.3" transform="rotate(-30 980 480)" />
  <ellipse cx="220" cy="150" rx="50" ry="25" fill="#95d5b2" fill-opacity="0.3" transform="rotate(20 220 150)" />
  <!-- Badge 20€ -->
  <circle cx="980" cy="150" r="110" fill="url(#badge)" />
  <text x="980" y="120" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle">20€</text>
  <text x="980" y="165" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">OFFERTS</text>
  <text x="980" y="200" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.9" text-anchor="middle">1ère commande</text>
  <!-- Titre principal -->
  <text x="100" y="220" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="white">GREENWEEZ</text>
  <!-- Sous-titre -->
  <text x="100" y="295" font-family="Arial, sans-serif" font-size="34" fill="#d8f3dc" font-weight="600">Le N°1 du Bio en Ligne en France</text>
  <!-- Stats -->
  <rect x="100" y="340" width="280" height="80" rx="12" fill="white" fill-opacity="0.15" />
  <text x="240" y="370" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle">+25 000</text>
  <text x="240" y="400" font-family="Arial, sans-serif" font-size="18" fill="#d8f3dc" text-anchor="middle">produits certifiés bio</text>

  <rect x="410" y="340" width="260" height="80" rx="12" fill="white" fill-opacity="0.15" />
  <text x="540" y="370" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle">Depuis</text>
  <text x="540" y="400" font-family="Arial, sans-serif" font-size="18" fill="#d8f3dc" text-anchor="middle">2008 en France</text>

  <rect x="700" y="340" width="280" height="80" rx="12" fill="white" fill-opacity="0.15" />
  <text x="840" y="370" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" fill="white" text-anchor="middle">Bio &amp; Éco</text>
  <text x="840" y="400" font-family="Arial, sans-serif" font-size="18" fill="#d8f3dc" text-anchor="middle">certifié Ecocert</text>
  <!-- Catégories -->
  <text x="100" y="475" font-family="Arial, sans-serif" font-size="22" fill="#d8f3dc">🥗 Alimentation bio  •  💚 Cosmétiques naturels  •  🏠 Maison éco  •  🌿 Bien-être</text>
  <!-- Bas -->
  <rect x="0" y="560" width="1200" height="70" fill="black" fill-opacity="0.2" />
  <text x="100" y="603" font-family="Arial, sans-serif" font-size="24" fill="white" font-weight="600">bonsplansmania.fr</text>
  <text x="1100" y="603" font-family="Arial, sans-serif" font-size="22" fill="#d8f3dc" text-anchor="end">Mars 2026</text>
</svg>
