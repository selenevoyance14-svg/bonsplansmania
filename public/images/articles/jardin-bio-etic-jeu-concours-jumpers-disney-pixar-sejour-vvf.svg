<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a10;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c518;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a810;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c3a1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d2510;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background forest -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <rect x="0" y="320" width="800" height="130" fill="url(#gold)" rx="0"/>
  <rect x="0" y="438" width="800" height="12" fill="url(#gold)" rx="0 0 12 12"/>

  <!-- Leaf decorations -->
  <g opacity="0.15">
    <ellipse cx="80" cy="60" rx="50" ry="25" fill="#4caf50" transform="rotate(-25 80 60)"/>
    <ellipse cx="720" cy="80" rx="45" ry="22" fill="#4caf50" transform="rotate(20 720 80)"/>
    <ellipse cx="50" cy="250" rx="35" ry="18" fill="#4caf50" transform="rotate(-10 50 250)"/>
  </g>

  <!-- Jardin BiO etic logo area -->
  <rect x="250" y="20" width="300" height="55" rx="8" fill="white" opacity="0.95"/>
  <text x="400" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2d5a1e" letter-spacing="2">LEA NATURE</text>
  <text x="400" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#2d5a1e">Jardin BiO etic</text>

  <!-- Jeu concours banner -->
  <rect x="220" y="90" width="360" height="40" rx="5" fill="url(#brown)"/>
  <text x="400" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="url(#gold)">Jeu concours</text>

  <!-- 100% gagnant badge -->
  <rect x="580" y="90" width="140" height="40" rx="20" fill="#4caf50"/>
  <text x="650" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">100% GAGNANT</text>

  <!-- Prizes -->
  <rect x="120" y="150" width="250" height="140" rx="10" fill="rgba(255,255,255,0.1)"/>
  <text x="245" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Lots a gagner</text>
  <text x="245" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">1 sejour en famille VVF</text>
  <text x="245" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Goodies du film Jumpers</text>
  <text x="245" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Codes promo Jardin BiO</text>
  <text x="245" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#aaa">Du 12/02/26 au 31/08/26</text>

  <!-- Disney Pixar Jumpers -->
  <rect x="430" y="150" width="250" height="140" rx="10" fill="rgba(255,255,255,0.1)"/>
  <text x="555" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#aaa" letter-spacing="2">DISNEY PIXAR</text>
  <text x="555" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#gold)">JUMPERS</text>
  <text x="555" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Au cinema le 4 mars 2026</text>
  <text x="555" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#aaa">Croquez la nature, vivez l'aventure</text>

  <!-- CTA on yellow section -->
  <rect x="280" y="345" width="240" height="40" rx="20" fill="url(#brown)"/>
  <text x="400" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#gold)">JE JOUE !</text>

  <!-- Bottom text -->
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5c3a1e">Jeu gratuit - Participation sans obligation d'achat</text>
</svg>