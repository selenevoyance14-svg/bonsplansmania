<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFECB3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Sol avec taches -->
  <rect x="0" y="300" width="800" height="150" fill="#D7CCC8" opacity="0.2"/>
  <ellipse cx="300" cy="340" rx="30" ry="8" fill="#A1887F" opacity="0.15"/>
  <ellipse cx="500" cy="350" rx="25" ry="6" fill="#A1887F" opacity="0.12"/>
  <!-- Aspirateur balai vertical -->
  <!-- Manche -->
  <rect x="370" y="60" width="12" height="220" rx="4" fill="#666"/>
  <rect x="368" y="60" width="16" height="20" rx="3" fill="#555"/>
  <!-- Poignée -->
  <rect x="362" y="50" width="28" height="18" rx="6" fill="#444"/>
  <!-- Corps principal -->
  <rect x="345" y="270" width="60" height="50" rx="8" fill="#555"/>
  <rect x="348" y="273" width="54" height="44" rx="6" fill="#616161"/>
  <!-- Réservoir eau propre -->
  <rect x="352" y="278" width="20" height="30" rx="4" fill="#64B5F6" opacity="0.5"/>
  <!-- Réservoir eau sale -->
  <rect x="378" y="278" width="20" height="30" rx="4" fill="#90A4AE" opacity="0.4"/>
  <!-- Rouleau brosse -->
  <ellipse cx="375" cy="325" rx="35" ry="10" fill="#8D6E63"/>
  <ellipse cx="375" cy="325" rx="32" ry="8" fill="#A1887F"/>
  <!-- Traces de nettoyage (avant/après) -->
  <rect x="250" y="310" width="100" height="80" fill="#A1887F" opacity="0.1"/>
  <rect x="400" y="310" width="150" height="80" fill="#FFECB3" opacity="0.3"/>
  <!-- Flèche direction -->
  <polygon points="420,290 440,300 420,310" fill="#4CAF50" opacity="0.4"/>
  <!-- Design plat 180° indication -->
  <path d="M320 330 L345 325" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="290" y="335" font-family="Arial, sans-serif" font-size="9" fill="#999">180°</text>
  <!-- Badge -43% -->
  <circle cx="700" cy="80" r="45" fill="#F44336"/>
  <text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF">-43%</text>
  <text x="700" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFCDD2">169,99€</text>
  <!-- Badge note -->
  <rect x="30" y="60" width="120" height="40" rx="8" fill="#FF6F00"/>
  <text x="90" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">4,9/5</text>
  <text x="90" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFE0B2">70 avis — 9,5/10</text>
  <!-- Titre -->
  <rect x="120" y="360" width="560" height="70" rx="10" fill="rgba(97,97,97,0.88)"/>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">Vexilar Cleanova X7 Aspirateur Laveur</text>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E0E0E0">Sans fil — Design plat 180° — Sec et humide — 40 min</text>
</svg>
