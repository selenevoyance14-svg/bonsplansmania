<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C4A6E"/>
      <stop offset="40%" style="stop-color:#0369A1"/>
      <stop offset="100%" style="stop-color:#0E7490"/>
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="100%" style="stop-color:#E8C9A0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Ocean waves -->
  <path d="M 0 420 Q 150 390, 300 420 Q 450 450, 600 420 Q 750 390, 900 420 Q 1050 450, 1200 420 L 1200 630 L 0 630 Z" fill="url(#sand)" opacity="0.3"/>
  <path d="M 0 450 Q 200 420, 400 450 Q 600 480, 800 450 Q 1000 420, 1200 450 L 1200 630 L 0 630 Z" fill="url(#sand)" opacity="0.2"/>
  <!-- Sun -->
  <circle cx="1050" cy="120" r="60" fill="url(#sun)" opacity="0.3"/>
  <circle cx="1050" cy="120" r="40" fill="url(#sun)" opacity="0.5"/>
  <!-- Seaweed/marine elements -->
  <path d="M 100 500 Q 110 450, 105 400 Q 100 350, 115 300" stroke="#059669" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M 130 510 Q 140 460, 135 410 Q 130 360, 145 320" stroke="#059669" stroke-width="2" fill="none" opacity="0.25"/>
  <path d="M 1080 490 Q 1090 440, 1085 390 Q 1080 340, 1095 300" stroke="#059669" stroke-width="2.5" fill="none" opacity="0.25"/>
  <!-- Badge TEST GRATUIT -->
  <rect x="430" y="60" width="340" height="48" rx="24" fill="white" opacity="0.95"/>
  <text x="600" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#0C4A6E">TEST GRATUIT x2</text>
  <!-- Brand -->
  <text x="600" y="175" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="white" opacity="0.6" letter-spacing="8">ALGOLOGIE · ARMOR · FRANCE</text>
  <!-- Main text -->
  <text x="600" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="white">Duo Bonne Mine</text>
  <text x="600" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="white" opacity="0.9">+ Routine Peau Floutee</text>
  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="url(#sand)">Soins marins bretons a tester gratuitement</text>
  <!-- Two mission badges -->
  <rect x="280" y="410" width="250" height="40" rx="20" fill="url(#sun)" opacity="0.85"/>
  <text x="405" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="white">#MonDuoBonneMine</text>
  <rect x="670" y="410" width="250" height="40" rx="20" fill="#0EA5E9" opacity="0.85"/>
  <text x="795" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="white">#MonFiltreMarin</text>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="white" opacity="0.95"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0C4A6E">Candidatures jusqu'au 12 et 15 avril 2026 — Produits complets offerts</text>
</svg>
