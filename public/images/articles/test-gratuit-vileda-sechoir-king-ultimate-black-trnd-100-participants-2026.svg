<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f8f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eee;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f06070;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Badge TEST GRATUIT -->
  <rect x="40" y="25" width="200" height="36" rx="18" fill="url(#badge)"/>
  <text x="140" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1.5">TEST GRATUIT</text>

  <!-- trnd logo area -->
  <text x="260" y="49" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">trnd x Vileda</text>

  <!-- Main title -->
  <text x="40" y="105" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1a1a1a">SECHOIR KING</text>
  <text x="40" y="145" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1a1a1a">ULTIMATE BLACK</text>

  <!-- Subtitle -->
  <text x="40" y="180" font-family="Arial, sans-serif" font-size="16" fill="#666">par Vileda — 100 participants selectionnes</text>

  <!-- Features -->
  <text x="40" y="230" font-family="Arial, sans-serif" font-size="15" fill="#444">
    <tspan x="40" dy="0">&#x2714; 20m d'etendage</tspan>
    <tspan x="40" dy="26">&#x2714; Design noir moderne</tspan>
    <tspan x="40" dy="26">&#x2714; Technologie Less Wires Marks</tspan>
    <tspan x="40" dy="26">&#x2714; Produit a garder apres le test</tspan>
  </text>

  <!-- Drying rack illustration (right side) -->
  <g transform="translate(500, 80)">
    <!-- Rack frame - dark/black design -->
    <rect x="0" y="120" width="250" height="8" rx="4" fill="#2d2d2d"/>
    <rect x="10" y="80" width="230" height="6" rx="3" fill="#3a3a3a"/>
    <rect x="20" y="45" width="210" height="5" rx="2.5" fill="#444"/>
    <!-- Legs -->
    <line x1="20" y1="128" x2="0" y2="200" stroke="#2d2d2d" stroke-width="5" stroke-linecap="round"/>
    <line x1="230" y1="128" x2="250" y2="200" stroke="#2d2d2d" stroke-width="5" stroke-linecap="round"/>
    <!-- Cross bars -->
    <line x1="40" y1="86" x2="40" y2="120" stroke="#555" stroke-width="2"/>
    <line x1="80" y1="86" x2="80" y2="120" stroke="#555" stroke-width="2"/>
    <line x1="120" y1="86" x2="120" y2="120" stroke="#555" stroke-width="2"/>
    <line x1="160" y1="86" x2="160" y2="120" stroke="#555" stroke-width="2"/>
    <line x1="200" y1="86" x2="200" y2="120" stroke="#555" stroke-width="2"/>
    <!-- Feature badges -->
    <rect x="30" y="10" width="55" height="30" rx="5" fill="#e74c5e"/>
    <text x="57" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">20m</text>
    <rect x="100" y="10" width="55" height="30" rx="5" fill="#e74c5e"/>
    <text x="127" y="29" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">XXL</text>
  </g>

  <!-- Participants counter -->
  <rect x="520" y="310" width="220" height="70" rx="12" fill="white" stroke="#e74c5e" stroke-width="2"/>
  <text x="630" y="338" font-family="Arial, sans-serif" font-size="13" fill="#666" text-anchor="middle">Places disponibles</text>
  <text x="630" y="365" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e74c5e" text-anchor="middle">100 testeurs</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#ddd"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#999" text-anchor="middle">bonsplansmania.fr — Projet trnd, 9 jours pour postuler</text>
</svg>
