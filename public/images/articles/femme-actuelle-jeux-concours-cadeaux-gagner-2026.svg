<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#be123c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.14" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="16"/>
  <circle cx="680" cy="80" r="140" fill="white" opacity="0.07"/>
  <circle cx="100" cy="390" r="110" fill="white" opacity="0.05"/>
  <!-- Badges -->
  <rect x="40" y="40" width="120" height="38" rx="19" fill="white" opacity="0.2"/>
  <text x="100" y="64" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">CONCOURS</text>
  <rect x="175" y="40" width="230" height="38" rx="19" fill="#f59e0b" opacity="0.9"/>
  <text x="290" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">Voyages · Beauté · Maison</text>
  <rect x="560" y="40" width="200" height="38" rx="19" fill="white" opacity="0.18"/>
  <text x="660" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">Participation gratuite</text>
  <!-- Card -->
  <rect x="40" y="100" width="720" height="230" rx="16" fill="url(#card)"/>
  <!-- Icon -->
  <rect x="60" y="120" width="80" height="80" rx="12" fill="white" opacity="0.15"/>
  <text x="100" y="172" font-family="Arial, sans-serif" font-size="36" text-anchor="middle">🎯</text>
  <!-- Brand -->
  <text x="165" y="148" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white" opacity="0.75">FEMME ACTUELLE · JEUX CONCOURS</text>
  <!-- Title -->
  <text x="165" y="183" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="white">Cadeaux à Gagner</text>
  <text x="165" y="213" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white">Chaque semaine de nouveaux lots</text>
  <!-- Subtitle -->
  <text x="165" y="248" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.85">Croisières · Soins beauté · Électroménager · Coffrets</text>
  <!-- Features -->
  <rect x="60" y="295" width="215" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="167" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Tirage au sort équitable</text>
  <rect x="290" y="295" width="200" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="390" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Lots jusqu'à 3 200€</text>
  <rect x="505" y="295" width="235" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="622" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Depuis 1984</text>
  <!-- Bottom -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.5" text-anchor="middle">bonsplansmania.fr</text>
