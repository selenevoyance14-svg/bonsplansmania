<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#831843"/>
      <stop offset="50%" style="stop-color:#BE185D"/>
      <stop offset="100%" style="stop-color:#831843"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE68A"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Sparkles -->
  <text x="200" y="180" font-size="20" fill="#FDE68A" opacity="0.3">&#10022;</text>
  <text x="350" y="120" font-size="14" fill="#FDE68A" opacity="0.25">&#10022;</text>
  <text x="900" y="160" font-size="18" fill="#FDE68A" opacity="0.3">&#10022;</text>
  <text x="1050" y="200" font-size="12" fill="#FDE68A" opacity="0.2">&#10022;</text>
  <text x="150" y="420" font-size="16" fill="#FDE68A" opacity="0.2">&#10022;</text>
  <text x="1000" y="380" font-size="22" fill="#FDE68A" opacity="0.25">&#10022;</text>
  <!-- Perfume bottles -->
  <g transform="translate(100, 200)" opacity="0.4">
    <rect x="15" y="0" width="20" height="12" rx="2" fill="url(#gold)"/>
    <rect x="5" y="12" width="40" height="70" rx="6" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  </g>
  <g transform="translate(1060, 220)" opacity="0.35">
    <rect x="12" y="0" width="16" height="10" rx="2" fill="url(#gold)"/>
    <rect x="0" y="10" width="40" height="65" rx="8" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
  </g>
  <!-- Shopping bag icon -->
  <g transform="translate(550, 55)" opacity="0.8">
    <rect x="0" y="20" width="100" height="70" rx="8" fill="url(#gold)" opacity="0.2"/>
    <path d="M 25 20 L 25 10 Q 25 0, 50 0 Q 75 0, 75 10 L 75 20" stroke="url(#gold)" stroke-width="2.5" fill="none"/>
  </g>
  <!-- Badge -->
  <rect x="380" y="160" width="440" height="52" rx="26" fill="url(#gold)"/>
  <text x="600" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#831843">SHOPPING DAYS ADOPT</text>
  <!-- Main text -->
  <text x="600" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="56" font-weight="900" fill="white">Jusqu'a -50%</text>
  <text x="600" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#FDE68A">sur 283 parfums, maquillage et soins</text>
  <!-- Price highlights -->
  <g transform="translate(280, 385)">
    <rect x="0" y="0" width="180" height="42" rx="21" fill="white" opacity="0.15"/>
    <text x="90" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">EDP des 9,56E</text>
  </g>
  <g transform="translate(510, 385)">
    <rect x="0" y="0" width="180" height="42" rx="21" fill="white" opacity="0.15"/>
    <text x="90" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">3+1 GRATUIT</text>
  </g>
  <g transform="translate(740, 385)">
    <rect x="0" y="0" width="180" height="42" rx="21" fill="white" opacity="0.15"/>
    <text x="90" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">Coffrets -50%</text>
  </g>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="url(#gold)" opacity="0.95"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#831843">Du 26 mars au 16 avril 2026 — Livraison gratuite des 35E</text>
</svg>
