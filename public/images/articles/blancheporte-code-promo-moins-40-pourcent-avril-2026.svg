<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf6f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5e6d8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b1a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2185b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative -->
  <circle cx="680" cy="80" r="90" fill="#f9e547" opacity="0.15"/>
  <circle cx="100" cy="400" r="60" fill="#c2185b" opacity="0.08"/>

  <!-- Badge -->
  <rect x="40" y="25" width="260" height="36" rx="18" fill="url(#badge)"/>
  <text x="170" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">CODE PROMO EXCLUSIF</text>

  <!-- Main title -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#2d3436">Blancheporte</text>

  <!-- Discount circle -->
  <circle cx="160" cy="210" r="65" fill="#f9e547"/>
  <text x="160" y="200" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#2d3436" text-anchor="middle">-40%</text>
  <text x="160" y="228" font-family="Arial, sans-serif" font-size="14" fill="#2d3436" text-anchor="middle">sur TOUTE</text>
  <text x="160" y="245" font-family="Arial, sans-serif" font-size="14" fill="#2d3436" text-anchor="middle">la commande</text>

  <!-- Code box -->
  <rect x="260" y="175" width="220" height="50" rx="10" fill="white" stroke="#8b1a4a" stroke-width="2"/>
  <text x="370" y="195" font-family="Arial, sans-serif" font-size="12" fill="#636e72" text-anchor="middle">CODE</text>
  <text x="370" y="216" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#8b1a4a" text-anchor="middle">899004</text>

  <!-- Condition -->
  <text x="40" y="300" font-family="Arial, sans-serif" font-size="15" fill="#636e72">Des 2 articles - du 24/03 au 15/04/2026</text>

  <!-- Categories -->
  <text x="40" y="345" font-family="Arial, sans-serif" font-size="14" fill="#444">
    <tspan x="40" dy="0">Femme - Lingerie - Homme - Maison</tspan>
    <tspan x="40" dy="24">Chaussures - Ceremonie - Linge de lit</tspan>
  </text>

  <!-- Illustrations right side -->
  <!-- Clothing item -->
  <rect x="540" y="70" width="100" height="130" rx="10" fill="white" stroke="#e0c8b8" stroke-width="2"/>
  <rect x="555" y="85" width="70" height="40" rx="5" fill="#f0c8c8" opacity="0.5"/>
  <rect x="555" y="135" width="70" height="50" rx="5" fill="#dce8f0" opacity="0.5"/>

  <!-- Bedding item -->
  <rect x="660" y="90" width="110" height="120" rx="10" fill="white" stroke="#e0c8b8" stroke-width="2"/>
  <rect x="675" y="105" width="80" height="90" rx="5" fill="#f5e0d0" opacity="0.4"/>
  <circle cx="700" cy="140" r="8" fill="#e07060" opacity="0.3"/>
  <circle cx="725" cy="155" r="6" fill="#e07060" opacity="0.25"/>
  <circle cx="740" cy="135" r="10" fill="#c09060" opacity="0.2"/>

  <!-- Price tag -->
  <circle cx="640" cy="310" r="45" fill="#8b1a4a"/>
  <text x="640" y="300" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">TAILLES</text>
  <text x="640" y="322" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">34 au 58</text>
  <text x="640" y="340" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">femme</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#e0c8b8"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#b0b0b0" text-anchor="middle">bonsplansmania.fr — Blancheporte</text>
</svg>