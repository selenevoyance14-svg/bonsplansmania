<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8bbd0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- Title -->
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="14" fill="#ad1457" text-anchor="middle" font-weight="bold" letter-spacing="2">SÉLECTION 2026</text>
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#212121" text-anchor="middle">Top 10 Baumes à Lèvres</text>
  <text x="400" y="115" font-family="Arial, sans-serif" font-size="15" fill="#757575" text-anchor="middle">Compositions clean, bio et Made in France</text>
  <!-- Lip balm sticks representation -->
  <!-- Stick 1 - Krème gold -->
  <rect x="80" y="160" width="28" height="180" rx="14" fill="#c8a84e"/>
  <rect x="80" y="220" width="28" height="60" rx="4" fill="#f5f5f5"/>
  <text x="94" y="255" font-family="Arial, sans-serif" font-size="7" fill="#424242" text-anchor="middle">Krème</text>
  <!-- Stick 2 - Le Petit Olivier green -->
  <rect x="130" y="170" width="28" height="170" rx="14" fill="#689f38"/>
  <rect x="130" y="230" width="28" height="60" rx="4" fill="#f5f5f5"/>
  <text x="144" y="265" font-family="Arial, sans-serif" font-size="6" fill="#424242" text-anchor="middle">Petit Olivier</text>
  <!-- Stick 3 - SVR white -->
  <rect x="180" y="155" width="28" height="185" rx="14" fill="#eceff1"/>
  <rect x="180" y="215" width="28" height="60" rx="4" fill="#1565c0"/>
  <text x="194" y="250" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">SVR</text>
  <!-- Stick 4 - Laïno blue -->
  <rect x="230" y="165" width="28" height="175" rx="14" fill="#1a237e"/>
  <rect x="230" y="225" width="28" height="60" rx="4" fill="#e53935"/>
  <text x="244" y="260" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Laïno</text>
  <!-- Stick 5 - So Bio green -->
  <rect x="280" y="160" width="28" height="180" rx="14" fill="#43a047"/>
  <rect x="280" y="220" width="28" height="60" rx="4" fill="#f5f5f5"/>
  <text x="294" y="255" font-family="Arial, sans-serif" font-size="6" fill="#424242" text-anchor="middle">SO'BiO</text>
  <!-- Stick 6 - Cien pink -->
  <rect x="370" y="170" width="28" height="170" rx="14" fill="#f48fb1"/>
  <rect x="370" y="230" width="28" height="60" rx="4" fill="#f5f5f5"/>
  <text x="384" y="265" font-family="Arial, sans-serif" font-size="7" fill="#424242" text-anchor="middle">Cien</text>
  <!-- Stick 7 - Rosée rose -->
  <rect x="420" y="155" width="28" height="185" rx="14" fill="#e91e63"/>
  <rect x="420" y="215" width="28" height="60" rx="4" fill="#f5f5f5"/>
  <text x="434" y="250" font-family="Arial, sans-serif" font-size="7" fill="#424242" text-anchor="middle">Rosée</text>
  <!-- Stick 8 - Avène white/orange -->
  <rect x="470" y="165" width="28" height="175" rx="14" fill="#ff6f00"/>
  <rect x="470" y="225" width="28" height="60" rx="4" fill="#f5f5f5"/>
  <text x="484" y="260" font-family="Arial, sans-serif" font-size="7" fill="#424242" text-anchor="middle">Avène</text>
  <!-- Stick 9 - Yves Rocher yellow -->
  <rect x="560" y="160" width="28" height="180" rx="14" fill="#fdd835"/>
  <rect x="560" y="220" width="28" height="60" rx="4" fill="#f5f5f5"/>
  <text x="574" y="255" font-family="Arial, sans-serif" font-size="6" fill="#424242" text-anchor="middle">Yves R.</text>
  <!-- Stick 10 - Beauty DERM rose -->
  <rect x="610" y="170" width="28" height="170" rx="14" fill="#f8bbd0"/>
  <rect x="610" y="230" width="28" height="60" rx="4" fill="#f5f5f5"/>
  <text x="624" y="265" font-family="Arial, sans-serif" font-size="6" fill="#424242" text-anchor="middle">DERM</text>
  <!-- Labels -->
  <rect x="200" y="370" width="100" height="28" rx="14" fill="#43a047"/>
  <text x="250" y="389" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">BIO</text>
  <rect x="320" y="370" width="160" height="28" rx="14" fill="#1565c0"/>
  <text x="400" y="389" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">MADE IN FRANCE</text>
  <rect x="500" y="370" width="100" height="28" rx="14" fill="#e91e63"/>
  <text x="550" y="389" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">CLEAN</text>
  <!-- Footer -->
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="13" fill="#9e9e9e" text-anchor="middle">Comparatif et guide d'achat — Disponibles sur Amazon</text>
</svg>
