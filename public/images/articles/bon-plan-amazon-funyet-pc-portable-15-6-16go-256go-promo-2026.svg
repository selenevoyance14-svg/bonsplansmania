<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8f4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c2d91;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3e1a6e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amazon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e68a00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d0d0d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8b8c4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Laptop illustration -->
  <g transform="translate(180, 50)">
    <!-- Screen -->
    <rect x="0" y="0" width="280" height="175" rx="8" fill="#222"/>
    <rect x="8" y="8" width="264" height="155" rx="4" fill="#1a1a3e"/>
    <!-- Screen content -->
    <text x="140" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">15.6" Full HD</text>
    <text x="140" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8080ff">IPS 1920x1080</text>
    <!-- Specs on screen -->
    <rect x="50" y="100" width="80" height="22" rx="4" fill="url(#purple)" opacity="0.8"/>
    <text x="90" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">16Go RAM</text>
    <rect x="150" y="100" width="80" height="22" rx="4" fill="url(#purple)" opacity="0.8"/>
    <text x="190" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">256Go SSD</text>
    <!-- Keyboard base -->
    <path d="M -20,175 L 300,175 L 320,210 L -40,210 Z" fill="url(#silver)"/>
    <rect x="20" y="180" width="240" height="15" rx="2" fill="#c0c0c8"/>
  </g>

  <!-- Promo badge -->
  <rect x="500" y="55" width="230" height="105" rx="14" fill="url(#amazon)"/>
  <text x="615" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white">-60%</text>
  <text x="615" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.9">Offre a duree limitee</text>
  <text x="615" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.7">Amazon -- Stock limite</text>

  <!-- Price -->
  <text x="615" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#999" text-decoration="line-through">799,99E</text>
  <text x="615" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#c62828">319,99E</text>
  <text x="615" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">ou 81,83E x4 mois</text>

  <!-- Brand -->
  <text x="400" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555" letter-spacing="3">FUNYET</text>

  <!-- Feature pills -->
  <rect x="80" y="335" width="120" height="28" rx="14" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="140" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Windows 11 Pro</text>

  <rect x="220" y="335" width="100" height="28" rx="14" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="270" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">HDMI + USB-C</text>

  <rect x="340" y="335" width="100" height="28" rx="14" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="390" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">WiFi 5 + BT</text>

  <rect x="460" y="335" width="120" height="28" rx="14" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="520" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Extension 1To</text>

  <rect x="600" y="335" width="120" height="28" rx="14" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="660" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Batterie 5000mAh</text>

  <!-- Bottom -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Livraison gratuite -- Retours 30 jours -- Paiement en 4x</text>
</svg>