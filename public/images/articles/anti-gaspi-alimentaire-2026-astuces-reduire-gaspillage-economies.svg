<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ADE80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0FDF4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05)" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="130" r="180" fill="white" fill-opacity="0.05"/>
  <circle cx="1070" cy="480" r="130" fill="white" fill-opacity="0.04"/>
  <rect x="60" y="60" width="700" height="510" rx="24" fill="url(#card)" stroke="white" stroke-opacity="0.2"/>
  <rect x="100" y="100" width="130" height="36" rx="18" fill="#15803D"/>
  <text x="165" y="123" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">BON PLAN</text>
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white">Anti-Gaspi Alimentaire</text>
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="22" fill="white" fill-opacity="0.9">Ne plus jeter de nourriture</text>
  <text x="100" y="270" font-family="Arial, sans-serif" font-size="22" fill="white" fill-opacity="0.9">et économiser jusqu'à 100€/mois</text>
  <rect x="100" y="315" width="560" height="1" fill="white" fill-opacity="0.2"/>
  <text x="100" y="360" font-family="Arial, sans-serif" font-size="17" fill="white" fill-opacity="0.8">DLC vs DDM : ce qu'on peut encore manger</text>
  <text x="100" y="390" font-family="Arial, sans-serif" font-size="17" fill="white" fill-opacity="0.8">Congélation, conservation, recettes restes</text>
  <text x="100" y="420" font-family="Arial, sans-serif" font-size="17" fill="white" fill-opacity="0.8">Organisation du frigo anti-gaspillage</text>
  <rect x="100" y="470" width="200" height="50" rx="25" fill="#15803D"/>
  <text x="200" y="501" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">Voir les astuces</text>
  <rect x="820" y="180" width="300" height="280" rx="20" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2"/>
  <text x="970" y="235" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#FDE68A" text-anchor="middle">100€</text>
  <text x="970" y="270" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.7" text-anchor="middle">gaspillés par mois/foyer</text>
  <line x1="870" y1="300" x2="1070" y2="300" stroke="white" stroke-opacity="0.15"/>
  <text x="970" y="340" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.9" text-anchor="middle">30 kg par personne</text>
  <text x="970" y="365" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.6" text-anchor="middle">jetés chaque année</text>
  <line x1="870" y1="390" x2="1070" y2="390" stroke="white" stroke-opacity="0.15"/>
  <text x="970" y="425" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.9" text-anchor="middle">Astuces simples</text>
  <text x="970" y="450" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.6" text-anchor="middle">applicables ce soir</text>
  <text x="1140" y="600" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.4" text-anchor="end">bonsplansmania.fr</text>
