  <!-- Features -->
  <rect x="60" y="295" width="220" height="22" rx="11" fill="white" opacity="0.12"/>
  <text x="170" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Validé ophtalmologistes</text>
  <rect x="295" y="295" width="190" height="22" rx="11" fill="white" opacity="0.12"/>
  <text x="390" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Gratuit et offert</text>
  <rect x="500" y="295" width="230" height="22" rx="11" fill="white" opacity="0.12"/>
  <text x="615" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Fondé par pharmaciens</text>
  <!-- Bottom -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.5" text-anchor="middle">bonsplansmania.fr</text>
