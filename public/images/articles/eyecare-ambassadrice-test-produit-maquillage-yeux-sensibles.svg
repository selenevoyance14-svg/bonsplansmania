  <text x="110" y="64" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">TEST GRATUIT</text>
  <!-- Card -->
  <rect x="40" y="100" width="720" height="230" rx="16" fill="url(#card)"/>
  <!-- Icon -->
  <rect x="60" y="120" width="80" height="80" rx="12" fill="white" opacity="0.15"/>
  <text x="100" y="172" font-family="Arial, sans-serif" font-size="36" text-anchor="middle">👁️</text>
  <!-- Brand -->
  <text x="165" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white" opacity="0.75">EYE CARE COSMETICS</text>
  <!-- Title -->
