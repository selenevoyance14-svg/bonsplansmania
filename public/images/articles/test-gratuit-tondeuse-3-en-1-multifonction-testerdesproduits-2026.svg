<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F2937"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#1F2937"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E05A6D"/>
      <stop offset="100%" style="stop-color:#D94462"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9CA3AF"/>
      <stop offset="100%" style="stop-color:#6B7280"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Trimmer illustration -->
  <g transform="translate(120, 180)" opacity="0.3">
    <rect x="20" y="0" width="30" height="15" rx="3" fill="url(#steel)"/>
    <rect x="10" y="15" width="50" height="120" rx="8" fill="url(#steel)"/>
    <rect x="5" y="0" width="60" height="8" rx="2" fill="#4B5563"/>
    <rect x="18" y="40" width="34" height="50" rx="3" fill="white" opacity="0.15"/>
  </g>
  <!-- Trimmer 2 -->
  <g transform="translate(1040, 200)" opacity="0.2">
    <rect x="15" y="0" width="25" height="12" rx="3" fill="url(#steel)"/>
    <rect x="8" y="12" width="40" height="100" rx="6" fill="url(#steel)"/>
    <rect x="3" y="0" width="50" height="6" rx="2" fill="#4B5563"/>
  </g>
  <!-- Badge TEST GRATUIT -->
  <rect x="390" y="50" width="420" height="52" rx="26" fill="url(#red)"/>
  <text x="600" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="white">TEST GRATUIT · 8 EXEMPLAIRES</text>
  <!-- Brand -->
  <text x="600" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="white" opacity="0.4" letter-spacing="5">TESTER DES PRODUITS</text>
  <!-- Main text -->
  <text x="600" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="900" fill="white">Tondeuse 3-en-1</text>
  <text x="600" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="url(#red)">Multifonction</text>
  <!-- Features -->
  <g transform="translate(250, 370)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="white" opacity="0.08"/>
    <text x="75" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.7">Étanche</text>
  </g>
  <g transform="translate(420, 370)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="white" opacity="0.08"/>
    <text x="75" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.7">Rechargeable</text>
  </g>
  <g transform="translate(590, 370)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="white" opacity="0.08"/>
    <text x="75" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.7">3 fonctions</text>
  </g>
  <g transform="translate(760, 370)">
    <rect x="0" y="0" width="190" height="38" rx="19" fill="white" opacity="0.08"/>
    <text x="95" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.7">Douche ou à sec</text>
  </g>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="url(#red)" opacity="0.95"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">Tirage au sort le 25 mai 2026 — Inscription gratuite</text>
</svg>
