<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff3e0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f57c00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#222;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Mission badge -->
  <rect x="220" y="18" width="360" height="28" rx="4" fill="url(#dark)"/>
  <text x="400" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" letter-spacing="2">MISSION AVIS VIDÉO</text>

  <!-- Naali logo text -->
  <text x="400" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#333" letter-spacing="3">naali</text>

  <!-- Product box -->
  <g transform="translate(280, 100)">
    <rect x="0" y="0" width="240" height="200" rx="12" fill="white" stroke="#eee" stroke-width="1.5"/>
    <!-- Orange top bar -->
    <rect x="0" y="0" width="240" height="40" rx="12" fill="url(#orange)"/>
    <rect x="0" y="20" width="240" height="20" fill="url(#orange)"/>
    <text x="120" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">ANTI-STRESS</text>

    <!-- Naali on box -->
    <text x="120" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#333">naali</text>

    <!-- Safran + ingredients -->
    <text x="120" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Safran + Vitamines B6, B9, B12</text>

    <!-- Gummy illustrations -->
    <circle cx="70" cy="130" r="12" fill="#ffb74d" opacity="0.7"/>
    <circle cx="100" cy="125" r="11" fill="#ffa726" opacity="0.6"/>
    <circle cx="130" cy="132" r="12" fill="#ffb74d" opacity="0.7"/>
    <circle cx="160" cy="127" r="11" fill="#ffa726" opacity="0.6"/>

    <!-- Flavor -->
    <text x="120" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f57c00">Goût mangue</text>
    <text x="120" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999">60 gommes — Cure 30 jours</text>
  </g>

  <!-- Stones decoration (like the product photo) -->
  <g transform="translate(100, 180)">
    <ellipse cx="60" cy="120" rx="45" ry="25" fill="#c8beb0" opacity="0.5"/>
    <ellipse cx="55" cy="95" rx="35" ry="20" fill="#d4c9bb" opacity="0.5"/>
    <ellipse cx="60" cy="72" rx="28" ry="16" fill="#c8beb0" opacity="0.4"/>
  </g>

  <g transform="translate(580, 200)">
    <ellipse cx="50" cy="100" rx="40" ry="22" fill="#c8beb0" opacity="0.4"/>
    <ellipse cx="45" cy="78" rx="32" ry="18" fill="#d4c9bb" opacity="0.4"/>
  </g>

  <!-- 15 produits badge -->
  <circle cx="600" cy="140" r="40" fill="url(#orange)"/>
  <text x="600" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">15</text>
  <text x="600" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">produits</text>
  <text x="600" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">à tester</text>

  <!-- Gratuit badge -->
  <rect x="300" y="320" width="200" height="36" rx="18" fill="url(#dark)"/>
  <text x="400" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">TEST GRATUIT</text>

  <!-- Date -->
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888">Candidature jusqu'au 2 avril 2026</text>

  <!-- Bottom leaves -->
  <ellipse cx="80" cy="420" rx="18" ry="7" fill="#a5d6a7" opacity="0.25" transform="rotate(-25 80 420)"/>
  <ellipse cx="720" cy="420" rx="18" ry="7" fill="#a5d6a7" opacity="0.25" transform="rotate(25 720 420)"/>
</svg>