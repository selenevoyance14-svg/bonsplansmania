<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#C8232C"/>
  <!-- Inner card -->
  <rect x="40" y="20" width="720" height="410" rx="8" fill="#D42D36"/>
  <!-- Title -->
  <text x="400" y="80" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" fill="white" text-anchor="middle">GAGNEZ 1 AN DE PRODUITS</text>
  <text x="400" y="120" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">DUCROS</text>
  <!-- Subtitle -->
  <text x="400" y="160" font-family="Poppins, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.9">Tentez de remporter une selection de 20 produits Ducros</text>
  <text x="400" y="180" font-family="Poppins, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.9">paprika, herbes aromatiques, curry, ail, melanges du monde</text>
  <!-- Product area background -->
  <rect x="200" y="200" width="400" height="160" rx="12" fill="white" opacity="0.1"/>
  <!-- Badge "1 an" -->
  <g transform="translate(330, 220)">
    <rect x="0" y="0" width="140" height="45" rx="4" fill="#B01020" transform="rotate(-5, 70, 22)"/>
    <text x="70" y="22" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#FFD700" text-anchor="middle" transform="rotate(-5, 70, 22)">1 an</text>
    <text x="70" y="55" font-family="Poppins, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">de produits</text>
    <text x="70" y="73" font-family="Poppins, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">a gagner</text>
  </g>
  <!-- Spice jars simplified -->
  <g transform="translate(150, 280)">
    <!-- Jar 1 - Curry -->
    <rect x="0" y="10" width="35" height="50" rx="4" fill="#DAA520"/>
    <rect x="5" y="0" width="25" height="15" rx="3" fill="#333"/>
    <text x="17" y="35" font-family="Poppins, sans-serif" font-size="5" fill="white" text-anchor="middle" font-weight="bold">CURRY</text>
    <text x="17" y="50" font-family="Poppins, sans-serif" font-size="4" fill="white" text-anchor="middle">Ducros</text>
  </g>
  <g transform="translate(220, 275)">
    <!-- Jar 2 - Herbes Provence -->
    <rect x="0" y="10" width="40" height="55" rx="4" fill="#4A8A4A"/>
    <rect x="5" y="0" width="30" height="15" rx="3" fill="#333"/>
    <text x="20" y="32" font-family="Poppins, sans-serif" font-size="4.5" fill="white" text-anchor="middle" font-weight="bold">HERBES DE</text>
    <text x="20" y="40" font-family="Poppins, sans-serif" font-size="4.5" fill="white" text-anchor="middle" font-weight="bold">PROVENCE</text>
    <text x="20" y="55" font-family="Poppins, sans-serif" font-size="4" fill="white" text-anchor="middle">Ducros</text>
  </g>
  <g transform="translate(370, 280)">
    <!-- Jar 3 - Moulin 5 baies -->
    <rect x="0" y="5" width="35" height="55" rx="4" fill="#8B4513"/>
    <rect x="5" y="-5" width="25" height="18" rx="3" fill="#222"/>
    <text x="17" y="28" font-family="Poppins, sans-serif" font-size="4.5" fill="white" text-anchor="middle" font-weight="bold">MOULIN</text>
    <text x="17" y="36" font-family="Poppins, sans-serif" font-size="4.5" fill="white" text-anchor="middle" font-weight="bold">5 BAIES</text>
    <text x="17" y="50" font-family="Poppins, sans-serif" font-size="4" fill="white" text-anchor="middle">Ducros</text>
  </g>
  <g transform="translate(440, 278)">
    <!-- Jar 4 - Ail -->
    <rect x="0" y="10" width="35" height="50" rx="4" fill="#E8D8B0"/>
    <rect x="5" y="0" width="25" height="15" rx="3" fill="#333"/>
    <text x="17" y="35" font-family="Poppins, sans-serif" font-size="5" fill="#333" text-anchor="middle" font-weight="bold">AIL</text>
    <text x="17" y="50" font-family="Poppins, sans-serif" font-size="4" fill="#555" text-anchor="middle">Ducros</text>
  </g>
  <g transform="translate(520, 275)">
    <!-- Jar 5 - Paprika -->
    <rect x="0" y="10" width="38" height="55" rx="4" fill="#CC3333"/>
    <rect x="5" y="0" width="28" height="15" rx="3" fill="#222"/>
    <text x="19" y="32" font-family="Poppins, sans-serif" font-size="4.5" fill="white" text-anchor="middle" font-weight="bold">PAPRIKA</text>
    <text x="19" y="40" font-family="Poppins, sans-serif" font-size="4.5" fill="white" text-anchor="middle" font-weight="bold">DOUX</text>
    <text x="19" y="55" font-family="Poppins, sans-serif" font-size="4" fill="white" text-anchor="middle">Ducros</text>
  </g>
  <g transform="translate(600, 280)">
    <!-- Jar 6 - Mexicaine -->
    <rect x="0" y="10" width="35" height="50" rx="4" fill="#D2691E"/>
    <rect x="5" y="0" width="25" height="15" rx="3" fill="#333"/>
    <text x="17" y="32" font-family="Poppins, sans-serif" font-size="4" fill="white" text-anchor="middle" font-weight="bold">MELANGE</text>
    <text x="17" y="40" font-family="Poppins, sans-serif" font-size="4" fill="white" text-anchor="middle" font-weight="bold">MEXICAIN</text>
    <text x="17" y="52" font-family="Poppins, sans-serif" font-size="4" fill="white" text-anchor="middle">Ducros</text>
  </g>
  <!-- CTA button -->
  <rect x="220" y="380" width="360" height="44" rx="4" fill="white"/>
  <text x="400" y="408" font-family="Poppins, sans-serif" font-size="16" font-weight="800" fill="#333" text-anchor="middle">JE PARTICIPE</text>
</svg>