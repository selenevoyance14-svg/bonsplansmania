<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="50%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#EA580C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Tablet illustration -->
  <g transform="translate(100, 180)" opacity="0.3">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="none" stroke="url(#blue)" stroke-width="2"/>
    <rect x="8" y="8" width="144" height="94" rx="4" fill="url(#blue)" opacity="0.15"/>
    <circle cx="80" cy="100" r="3" fill="url(#blue)" opacity="0.5"/>
  </g>
  <!-- Keyboard illustration -->
  <g transform="translate(100, 300)" opacity="0.2">
    <rect x="0" y="0" width="160" height="50" rx="4" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="10" y="8" width="12" height="10" rx="2" fill="#94A3B8" opacity="0.4"/>
    <rect x="26" y="8" width="12" height="10" rx="2" fill="#94A3B8" opacity="0.4"/>
    <rect x="42" y="8" width="12" height="10" rx="2" fill="#94A3B8" opacity="0.4"/>
    <rect x="58" y="8" width="12" height="10" rx="2" fill="#94A3B8" opacity="0.4"/>
    <rect x="74" y="8" width="12" height="10" rx="2" fill="#94A3B8" opacity="0.4"/>
    <rect x="90" y="8" width="12" height="10" rx="2" fill="#94A3B8" opacity="0.4"/>
  </g>
  <!-- Badge -->
  <rect x="400" y="50" width="400" height="52" rx="26" fill="url(#orange)"/>
  <text x="600" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="white">OFFRE À DURÉE LIMITÉE -55%</text>
  <!-- Main text -->
  <text x="600" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="900" fill="white">Tablette Android 10.1"</text>
  <text x="600" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="url(#blue)">+ Clavier + Souris</text>
  <!-- Price -->
  <g transform="translate(380, 300)">
    <text x="0" y="45" font-family="Arial,sans-serif" font-size="52" font-weight="900" fill="url(#orange)">85,99€</text>
    <text x="290" y="35" font-family="Arial,sans-serif" font-size="24" fill="#94A3B8" text-decoration="line-through">189,99€</text>
  </g>
  <!-- Specs -->
  <g transform="translate(240, 385)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="white" opacity="0.08"/>
    <text x="70" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="white" opacity="0.7">22 Go RAM</text>
  </g>
  <g transform="translate(400, 385)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="white" opacity="0.08"/>
    <text x="70" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="white" opacity="0.7">128 Go + 1 To</text>
  </g>
  <g transform="translate(560, 385)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="white" opacity="0.08"/>
    <text x="70" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="white" opacity="0.7">8000 mAh</text>
  </g>
  <g transform="translate(720, 385)">
    <rect x="0" y="0" width="140" height="36" rx="18" fill="white" opacity="0.08"/>
    <text x="70" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="white" opacity="0.7">Widevine L1</text>
  </g>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="url(#orange)" opacity="0.95"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">Amazon — 4,3/5 sur 573 avis — Pack complet tablette + clavier + souris</text>
</svg>
