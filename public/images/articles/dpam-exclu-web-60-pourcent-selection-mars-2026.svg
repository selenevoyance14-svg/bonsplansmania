<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#F5F5F5"/>
  <!-- Shoes illustrations top -->
  <g opacity="0.1">
    <circle cx="200" cy="50" r="30" fill="#E63946"/>
    <circle cx="600" cy="50" r="25" fill="#E63946"/>
    <circle cx="400" cy="40" r="20" fill="#E63946"/>
  </g>
  <!-- EXCLU WEB banner -->
  <rect x="180" y="80" width="440" height="45" rx="4" fill="#E63946"/>
  <text x="400" y="112" font-family="Arial Black, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="900">EXCLU WEB</text>
  <!-- -60% -->
  <text x="250" y="230" font-family="Arial Black, sans-serif" font-size="28" fill="#E63946" font-weight="900">TOUT A</text>
  <text x="520" y="250" font-family="Arial Black, sans-serif" font-size="120" fill="#E63946" text-anchor="middle" font-weight="900">-60</text>
  <text x="680" y="210" font-family="Arial Black, sans-serif" font-size="50" fill="#E63946" font-weight="900">%</text>
  <!-- Subtitle -->
  <text x="400" y="300" font-family="Georgia, serif" font-size="18" fill="#888" text-anchor="middle">sur une selection d'articles</text>
  <!-- CTA -->
  <rect x="200" y="330" width="400" height="50" rx="4" fill="#E63946"/>
  <text x="400" y="362" font-family="Arial Black, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="900">JE CRAQUE</text>
  <!-- Brand -->
  <text x="400" y="425" font-family="Poppins, sans-serif" font-size="18" fill="#333" text-anchor="middle" font-weight="700">DPAM</text>
  <text x="400" y="443" font-family="Poppins, sans-serif" font-size="10" fill="#888" text-anchor="middle">Du Pareil au Meme — Mode enfant</text>
</svg>