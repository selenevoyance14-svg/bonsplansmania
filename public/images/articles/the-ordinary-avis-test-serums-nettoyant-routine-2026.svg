  <text x="390" y="502" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="700">2 800+ avis</text>

  <rect x="520" y="470" width="180" height="50" rx="25" fill="white" fill-opacity="0.12" />
  <text x="610" y="502" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="700">Vegan</text>

  <!-- Badge -->
  <rect x="80" y="546" width="420" height="44" rx="10" fill="white" fill-opacity="0.1" />
  <text x="100" y="573" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">Clean Beauty · Prix mini · Formules minimalistes</text>

  <text x="80" y="606" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.6">Avril 2026 · Skincare · Notre avis honnete</text>
