  <rect x="80" y="470" width="180" height="50" rx="25" fill="white" fill-opacity="0.12" />
  <text x="170" y="502" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="700">4,4/5</text>

