  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="80" r="220" fill="white" fill-opacity="0.03" />
  <circle cx="100" cy="560" r="180" fill="white" fill-opacity="0.03" />

