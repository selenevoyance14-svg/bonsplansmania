  <text x="180" y="152" font-family="Arial, sans-serif" font-size="16" fill="#3E2723" text-anchor="middle" font-weight="700">TEST PRODUIT</text>

  <!-- Title -->
  <text x="80" y="248" font-family="Georgia, serif" font-size="42" fill="white" font-weight="400" fill-opacity="0.8">On a teste</text>
  <text x="80" y="328" font-family="Georgia, serif" font-size="88" fill="white" font-weight="700">The</text>
  <text x="300" y="328" font-family="Georgia, serif" font-size="88" fill="#FFD700" font-weight="700">Ordinary</text>

  <rect x="80" y="350" width="100" height="3" rx="2" fill="#FFD700" fill-opacity="0.8" />

  <!-- Details -->
  <rect x="80" y="380" width="740" height="64" rx="12" fill="white" fill-opacity="0.08" />
  <text x="100" y="406" font-family="Arial, sans-serif" font-size="19" fill="white" fill-opacity="0.85">Acide Hyaluronique · Squalane · Acide Salicylique</text>
  <text x="100" y="432" font-family="Arial, sans-serif" font-size="22" fill="#FFD700" font-weight="700">3 best-sellers testes · Yuka · Que Choisir · Verdict</text>

