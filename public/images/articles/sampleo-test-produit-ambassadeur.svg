<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6A1B9A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8E24AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CE93D8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="80" r="220" fill="white" fill-opacity="0.05" />
  <circle cx="100" cy="560" r="180" fill="white" fill-opacity="0.05" />

  <!-- Site badge -->
  <rect x="80" y="60" width="220" height="44" rx="22" fill="white" fill-opacity="0.15" />
  <text x="190" y="88" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">BonsPlansMania.fr</text>

  <!-- Category badge -->
  <rect x="80" y="128" width="200" height="36" rx="18" fill="url(#badge)" />
  <text x="180" y="152" font-family="Arial, sans-serif" font-size="16" fill="#5B1A00" text-anchor="middle" font-weight="700">🎁 TEST GRATUIT</text>

  <!-- Title -->
  <text x="80" y="265" font-family="Georgia, serif" font-size="100" fill="white" font-weight="700">sampleo</text>

  <rect x="80" y="288" width="100" height="3" rx="2" fill="white" fill-opacity="0.5" />

  <text x="80" y="332" font-family="Arial, sans-serif" font-size="26" fill="white" fill-opacity="0.95" font-weight="600">Devenez Ambassadrice de Grandes Marques</text>

  <!-- Brands -->
  <rect x="80" y="358" width="560" height="58" rx="12" fill="white" fill-opacity="0.12" />
  <text x="100" y="381" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.85">Vichy · L'Oréal · Mixa · Bourjois · Réminiscence</text>
  <text x="100" y="406" font-family="Arial, sans-serif" font-size="22" fill="#FFD700" font-weight="700">Recevez les produits gratuitement chez vous</text>

  <!-- Steps -->
  <rect x="80" y="436" width="160" height="52" rx="10" fill="white" fill-opacity="0.15" />
  <text x="100" y="457" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.8">Étape 1</text>
  <text x="100" y="480" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">Candidatez</text>

  <rect x="260" y="436" width="160" height="52" rx="10" fill="white" fill-opacity="0.15" />
  <text x="280" y="457" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.8">Étape 2</text>
  <text x="280" y="480" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">Recevez</text>

  <rect x="440" y="436" width="160" height="52" rx="10" fill="white" fill-opacity="0.15" />
  <text x="460" y="457" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.8">Étape 3</text>
  <text x="460" y="480" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">Partagez</text>

  <text x="80" y="590" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7">Mars 2026 · Campagnes en cours</text>
</svg>
