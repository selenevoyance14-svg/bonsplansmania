      <stop offset="0%" style="stop-color:#FDF6E3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F5E6C8;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" rx="18"/>
