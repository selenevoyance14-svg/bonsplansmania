  <rect x="140" y="255" width="120" height="45" rx="22" fill="#C8963E" opacity="0.15"/>
  <text x="200" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#C8963E">-20%</text>
  <rect x="290" y="255" width="120" height="45" rx="22" fill="#C8963E" opacity="0.2"/>
  <text x="350" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#C8963E">-30%</text>
  <rect x="440" y="255" width="120" height="45" rx="22" fill="#C8963E" opacity="0.25"/>
  <text x="500" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#C8963E">-40%</text>
