  <text x="400" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8B6914" opacity="0.7">Tresors de la Ruche — depuis 1921</text>
  <!-- Badge promo -->
  <rect x="225" y="160" width="350" height="65" rx="12" fill="#C8963E"/>
  <text x="400" y="203" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="#fff">PROMOTIONS</text>
