  <rect x="255" y="40" width="220" height="38" rx="19" fill="white" opacity="0.2"/>
  <text x="365" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">Eau thermale des Alpes</text>
  <!-- Card -->
