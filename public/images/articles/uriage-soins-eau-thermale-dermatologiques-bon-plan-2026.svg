  <text x="390" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ En pharmacie</text>
  <rect x="505" y="295" width="235" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="622" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Validé dermato</text>
  <!-- Bottom -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.5" text-anchor="middle">bonsplansmania.fr</text>
