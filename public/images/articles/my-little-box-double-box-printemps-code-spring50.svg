<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce4ec;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2185b;stop-opacity:1" />
    </linearGradient>
    <pattern id="vichy" patternUnits="userSpaceOnUse" width="16" height="16">
      <rect width="16" height="16" fill="white"/>
      <rect width="8" height="8" fill="#f9a825"/>
      <rect x="8" y="8" width="8" height="8" fill="#f9a825"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Spring Days tag -->
  <rect x="50" y="25" width="140" height="28" rx="4" fill="url(#pink)"/>
  <text x="120" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" letter-spacing="1">SPRING DAYS</text>

  <!-- Title -->
  <text x="400" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#333">VOTRE DOUBLE BOX DU</text>
  <text x="400" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#333">PRINTEMPS A MOITIE PRIX</text>

  <!-- Vichy bag illustration -->
  <g transform="translate(420, 155)">
    <!-- Bag body -->
    <rect x="0" y="30" width="180" height="130" rx="10" fill="url(#vichy)" stroke="#e0c8a0" stroke-width="1.5"/>
    <!-- Bag top/lid -->
    <path d="M10 30 Q90 10 170 30" fill="url(#vichy)" stroke="#e0c8a0" stroke-width="1.5"/>
    <!-- Handles -->
    <path d="M50 30 Q50 -5 90 -5 Q130 -5 130 30" stroke="#e8d5c0" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Zipper line -->
    <line x1="20" y1="45" x2="160" y2="45" stroke="#e0c8a0" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Tulips -->
  <g transform="translate(80, 180)">
    <line x1="30" y1="120" x2="25" y2="50" stroke="#4caf50" stroke-width="3"/>
    <line x1="60" y1="120" x2="55" y2="40" stroke="#4caf50" stroke-width="3"/>
    <line x1="90" y1="120" x2="95" y2="55" stroke="#4caf50" stroke-width="3"/>
    <ellipse cx="25" cy="40" rx="10" ry="16" fill="#e91e63" transform="rotate(-5 25 40)"/>
    <ellipse cx="55" cy="30" rx="10" ry="16" fill="#f06292"/>
    <ellipse cx="95" cy="45" rx="10" ry="16" fill="#e91e63" transform="rotate(5 95 45)"/>
  </g>

  <!-- Price bubble -->
  <circle cx="280" cy="300" r="60" fill="url(#pink)" opacity="0.9"/>
  <text x="280" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" text-decoration="line-through" opacity="0.8">41,80€</text>
  <text x="280" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.9">maintenant a</text>
  <text x="280" y="325" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="white">20,90€</text>

  <!-- Code promo -->
  <rect x="220" y="370" width="180" height="32" rx="4" fill="white" stroke="#e91e63" stroke-width="2"/>
  <text x="255" y="391" font-family="Arial, sans-serif" font-size="10" fill="#e91e63">avec le code</text>
  <text x="340" y="392" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c2185b">SPRING50</text>

  <!-- My Little Box branding -->
  <text x="400" y="435" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#333" letter-spacing="2">MyLittleBox</text>

  <!-- Offre flash badge -->
  <rect x="560" y="370" width="160" height="32" rx="16" fill="url(#pink)"/>
  <text x="640" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">OFFRE FLASH</text>
</svg>