<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8ef;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5f8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4060;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <rect x="200" y="18" width="400" height="50" rx="4" fill="url(#blue)"/>
  <text x="400" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="white" letter-spacing="2">Dr Pierre Ricaud</text>
  <text x="400" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2c5f8a" letter-spacing="2">SOINS ANTI-AGE PAR UN DERMATOLOGUE</text>
  <rect x="200" y="115" width="400" height="160" rx="10" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Anti-age accessible</text>
  <text x="400" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Expertise dermatologique depuis 35 ans</text>
  <text x="400" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Fabrique en France</text>
  <text x="400" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Vente directe = prix justes</text>
  <rect x="290" y="245" width="220" height="25" rx="12" fill="url(#blue)"/>
  <text x="400" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">15 - 35 EUR par produit</text>
  <g transform="translate(120, 300)">
    <rect x="0" y="0" width="170" height="65" rx="8" fill="url(#blue)" opacity="0.1"/>
    <text x="85" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c5f8a">Creme anti-rides</text>
    <text x="85" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">Best-seller de la marque</text>
  </g>
  <g transform="translate(315, 300)">
    <rect x="0" y="0" width="170" height="65" rx="8" fill="url(#blue)" opacity="0.1"/>
    <text x="85" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c5f8a">Serum eclat</text>
    <text x="85" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">Boost de luminosite</text>
  </g>
  <g transform="translate(510, 300)">
    <rect x="0" y="0" width="170" height="65" rx="8" fill="url(#blue)" opacity="0.1"/>
    <text x="85" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c5f8a">Contour des yeux</text>
    <text x="85" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">Cernes et ridules</text>
  </g>
  <rect x="280" y="390" width="240" height="28" rx="14" fill="url(#blue)"/>
  <text x="400" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">NOTRE AVIS + TEST</text>
  <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">Le meilleur rapport qualite-prix anti-age ?</text>
