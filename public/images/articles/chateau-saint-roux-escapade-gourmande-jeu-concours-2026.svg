<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="csr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF0E6"/>
      <stop offset="100%" style="stop-color:#F0E0D0"/>
    </linearGradient>
    <linearGradient id="csr-wine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B2252"/>
      <stop offset="100%" style="stop-color:#6A1840"/>
    </linearGradient>
    <linearGradient id="csr-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8A860"/>
      <stop offset="100%" style="stop-color:#A89048"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#csr-bg)"/>
  <!-- Provence landscape silhouette -->
  <g opacity="0.08" fill="#8B7355">
    <path d="M0,350 Q100,280 200,310 Q300,260 400,290 Q500,250 600,280 Q700,260 800,300 L800,450 L0,450 Z"/>
    <!-- Cypress trees -->
    <ellipse cx="150" cy="280" rx="12" ry="50"/>
    <ellipse cx="350" cy="260" rx="10" ry="45"/>
    <ellipse cx="620" cy="250" rx="11" ry="48"/>
  </g>
  <!-- Chateau shape -->
  <g transform="translate(80, 120)" opacity="0.12">
    <rect x="0" y="60" width="180" height="120" rx="4" fill="#8B5A3A"/>
    <rect x="20" y="40" width="40" height="30" fill="#8B5A3A"/>
    <rect x="120" y="30" width="40" height="40" fill="#8B5A3A"/>
    <polygon points="20,40 40,20 60,40" fill="#8B5A3A"/>
    <polygon points="120,30 140,10 160,30" fill="#8B5A3A"/>
    <!-- Windows -->
    <rect x="30" y="80" width="20" height="25" rx="10" fill="#FAF0E6"/>
    <rect x="70" y="80" width="20" height="25" rx="10" fill="#FAF0E6"/>
    <rect x="110" y="80" width="20" height="25" rx="10" fill="#FAF0E6"/>
    <!-- Door -->
    <rect x="70" y="130" width="30" height="50" rx="15" fill="#FAF0E6"/>
  </g>
  <!-- Title area -->
  <text x="400" y="60" font-family="Poppins, sans-serif" font-size="13" fill="#8B2252" text-anchor="middle" font-weight="700" letter-spacing="2">JEU CONCOURS</text>
  <text x="400" y="105" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#3A2A20" text-anchor="middle">Gagnez une escapade</text>
  <text x="400" y="145" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#3A2A20" text-anchor="middle">gourmande</text>
  <text x="400" y="185" font-family="Georgia, serif" font-size="22" fill="#8B2252" text-anchor="middle" font-style="italic">au Chateau Saint-Roux</text>
  <text x="400" y="215" font-family="Poppins, sans-serif" font-size="13" fill="#8B7355" text-anchor="middle">Provence — Pour 2 personnes</text>
  <!-- Icons row -->
  <g transform="translate(140, 245)">
    <!-- Bed icon -->
    <rect x="0" y="15" width="40" height="20" rx="4" fill="url(#csr-wine)" opacity="0.7"/>
    <rect x="5" y="10" width="12" height="10" rx="6" fill="url(#csr-wine)" opacity="0.5"/>
    <text x="20" y="55" font-family="Poppins, sans-serif" font-size="9" fill="#6A5A4A" text-anchor="middle">1 nuit</text>
  </g>
  <g transform="translate(270, 245)">
    <!-- Breakfast icon -->
    <circle cx="20" cy="20" r="16" fill="none" stroke="#C8A860" stroke-width="2.5" opacity="0.7"/>
    <circle cx="20" cy="20" r="8" fill="#C8A860" opacity="0.3"/>
    <text x="20" y="55" font-family="Poppins, sans-serif" font-size="9" fill="#6A5A4A" text-anchor="middle">Petit-dej</text>
  </g>
  <g transform="translate(400, 245)">
    <!-- Dinner icon -->
    <rect x="10" y="8" width="20" height="2" rx="1" fill="#8B2252" opacity="0.6"/>
    <rect x="8" y="12" width="24" height="16" rx="8" fill="none" stroke="#8B2252" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="28" x2="20" y2="35" stroke="#8B2252" stroke-width="2" opacity="0.6"/>
    <text x="20" y="55" font-family="Poppins, sans-serif" font-size="9" fill="#6A5A4A" text-anchor="middle">Diner</text>
  </g>
  <g transform="translate(530, 245)">
    <!-- Wine + cheese icon -->
    <path d="M15,5 L10,20 L5,20 Q5,30 15,30 Q25,30 25,20 L20,20 Z" fill="url(#csr-wine)" opacity="0.6"/>
    <line x1="15" y1="30" x2="15" y2="36" stroke="#8B2252" stroke-width="2" opacity="0.6"/>
    <line x1="8" y1="36" x2="22" y2="36" stroke="#8B2252" stroke-width="2" opacity="0.6"/>
    <text x="15" y="55" font-family="Poppins, sans-serif" font-size="9" fill="#6A5A4A" text-anchor="middle">Atelier</text>
    <text x="15" y="66" font-family="Poppins, sans-serif" font-size="8" fill="#6A5A4A" text-anchor="middle">fromage &amp; vin</text>
  </g>
  <!-- CTA -->
  <rect x="260" y="350" width="280" height="48" rx="24" fill="url(#csr-wine)"/>
  <text x="400" y="380" font-family="Poppins, sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">Participer au concours</text>
  <!-- Source -->
  <text x="400" y="430" font-family="Poppins, sans-serif" font-size="11" fill="#A89070" text-anchor="middle">Via Cosmopolitan.fr — Gratuit, sans obligation</text>
</svg>