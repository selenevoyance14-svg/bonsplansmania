<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffdf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff8e1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c518;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6a817;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#222;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe082;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffca28;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Sun rays decoration -->
  <circle cx="680" cy="80" r="60" fill="url(#sun)" opacity="0.3"/>
  <circle cx="680" cy="80" r="40" fill="url(#sun)" opacity="0.4"/>
  <circle cx="680" cy="80" r="22" fill="#ffca28" opacity="0.6"/>

  <!-- Nouveaute badge -->
  <rect x="250" y="18" width="300" height="28" rx="4" fill="url(#dark)"/>
  <text x="400" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" letter-spacing="2">NOUVEAUTE -- TEST GRATUIT</text>

  <!-- Brand name -->
  <text x="400" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#333" letter-spacing="6">etat pur</text>
  <text x="400" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999" letter-spacing="1">Juste ce dont votre peau a besoin</text>

  <!-- Product tube illustration -->
  <g transform="translate(310, 120)">
    <rect x="0" y="0" width="180" height="160" rx="10" fill="white" stroke="#eee" stroke-width="1.5"/>
    <!-- Yellow tube cap -->
    <rect x="70" y="10" width="40" height="25" rx="5" fill="url(#gold)"/>
    <rect x="75" y="30" width="30" height="8" rx="3" fill="#e6a817"/>
    <!-- Tube body -->
    <rect x="60" y="38" width="60" height="85" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="90" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#999" letter-spacing="1">Peptide-6</text>
    <text x="90" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#999">pro-melanin</text>
    <text x="90" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="url(#gold)">10ppm</text>
    <!-- Drop -->
    <ellipse cx="90" cy="130" rx="12" ry="8" fill="#fff8e1" stroke="#f5c518" stroke-width="1"/>

    <!-- Label -->
    <text x="90" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Actif Pur</text>
  </g>

  <!-- 100 produits badge -->
  <circle cx="160" cy="200" r="42" fill="url(#gold)"/>
  <text x="160" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="white">100</text>
  <text x="160" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">produits</text>
  <text x="160" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">a tester</text>

  <!-- Bronzage info -->
  <g transform="translate(530, 150)">
    <rect x="0" y="0" width="200" height="80" rx="8" fill="white" stroke="#f5c518" stroke-width="1.5"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">ALTERNATIVE AUX</text>
    <text x="100" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">COMPLEMENTS</text>
    <text x="100" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">Double action bronzage</text>
    <text x="100" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">Prepare + accelere</text>
  </g>

  <!-- CTA -->
  <rect x="260" y="310" width="280" height="40" rx="20" fill="url(#gold)"/>
  <text x="400" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">DEVENEZ TESTEUR</text>

  <!-- Subtitle -->
  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">Repondez au questionnaire pour participer</text>

  <!-- Bottom accents -->
  <rect x="340" y="410" width="120" height="3" rx="1.5" fill="url(#gold)" opacity="0.4"/>
</svg>