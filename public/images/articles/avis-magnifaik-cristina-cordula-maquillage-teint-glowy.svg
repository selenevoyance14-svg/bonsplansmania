  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <rect x="220" y="18" width="360" height="50" rx="25" fill="url(#coral)"/>
  <text x="400" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="white" letter-spacing="3">MAGNIFAIK</text>
  <text x="400" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#999">by Cristina Cordula</text>
  <text x="400" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Maquillage Teint Glowy</text>
