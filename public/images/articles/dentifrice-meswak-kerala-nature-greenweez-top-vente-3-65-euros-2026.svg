<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f0e0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Badge TOP VENTE -->
  <rect x="40" y="25" width="160" height="36" rx="18" fill="#2e7d32"/>
  <text x="120" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">TOP VENTE</text>

  <!-- Stars rating -->
  <text x="220" y="50" font-family="Arial, sans-serif" font-size="18" fill="#f5a623">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
  <text x="320" y="50" font-family="Arial, sans-serif" font-size="14" fill="#666">4.8/5 (856 avis)</text>

  <!-- Main title -->
  <text x="40" y="105" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#2d2d2d">DENTIFRICE MESWAK</text>
  <text x="40" y="138" font-family="Arial, sans-serif" font-size="16" fill="#666">Kerala Nature — 100g</text>

  <!-- Price -->
  <text x="40" y="185" font-family="Arial, sans-serif" font-size="18" fill="#999" text-decoration="line-through">4,06E</text>
  <rect x="100" y="165" width="110" height="35" rx="8" fill="#2e7d32"/>
  <text x="155" y="189" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">3,65E</text>
  <rect x="225" y="170" width="55" height="25" rx="6" fill="#e53935"/>
  <text x="252" y="188" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">-10%</text>

  <!-- Features -->
  <text font-family="Arial, sans-serif" font-size="14" fill="#555">
    <tspan x="40" y="235">&#x2714; Formule naturelle a base de Meswak</tspan>
    <tspan x="40" y="261">&#x2714; Sans fluor synthetique, sans SLS, sans parabens</tspan>
    <tspan x="40" y="287">&#x2714; 856 avis positifs sur Greenweez</tspan>
  </text>

  <!-- Newsletter bonus -->
  <rect x="40" y="310" width="380" height="50" rx="10" fill="white" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="50" y="335" font-family="Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold">1ere commande : -10% + livraison offerte</text>
  <text x="50" y="352" font-family="Arial, sans-serif" font-size="11" fill="#888">Inscription newsletter Greenweez</text>

  <!-- Toothpaste tube illustration (right side) -->
  <!-- Tube body -->
  <rect x="540" y="100" width="200" height="80" rx="10" fill="white" stroke="#c8a050" stroke-width="2"/>
  <!-- Tube cap -->
  <rect x="740" y="115" width="30" height="50" rx="8" fill="#e8d8b0" stroke="#c8a050" stroke-width="1.5"/>
  <!-- Tube nozzle -->
  <rect x="530" y="125" width="15" height="30" rx="4" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>

  <!-- Label on tube -->
  <rect x="570" y="112" width="150" height="56" rx="6" fill="#f5efe0"/>
  <text x="645" y="137" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#8b5e3c" text-anchor="middle">MESWAK</text>
  <rect x="600" y="145" width="90" height="1" fill="#c8a050"/>
  <text x="645" y="162" font-family="Arial, sans-serif" font-size="8" fill="#8b5e3c" text-anchor="middle">Kerala Nature</text>

  <!-- Box behind tube -->
  <rect x="560" y="200" width="180" height="100" rx="6" fill="#d4a050" opacity="0.8"/>
  <rect x="560" y="200" width="180" height="30" rx="6" fill="#c89040"/>
  <text x="650" y="220" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">MESWAK</text>
  <rect x="580" y="245" width="140" height="1" fill="white" opacity="0.3"/>
  <text x="650" y="265" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" opacity="0.8">Dentifrice Naturel</text>
  <text x="650" y="280" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" opacity="0.8">100g</text>

  <!-- Leaf decoration -->
  <ellipse cx="720" cy="340" rx="12" ry="25" fill="#6a994e" opacity="0.3" transform="rotate(-20, 720, 340)"/>
  <ellipse cx="740" cy="345" rx="10" ry="22" fill="#6a994e" opacity="0.2" transform="rotate(15, 740, 345)"/>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#c8d0b8"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#999" text-anchor="middle">bonsplansmania.fr — Greenweez, courses bio en ligne</text>
</svg>
