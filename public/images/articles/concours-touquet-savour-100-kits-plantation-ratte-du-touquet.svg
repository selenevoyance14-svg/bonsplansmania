<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#8B1A1A" rx="18"/>
  <!-- Déco terre/jardin -->
  <circle cx="680" cy="80" r="60" fill="#6B3A2A" opacity="0.3"/>
  <circle cx="120" cy="360" r="45" fill="#6B3A2A" opacity="0.2"/>
  <!-- Logo text -->
  <text x="400" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#F5D547">Touquet Savour</text>
  <text x="400" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fff" opacity="0.6">La passion des varietes depuis 1997</text>
  <!-- Titre principal -->
  <text x="400" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#F5D547">Cultivez gratuitement</text>
  <text x="400" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#F5D547">la Ratte du Touquet !</text>
  <!-- Badge lots -->
  <rect x="175" y="225" width="450" height="60" rx="10" fill="#C0392B"/>
  <text x="400" y="263" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#fff">100 KITS DE PLANTATION</text>
  <!-- Détails kit -->
  <line x1="250" y1="320" x2="250" y2="360" stroke="#F5D547" stroke-width="1" opacity="0.4"/>
  <line x1="450" y1="320" x2="450" y2="360" stroke="#F5D547" stroke-width="1" opacity="0.4"/>
  <text x="150" y="340" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" fill="#fff">10</text>
  <text x="150" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#F5D547">PLANTS</text>
  <text x="350" y="340" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" fill="#fff">1</text>
  <text x="350" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#F5D547">SAC DE PLANTATION</text>
  <text x="570" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">CONSEILS</text>
  <text x="570" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#F5D547">DE CULTURE</text>
  <!-- Footer -->
  <text x="400" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fff" opacity="0.5">Du 30 mars au 19 avril 2026 — France metropolitaine</text>
</svg>