<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9D174D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DB2777;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F472B6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.06" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="1000" cy="80" r="180" fill="white" fill-opacity="0.05"/>
  <circle cx="100" cy="540" r="150" fill="white" fill-opacity="0.05"/>
  <circle cx="950" cy="540" r="100" fill="white" fill-opacity="0.06"/>
  <!-- Card -->
  <rect x="60" y="60" width="680" height="510" rx="24" fill="url(#card)" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Badge -->
  <rect x="100" y="100" width="200" height="36" rx="18" fill="white" fill-opacity="0.25"/>
  <text x="200" y="123" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">FEMME ACTUELLE</text>
  <!-- Title -->
  <text x="100" y="196" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="white">Jeux-Concours</text>
  <text x="100" y="248" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white" fill-opacity="0.9">Lots exceptionnels 2026</text>
  <!-- Prize boxes -->
  <rect x="100" y="280" width="580" height="55" rx="14" fill="white" fill-opacity="0.2"/>
  <text x="390" y="303" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">🚢 Croisière Grèce • Italie • Croatie</text>
  <text x="390" y="323" font-family="Arial, sans-serif" font-size="15" fill="white" fill-opacity="0.9" text-anchor="middle">3 200 € de dotation pour 2 personnes</text>
  <rect x="100" y="348" width="280" height="44" rx="12" fill="white" fill-opacity="0.15"/>
  <text x="120" y="375" font-family="Arial, sans-serif" font-size="16" fill="white">🌊 Séjour spa 1 324€</text>
  <rect x="394" y="348" width="286" height="44" rx="12" fill="white" fill-opacity="0.15"/>
  <text x="414" y="375" font-family="Arial, sans-serif" font-size="16" fill="white">💄 Lots beauté</text>
  <!-- Check -->
  <text x="100" y="448" font-family="Arial, sans-serif" font-size="19" fill="white">✅ Gratuit · Participation en 1 clic</text>
  <!-- Site tag -->
  <text x="100" y="530" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.6">jeux.femmeactuelle.fr</text>
  <!-- Right decoration -->
  <text x="920" y="370" font-family="Arial, sans-serif" font-size="140" text-anchor="middle" opacity="0.25">🎁</text>
  <text x="920" y="200" font-family="Arial, sans-serif" font-size="80" text-anchor="middle" opacity="0.2">🏆</text>
  <!-- BonsPlansMania tag -->
  <rect x="900" y="560" width="240" height="40" rx="20" fill="white" fill-opacity="0.15"/>
  <text x="1020" y="585" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">bonsplansmania.fr</text>
</svg>
