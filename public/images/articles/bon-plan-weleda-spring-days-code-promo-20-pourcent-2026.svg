<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f9f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f0e4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3f2b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8c8d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0a8b8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Brand name -->
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#2d5a3d" letter-spacing="8">WELEDA</text>

  <!-- Green banner -->
  <rect x="0" y="70" width="800" height="35" fill="url(#green)"/>
  <text x="400" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" letter-spacing="2">SPRING DAYS -- OFFRE LIMITEE</text>

  <!-- Flower decoration left -->
  <g transform="translate(100, 160)">
    <line x1="30" y1="120" x2="30" y2="40" stroke="#6b9c5a" stroke-width="2.5"/>
    <ellipse cx="15" cy="35" rx="14" ry="18" fill="url(#pink)" opacity="0.7" transform="rotate(-20 15 35)"/>
    <ellipse cx="45" cy="35" rx="14" ry="18" fill="url(#pink)" opacity="0.6" transform="rotate(20 45 35)"/>
    <ellipse cx="30" cy="22" rx="13" ry="17" fill="url(#pink)" opacity="0.8"/>
    <circle cx="30" cy="30" r="5" fill="#f0a8b8"/>
  </g>

  <!-- Flower decoration right -->
  <g transform="translate(620, 180)">
    <line x1="30" y1="100" x2="30" y2="35" stroke="#6b9c5a" stroke-width="2.5"/>
    <ellipse cx="15" cy="30" rx="12" ry="16" fill="url(#pink)" opacity="0.6" transform="rotate(-15 15 30)"/>
    <ellipse cx="45" cy="30" rx="12" ry="16" fill="url(#pink)" opacity="0.5" transform="rotate(15 45 30)"/>
    <ellipse cx="30" cy="18" rx="11" ry="15" fill="url(#pink)" opacity="0.7"/>
    <circle cx="30" cy="26" r="4" fill="#f0a8b8"/>
  </g>

  <!-- Main promo block -->
  <rect x="200" y="130" width="400" height="200" rx="12" fill="url(#green)"/>

  <text x="400" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" letter-spacing="3">SPRING DAYS</text>

  <text x="400" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white">-20%</text>

  <text x="400" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.9">sur une selection de soins</text>

  <!-- Code box -->
  <rect x="300" y="280" width="200" height="35" rx="4" fill="none" stroke="white" stroke-width="2"/>
  <text x="400" y="303" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="white" letter-spacing="3">CODE : SPRING</text>

  <!-- Leaves decoration -->
  <ellipse cx="180" cy="380" rx="25" ry="8" fill="#6b9c5a" opacity="0.3" transform="rotate(-30 180 380)"/>
  <ellipse cx="200" cy="395" rx="20" ry="6" fill="#6b9c5a" opacity="0.25" transform="rotate(-15 200 395)"/>
  <ellipse cx="620" cy="375" rx="25" ry="8" fill="#6b9c5a" opacity="0.3" transform="rotate(30 620 375)"/>
  <ellipse cx="600" cy="390" rx="20" ry="6" fill="#6b9c5a" opacity="0.25" transform="rotate(15 600 390)"/>

  <!-- Bottom text -->
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d5a3d" opacity="0.7">Cosmetiques naturels certifies NATRUE</text>
</svg>