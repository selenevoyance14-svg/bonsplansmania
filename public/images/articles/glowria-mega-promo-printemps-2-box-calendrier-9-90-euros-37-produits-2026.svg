<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0ec;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e84393;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8956c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#daa876;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative elements -->
  <circle cx="700" cy="60" r="80" fill="#ffc8dd" opacity="0.3"/>
  <circle cx="80" cy="400" r="60" fill="#ffd6a5" opacity="0.25"/>
  <circle cx="750" cy="380" r="50" fill="#e84393" opacity="0.1"/>

  <!-- Badge "MEGA PROMO PRINTEMPS" -->
  <rect x="40" y="25" width="310" height="36" rx="18" fill="url(#badge)"/>
  <text x="195" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">MEGA PROMO DE PRINTEMPS</text>

  <!-- Main title -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2d3436">2 BOX + 1 CALENDRIER</text>
  <text x="40" y="155" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2d3436">POUR</text>

  <!-- Price box -->
  <rect x="165" y="125" width="170" height="55" rx="10" fill="#e84393"/>
  <text x="250" y="162" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">9,90 E</text>

  <!-- Value -->
  <text x="40" y="205" font-family="Arial, sans-serif" font-size="18" fill="#636e72">37 produits - valeur 990 euros</text>

  <!-- Features -->
  <text x="40" y="260" font-family="Arial, sans-serif" font-size="15" fill="#444">
    <tspan x="40" dy="0">&#x2714; 2 nouvelles box beaute completes</tspan>
    <tspan x="40" dy="26">&#x2714; 1 calendrier de l'Apres en bonus</tspan>
    <tspan x="40" dy="26">&#x2714; 37 produits format vente</tspan>
    <tspan x="40" dy="26">&#x2714; Livraison offerte</tspan>
  </text>

  <!-- Box illustrations (right side) -->
  <!-- Box 1 - Floral/spring -->
  <rect x="480" y="80" width="140" height="170" rx="12" fill="white" stroke="#ffc8dd" stroke-width="2"/>
  <rect x="480" y="80" width="140" height="40" rx="12" fill="#ffc8dd" opacity="0.6"/>
  <text x="550" y="106" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e84393" text-anchor="middle">BOX 1</text>
  <rect x="500" y="140" width="25" height="55" rx="5" fill="#a8e6cf"/>
  <rect x="535" y="145" width="22" height="50" rx="5" fill="#ffd3b6"/>
  <rect x="567" y="135" width="28" height="60" rx="5" fill="#dcedc1"/>
  <text x="550" y="225" font-family="Arial, sans-serif" font-size="10" fill="#e84393" text-anchor="middle">NOUVEAUTE</text>

  <!-- Box 2 - Gold/luxe -->
  <rect x="640" y="100" width="130" height="160" rx="12" fill="url(#gold)" opacity="0.9"/>
  <rect x="640" y="100" width="130" height="38" rx="12" fill="#2d3436" opacity="0.8"/>
  <text x="705" y="124" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">CALENDRIER</text>
  <rect x="658" y="155" width="20" height="45" rx="4" fill="white" opacity="0.5"/>
  <rect x="685" y="150" width="20" height="50" rx="4" fill="white" opacity="0.4"/>
  <rect x="712" y="158" width="20" height="42" rx="4" fill="white" opacity="0.5"/>
  <rect x="739" y="152" width="18" height="48" rx="4" fill="white" opacity="0.4"/>
  <text x="705" y="235" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">NOUVEAUTE</text>

  <!-- Price sticker -->
  <circle cx="630" cy="310" r="45" fill="#e84393"/>
  <text x="630" y="300" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">VALEUR</text>
  <text x="630" y="322" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">990E</text>
  <text x="630" y="340" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">pour 9,90E</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#f0c0d0"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#b0b0b0" text-anchor="middle">bonsplansmania.fr — Glowria (ex Beautiful Box)</text>
</svg>
