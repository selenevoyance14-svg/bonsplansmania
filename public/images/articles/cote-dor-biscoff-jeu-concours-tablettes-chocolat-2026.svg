<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="cdb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B1A1A"/>
      <stop offset="100%" style="stop-color:#6A1010"/>
    </linearGradient>
    <linearGradient id="cdb-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AA50"/>
      <stop offset="50%" style="stop-color:#E8C870"/>
      <stop offset="100%" style="stop-color:#D4AA50"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#cdb-bg)"/>
  <!-- Gold banner top -->
  <rect x="80" y="30" width="640" height="50" rx="4" fill="url(#cdb-gold)" opacity="0.9"/>
  <text x="280" y="62" font-family="Arial Black, sans-serif" font-size="22" fill="#6A1010" font-weight="900">NOUVEAU</text>
  <!-- Cote d'Or logo area -->
  <rect x="420" y="35" width="80" height="40" rx="4" fill="#CC1010"/>
  <text x="460" y="52" font-family="Georgia, serif" font-size="8" fill="white" text-anchor="middle">COTE</text>
  <text x="460" y="65" font-family="Georgia, serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">D'OR</text>
  <!-- X -->
  <text x="520" y="62" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" opacity="0.8">x</text>
  <!-- Biscoff logo area -->
  <rect x="545" y="35" width="100" height="40" rx="4" fill="#CC1010"/>
  <text x="595" y="62" font-family="Arial Black, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Biscoff</text>
  <!-- Chocolate pieces illustration -->
  <g transform="translate(250, 100)" opacity="0.3">
    <rect x="0" y="0" width="120" height="25" rx="4" fill="#4A2A10" transform="rotate(-15, 60, 12)"/>
    <rect x="130" y="-10" width="100" height="25" rx="4" fill="#5A3A18" transform="rotate(10, 180, 2)"/>
    <rect x="60" y="20" width="80" height="20" rx="3" fill="#3A2008" transform="rotate(-5, 100, 30)"/>
  </g>
  <!-- Main text -->
  <text x="400" y="210" font-family="Arial Black, sans-serif" font-size="34" fill="url(#cdb-gold)" text-anchor="middle" font-weight="900">IL FAUT LE GOUTER</text>
  <text x="400" y="255" font-family="Arial Black, sans-serif" font-size="34" fill="url(#cdb-gold)" text-anchor="middle" font-weight="900">POUR COMPRENDRE</text>
  <!-- Date -->
  <text x="400" y="300" font-family="Poppins, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">Du 16 au 30 mars 2026</text>
  <!-- Description -->
  <text x="400" y="335" font-family="Poppins, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.9">300 tablettes Cote d'Or Biscoff a gagner</text>
  <text x="400" y="355" font-family="Poppins, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.9">Chocolat lait et chocolat blanc</text>
  <!-- CTA buttons -->
  <rect x="240" y="385" width="160" height="40" rx="4" fill="url(#cdb-gold)"/>
  <text x="320" y="411" font-family="Poppins, sans-serif" font-size="13" fill="#6A1010" text-anchor="middle" font-weight="800">JE M'INSCRIS</text>
  <rect x="420" y="385" width="160" height="40" rx="4" fill="url(#cdb-gold)" opacity="0.7"/>
  <text x="500" y="411" font-family="Poppins, sans-serif" font-size="13" fill="#6A1010" text-anchor="middle" font-weight="800">JE PARTICIPE</text>
</svg>