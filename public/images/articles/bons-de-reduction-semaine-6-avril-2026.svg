<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Badge -->
  <rect x="40" y="25" width="320" height="36" rx="18" fill="url(#badge)"/>
  <text x="200" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">BONS DE REDUCTION DE LA SEMAINE</text>

  <!-- Title -->
  <text x="40" y="105" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">Semaine du 7 avril 2026</text>
  <text x="40" y="135" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.7">Tous les coupons gratuits a imprimer</text>

  <!-- Categories -->
  <rect x="40" y="165" width="155" height="50" rx="10" fill="white" fill-opacity="0.08" stroke="#e74c3c" stroke-width="1"/>
  <text x="117" y="186" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.6" text-anchor="middle">Cafe</text>
  <text x="117" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e74c3c" text-anchor="middle">18,80E</text>

  <rect x="210" y="165" width="155" height="50" rx="10" fill="white" fill-opacity="0.08" stroke="#e67e22" stroke-width="1"/>
  <text x="287" y="186" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.6" text-anchor="middle">Biscuits</text>
  <text x="287" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e67e22" text-anchor="middle">17,70E</text>

  <rect x="380" y="165" width="155" height="50" rx="10" fill="white" fill-opacity="0.08" stroke="#3498db" stroke-width="1"/>
  <text x="457" y="186" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.6" text-anchor="middle">Laitiers</text>
  <text x="457" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498db" text-anchor="middle">28 bons</text>

  <rect x="550" y="165" width="155" height="50" rx="10" fill="white" fill-opacity="0.08" stroke="#9b59b6" stroke-width="1"/>
  <text x="627" y="186" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.6" text-anchor="middle">Volaille</text>
  <text x="627" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b59b6" text-anchor="middle">16,00E</text>

  <!-- Brands -->
  <text x="40" y="265" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.8">
    <tspan x="40" dy="0">L'Or - Starbucks - Nescafe - Milka - Cote d'Or</tspan>
    <tspan x="40" dy="24">LU - Belin - Oreo - Lactel - President - Leerdammer</tspan>
    <tspan x="40" dy="24">Maitre CoQ - La Laitiere - Kraft - Bjorg - Bonne Maman</tspan>
  </text>

  <!-- Scissors icon -->
  <text x="680" y="290" font-family="Arial, sans-serif" font-size="50" fill="white" fill-opacity="0.1">%</text>
  <text x="720" y="350" font-family="Arial, sans-serif" font-size="40" fill="white" fill-opacity="0.08">%</text>
  <text x="650" y="370" font-family="Arial, sans-serif" font-size="60" fill="white" fill-opacity="0.06">%</text>

  <!-- CTA -->
  <rect x="40" y="365" width="280" height="42" rx="21" fill="url(#accent)"/>
  <text x="180" y="391" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">IMPRIMER LES BONS GRATUITS</text>

  <!-- Footer -->
  <rect x="40" y="418" width="720" height="1" fill="white" opacity="0.05"/>
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.2" text-anchor="middle">bonsplansmania.fr — Mise a jour chaque semaine</text>
</svg>