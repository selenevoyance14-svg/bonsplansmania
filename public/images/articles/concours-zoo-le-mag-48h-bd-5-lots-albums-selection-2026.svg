<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E1E"/>
      <stop offset="50%" style="stop-color:#2D2D2D"/>
      <stop offset="100%" style="stop-color:#1E1E1E"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Comic panel grid background -->
  <rect x="60" y="120" width="160" height="220" rx="4" fill="none" stroke="#4B5563" stroke-width="1" opacity="0.2"/>
  <rect x="230" y="120" width="140" height="220" rx="4" fill="none" stroke="#4B5563" stroke-width="1" opacity="0.15"/>
  <rect x="830" y="140" width="150" height="200" rx="4" fill="none" stroke="#4B5563" stroke-width="1" opacity="0.15"/>
  <rect x="990" y="120" width="140" height="220" rx="4" fill="none" stroke="#4B5563" stroke-width="1" opacity="0.2"/>
  <!-- Book spines -->
  <g transform="translate(80, 150)" opacity="0.25">
    <rect x="0" y="0" width="18" height="160" rx="2" fill="#EF4444"/>
    <rect x="22" y="10" width="16" height="150" rx="2" fill="#3B82F6"/>
    <rect x="42" y="5" width="20" height="155" rx="2" fill="#10B981"/>
    <rect x="66" y="15" width="14" height="145" rx="2" fill="#F59E0B"/>
    <rect x="84" y="0" width="18" height="160" rx="2" fill="#8B5CF6"/>
  </g>
  <g transform="translate(1000, 160)" opacity="0.2">
    <rect x="0" y="0" width="16" height="150" rx="2" fill="#EC4899"/>
    <rect x="20" y="10" width="20" height="140" rx="2" fill="#06B6D4"/>
    <rect x="44" y="5" width="14" height="145" rx="2" fill="#F97316"/>
    <rect x="62" y="0" width="18" height="150" rx="2" fill="#84CC16"/>
  </g>
  <!-- ZOO LE MAG -->
  <rect x="480" y="50" width="240" height="45" rx="4" fill="white"/>
  <text x="600" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="900" fill="#1E1E1E">ZOO LE MAG</text>
  <!-- Badge -->
  <rect x="390" y="115" width="420" height="48" rx="24" fill="url(#red)"/>
  <text x="600" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="white">CONCOURS 48H DE LA BD · 5 LOTS</text>
  <!-- 14 ans badge -->
  <circle cx="180" cy="90" r="35" fill="url(#red)" opacity="0.8"/>
  <text x="180" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="white">14</text>
  <text x="180" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="white">ANS</text>
  <!-- Main text -->
  <text x="600" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="50" font-weight="900" fill="white">Lots d'Albums BD</text>
  <text x="600" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="url(#red)">Selection 2026 a Gagner</text>
  <!-- Genres -->
  <text x="600" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white" opacity="0.6">Thriller · Aventure · Super-heros · Pirates · Fantastique · Humour</text>
  <!-- Action words -->
  <text x="950" y="100" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="url(#red)" opacity="0.12" transform="rotate(10, 950, 100)">BOOM!</text>
  <text x="100" y="450" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="url(#red)" opacity="0.1" transform="rotate(-8, 100, 450)">WHAM!</text>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="url(#red)" opacity="0.95"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">Jusqu'au 5 avril 2026 — Participation gratuite — 3 et 4 avril : BD a 2E en librairie</text>
</svg>
