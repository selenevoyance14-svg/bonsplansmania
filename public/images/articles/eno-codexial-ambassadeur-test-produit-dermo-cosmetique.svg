<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="16"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="120" fill="white" opacity="0.06"/>
  <circle cx="150" cy="380" r="90" fill="white" opacity="0.05"/>
  <!-- Badge GRATUIT -->
  <rect x="40" y="40" width="140" height="38" rx="19" fill="#10b981" opacity="0.9"/>
  <text x="110" y="64" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">TEST GRATUIT</text>
  <!-- Main card -->
  <rect x="40" y="100" width="720" height="230" rx="16" fill="url(#card)"/>
  <!-- Icon area -->
  <rect x="60" y="120" width="80" height="80" rx="12" fill="white" opacity="0.15"/>
  <text x="100" y="172" font-family="Arial, sans-serif" font-size="36" text-anchor="middle">🧴</text>
  <!-- Brand name -->
  <text x="165" y="155" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white" opacity="0.7">ENO CODEXIAL</text>
  <!-- Title -->
  <text x="165" y="185" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="white">Ambassadeur</text>
  <text x="165" y="215" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="white">Dermo-Cosmétique</text>
  <!-- Subtitle -->
  <text x="165" y="248" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.8">Testez des soins dermatologiques gratuitement</text>
  <!-- Features -->
  <rect x="60" y="295" width="200" height="22" rx="11" fill="white" opacity="0.12"/>
  <text x="160" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Produits offerts</text>
  <rect x="275" y="295" width="200" height="22" rx="11" fill="white" opacity="0.12"/>
  <text x="375" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Sans engagement</text>
  <rect x="490" y="295" width="250" height="22" rx="11" fill="white" opacity="0.12"/>
  <text x="615" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Pharmagedon certifié</text>
  <!-- Bottom -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.5" text-anchor="middle">bonsplansmania.fr</text>
</svg>
