<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Réfrigérateur -->
  <rect x="300" y="40" width="150" height="340" rx="6" fill="#333"/>
  <rect x="305" y="45" width="140" height="335" rx="4" fill="#3A3A3A"/>
  <!-- Partie frigo (haut) -->
  <rect x="310" y="50" width="130" height="200" rx="3" fill="#444"/>
  <line x1="310" y1="250" x2="440" y2="250" stroke="#555" stroke-width="2"/>
  <!-- Partie congélateur (bas) -->
  <rect x="310" y="255" width="130" height="120" rx="3" fill="#444"/>
  <!-- Poignée frigo -->
  <rect x="430" y="130" width="6" height="40" rx="3" fill="#666"/>
  <!-- Poignée congélateur -->
  <rect x="430" y="300" width="6" height="30" rx="3" fill="#666"/>
  <!-- Éclairage intérieur (léger reflet) -->
  <rect x="315" y="55" width="120" height="190" rx="2" fill="#4A4A4A" opacity="0.3"/>
  <!-- Étagères -->
  <line x1="315" y1="110" x2="435" y2="110" stroke="#555" stroke-width="1"/>
  <line x1="315" y1="165" x2="435" y2="165" stroke="#555" stroke-width="1"/>
  <!-- Logo CHIQ -->
  <text x="375" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#888">CHIQ</text>
  <!-- Flocons froid -->
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="20" fill="#64B5F6" opacity="0.2">*</text>
  <text x="520" y="150" font-family="Arial, sans-serif" font-size="16" fill="#64B5F6" opacity="0.15">*</text>
  <text x="540" y="250" font-family="Arial, sans-serif" font-size="14" fill="#64B5F6" opacity="0.1">*</text>
  <!-- Classe énergie -->
  <rect x="500" y="180" width="40" height="50" rx="4" fill="#FFF"/>
  <rect x="505" y="185" width="30" height="8" rx="1" fill="#4CAF50"/>
  <rect x="505" y="195" width="26" height="8" rx="1" fill="#8BC34A"/>
  <rect x="505" y="205" width="22" height="8" rx="1" fill="#FFEB3B"/>
  <rect x="505" y="215" width="18" height="8" rx="1" fill="#FF9800"/>
  <text x="520" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#FFF">A</text>
  <text x="518" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#FFF">B</text>
  <text x="516" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#FFF">C</text>
  <rect x="503" y="213" width="22" height="10" rx="1" fill="none" stroke="#F44336" stroke-width="1.5"/>
  <!-- Badge -11% -->
  <circle cx="700" cy="80" r="45" fill="#F44336"/>
  <text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF">-11%</text>
  <text x="700" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFCDD2">249,99€</text>
  <!-- Badge avis -->
  <rect x="30" y="60" width="130" height="40" rx="8" fill="#FF6F00"/>
  <text x="95" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">3 649 avis</text>
  <text x="95" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFE0B2">4,1/5 — 157 litres</text>
  <!-- Titre -->
  <rect x="120" y="370" width="560" height="65" rx="10" fill="rgba(51,51,51,0.9)"/>
  <text x="400" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="#FFFFFF">CHIQ Réfrigérateur Congélateur 157L</text>
  <text x="400" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#BDBDBD">Low Frost — Faible bruit — Compact — Reprise ancien appareil</text>
</svg>
