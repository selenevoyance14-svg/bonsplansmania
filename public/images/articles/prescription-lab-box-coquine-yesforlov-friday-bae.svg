<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8bbd0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hotpink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2185b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Flower decorations -->
  <circle cx="620" cy="80" r="20" fill="#e91e63" opacity="0.2"/>
  <circle cx="645" cy="65" r="15" fill="#f48fb1" opacity="0.25"/>
  <circle cx="660" cy="90" r="12" fill="#e91e63" opacity="0.15"/>
  <circle cx="160" cy="350" r="18" fill="#e91e63" opacity="0.15"/>
  <circle cx="140" cy="370" r="12" fill="#f48fb1" opacity="0.2"/>

  <!-- Edition limitée tag -->
  <rect x="250" y="18" width="300" height="28" rx="14" fill="url(#hotpink)"/>
  <text x="400" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" letter-spacing="2">EDITION LIMITEE</text>

  <!-- Title -->
  <text x="400" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#c2185b" font-style="italic">La Box Coquine</text>

  <!-- Prescription Lab -->
  <text x="400" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#888" font-style="italic">Prescription Lab x YesForLov x Friday Bae</text>

  <!-- 4 product cards -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="140" height="120" rx="10" fill="white" opacity="0.85"/>
    <!-- Stimulator icon -->
    <ellipse cx="70" cy="45" rx="18" ry="25" fill="#f8bbd0" opacity="0.5"/>
    <circle cx="70" cy="35" r="10" fill="#f48fb1" opacity="0.4"/>
    <text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c2185b">Stimulateur</text>
    <text x="70" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#888">Friday Bae</text>
  </g>

  <g transform="translate(240, 130)">
    <rect x="0" y="0" width="140" height="120" rx="10" fill="white" opacity="0.85"/>
    <!-- Gel tube -->
    <rect x="50" y="20" width="40" height="55" rx="8" fill="#fff9c4" opacity="0.8" stroke="#f0e68c" stroke-width="1"/>
    <rect x="55" y="15" width="30" height="12" rx="4" fill="#f0e68c"/>
    <text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c2185b">Gel Gourmand</text>
    <text x="70" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#888">YesForLov</text>
  </g>

  <g transform="translate(400, 130)">
    <rect x="0" y="0" width="140" height="120" rx="10" fill="white" opacity="0.85"/>
    <!-- Candy box -->
    <rect x="40" y="22" width="60" height="48" rx="6" fill="#333" opacity="0.8"/>
    <text x="70" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">SEXY CANDY</text>
    <text x="70" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white">EXPLOSION</text>
    <text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c2185b">Sucre Aphrodisiaque</text>
    <text x="70" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#888">YesForLov</text>
  </g>

  <g transform="translate(560, 130)">
    <rect x="0" y="0" width="140" height="120" rx="10" fill="white" opacity="0.85"/>
    <!-- Feather -->
    <line x1="70" y1="20" x2="70" y2="70" stroke="#333" stroke-width="1.5"/>
    <ellipse cx="70" cy="35" rx="20" ry="12" fill="#333" opacity="0.15"/>
    <ellipse cx="70" cy="45" rx="18" ry="10" fill="#333" opacity="0.1"/>
    <text x="70" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c2185b">Plume a Caresses</text>
    <text x="70" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#888">Accessoire</text>
  </g>

  <!-- Price section -->
  <text x="330" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#999" text-decoration="line-through">69€</text>
  <text x="470" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#c2185b">29,90€</text>

  <!-- Value -->
  <text x="400" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#888">123€ de produits — Sans abonnement</text>

  <!-- 50% badge -->
  <circle cx="680" cy="295" r="32" fill="url(#hotpink)"/>
  <text x="680" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">-50%</text>
  <text x="680" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">OFFERTS</text>

  <!-- Derniers exemplaires -->
  <rect x="270" y="355" width="260" height="28" rx="14" fill="url(#hotpink)" opacity="0.9"/>
  <text x="400" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Derniers exemplaires !</text>

  <!-- Hearts -->
  <text x="100" y="420" font-size="14" fill="#e91e63" opacity="0.3">&#9829;</text>
  <text x="700" y="420" font-size="14" fill="#e91e63" opacity="0.3">&#9829;</text>
  <text x="400" y="435" font-size="10" fill="#e91e63" opacity="0.2">&#9829;</text>
</svg>