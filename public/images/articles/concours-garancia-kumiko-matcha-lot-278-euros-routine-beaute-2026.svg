<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0EB"/>
      <stop offset="50%" style="stop-color:#EDE8E0"/>
      <stop offset="100%" style="stop-color:#F5F0EB"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4D7C0F"/>
      <stop offset="100%" style="stop-color:#65A30D"/>
    </linearGradient>
    <linearGradient id="garancia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Matcha bowl illustration -->
  <g transform="translate(100, 220)" opacity="0.25">
    <ellipse cx="50" cy="60" rx="50" ry="20" fill="#4D7C0F"/>
    <path d="M 0 40 Q 0 80, 50 80 Q 100 80, 100 40" fill="none" stroke="#4D7C0F" stroke-width="2"/>
    <ellipse cx="50" cy="40" rx="50" ry="20" fill="#65A30D" opacity="0.5"/>
    <ellipse cx="50" cy="40" rx="35" ry="14" fill="#4D7C0F" opacity="0.3"/>
  </g>
  <!-- Cosmetic bottles right -->
  <g transform="translate(1020, 200)" opacity="0.2">
    <rect x="0" y="10" width="30" height="80" rx="4" fill="#DC2626"/>
    <rect x="5" y="0" width="20" height="15" rx="3" fill="#DC2626"/>
    <rect x="40" y="20" width="35" height="70" rx="6" fill="#9CA3AF"/>
    <rect x="48" y="5" width="19" height="20" rx="2" fill="#9CA3AF"/>
  </g>
  <!-- Badge CONCOURS -->
  <rect x="380" y="50" width="440" height="52" rx="26" fill="url(#garancia)"/>
  <text x="600" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="white">CONCOURS · LOT DE 278E</text>
  <!-- Brands -->
  <text x="600" y="170" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#78716C" letter-spacing="4">GARANCIA x KUMIKO MATCHA</text>
  <!-- Main text -->
  <text x="600" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="900" fill="#1C1917">Routine Beaute</text>
  <text x="600" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="url(#green)">+ Coffret Matcha</text>
  <!-- Details -->
  <g transform="translate(300, 365)">
    <rect x="0" y="0" width="260" height="42" rx="21" fill="url(#garancia)" opacity="0.12"/>
    <text x="130" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#DC2626">Garancia 139E</text>
  </g>
  <g transform="translate(600, 365)">
    <rect x="0" y="0" width="260" height="42" rx="21" fill="url(#green)" opacity="0.12"/>
    <text x="130" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#4D7C0F">Kumiko Matcha 139E</text>
  </g>
  <!-- Subtitle -->
  <text x="600" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#78716C">Beaute + bien-etre : prenez soin de vous a l'interieur comme a l'exterieur</text>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="url(#garancia)" opacity="0.9"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">Participation gratuite par email — Tirage au sort</text>
</svg>
