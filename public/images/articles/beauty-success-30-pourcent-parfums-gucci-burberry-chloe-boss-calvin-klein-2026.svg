<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf2f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f0ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Badge -->
  <rect x="40" y="25" width="160" height="36" rx="18" fill="#d63384"/>
  <text x="120" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">BON PLAN</text>

  <!-- Brand -->
  <text x="40" y="100" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#2d2d2d">Beauty Success</text>

  <!-- Discount -->
  <rect x="40" y="115" width="130" height="48" rx="10" fill="#d63384"/>
  <text x="105" y="147" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">-30%</text>
  <text x="185" y="147" font-family="Arial, sans-serif" font-size="18" fill="#333">sur les parfums</text>

  <!-- Brands list -->
  <text font-family="Arial, sans-serif" font-size="14" fill="#555">
    <tspan x="40" y="200">&#x2714; Gucci Flora (Jasmine, Orchid, Gardenia)</tspan>
    <tspan x="40" y="224">&#x2714; Burberry Her, Goddess, Hero</tspan>
    <tspan x="40" y="248">&#x2714; Chloe Lumineuse et Intense</tspan>
    <tspan x="40" y="272">&#x2714; Boss The Scent, Bottled Beyond</tspan>
    <tspan x="40" y="296">&#x2714; Calvin Klein Euphoria Elixir (nouveautes)</tspan>
  </text>

  <!-- Newsletter bonus -->
  <rect x="40" y="320" width="380" height="50" rx="10" fill="white" stroke="#d63384" stroke-width="1.5"/>
  <text x="50" y="343" font-family="Arial, sans-serif" font-size="13" fill="#d63384" font-weight="bold">1ere commande : -10% EN PLUS + livraison offerte</text>
  <text x="50" y="360" font-family="Arial, sans-serif" font-size="11" fill="#888">Inscription newsletter Beauty Success</text>

  <!-- Perfume bottles (right side) -->
  <!-- Bottle 1 - Gucci Flora style (green/floral) -->
  <rect x="500" y="55" width="50" height="10" rx="3" fill="#c8a050"/>
  <rect x="518" y="30" width="14" height="30" rx="3" fill="#c8a050"/>
  <rect x="495" y="65" width="60" height="100" rx="8" fill="#5a8a4a" opacity="0.8"/>
  <text x="525" y="120" font-family="Georgia, serif" font-size="8" fill="white" text-anchor="middle">GUCCI</text>

  <!-- Bottle 2 - Burberry Her style (pink) -->
  <rect x="580" y="75" width="55" height="10" rx="3" fill="#f0c0c0"/>
  <rect x="600" y="50" width="15" height="30" rx="3" fill="#e0a0a0"/>
  <rect x="575" y="85" width="65" height="110" rx="6" fill="#f5c8d0"/>
  <text x="607" y="145" font-family="Arial, sans-serif" font-size="7" fill="#8a4a5a" text-anchor="middle">BURBERRY</text>

  <!-- Bottle 3 - Chloe style (nude/ribbon) -->
  <rect x="665" y="65" width="50" height="12" rx="4" fill="#e8d8c8"/>
  <rect x="683" y="40" width="14" height="30" rx="3" fill="#d8c8b8"/>
  <rect x="660" y="77" width="60" height="105" rx="10" fill="#f0e0d0"/>
  <rect x="660" y="90" width="60" height="8" fill="#f5c8c8" opacity="0.6"/>
  <text x="690" y="140" font-family="Georgia, serif" font-size="8" fill="#8a6a5a" text-anchor="middle">Chloe</text>

  <!-- Bottle 4 - Boss style (dark) -->
  <rect x="740" y="80" width="40" height="8" rx="3" fill="#555"/>
  <rect x="753" y="58" width="14" height="26" rx="3" fill="#444"/>
  <rect x="735" y="88" width="50" height="95" rx="6" fill="#2d2d2d"/>
  <text x="760" y="140" font-family="Arial, sans-serif" font-size="7" fill="#888" text-anchor="middle">BOSS</text>

  <!-- -30% stickers -->
  <rect x="490" y="50" width="40" height="20" rx="4" fill="#d63384"/>
  <text x="510" y="64" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">-30%</text>

  <rect x="570" y="70" width="40" height="20" rx="4" fill="#d63384"/>
  <text x="590" y="84" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">-30%</text>

  <rect x="655" y="60" width="40" height="20" rx="4" fill="#d63384"/>
  <text x="675" y="74" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">-30%</text>

  <rect x="730" y="75" width="40" height="20" rx="4" fill="#d63384"/>
  <text x="750" y="89" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">-30%</text>

  <!-- CK Euphoria bottles (bottom right) -->
  <ellipse cx="560" cy="260" rx="22" ry="55" fill="#7b2d8e" opacity="0.7"/>
  <ellipse cx="620" cy="260" rx="22" ry="55" fill="#c82060" opacity="0.7"/>
  <ellipse cx="680" cy="260" rx="22" ry="55" fill="#c8a020" opacity="0.7"/>
  <rect x="520" y="200" width="30" height="16" rx="4" fill="white" opacity="0.3"/>
  <text x="535" y="212" font-family="Arial, sans-serif" font-size="6" fill="white" text-anchor="middle">NEW</text>
  <text x="620" y="320" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">Calvin Klein Euphoria Elixir</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#e0c8d8"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#999" text-anchor="middle">bonsplansmania.fr — Beauty Success, parfumerie</text>
</svg>
