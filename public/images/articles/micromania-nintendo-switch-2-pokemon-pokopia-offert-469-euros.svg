<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e60012;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0000f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388e3c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Micromania tag -->
  <rect x="270" y="12" width="260" height="32" rx="4" fill="url(#red)"/>
  <text x="400" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" letter-spacing="3">MICROMANIA</text>

  <!-- Offre exclusive badge -->
  <rect x="280" y="55" width="240" height="24" rx="12" fill="#ffca28"/>
  <text x="400" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1a1a2e" letter-spacing="1">OFFRE EXCLUSIVE</text>

  <!-- Console name -->
  <text x="400" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" letter-spacing="2">NINTENDO SWITCH 2</text>

  <!-- Plus sign -->
  <text x="400" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffca28">+</text>

  <!-- Pokemon Pokopia -->
  <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="white">Pokemon Pokopia</text>
  <text x="400" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#aaa">(version digitale)</text>

  <!-- OFFERT badge -->
  <rect x="320" y="218" width="160" height="36" rx="6" fill="url(#green)"/>
  <text x="400" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">OFFERT !</text>

  <!-- Price section -->
  <rect x="200" y="275" width="400" height="100" rx="10" fill="rgba(255,255,255,0.08)"/>

  <!-- New price -->
  <text x="400" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white">469<tspan font-size="28">,99 EUR</tspan></text>

  <!-- Old price strikethrough -->
  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#999" text-decoration="line-through">539,98 EUR</text>

  <!-- Savings -->
  <rect x="300" y="390" width="200" height="28" rx="14" fill="url(#red)"/>
  <text x="400" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">-70 EUR d'economie</text>

  <!-- Bottom tagline -->
  <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Exclusivement sur Nintendo Switch 2</text>
</svg>