<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d4a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <circle cx="700" cy="80" r="120" fill="white" fill-opacity="0.04"/>
  <circle cx="60" cy="400" r="80" fill="white" fill-opacity="0.03"/>

  <!-- Card -->
  <rect x="35" y="35" width="480" height="380" rx="18" fill="url(#card)" stroke="white" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Badge -->
  <rect x="60" y="60" width="200" height="32" rx="16" fill="#4a7c5f"/>
  <text x="160" y="81" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">TEST PRODUIT GRATUIT</text>

  <!-- Brand -->
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white">Chicco</text>

  <!-- Product -->
  <text x="60" y="175" font-family="Arial, sans-serif" font-size="20" fill="white" fill-opacity="0.9">Poussette Dolomiti</text>

  <!-- Specs boxes -->
  <rect x="60" y="205" width="200" height="55" rx="12" fill="white" fill-opacity="0.15"/>
  <text x="160" y="228" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" fill-opacity="0.7">Poids</text>
  <text x="160" y="249" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">7,9 kg</text>

  <rect x="275" y="205" width="200" height="55" rx="12" fill="white" fill-opacity="0.1"/>
  <text x="375" y="228" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" fill-opacity="0.7">Utilisation</text>
  <text x="375" y="249" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">0 - 22 kg</text>

  <!-- Features -->
  <text x="60" y="305" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.85">
    <tspan x="60" dy="0">Grandes roues + suspensions reglables</tspan>
    <tspan x="60" dy="24">Pliage une main - canopy UV50+</tspan>
    <tspan x="60" dy="24">Couvre-jambes + habillage pluie inclus</tspan>
  </text>

  <!-- Cost -->
  <text x="60" y="395" font-family="Arial, sans-serif" font-size="15" fill="#8ecda8" font-weight="bold">Inscription gratuite - 0,02 euros de port</text>

  <!-- Stroller illustration (right side) -->
  <!-- Stroller frame -->
  <line x1="600" y1="180" x2="620" y2="320" stroke="white" stroke-width="3" stroke-opacity="0.4"/>
  <line x1="680" y1="160" x2="660" y2="320" stroke="white" stroke-width="3" stroke-opacity="0.4"/>
  <line x1="600" y1="180" x2="680" y2="160" stroke="white" stroke-width="3" stroke-opacity="0.4"/>
  <!-- Handle -->
  <line x1="680" y1="160" x2="710" y2="120" stroke="white" stroke-width="4" stroke-opacity="0.5"/>
  <circle cx="712" cy="118" r="5" fill="white" fill-opacity="0.4"/>
  <!-- Seat -->
  <rect x="595" y="190" width="80" height="90" rx="8" fill="#4a7c5f" opacity="0.5"/>
  <!-- Wheels -->
  <circle cx="620" cy="330" r="18" fill="none" stroke="white" stroke-width="3" stroke-opacity="0.3"/>
  <circle cx="660" cy="330" r="18" fill="none" stroke="white" stroke-width="3" stroke-opacity="0.3"/>
  <circle cx="620" cy="330" r="4" fill="white" fill-opacity="0.3"/>
  <circle cx="660" cy="330" r="4" fill="white" fill-opacity="0.3"/>

  <!-- Footer -->
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.3" text-anchor="middle">bonsplansmania.fr</text>
</svg>