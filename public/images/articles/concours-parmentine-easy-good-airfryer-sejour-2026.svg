  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd6b2"/>
      <stop offset="1" stop-color="#f59b63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#563522" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="1090" cy="50" r="190" fill="#fff" opacity=".2"/>
  <circle cx="90" cy="610" r="220" fill="#6f963c" opacity=".13"/>
  <g font-family="Arial, Helvetica, sans-serif">
