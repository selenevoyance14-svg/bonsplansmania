<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="16"/>
  <circle cx="660" cy="90" r="140" fill="white" opacity="0.06"/>
  <circle cx="110" cy="380" r="100" fill="white" opacity="0.05"/>
  <!-- Badges -->
  <rect x="40" y="40" width="130" height="38" rx="19" fill="white" opacity="0.2"/>
  <text x="105" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">100% BIO</text>
  <rect x="185" y="40" width="170" height="38" rx="19" fill="white" opacity="0.2"/>
  <text x="270" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">MADE IN FRANCE</text>
  <!-- Value badge -->
  <rect x="600" y="40" width="160" height="38" rx="19" fill="#f59e0b" opacity="0.9"/>
  <text x="680" y="64" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="white" text-anchor="middle">Valeur 107€</text>
  <!-- Card -->
  <rect x="40" y="100" width="720" height="230" rx="16" fill="url(#card)"/>
  <!-- Icon -->
  <rect x="60" y="120" width="80" height="80" rx="12" fill="white" opacity="0.15"/>
  <text x="100" y="172" font-family="Arial, sans-serif" font-size="36" text-anchor="middle">🌸</text>
  <!-- Brand -->
  <text x="165" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white" opacity="0.75">BIOTYFULL BOX · MARS 2026</text>
  <!-- Title -->
  <text x="165" y="185" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="white">Fraîcheur Florale</text>
  <text x="165" y="215" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white">6 produits bio français</text>
  <!-- Subtitle -->
  <text x="165" y="250" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.85">Huygens · T.Leclerc · Glatika · Ladrôme</text>
  <!-- Features -->
  <rect x="60" y="295" width="200" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="160" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Cosmos Bio certifié</text>
  <rect x="275" y="295" width="210" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="380" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Jamais d'échantillons</text>
  <rect x="500" y="295" width="240" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="620" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Offre spéciale dispo</text>
  <!-- Bottom -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.5" text-anchor="middle">bonsplansmania.fr</text>
</svg>
