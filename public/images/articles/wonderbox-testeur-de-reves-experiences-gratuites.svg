<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E65100;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#BF360C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF7043;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%"  x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="80" r="220" fill="white" fill-opacity="0.05" />
  <circle cx="100" cy="560" r="180" fill="white" fill-opacity="0.05" />
  <!-- Sky arc decoration -->
  <path d="M 700 630 Q 900 250 1200 300" stroke="white" stroke-width="2" fill="none" stroke-opacity="0.08" />
  <path d="M 650 630 Q 850 220 1200 250" stroke="white" stroke-width="1.5" fill="none" stroke-opacity="0.06" />

  <!-- Site badge -->
  <rect x="80" y="60" width="220" height="44" rx="22" fill="white" fill-opacity="0.15" />
  <text x="190" y="88" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">BonsPlansMania.fr</text>

  <!-- Category badge -->
  <rect x="80" y="128" width="200" height="36" rx="18" fill="url(#badge)" />
  <text x="180" y="152" font-family="Arial, sans-serif" font-size="16" fill="#5B1A00" text-anchor="middle" font-weight="700">🎁 TEST GRATUIT</text>

  <!-- Title -->
  <text x="80" y="258" font-family="Georgia, serif" font-size="88" fill="white" font-weight="700">wonderbox</text>

  <rect x="80" y="276" width="100" height="3" rx="2" fill="#FFD700" fill-opacity="0.8" />

  <text x="80" y="322" font-family="Arial, sans-serif" font-size="34" fill="#FFD700" font-weight="700">Testeur de Rêves</text>

  <!-- Experiences -->
  <rect x="80" y="346" width="680" height="66" rx="12" fill="white" fill-opacity="0.12" />
  <text x="100" y="370" font-family="Arial, sans-serif" font-size="19" fill="white" fill-opacity="0.9" font-weight="600">🪂 Parachute · 🎈 Montgolfière · 🏰 Château</text>
  <text x="100" y="400" font-family="Arial, sans-serif" font-size="22" fill="#FFD700" font-weight="700">Hébergements insolites · Gastronomie · Bien-être</text>

  <!-- Select badge -->
  <rect x="80" y="440" width="300" height="44" rx="10" fill="white" fill-opacity="0.15" />
  <text x="100" y="467" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">6 testeurs sélectionnés</text>

  <!-- Free badge -->
  <rect x="400" y="440" width="200" height="44" rx="10" fill="white" fill-opacity="0.15" />
  <text x="420" y="467" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="700">100% Gratuit</text>

  <text x="80" y="590" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7">Mars 2026 · Candidatures ouvertes</text>
</svg>
