<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#DB2777;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.06" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative shapes -->
  <circle cx="1000" cy="100" r="200" fill="white" fill-opacity="0.05"/>
  <circle cx="150" cy="520" r="160" fill="white" fill-opacity="0.05"/>
  <circle cx="900" cy="520" r="100" fill="white" fill-opacity="0.06"/>
  <!-- Card -->
  <rect x="60" y="60" width="680" height="510" rx="24" fill="url(#card)" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Badge -->
  <rect x="100" y="100" width="210" height="36" rx="18" fill="white" fill-opacity="0.25"/>
  <text x="205" y="123" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">CONCOURS L'ORÉAL</text>
  <!-- Title -->
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="white">Ma Vie en</text>
  <text x="100" y="252" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="white">Couleurs</text>
  <!-- Subtitle -->
  <text x="100" y="310" font-family="Arial, sans-serif" font-size="22" fill="white" fill-opacity="0.9">Jeux-concours beauté, voyages</text>
  <text x="100" y="340" font-family="Arial, sans-serif" font-size="22" fill="white" fill-opacity="0.9">&amp; lots exceptionnels</text>
  <!-- Features -->
  <rect x="100" y="375" width="580" height="50" rx="14" fill="white" fill-opacity="0.2"/>
  <text x="390" y="396" font-family="Arial, sans-serif" font-size="17" fill="white" text-anchor="middle" font-weight="600">🎁 Nouveaux lots chaque semaine</text>
  <text x="390" y="416" font-family="Arial, sans-serif" font-size="15" fill="white" fill-opacity="0.85" text-anchor="middle">Produits beauté • Voyages • Séjours spa</text>
  <!-- Check -->
  <text x="100" y="475" font-family="Arial, sans-serif" font-size="19" fill="white">✅ Gratuit · Sans obligation d'achat</text>
  <!-- Site tag -->
  <text x="100" y="530" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.6">mavieencouleurs.fr</text>
  <!-- Right decoration -->
  <text x="920" y="360" font-family="Arial, sans-serif" font-size="140" text-anchor="middle" opacity="0.25">💄</text>
  <text x="920" y="200" font-family="Arial, sans-serif" font-size="80" text-anchor="middle" opacity="0.2">🌸</text>
  <!-- BonsPlansMania tag -->
  <rect x="900" y="560" width="240" height="40" rx="20" fill="white" fill-opacity="0.15"/>
  <text x="1020" y="585" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">bonsplansmania.fr</text>
</svg>
