<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffecb3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- Stokomani brand -->
  <rect x="250" y="15" width="300" height="45" rx="8" fill="#d32f2f"/>
  <text x="400" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">STOKOMANI</text>
  <!-- Date banner -->
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#d32f2f" text-anchor="middle">DU 25 AU 29 MARS 2026</text>
  <!-- Main product -->
  <text x="400" y="135" font-family="Arial, sans-serif" font-size="18" fill="#424242" text-anchor="middle">Spa Gonflable Intex Octo Bulles Baltik</text>
  <text x="400" y="160" font-family="Arial, sans-serif" font-size="14" fill="#757575" text-anchor="middle">6 personnes — Design imitation bois gris</text>
  <!-- Price -->
  <text x="400" y="215" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#212121" text-anchor="middle">599,99€</text>
  <!-- Refund badge -->
  <rect x="150" y="245" width="500" height="90" rx="12" fill="#d32f2f"/>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#fdd835" text-anchor="middle">50%</text>
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">REMBOURSÉS EN BONS D'ACHATS</text>
  <!-- Effective price -->
  <text x="400" y="375" font-family="Arial, sans-serif" font-size="20" fill="#424242" text-anchor="middle">soit</text>
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2e7d32" text-anchor="middle">300€ OFFERTS</text>
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="14" fill="#757575" text-anchor="middle">en bons d'achats Stokomani</text>
</svg>
