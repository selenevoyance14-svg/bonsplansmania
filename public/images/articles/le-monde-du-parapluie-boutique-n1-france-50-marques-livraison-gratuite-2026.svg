<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d8e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="umbrella1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a5caa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a4a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="umbrella2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e53935;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c62828;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with rain effect -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Rain drops -->
  <line x1="100" y1="0" x2="95" y2="20" stroke="#b0c0d0" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="10" x2="195" y2="30" stroke="#b0c0d0" stroke-width="1" opacity="0.25"/>
  <line x1="350" y1="5" x2="345" y2="25" stroke="#b0c0d0" stroke-width="1" opacity="0.2"/>
  <line x1="450" y1="15" x2="445" y2="35" stroke="#b0c0d0" stroke-width="1" opacity="0.3"/>
  <line x1="150" y1="30" x2="145" y2="50" stroke="#b0c0d0" stroke-width="1" opacity="0.2"/>
  <line x1="300" y1="25" x2="295" y2="45" stroke="#b0c0d0" stroke-width="1" opacity="0.25"/>

  <!-- Badge -->
  <rect x="40" y="25" width="160" height="36" rx="18" fill="#2a5caa"/>
  <text x="120" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">BON PLAN</text>

  <!-- N1 badge -->
  <circle cx="230" cy="43" r="20" fill="#e53935"/>
  <text x="230" y="40" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">N.1</text>
  <text x="230" y="52" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">France</text>

  <!-- Main title -->
  <text x="40" y="108" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#1a2a3a">LE MONDE DU</text>
  <text x="40" y="148" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#1a2a3a">PARAPLUIE</text>

  <!-- Subtitle -->
  <text x="40" y="180" font-family="Arial, sans-serif" font-size="16" fill="#555">50 marques, le parapluie qui vous ressemble</text>

  <!-- Features -->
  <text font-family="Arial, sans-serif" font-size="14" fill="#444">
    <tspan x="40" y="225">&#x2714; Knirps, Fulton, Blunt, JPG, Hugo Boss</tspan>
    <tspan x="40" y="251">&#x2714; Femme, homme, enfant, mariage, luxe</tspan>
    <tspan x="40" y="277">&#x2714; Livraison gratuite des 49 euros</tspan>
    <tspan x="40" y="303">&#x2714; Expedition 48h, satisfait ou rembourse</tspan>
  </text>

  <!-- Price range -->
  <rect x="40" y="325" width="240" height="40" rx="8" fill="white" stroke="#2a5caa" stroke-width="1.5"/>
  <text x="160" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2a5caa" text-anchor="middle">A partir de 34 euros — 50 marques</text>

  <!-- Umbrella illustrations (right side) -->
  <!-- Blue umbrella -->
  <path d="M520,180 Q600,80 680,180 Z" fill="url(#umbrella1)"/>
  <path d="M520,180 Q560,120 600,180 Z" fill="#3a6cba" opacity="0.5"/>
  <path d="M600,180 Q640,120 680,180 Z" fill="#1a4a8a" opacity="0.5"/>
  <line x1="600" y1="180" x2="600" y2="330" stroke="#555" stroke-width="3"/>
  <path d="M600,330 Q600,345 588,345" stroke="#555" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Red umbrella (behind, offset) -->
  <path d="M640,150 Q710,60 780,150 Z" fill="url(#umbrella2)" opacity="0.7"/>
  <line x1="710" y1="150" x2="710" y2="280" stroke="#666" stroke-width="2.5" opacity="0.7"/>
  <path d="M710,280 Q710,293 700,293" stroke="#666" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Small transparent/clear umbrella -->
  <ellipse cx="530" cy="260" rx="50" ry="35" fill="white" opacity="0.3" stroke="#aaa" stroke-width="1"/>
  <line x1="530" y1="260" x2="530" y2="340" stroke="#aaa" stroke-width="2"/>
  <path d="M530,340 Q530,350 522,350" stroke="#aaa" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#b0c0d0"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#888" text-anchor="middle">bonsplansmania.fr — Le Monde du Parapluie, boutique n1 France</text>
</svg>
