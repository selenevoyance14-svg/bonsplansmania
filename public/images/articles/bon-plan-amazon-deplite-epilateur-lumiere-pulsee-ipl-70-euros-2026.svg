<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Éclats lumineux -->
  <circle cx="400" cy="180" r="120" fill="#FFD54F" opacity="0.08"/>
  <circle cx="400" cy="180" r="80" fill="#FFD54F" opacity="0.06"/>
  <!-- Épilateur IPL -->
  <!-- Corps principal -->
  <rect x="340" y="100" width="70" height="200" rx="20" fill="#F5F5F5"/>
  <rect x="345" y="105" width="60" height="190" rx="18" fill="#FAFAFA"/>
  <!-- Fenêtre flash -->
  <rect x="350" y="110" width="50" height="35" rx="8" fill="#FFD54F" opacity="0.6"/>
  <rect x="355" y="115" width="40" height="25" rx="6" fill="#FFC107" opacity="0.4"/>
  <!-- Écran LED -->
  <rect x="358" y="165" width="34" height="22" rx="4" fill="#1A237E"/>
  <text x="375" y="180" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="12" fill="#64B5F6">5</text>
  <!-- Boutons -->
  <circle cx="375" cy="210" r="10" fill="#E0E0E0"/>
  <circle cx="375" cy="210" r="7" fill="#EEEEEE"/>
  <!-- Ligne design dorée -->
  <rect x="365" y="235" width="20" height="3" rx="1" fill="#FFB74D" opacity="0.6"/>
  <!-- Flash de lumière -->
  <line x1="375" y1="100" x2="375" y2="70" stroke="#FFD54F" stroke-width="2" opacity="0.4"/>
  <line x1="355" y1="105" x2="340" y2="80" stroke="#FFD54F" stroke-width="1.5" opacity="0.3"/>
  <line x1="395" y1="105" x2="410" y2="80" stroke="#FFD54F" stroke-width="1.5" opacity="0.3"/>
  <line x1="345" y1="115" x2="325" y2="100" stroke="#FFD54F" stroke-width="1" opacity="0.2"/>
  <line x1="405" y1="115" x2="425" y2="100" stroke="#FFD54F" stroke-width="1" opacity="0.2"/>
  <!-- Lunettes de protection -->
  <rect x="500" y="200" width="80" height="30" rx="12" fill="#333"/>
  <rect x="505" y="205" width="30" height="20" rx="8" fill="#1A1A1A"/>
  <rect x="545" y="205" width="30" height="20" rx="8" fill="#1A1A1A"/>
  <rect x="535" y="212" width="10" height="6" rx="2" fill="#444"/>
  <!-- Flocon refroidissement -->
  <text x="240" y="190" font-family="Arial, sans-serif" font-size="30" fill="#64B5F6" opacity="0.3">*</text>
  <text x="235" y="220" font-family="Arial, sans-serif" font-size="10" fill="#64B5F6" opacity="0.4">10°C</text>
  <!-- Badge coupon -->
  <circle cx="700" cy="80" r="45" fill="#F44336"/>
  <text x="700" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF">63,37€</text>
  <text x="700" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFCDD2">avec coupon</text>
  <text x="700" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFCDD2">-22% prix ancien</text>
  <!-- Badge Choix Amazon -->
  <rect x="30" y="60" width="130" height="40" rx="8" fill="#FF9800"/>
  <text x="95" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">Choix d'Amazon</text>
  <text x="95" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFF3E0">4,5/5 — 206 avis</text>
  <!-- Titre -->
  <rect x="120" y="360" width="560" height="70" rx="10" fill="rgba(255,143,0,0.85)"/>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">Deplite Épilateur Lumière Pulsée IPL</text>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFF3E0">999 900 flashs — Refroidissement — 9 niveaux — H/F</text>
</svg>
