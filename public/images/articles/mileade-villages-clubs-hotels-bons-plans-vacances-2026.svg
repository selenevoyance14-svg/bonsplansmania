<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F0FF"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DB8D9"/>
      <stop offset="100%" stop-color="#2E8BC0"/>
    </linearGradient>
  </defs>
  <!-- Ciel -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <!-- Soleil -->
  <circle cx="650" cy="80" r="50" fill="#FFD700" opacity="0.9"/>
  <!-- Montagnes fond -->
  <polygon points="0,280 150,160 300,280" fill="#8FBC8F" opacity="0.5"/>
  <polygon points="200,280 400,130 600,280" fill="#6B8E6B" opacity="0.5"/>
  <!-- Mer -->
  <rect x="0" y="300" width="800" height="150" fill="url(#sea)"/>
  <!-- Plage -->
  <ellipse cx="400" cy="310" rx="350" ry="30" fill="#F4D7A3"/>
  <!-- Batiment village club -->
  <rect x="100" y="210" width="140" height="80" rx="4" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  <rect x="100" y="200" width="140" height="15" rx="3" fill="#D94F30"/>
  <!-- Fenetres -->
  <rect x="115" y="230" width="20" height="20" rx="2" fill="#87CEEB" stroke="#CCC" stroke-width="0.5"/>
  <rect x="145" y="230" width="20" height="20" rx="2" fill="#87CEEB" stroke="#CCC" stroke-width="0.5"/>
  <rect x="175" y="230" width="20" height="20" rx="2" fill="#87CEEB" stroke="#CCC" stroke-width="0.5"/>
  <rect x="205" y="230" width="20" height="20" rx="2" fill="#87CEEB" stroke="#CCC" stroke-width="0.5"/>
  <rect x="115" y="260" width="20" height="20" rx="2" fill="#87CEEB" stroke="#CCC" stroke-width="0.5"/>
  <rect x="145" y="260" width="20" height="20" rx="2" fill="#87CEEB" stroke="#CCC" stroke-width="0.5"/>
  <rect x="175" y="260" width="20" height="20" rx="2" fill="#87CEEB" stroke="#CCC" stroke-width="0.5"/>
  <rect x="205" y="260" width="20" height="20" rx="2" fill="#87CEEB" stroke="#CCC" stroke-width="0.5"/>
  <!-- Piscine -->
  <ellipse cx="350" cy="275" rx="55" ry="22" fill="#5BC0DE" stroke="#4AA8C4" stroke-width="1.5"/>
  <!-- Palmiers -->
  <rect x="508" y="220" width="6" height="70" rx="3" fill="#8B6914"/>
  <ellipse cx="511" cy="215" rx="30" ry="12" fill="#2E8B57" transform="rotate(-15 511 215)"/>
  <ellipse cx="511" cy="218" rx="28" ry="10" fill="#3CB371" transform="rotate(20 511 218)"/>
  <ellipse cx="511" cy="212" rx="25" ry="10" fill="#228B22" transform="rotate(-40 511 212)"/>
  <rect x="578" y="235" width="5" height="55" rx="2.5" fill="#8B6914"/>
  <ellipse cx="580" cy="230" rx="25" ry="10" fill="#2E8B57" transform="rotate(-10 580 230)"/>
  <ellipse cx="580" cy="233" rx="22" ry="9" fill="#3CB371" transform="rotate(25 580 233)"/>
  <!-- Parasol -->
  <rect x="448" y="260" width="3" height="35" fill="#8B4513"/>
  <path d="M430 260 Q450 240 470 260 Z" fill="#D94F30"/>
  <!-- Badge -20% -->
  <circle cx="700" cy="80" r="45" fill="#D94F30"/>
  <text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF">-20%</text>
  <text x="700" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">dernière min.</text>
  <!-- Badge 50€ -->
  <rect x="20" y="60" width="110" height="50" rx="8" fill="#FF8C00"/>
  <text x="75" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">50€ offerts</text>
  <text x="75" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFFFFF">1er séjour</text>
  <!-- Titre -->
  <rect x="150" y="350" width="500" height="70" rx="10" fill="rgba(0,0,0,0.6)"/>
  <text x="400" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#FFFFFF">Miléade</text>
  <text x="400" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#F4D7A3">Villages Clubs et Hotels en France</text>
  <!-- Nuages -->
  <ellipse cx="120" cy="50" rx="40" ry="15" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="145" cy="45" rx="30" ry="12" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="450" cy="35" rx="35" ry="13" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="475" cy="30" rx="25" ry="10" fill="#FFFFFF" opacity="0.6"/>
</svg>
