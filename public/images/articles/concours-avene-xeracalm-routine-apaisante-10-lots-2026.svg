<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5F0"/>
      <stop offset="100%" stop-color="#FFEEE5"/>
    </linearGradient>
  </defs>
  <!-- Fond pêche doux -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Flacon huile lavante -->
  <rect x="230" y="120" width="55" height="150" rx="10" fill="#F5C76B" stroke="#E5B55B" stroke-width="1.5"/>
  <rect x="245" y="100" width="25" height="25" rx="4" fill="#E5B55B"/>
  <!-- Pompe -->
  <rect x="254" y="80" width="8" height="22" rx="2" fill="#BDBDBD"/>
  <rect x="248" y="75" width="20" height="8" rx="3" fill="#9E9E9E"/>
  <rect x="265" y="78" width="15" height="5" rx="2" fill="#BDBDBD"/>
  <!-- Etiquette -->
  <rect x="238" y="150" width="39" height="50" rx="3" fill="#FFFFFF" opacity="0.8"/>
  <text x="257" y="168" text-anchor="middle" font-family="Arial" font-size="6" fill="#D4765B">Avène</text>
  <text x="257" y="180" text-anchor="middle" font-family="Arial" font-size="5" fill="#D4765B" font-weight="bold">XERACALM</text>
  <text x="257" y="190" text-anchor="middle" font-family="Arial" font-size="4" fill="#999">Huile lavante</text>
  <!-- Flacon baume -->
  <rect x="370" y="110" width="60" height="160" rx="12" fill="#FFFFFF" stroke="#E0D0C8" stroke-width="1.5"/>
  <rect x="385" y="95" width="30" height="20" rx="5" fill="#E0D0C8"/>
  <circle cx="400" cy="88" r="8" fill="#D4765B"/>
  <!-- Etiquette baume -->
  <rect x="378" y="140" width="44" height="55" rx="3" fill="#FFF0E8"/>
  <text x="400" y="158" text-anchor="middle" font-family="Arial" font-size="6" fill="#D4765B">Avène</text>
  <text x="400" y="170" text-anchor="middle" font-family="Arial" font-size="5" fill="#D4765B" font-weight="bold">XERACALM</text>
  <text x="400" y="180" text-anchor="middle" font-family="Arial" font-size="4" fill="#999">Baume</text>
  <text x="400" y="188" text-anchor="middle" font-family="Arial" font-size="4" fill="#999">relipidant</text>
  <!-- Tube concentré -->
  <rect x="510" y="150" width="35" height="120" rx="8" fill="#FFFFFF" stroke="#E0D0C8" stroke-width="1.5"/>
  <path d="M515 150 Q527 130 540 150" fill="#E0D0C8"/>
  <!-- Etiquette concentré -->
  <rect x="515" y="175" width="25" height="40" rx="2" fill="#FFF0E8"/>
  <text x="527" y="190" text-anchor="middle" font-family="Arial" font-size="5" fill="#D4765B">Avène</text>
  <text x="527" y="200" text-anchor="middle" font-family="Arial" font-size="4" fill="#D4765B" font-weight="bold">XC A.D</text>
  <text x="527" y="210" text-anchor="middle" font-family="Arial" font-size="3.5" fill="#999">Concentré</text>
  <!-- Logo Avène -->
  <text x="80" y="55" font-family="Georgia, serif" font-size="28" fill="#D4765B" font-style="italic">Avène</text>
  <text x="80" y="70" font-family="Arial" font-size="8" fill="#D4765B">EAU THERMALE</text>
  <!-- Badge 10 lots -->
  <circle cx="690" cy="80" r="48" fill="#D4765B"/>
  <text x="690" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF">10</text>
  <text x="690" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">lots</text>
  <text x="690" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFE0D0">a gagner</text>
  <!-- Titre -->
  <rect x="140" y="340" width="520" height="80" rx="12" fill="rgba(212,118,91,0.85)"/>
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF">Concours Avène Xeracalm A.D</text>
  <text x="400" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FFE0D0">Routine apaisante complète a gagner</text>
</svg>
