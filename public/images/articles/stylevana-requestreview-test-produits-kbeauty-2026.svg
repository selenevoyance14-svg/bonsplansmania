<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B21A8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#BE185D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="950" cy="100" r="180" fill="white" fill-opacity="0.05"/>
  <circle cx="1050" cy="500" r="120" fill="white" fill-opacity="0.07"/>
  <circle cx="100" cy="550" r="150" fill="white" fill-opacity="0.05"/>
  <!-- Card -->
  <rect x="60" y="60" width="700" height="510" rx="24" fill="url(#card)" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Badge -->
  <rect x="100" y="100" width="180" height="36" rx="18" fill="white" fill-opacity="0.2"/>
  <text x="190" y="123" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">TEST GRATUIT</text>
  <!-- Title -->
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="white">Stylevana</text>
  <text x="100" y="260" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="white" fill-opacity="0.9">RequestReview</text>
  <!-- Subtitle -->
  <text x="100" y="320" font-family="Arial, sans-serif" font-size="24" fill="white" fill-opacity="0.85">Testez des produits</text>
  <text x="100" y="352" font-family="Arial, sans-serif" font-size="24" fill="white" fill-opacity="0.85">K-Beauty gratuitement</text>
  <!-- Features -->
  <rect x="100" y="400" width="300" height="44" rx="12" fill="white" fill-opacity="0.15"/>
  <text x="120" y="428" font-family="Arial, sans-serif" font-size="18" fill="white">🌸 Beauté coréenne offerte</text>
  <rect x="420" y="400" width="280" height="44" rx="12" fill="white" fill-opacity="0.15"/>
  <text x="440" y="428" font-family="Arial, sans-serif" font-size="18" fill="white">✨ Avis en échange</text>
  <!-- Site tag -->
  <text x="100" y="520" font-family="Arial, sans-serif" font-size="20" fill="white" fill-opacity="0.6">stylevana.com</text>
  <!-- Right side decoration -->
  <text x="870" y="340" font-family="Arial, sans-serif" font-size="140" text-anchor="middle" opacity="0.3">🌸</text>
  <text x="870" y="200" font-family="Arial, sans-serif" font-size="80" text-anchor="middle" opacity="0.2">✨</text>
  <!-- BonsPlansMania tag -->
  <rect x="900" y="560" width="240" height="40" rx="20" fill="white" fill-opacity="0.15"/>
  <text x="1020" y="585" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">bonsplansmania.fr</text>
</svg>
