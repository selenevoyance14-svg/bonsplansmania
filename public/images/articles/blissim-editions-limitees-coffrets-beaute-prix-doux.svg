<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce4ec;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2185b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Blissim branding -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e91e63" font-style="italic" letter-spacing="2">blissim</text>

  <!-- Title -->
  <text x="400" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#333">Editions Limitees</text>
  <text x="400" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#888">7 coffrets beaute a prix doux</text>

  <!-- 7 mini coffret cards -->
  <!-- Row 1: 4 coffrets -->
  <g transform="translate(45, 120)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="url(#pink)" opacity="0.85"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">SPLENDIST PRINTEMPS</text>
    <text x="80" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white">49,90€</text>
    <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.9">Valeur 261€</text>
    <rect x="50" y="82" width="60" height="14" rx="7" fill="#ffeb3b"/>
    <text x="80" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#333">NEW</text>
  </g>

  <g transform="translate(220, 120)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#333"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">CULTISSIME</text>
    <text x="80" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white">36,55€</text>
    <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.9">Valeur 200€</text>
    <rect x="40" y="82" width="80" height="14" rx="7" fill="#ffeb3b"/>
    <text x="80" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#333">MUST-HAVE</text>
  </g>

  <g transform="translate(395, 120)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#ff8a65" opacity="0.85"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">EXPERTE ANTI-AGE</text>
    <text x="80" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white">42,50€</text>
    <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.9">Valeur 240€</text>
  </g>

  <g transform="translate(570, 120)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#8d6e63" opacity="0.85"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">SPA A LA MAISON</text>
    <text x="80" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white">32,30€</text>
    <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.9">Valeur 156€</text>
  </g>

  <!-- Row 2: 3 coffrets -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#ab47bc" opacity="0.85"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">GLOW UP</text>
    <text x="80" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white">32,30€</text>
    <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.9">Valeur 161€</text>
  </g>

  <g transform="translate(310, 240)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#1565c0" opacity="0.85"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">MONSIEUR</text>
    <text x="80" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white">22,40€</text>
    <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.9">Valeur 131€</text>
    <rect x="40" y="82" width="80" height="14" rx="7" fill="#c8e6c9"/>
    <text x="80" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#2e7d32">PROMO -30%</text>
  </g>

  <g transform="translate(520, 240)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#f48fb1" opacity="0.85"/>
    <text x="80" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white" font-weight="bold">100% MAKE-UP</text>
    <text x="80" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white">30,60€</text>
    <text x="80" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.9">Valeur 137€</text>
  </g>

  <!-- Bottom -->
  <rect x="230" y="365" width="340" height="35" rx="17" fill="url(#dark)"/>
  <text x="400" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Des 22,40€ — Editions Limitees</text>

  <text x="400" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">Tarte - Vichy - Bioderma - Weleda - Rene Furterer - Talika</text>
  <text x="400" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">Coffrets sur-mesure ultra-genereux a prix doux</text>
</svg>