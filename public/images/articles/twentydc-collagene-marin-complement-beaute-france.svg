  <text x="167" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Haute biodisponibilité</text>
  <rect x="290" y="295" width="200" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="390" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Peau + Articulations</text>
  <rect x="505" y="295" width="235" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="622" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Formule clean</text>
  <!-- Bottom -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.5" text-anchor="middle">bonsplansmania.fr</text>
