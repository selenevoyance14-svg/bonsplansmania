      <stop offset="0%" style="stop-color:#0369a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.13" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="16"/>
  <circle cx="680" cy="80" r="140" fill="white" opacity="0.06"/>
  <circle cx="100" cy="390" r="100" fill="white" opacity="0.05"/>
  <!-- Badges -->
  <rect x="40" y="40" width="170" height="38" rx="19" fill="white" opacity="0.2"/>
  <text x="125" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">MADE IN FRANCE</text>
  <rect x="225" y="40" width="220" height="38" rx="19" fill="#f59e0b" opacity="0.9"/>
  <text x="335" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">92% voient des résultats</text>
  <!-- Card -->
