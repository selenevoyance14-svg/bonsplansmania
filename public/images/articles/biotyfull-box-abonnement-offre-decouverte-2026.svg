<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#15803d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="16"/>
  <circle cx="680" cy="80" r="130" fill="white" opacity="0.06"/>
  <circle cx="100" cy="390" r="100" fill="white" opacity="0.05"/>
  <!-- Badges -->
  <rect x="40" y="40" width="130" height="38" rx="19" fill="white" opacity="0.2"/>
  <text x="105" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">100% BIO</text>
  <rect x="185" y="40" width="170" height="38" rx="19" fill="white" opacity="0.2"/>
  <text x="270" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">MADE IN FRANCE</text>
  <rect x="600" y="40" width="160" height="38" rx="19" fill="#f59e0b" opacity="0.95"/>
  <text x="680" y="64" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="white" text-anchor="middle">Dès 13€</text>
  <!-- Card -->
  <rect x="40" y="100" width="720" height="230" rx="16" fill="url(#card)"/>
  <!-- Icon -->
  <rect x="60" y="120" width="80" height="80" rx="12" fill="white" opacity="0.15"/>
  <text x="100" y="172" font-family="Arial, sans-serif" font-size="36" text-anchor="middle">🌿</text>
  <!-- Brand -->
  <text x="165" y="148" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white" opacity="0.75">BIOTYFULL BOX · BOX N°1 BIO FRANCE</text>
  <!-- Title -->
  <text x="165" y="183" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="white">Offre Découverte 2026</text>
  <text x="165" y="213" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white">6 produits bio · valeur 80€+/mois</text>
  <!-- Subtitle -->
  <text x="165" y="248" font-family="Arial, sans-serif" font-size="15" fill="white" opacity="0.85">Huygens · T.Leclerc · Ladrôme · Glatika…</text>
