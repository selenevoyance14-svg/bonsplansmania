  <rect x="60" y="295" width="205" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="162" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Jamais d'échantillons</text>
  <rect x="280" y="295" width="200" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="380" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ Sans engagement</text>
  <rect x="495" y="295" width="245" height="22" rx="11" fill="white" opacity="0.15"/>
  <text x="617" y="311" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">✓ 80 000 abonnées</text>
  <!-- Bottom -->
  <text x="400" y="410" font-family="Arial, sans-serif" font-size="13" fill="white" opacity="0.5" text-anchor="middle">bonsplansmania.fr</text>
