<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5ebe0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d81b60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2185b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#43a047;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative leaves -->
  <ellipse cx="30" cy="100" rx="25" ry="10" fill="#a5d6a7" opacity="0.3" transform="rotate(-40 30 100)"/>
  <ellipse cx="770" cy="80" rx="22" ry="9" fill="#a5d6a7" opacity="0.25" transform="rotate(30 770 80)"/>
  <ellipse cx="750" cy="350" rx="20" ry="8" fill="#a5d6a7" opacity="0.2" transform="rotate(-20 750 350)"/>
  <ellipse cx="60" cy="380" rx="18" ry="7" fill="#a5d6a7" opacity="0.25" transform="rotate(45 60 380)"/>

  <!-- Spring flowers -->
  <circle cx="100" cy="50" r="6" fill="#f48fb1" opacity="0.3"/>
  <circle cx="115" cy="42" r="5" fill="#f48fb1" opacity="0.25"/>
  <circle cx="700" cy="60" r="7" fill="#f48fb1" opacity="0.25"/>
  <circle cx="685" cy="50" r="5" fill="#f48fb1" opacity="0.2"/>

  <!-- Grand Jeu title -->
  <text x="400" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#888" letter-spacing="3">GRAND JEU CONCOURS</text>

  <!-- Main title -->
  <text x="400" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#d81b60">Box Rituel de Printemps</text>

  <!-- Belle au Naturel -->
  <text x="400" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#666" font-style="italic">Belle au Naturel</text>

  <!-- Box illustration -->
  <g transform="translate(250, 140)">
    <!-- Kraft box -->
    <rect x="50" y="20" width="200" height="140" rx="6" fill="#d4a574" opacity="0.8"/>
    <rect x="55" y="25" width="190" height="130" rx="4" fill="#e8c9a0" opacity="0.6"/>
    <!-- Box flaps -->
    <polygon points="50,20 150,0 250,20" fill="#c99b6a" opacity="0.7"/>

    <!-- Products inside -->
    <rect x="70" y="50" width="28" height="70" rx="5" fill="white" opacity="0.8"/>
    <rect x="73" y="55" width="22" height="20" rx="2" fill="#4caf50" opacity="0.5"/>
    <text x="84" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="white" font-weight="bold">BIO</text>

    <rect x="110" y="45" width="24" height="75" rx="4" fill="#fff9c4" opacity="0.8"/>
    <rect x="113" y="50" width="18" height="25" rx="2" fill="#ff8f00" opacity="0.4"/>

    <rect x="145" y="55" width="20" height="60" rx="10" fill="#1a237e" opacity="0.7"/>
    <circle cx="155" cy="62" r="5" fill="white" opacity="0.3"/>

    <rect x="175" y="48" width="26" height="68" rx="4" fill="white" opacity="0.8"/>
    <rect x="178" y="52" width="20" height="18" rx="2" fill="#e91e63" opacity="0.3"/>

    <rect x="210" y="55" width="22" height="58" rx="4" fill="#e8f5e9" opacity="0.8"/>
  </g>

  <!-- Bio badges -->
  <g transform="translate(130, 310)">
    <circle cx="0" cy="0" r="22" fill="white" stroke="#43a047" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#43a047">100%</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#43a047">BIO</text>
  </g>

  <g transform="translate(220, 310)">
    <circle cx="0" cy="0" r="22" fill="white" stroke="#43a047" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#43a047">GRAND</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#43a047">FORMAT</text>
  </g>

  <g transform="translate(310, 310)">
    <circle cx="0" cy="0" r="22" fill="white" stroke="#43a047" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#43a047">MARQUES</text>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#43a047">FR</text>
  </g>

  <!-- 2 box à gagner badge -->
  <rect x="460" y="170" width="240" height="90" rx="12" fill="url(#pink)"/>
  <text x="580" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="white">2 BOX</text>
  <text x="580" y="235" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="white">à gagner !</text>

  <!-- Value -->
  <rect x="480" y="280" width="200" height="40" rx="8" fill="white" stroke="#d81b60" stroke-width="1.5"/>
  <text x="580" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d81b60">Valeur : 94€</text>

  <!-- Date -->
  <text x="580" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">Du 1er mars au 25 mai 2026</text>
  <text x="580" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#aaa">Gratuit, sans obligation d'achat</text>

  <!-- Participation button -->
  <rect x="490" y="385" width="180" height="38" rx="19" fill="url(#pink)"/>
  <text x="580" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">JE PARTICIPE</text>

  <!-- Bottom decoration -->
  <circle cx="400" cy="440" r="4" fill="#d81b60" opacity="0.2"/>
  <circle cx="415" cy="438" r="3" fill="#d81b60" opacity="0.15"/>
  <circle cx="385" cy="438" r="3" fill="#d81b60" opacity="0.15"/>
</svg>