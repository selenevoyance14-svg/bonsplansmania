<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A2E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2D1B4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6A3FA0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="promo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF4081;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F50057;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="80" r="220" fill="white" fill-opacity="0.05" />
  <circle cx="100" cy="560" r="180" fill="white" fill-opacity="0.05" />

  <!-- Site badge -->
  <rect x="80" y="60" width="220" height="44" rx="22" fill="white" fill-opacity="0.15" />
  <text x="190" y="88" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">BonsPlansMania.fr</text>

  <!-- Category badge -->
  <rect x="80" y="128" width="190" height="36" rx="18" fill="url(#badge)" />
  <text x="175" y="152" font-family="Arial, sans-serif" font-size="16" fill="#5B1A00" text-anchor="middle" font-weight="700">🏷️ BON PLAN</text>

  <!-- Promo badge -->
  <rect x="300" y="128" width="160" height="36" rx="18" fill="url(#promo)" />
  <text x="380" y="152" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="700">Jusqu'à -75%</text>

  <!-- Title -->
  <text x="80" y="250" font-family="Georgia, serif" font-size="38" fill="white" font-weight="400" fill-opacity="0.9">Parfums</text>
  <text x="80" y="338" font-family="Georgia, serif" font-size="90" fill="white" font-weight="700">MoinsChers</text>

  <rect x="80" y="356" width="100" height="3" rx="2" fill="#FFD700" fill-opacity="0.8" />

  <text x="80" y="402" font-family="Arial, sans-serif" font-size="26" fill="white" fill-opacity="0.95" font-weight="600">Le Luxe à Petit Prix · 5 000 Références</text>

  <!-- Brands -->
  <rect x="80" y="426" width="760" height="64" rx="12" fill="white" fill-opacity="0.12" />
  <text x="100" y="450" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.85">🌹 Dior · Guerlain · YSL · Armani · Hugo Boss · Calvin Klein</text>
  <text x="100" y="478" font-family="Arial, sans-serif" font-size="22" fill="#FFD700" font-weight="700">100% authentiques · 250 000 clients · -12% à -75%</text>

  <!-- Badge -->
  <rect x="80" y="524" width="300" height="44" rx="10" fill="white" fill-opacity="0.15" />
  <text x="100" y="551" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">Lien affilié · Offres mars 2026</text>

  <text x="80" y="606" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7">Mars 2026 · Livraison à domicile</text>
</svg>
