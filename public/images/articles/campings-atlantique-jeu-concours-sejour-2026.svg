<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0369A1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0891B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Wave decoration -->
  <ellipse cx="600" cy="700" rx="900" ry="300" fill="white" fill-opacity="0.05"/>
  <ellipse cx="600" cy="750" rx="800" ry="280" fill="white" fill-opacity="0.04"/>
  <!-- Circles -->
  <circle cx="980" cy="80" r="160" fill="white" fill-opacity="0.06"/>
  <circle cx="80" cy="500" r="130" fill="white" fill-opacity="0.05"/>
  <!-- Card -->
  <rect x="60" y="60" width="680" height="510" rx="24" fill="url(#card)" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Badge -->
  <rect x="100" y="100" width="140" height="36" rx="18" fill="#F59E0B"/>
  <text x="170" y="123" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">CONCOURS</text>
  <!-- Title -->
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="white">Campings</text>
  <text x="100" y="255" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="white">Atlantique</text>
  <!-- Subtitle -->
  <text x="100" y="315" font-family="Arial, sans-serif" font-size="26" fill="white" fill-opacity="0.9">Gagnez un séjour en camping !</text>
  <!-- Prize highlight -->
  <rect x="100" y="355" width="580" height="70" rx="16" fill="white" fill-opacity="0.2"/>
  <text x="390" y="385" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">🏆 1 400 € de lots à gagner</text>
  <text x="390" y="410" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.85" text-anchor="middle">Mobile-home • Bons d'achat • Séjours</text>
  <!-- Features -->
  <text x="100" y="475" font-family="Arial, sans-serif" font-size="19" fill="white">✅ Gratuit &amp; sans achat obligatoire</text>
  <!-- Site tag -->
  <text x="100" y="530" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.6">campings-atlantique.com</text>
  <!-- Right side -->
  <text x="920" y="360" font-family="Arial, sans-serif" font-size="150" text-anchor="middle" opacity="0.25">⛺</text>
  <text x="920" y="200" font-family="Arial, sans-serif" font-size="80" text-anchor="middle" opacity="0.2">🌊</text>
  <!-- BonsPlansMania tag -->
  <rect x="900" y="560" width="240" height="40" rx="20" fill="white" fill-opacity="0.15"/>
  <text x="1020" y="585" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">bonsplansmania.fr</text>
</svg>
