<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3e5f5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- Top banner with code -->
  <rect x="0" y="0" width="800" height="80" rx="12" fill="url(#banner)"/>
  <rect x="0" y="12" width="800" height="68" fill="url(#banner)"/>
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">-10% des 70E | -12% des 132E | -18% des 176E</text>
  <rect x="310" y="47" width="180" height="28" rx="4" fill="white" opacity="0.2"/>
  <text x="400" y="67" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffd600" text-anchor="middle">Code : SPRING26</text>
  <!-- YesStyle title -->
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#7b1fa2" text-anchor="middle">YesStyle K-Beauty</text>
  <!-- Two brand boxes -->
  <!-- Milk Touch -->
  <rect x="60" y="160" width="310" height="220" rx="12" fill="white" opacity="0.9"/>
  <rect x="60" y="160" width="310" height="50" rx="12" fill="#f48fb1"/>
  <rect x="60" y="190" width="310" height="20" fill="#f48fb1"/>
  <text x="215" y="192" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Milk Touch</text>
  <text x="215" y="260" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#e91e63" text-anchor="middle">-50%</text>
  <text x="215" y="295" font-family="Arial, sans-serif" font-size="14" fill="#424242" text-anchor="middle">Cushion, Lip Balm Collagene</text>
  <text x="215" y="318" font-family="Arial, sans-serif" font-size="14" fill="#424242" text-anchor="middle">Masseur visage</text>
  <text x="215" y="365" font-family="Arial, sans-serif" font-size="12" fill="#9e9e9e" text-anchor="middle">Maquillage coreen</text>
  <!-- Dasique -->
  <rect x="430" y="160" width="310" height="220" rx="12" fill="white" opacity="0.9"/>
  <rect x="430" y="160" width="310" height="50" rx="12" fill="#ce93d8"/>
  <rect x="430" y="190" width="310" height="20" fill="#ce93d8"/>
  <text x="585" y="192" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Dasique</text>
  <text x="585" y="260" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#9c27b0" text-anchor="middle">-50%</text>
  <text x="585" y="295" font-family="Arial, sans-serif" font-size="14" fill="#424242" text-anchor="middle">Palette Coquillage 9 couleurs</text>
  <text x="585" y="318" font-family="Arial, sans-serif" font-size="14" fill="#424242" text-anchor="middle">Gloss, Lip Balm fondant</text>
  <text x="585" y="365" font-family="Arial, sans-serif" font-size="12" fill="#9e9e9e" text-anchor="middle">Maquillage coreen</text>
  <!-- Footer -->
  <text x="400" y="425" font-family="Arial, sans-serif" font-size="15" fill="#7b1fa2" text-anchor="middle" font-weight="bold">Offre flash — expire dans moins de 36h</text>
</svg>
