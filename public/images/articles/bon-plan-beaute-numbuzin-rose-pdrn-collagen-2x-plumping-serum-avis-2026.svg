<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf0ed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8e0da;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c62828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a31515;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a0b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d48090;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0e0e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Product jar illustration -->
  <g transform="translate(290, 60)">
    <!-- Jar body -->
    <rect x="0" y="50" width="220" height="140" rx="15" fill="url(#red)"/>
    <!-- Jar lid -->
    <rect x="10" y="20" width="200" height="40" rx="12" fill="url(#rose)" opacity="0.8"/>
    <rect x="10" y="45" width="200" height="15" rx="0" fill="url(#rose)" opacity="0.6"/>
    <!-- Gel surface -->
    <ellipse cx="110" cy="65" rx="95" ry="12" fill="#b71c1c" opacity="0.6"/>

    <!-- Label text -->
    <text x="70" y="105" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.9">numbuzin</text>
    <text x="70" y="122" font-family="Arial, sans-serif" font-size="9" fill="white" opacity="0.7">Rose PDRN Collagen</text>
    <text x="70" y="135" font-family="Arial, sans-serif" font-size="9" fill="white" opacity="0.7">2X Plumping Serum</text>
    <text x="70" y="155" font-family="Arial, sans-serif" font-size="8" fill="white" opacity="0.5">Rose PDRN</text>
    <text x="70" y="167" font-family="Arial, sans-serif" font-size="8" fill="white" opacity="0.5">+ Collagen Shots</text>

    <!-- 2X badge -->
    <text x="175" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="white" opacity="0.3">2X</text>

    <!-- No.2 label -->
    <rect x="165" y="92" width="40" height="14" rx="2" fill="url(#dark)"/>
    <text x="185" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">NO.2</text>
  </g>

  <!-- Spatula -->
  <line x1="520" y1="80" x2="560" y2="140" stroke="#e0c0c0" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="565" cy="145" rx="12" ry="8" fill="#d48090" opacity="0.6" transform="rotate(30 565 145)"/>

  <!-- Rating stars -->
  <g transform="translate(305, 275)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="22" fill="#d4a017">*****</text>
  </g>

  <!-- Notre avis badge -->
  <rect x="270" y="300" width="260" height="35" rx="17" fill="url(#dark)"/>
  <text x="400" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">NOTRE AVIS -- ON RECOMMANDE</text>

  <!-- Key benefits -->
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Hydratation intense -- Effet repulpant -- Glow visible</text>
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Sans parfum -- Sans colorant -- Peaux sensibles OK</text>

  <!-- Price hint -->
  <text x="400" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="url(#red)" font-weight="bold">~25E -- K-beauty</text>
</svg>