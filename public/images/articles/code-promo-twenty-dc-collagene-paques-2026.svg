<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6A3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#EDD87A;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)" rx="18"/>
  <!-- Oeufs déco Pâques -->
  <ellipse cx="620" cy="340" rx="20" ry="25" fill="#A8D8EA" opacity="0.5"/>
  <ellipse cx="680" cy="360" rx="18" ry="22" fill="#FFB7B2" opacity="0.5"/>
  <ellipse cx="650" cy="380" rx="16" ry="20" fill="#E2F0CB" opacity="0.5"/>
  <ellipse cx="140" cy="370" rx="17" ry="21" fill="#FFDAC1" opacity="0.5"/>
  <!-- Titre -->
  <text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="12" fill="#333">T W E N T Y</text>
  <text x="530" y="75" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#333">DC</text>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#666">Collagene francais — Fabrication francaise</text>
  <!-- Badge promo -->
  <rect x="150" y="130" width="500" height="70" rx="12" fill="#fff" opacity="0.85"/>
  <text x="400" y="175" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" fill="#333">CHASSE AUX CODES PROMOS</text>
  <!-- 3 codes -->
  <circle cx="230" cy="250" r="18" fill="#7BC67E"/>
  <text x="230" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">-5%</text>
  <text x="230" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#333">Un code de -5%</text>
  <circle cx="400" cy="250" r="18" fill="#5B9BD5"/>
  <text x="400" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">-10%</text>
  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#333">Un code de -10%</text>
  <circle cx="570" cy="250" r="18" fill="#F5C542"/>
  <text x="570" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">-15%</text>
  <text x="570" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#333">Un code de -15%</text>
  <!-- Sous-titre -->
  <text x="400" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#555">Caches dans les pages produits collagene</text>
  <!-- Footer -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888">Peau Magnifique — Articulations — Pur Collagene Marin</text>
