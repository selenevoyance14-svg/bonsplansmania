      <stop offset="0%" style="stop-color:#D4398A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E870AB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5B8D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
