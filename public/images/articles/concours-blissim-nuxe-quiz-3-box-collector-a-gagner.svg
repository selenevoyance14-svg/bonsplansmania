  <text x="100" y="455" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.85">Edition speciale · Produits Nuxe premium</text>
  <text x="100" y="482" font-family="Arial, sans-serif" font-size="22" fill="#FFD700" font-weight="700">Repondez au quiz · Communaute Blissim</text>

