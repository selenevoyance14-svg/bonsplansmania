  <text x="170" y="152" font-family="Arial, sans-serif" font-size="16" fill="#5B1A00" text-anchor="middle" font-weight="700">CONCOURS</text>

  <!-- Title -->
  <text x="80" y="248" font-family="Georgia, serif" font-size="52" fill="white" font-weight="400" fill-opacity="0.9">Blissim x Nuxe</text>
