<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Sol -->
  <rect x="0" y="320" width="800" height="130" fill="#B0BEC5" opacity="0.1"/>
  <!-- Rameur simplifié -->
  <!-- Rail principal -->
  <rect x="150" y="270" width="450" height="12" rx="4" fill="#333"/>
  <rect x="155" y="273" width="440" height="6" rx="3" fill="#444"/>
  <!-- Second rail -->
  <rect x="150" y="290" width="450" height="12" rx="4" fill="#333"/>
  <rect x="155" y="293" width="440" height="6" rx="3" fill="#444"/>
  <!-- Siège coulissant -->
  <rect x="330" y="245" width="70" height="30" rx="8" fill="#1565C0"/>
  <rect x="335" y="248" width="60" height="24" rx="6" fill="#1976D2"/>
  <!-- Support pieds -->
  <rect x="520" y="230" width="60" height="50" rx="6" fill="#444"/>
  <rect x="525" y="235" width="22" height="40" rx="3" fill="#555"/>
  <rect x="553" y="235" width="22" height="40" rx="3" fill="#555"/>
  <!-- Volant d'inertie (avant) -->
  <rect x="140" y="200" width="50" height="100" rx="8" fill="#333"/>
  <circle cx="165" cy="250" r="30" fill="#444"/>
  <circle cx="165" cy="250" r="22" fill="#555"/>
  <circle cx="165" cy="250" r="8" fill="#666"/>
  <!-- Poignée de tirage -->
  <rect x="200" y="222" width="140" height="6" rx="3" fill="#888"/>
  <rect x="190" y="216" width="20" height="18" rx="4" fill="#666"/>
  <!-- Écran LED -->
  <rect x="148" y="195" width="34" height="18" rx="3" fill="#111"/>
  <rect x="151" y="198" width="28" height="12" rx="2" fill="#004D40"/>
  <text x="165" y="207" text-anchor="middle" font-family="monospace" font-size="6" fill="#4CAF50">8:25</text>
  <!-- Logo DMASUN -->
  <rect x="345" y="252" width="40" height="10" rx="2" fill="#F44336" opacity="0.8"/>
  <text x="365" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="6" fill="#FFF">DMASUN</text>
  <!-- Badge -36% -->
  <circle cx="700" cy="80" r="45" fill="#F44336"/>
  <text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF">-36%</text>
  <text x="700" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFCDD2">135,37€</text>
  <!-- Badge Choix Amazon -->
  <rect x="30" y="60" width="130" height="40" rx="8" fill="#FF9800"/>
  <text x="95" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">Choix d'Amazon</text>
  <text x="95" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFF3E0">4,5/5 — 106 avis</text>
  <!-- Titre -->
  <rect x="120" y="360" width="560" height="70" rx="10" fill="rgba(21,101,192,0.85)"/>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">DMASUN Rameur d'Appartement</text>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#BBDEFB">16/32 niveaux — Double rails — Écran LED — 160 kg</text>
</svg>
