<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006064;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00838F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4DD0E1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="80" r="220" fill="white" fill-opacity="0.05" />
  <circle cx="100" cy="560" r="180" fill="white" fill-opacity="0.05" />

  <!-- Site badge -->
  <rect x="80" y="60" width="220" height="44" rx="22" fill="white" fill-opacity="0.15" />
  <text x="190" y="88" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">BonsPlansMania.fr</text>

  <!-- Category badge -->
  <rect x="80" y="128" width="200" height="36" rx="18" fill="url(#badge)" />
  <text x="180" y="152" font-family="Arial, sans-serif" font-size="16" fill="#5B1A00" text-anchor="middle" font-weight="700">TEST GRATUIT</text>

  <!-- Title -->
  <text x="80" y="248" font-family="Georgia, serif" font-size="44" fill="white" font-weight="400" fill-opacity="0.9">Reminiscence</text>
  <text x="80" y="338" font-family="Georgia, serif" font-size="100" fill="white" font-weight="700">Le Rem</text>

  <rect x="80" y="356" width="100" height="3" rx="2" fill="#FFD700" fill-opacity="0.8" />

  <text x="80" y="406" font-family="Arial, sans-serif" font-size="28" fill="white" fill-opacity="0.95" font-weight="600">Edition Limitee 30 ans · 1996</text>

  <!-- Details -->
  <rect x="80" y="432" width="740" height="64" rx="12" fill="white" fill-opacity="0.12" />
  <text x="100" y="458" font-family="Arial, sans-serif" font-size="19" fill="white" fill-opacity="0.85">Parfum floral-marin culte · Flacon turquoise collector</text>
  <text x="100" y="484" font-family="Arial, sans-serif" font-size="22" fill="#FFD700" font-weight="700">500 ambassadeurs · Sampleo · Ile de Saint-Barthelemy</text>

  <!-- Badge -->
  <rect x="80" y="530" width="280" height="44" rx="10" fill="white" fill-opacity="0.15" />
  <text x="100" y="557" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">500 places · Sampleo</text>

  <text x="80" y="606" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7">Avril 2026 · Parfumerie · Edition limitee collector</text>
</svg>
