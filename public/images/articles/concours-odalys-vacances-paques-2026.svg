<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8bc34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#689f38;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#90caf9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64b5f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="250" fill="url(#sky)" rx="12"/>
  <!-- Grass -->
  <rect y="220" width="800" height="230" fill="url(#bg)"/>
  <ellipse cx="400" cy="230" rx="420" ry="30" fill="#7cb342"/>

  <!-- Sun -->
  <circle cx="680" cy="70" r="40" fill="#fff9c4" opacity="0.6"/>
  <circle cx="680" cy="70" r="30" fill="#ffee58" opacity="0.4"/>

  <!-- Easter basket -->
  <g transform="translate(300, 160)">
    <!-- Basket -->
    <ellipse cx="100" cy="100" rx="80" ry="35" fill="#8d6e63"/>
    <ellipse cx="100" cy="95" rx="75" ry="30" fill="#a1887f"/>
    <path d="M40 95 Q100 30 160 95" stroke="#6d4c41" stroke-width="4" fill="none"/>
    <!-- Weave lines -->
    <line x1="30" y1="100" x2="170" y2="100" stroke="#795548" stroke-width="1" opacity="0.5"/>
    <line x1="35" y1="110" x2="165" y2="110" stroke="#795548" stroke-width="1" opacity="0.5"/>
    <line x1="40" y1="120" x2="160" y2="120" stroke="#795548" stroke-width="1" opacity="0.5"/>

    <!-- Easter eggs -->
    <ellipse cx="60" cy="80" rx="14" ry="18" fill="#ef5350" transform="rotate(-10 60 80)"/>
    <line x1="50" y1="75" x2="70" y2="75" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="48" y1="82" x2="72" y2="82" stroke="white" stroke-width="1.5" opacity="0.6"/>

    <ellipse cx="95" cy="72" rx="13" ry="17" fill="#42a5f5" transform="rotate(5 95 72)"/>
    <circle cx="90" cy="68" r="2" fill="white" opacity="0.5"/>
    <circle cx="100" cy="72" r="2" fill="white" opacity="0.5"/>
    <circle cx="93" cy="78" r="2" fill="white" opacity="0.5"/>

    <ellipse cx="130" cy="78" rx="14" ry="18" fill="#ffee58" transform="rotate(8 130 78)"/>
    <line x1="122" y1="72" x2="138" y2="72" stroke="#ff9800" stroke-width="1.5" opacity="0.5"/>
    <line x1="120" y1="80" x2="140" y2="80" stroke="#ff9800" stroke-width="1.5" opacity="0.5"/>

    <ellipse cx="75" cy="70" rx="12" ry="16" fill="#66bb6a" transform="rotate(-5 75 70)"/>
    <ellipse cx="115" cy="68" rx="13" ry="16" fill="#ce93d8" transform="rotate(3 115 68)"/>
  </g>

  <!-- Jeu Concours badge -->
  <circle cx="580" cy="140" r="50" fill="#90caf9" opacity="0.8"/>
  <text x="580" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">JEU</text>
  <text x="580" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" font-weight="bold">CONCOURS</text>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="#333" font-style="italic">A vous de jouer !</text>

  <!-- Lots -->
  <rect x="200" y="330" width="400" height="80" rx="10" fill="white" opacity="0.9"/>
  <text x="400" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666" letter-spacing="1">TENTEZ DE GAGNER :</text>
  <text x="400" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">1 week-end à Pâques</text>
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">1 semaine de vacances</text>

  <!-- Odalys branding -->
  <text x="400" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold" letter-spacing="1">ODALYS VACANCES</text>

  <!-- Grass blades -->
  <line x1="50" y1="250" x2="45" y2="220" stroke="#558b2f" stroke-width="2" opacity="0.4"/>
  <line x1="120" y1="245" x2="118" y2="218" stroke="#558b2f" stroke-width="2" opacity="0.3"/>
  <line x1="680" y1="248" x2="685" y2="220" stroke="#558b2f" stroke-width="2" opacity="0.4"/>
  <line x1="750" y1="250" x2="748" y2="225" stroke="#558b2f" stroke-width="2" opacity="0.3"/>
</svg>