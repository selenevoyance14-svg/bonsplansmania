  <rect x="80" y="516" width="200" height="44" rx="10" fill="white" fill-opacity="0.15" />
  <text x="100" y="543" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">Sans engagement</text>

  <rect x="298" y="516" width="160" height="44" rx="10" fill="white" fill-opacity="0.15" />
  <text x="318" y="543" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">⭐ 4,6/5</text>

  <text x="80" y="590" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7">Mars 2026 · Expédition 15-20 du mois</text>
