    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="80" r="220" fill="white" fill-opacity="0.05" />
  <circle cx="100" cy="560" r="180" fill="white" fill-opacity="0.05" />
  <!-- Leaf deco -->
  <path d="M 800 0 Q 1100 200 1000 500" stroke="white" stroke-width="2" fill="none" stroke-opacity="0.08" />
  <path d="M 850 0 Q 1150 180 1050 520" stroke="white" stroke-width="1.5" fill="none" stroke-opacity="0.06" />

  <!-- Site badge -->
  <rect x="80" y="60" width="220" height="44" rx="22" fill="white" fill-opacity="0.15" />
  <text x="190" y="88" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">BonsPlansMania.fr</text>

  <!-- Category badge -->
  <rect x="80" y="128" width="190" height="36" rx="18" fill="url(#badge)" />
  <text x="175" y="152" font-family="Arial, sans-serif" font-size="16" fill="#5B1A00" text-anchor="middle" font-weight="700">💄 BOX BEAUTÉ</text>

  <!-- Title -->
  <text x="80" y="255" font-family="Georgia, serif" font-size="52" fill="white" font-weight="400" fill-opacity="0.9">L'Arôma</text>
  <text x="80" y="340" font-family="Georgia, serif" font-size="96" fill="white" font-weight="700">Box</text>

  <rect x="80" y="358" width="100" height="3" rx="2" fill="#FFD700" fill-opacity="0.8" />

  <text x="80" y="404" font-family="Arial, sans-serif" font-size="26" fill="white" fill-opacity="0.95" font-weight="600">Box Bien-Être &amp; Aromathérapie</text>

  <!-- Content -->
  <rect x="80" y="428" width="660" height="64" rx="12" fill="white" fill-opacity="0.12" />
  <text x="100" y="452" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.85">🌿 Huiles essentielles · 🪨 Cristaux · 🕯️ Bougies · 🍵 Thés</text>
  <text x="100" y="480" font-family="Arial, sans-serif" font-size="22" fill="#FFD700" font-weight="700">6-7 produits taille réelle · Jusqu'à 150 € de valeur</text>

