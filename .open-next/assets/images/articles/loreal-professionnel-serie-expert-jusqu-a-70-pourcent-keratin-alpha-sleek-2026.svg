<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eee8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Badge BON PLAN -->
  <rect x="40" y="25" width="160" height="36" rx="18" fill="#2d2d2d"/>
  <text x="120" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">BON PLAN</text>

  <!-- Brand -->
  <text x="40" y="105" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#1a1a1a">L'OREAL</text>
  <text x="40" y="135" font-family="Arial, sans-serif" font-size="16" fill="#666" letter-spacing="3">PROFESSIONNEL</text>

  <!-- Discount -->
  <rect x="40" y="155" width="200" height="55" rx="10" fill="#5a2d82"/>
  <text x="140" y="192" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">JUSQU'A -70%</text>

  <!-- Subtitle -->
  <text x="40" y="240" font-family="Arial, sans-serif" font-size="16" fill="#555">Gamme Serie Expert</text>

  <!-- Features -->
  <text font-family="Arial, sans-serif" font-size="14" fill="#555">
    <tspan x="40" y="280">&#x2714; Keratin Alpha Sleek — lissage et discipline</tspan>
    <tspan x="40" y="306">&#x2714; Absolut Repair — reparation intense</tspan>
    <tspan x="40" y="332">&#x2714; Qualite salon de coiffure</tspan>
  </text>

  <!-- Expedition badge -->
  <rect x="40" y="355" width="200" height="35" rx="8" fill="#2d2d2d"/>
  <text x="140" y="378" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">EXPEDITION 72H</text>

  <!-- Product illustrations (right side) -->
  <!-- Purple shampoo bottle -->
  <rect x="530" y="60" width="70" height="30" rx="4" fill="#1a1a1a"/>
  <rect x="545" y="30" width="40" height="35" rx="4" fill="#1a1a1a"/>
  <rect x="520" y="90" width="90" height="200" rx="12" fill="#5a2d82"/>
  <rect x="530" y="110" width="70" height="80" rx="6" fill="white" opacity="0.15"/>
  <text x="565" y="145" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">Keratin</text>
  <text x="565" y="157" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">Alpha</text>
  <text x="565" y="169" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">Sleek</text>
  <text x="565" y="220" font-family="Arial, sans-serif" font-size="7" fill="#c8b0e0" text-anchor="middle">SERIE EXPERT</text>

  <!-- Purple jar/masque -->
  <ellipse cx="690" cy="160" rx="55" ry="16" fill="#4a1d72"/>
  <rect x="635" y="160" width="110" height="65" rx="6" fill="#5a2d82"/>
  <ellipse cx="690" cy="225" rx="55" ry="14" fill="#4a1d72"/>
  <text x="690" y="190" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">Keratin Alpha Sleek</text>
  <text x="690" y="205" font-family="Arial, sans-serif" font-size="7" fill="#c8b0e0" text-anchor="middle">SERIE EXPERT</text>

  <!-- Gold serum bottle -->
  <rect x="470" y="130" width="30" height="15" rx="3" fill="#1a1a1a"/>
  <rect x="478" y="110" width="14" height="25" rx="3" fill="#1a1a1a"/>
  <rect x="460" y="145" width="50" height="130" rx="10" fill="#c8952a"/>
  <rect x="468" y="165" width="34" height="50" rx="4" fill="white" opacity="0.15"/>
  <text x="485" y="188" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Absolut</text>
  <text x="485" y="198" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">Repair</text>

  <!-- Discount sticker -->
  <circle cx="740" cy="100" r="32" fill="#e53935"/>
  <text x="740" y="96" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">-70%</text>
  <text x="740" y="112" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">max</text>

  <!-- Footer -->
  <rect x="40" y="410" width="720" height="1" fill="#c8c0d0"/>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="13" fill="#999" text-anchor="middle">bonsplansmania.fr — L'Oreal Professionnel Serie Expert</text>
</svg>
