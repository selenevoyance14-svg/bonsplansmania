<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2a4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8872e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7fb3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a9fd4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Grass strip -->
  <rect x="0" y="340" width="800" height="110" fill="#1a5c2a" rx="0"/>
  <ellipse cx="100" cy="340" rx="80" ry="20" fill="#237a36"/>
  <ellipse cx="300" cy="345" rx="100" ry="22" fill="#1e6b2e"/>
  <ellipse cx="550" cy="340" rx="90" ry="18" fill="#237a36"/>
  <ellipse cx="720" cy="342" rx="80" ry="20" fill="#1e6b2e"/>

  <!-- Flowers -->
  <g transform="translate(80, 280)">
    <line x1="15" y1="60" x2="15" y2="20" stroke="#2d8a42" stroke-width="2"/>
    <circle cx="15" cy="15" r="8" fill="#e88b9c" opacity="0.8"/>
    <circle cx="8" cy="20" r="7" fill="#f0a0b0" opacity="0.6"/>
    <circle cx="22" cy="20" r="7" fill="#f0a0b0" opacity="0.6"/>
  </g>
  <g transform="translate(680, 290)">
    <line x1="15" y1="50" x2="15" y2="15" stroke="#2d8a42" stroke-width="2"/>
    <circle cx="15" cy="12" r="7" fill="#e8e8e8" opacity="0.6"/>
    <circle cx="9" cy="17" r="6" fill="#f0f0f0" opacity="0.5"/>
  </g>

  <!-- Easter eggs -->
  <ellipse cx="200" cy="360" rx="14" ry="18" fill="#7fb3e0" stroke="white" stroke-width="1"/>
  <line x1="188" y1="355" x2="212" y2="355" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="188" y1="365" x2="212" y2="365" stroke="white" stroke-width="1" opacity="0.5"/>

  <ellipse cx="500" cy="365" rx="12" ry="16" fill="#c9a84c" stroke="white" stroke-width="1"/>
  <line x1="490" y1="360" x2="510" y2="360" stroke="white" stroke-width="1" opacity="0.5"/>

  <ellipse cx="620" cy="358" rx="13" ry="17" fill="#e88b9c" stroke="white" stroke-width="1"/>

  <!-- JPG 76 logo -->
  <text x="400" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="white" opacity="0.15">76</text>

  <!-- Title -->
  <text x="400" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" letter-spacing="3">LA CHASSE EST</text>
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="url(#blue)" letter-spacing="2">OUVERTE</text>

  <!-- Brand -->
  <text x="400" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="url(#gold)" letter-spacing="4">JEAN PAUL GAULTIER</text>

  <!-- Prizes -->
  <rect x="220" y="270" width="360" height="45" rx="8" fill="white" opacity="0.1"/>
  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9">Porte-monnaie JPG + Coffret Decouverte Parfums</text>
  <text x="400" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="url(#gold)">Cadeaux exclusifs a gagner</text>

  <!-- Paques badge -->
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.6">Paques 2026 -- Jeu gratuit en ligne</text>
</svg>