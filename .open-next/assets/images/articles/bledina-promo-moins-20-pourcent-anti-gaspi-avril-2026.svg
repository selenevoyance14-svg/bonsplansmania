<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f0d8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d6a3f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a9c5f;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative -->
  <circle cx="700" cy="70" r="80" fill="#4a9c5f" opacity="0.08"/>
  <circle cx="70" cy="400" r="50" fill="#f0c040" opacity="0.12"/>
  <circle cx="750" cy="380" r="40" fill="#e8704a" opacity="0.06"/>

  <!-- Badge -->
  <rect x="40" y="25" width="220" height="36" rx="18" fill="url(#badge)"/>
  <text x="150" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">BONS PLANS BEBE</text>

  <!-- Brand -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2d6a3f">Bledina</text>
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="16" fill="#636e72">Alimentation bebe - Avril 2026</text>

  <!-- Promo 1 : -20% -->
  <rect x="40" y="170" width="220" height="110" rx="14" fill="white" stroke="#2d6a3f" stroke-width="2"/>
  <circle cx="90" cy="210" r="30" fill="#e8704a"/>
  <text x="90" y="215" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle">-20%</text>
  <text x="135" y="245" font-family="Arial, sans-serif" font-size="12" fill="#444" text-anchor="middle">des 75 euros d'achat</text>
  <text x="135" y="265" font-family="Arial, sans-serif" font-size="11" fill="#636e72" text-anchor="middle">01/04 au 30/04/2026</text>

  <!-- Promo 2 : Anti-gaspi -->
  <rect x="280" y="170" width="220" height="110" rx="14" fill="#2d6a3f"/>
  <text x="390" y="210" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Operation Anti-Gaspi</text>
  <text x="390" y="240" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">-30%</text>
  <text x="390" y="265" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" fill-opacity="0.8">sur une selection</text>

  <!-- Promo 3 : Bols -->
  <rect x="520" y="170" width="240" height="110" rx="14" fill="white" stroke="#f0c040" stroke-width="2"/>
  <text x="640" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2d6a3f" text-anchor="middle">Les Bols Bledina</text>
  <text x="640" y="235" font-family="Arial, sans-serif" font-size="13" fill="#444" text-anchor="middle">Nouvelles textures</text>
  <text x="640" y="258" font-family="Arial, sans-serif" font-size="12" fill="#636e72" text-anchor="middle">Des 12 mois</text>

  <!-- Bottom info -->
  <text x="40" y="330" font-family="Arial, sans-serif" font-size="15" fill="#444">
    <tspan x="40" dy="0">Livraison a domicile - Produits bebe</tspan>
    <tspan x="40" dy="26">Sans engagement - Prix minis toute l'annee</tspan>
  </text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#c8d8b8"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#b0b0b0" text-anchor="middle">bonsplansmania.fr — Bledina</text>
</svg>