<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e3f2fd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ce93d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f48fb1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Stars decoration -->
  <polygon points="100,50 103,60 113,60 105,66 108,76 100,70 92,76 95,66 87,60 97,60" fill="#ce93d8" opacity="0.15"/>
  <polygon points="700,40 702,47 709,47 703,51 705,58 700,54 695,58 697,51 691,47 698,47" fill="#90caf9" opacity="0.2"/>
  <polygon points="650,380 652,387 659,387 653,391 655,398 650,394 645,398 647,391 641,387 648,387" fill="#f48fb1" opacity="0.15"/>

  <!-- Badge -->
  <rect x="40" y="25" width="300" height="36" rx="18" fill="url(#badge)"/>
  <text x="190" y="49" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">EDITION LIMITEE x MAGICMAMAN</text>

  <!-- Main title -->
  <text x="40" y="108" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#2d2d2d">BOX MAMAN</text>
  <text x="40" y="150" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#2d2d2d">ET MOI</text>

  <!-- Subtitle -->
  <text x="40" y="178" font-family="Arial, sans-serif" font-size="14" fill="#888" font-style="italic">Qui prend soin de vous et bebe</text>

  <!-- Price -->
  <text x="40" y="220" font-family="Arial, sans-serif" font-size="18" fill="#999" text-decoration="line-through">160,59E</text>
  <rect x="145" y="200" width="140" height="35" rx="8" fill="#ce93d8"/>
  <text x="215" y="224" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">32,90E</text>
  <text x="300" y="224" font-family="Arial, sans-serif" font-size="14" fill="#e57373">  -79%</text>

  <!-- Features -->
  <text font-family="Arial, sans-serif" font-size="14" fill="#555">
    <tspan x="40" y="268">&#x2022; Essentiels bebe des les premiers mois</tspan>
    <tspan x="40" y="294">&#x2022; Rituel beaute et bien-etre maman</tspan>
    <tspan x="40" y="320">&#x2022; Surprises pour toute la famille</tspan>
    <tspan x="40" y="346">&#x2022; Kerargan, Ouate, Joone, Cetaphil</tspan>
  </text>

  <!-- Box illustration (right side) -->
  <rect x="520" y="85" width="230" height="250" rx="16" fill="white" stroke="#ce93d8" stroke-width="1.5" opacity="0.9"/>

  <!-- Banner on box -->
  <rect x="520" y="85" width="230" height="40" rx="16" fill="#f3e5f5"/>
  <text x="635" y="110" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7b1fa2" text-anchor="middle">MAMAN ET MOI</text>

  <!-- Baby products -->
  <rect x="540" y="145" width="30" height="70" rx="6" fill="#bbdefb"/>
  <text x="555" y="185" font-family="Arial, sans-serif" font-size="6" fill="#1976d2" text-anchor="middle" transform="rotate(-90, 555, 185)">JOONE</text>

  <rect x="578" y="150" width="28" height="65" rx="6" fill="#c8e6c9"/>
  <text x="592" y="188" font-family="Arial, sans-serif" font-size="6" fill="#388e3c" text-anchor="middle" transform="rotate(-90, 592, 188)">OUATE</text>

  <rect x="614" y="140" width="32" height="75" rx="6" fill="#ffe0b2"/>
  <text x="630" y="183" font-family="Arial, sans-serif" font-size="6" fill="#e65100" text-anchor="middle" transform="rotate(-90, 630, 183)">KERARGAN</text>

  <rect x="654" y="148" width="26" height="67" rx="6" fill="#e1bee7"/>

  <rect x="688" y="155" width="28" height="60" rx="6" fill="#b2dfdb"/>
  <text x="702" y="190" font-family="Arial, sans-serif" font-size="6" fill="#00695c" text-anchor="middle" transform="rotate(-90, 702, 190)">CETAPHIL</text>

  <!-- Heart between maman and bebe -->
  <text x="635" y="260" font-family="Arial, sans-serif" font-size="28" fill="#f48fb1" text-anchor="middle" opacity="0.6">&#x2665;</text>

  <!-- Maman + Bebe icons -->
  <circle cx="600" cy="300" r="16" fill="#f8bbd0" opacity="0.5"/>
  <circle cx="600" cy="292" r="8" fill="#f8bbd0" opacity="0.5"/>
  <circle cx="670" cy="305" r="10" fill="#bbdefb" opacity="0.5"/>
  <circle cx="670" cy="298" r="6" fill="#bbdefb" opacity="0.5"/>

  <!-- Reduction badge -->
  <circle cx="720" cy="110" r="28" fill="#ce93d8"/>
  <text x="720" y="106" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">-79%</text>
  <text x="720" y="122" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">edition limitee</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#d0c0d8"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#999" text-anchor="middle">bonsplansmania.fr — My Beauty Factory x magicmaman</text>
</svg>
