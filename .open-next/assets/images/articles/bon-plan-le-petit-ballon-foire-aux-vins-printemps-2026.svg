<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffde7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff9c4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- Brand -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#212121" text-anchor="middle">LE PETIT BALLON</text>
  <!-- Foire aux vins banner -->
  <rect x="220" y="65" width="360" height="35" rx="6" fill="#f9a825"/>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">FOIRE AUX VINS DE PRINTEMPS</text>
  <!-- Discount badge -->
  <circle cx="400" cy="185" r="65" fill="#e91e63" opacity="0.9"/>
  <text x="400" y="175" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">JUSQU'A</text>
  <text x="400" y="205" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">-34%</text>
  <!-- Wine bottles representation -->
  <!-- Bottle 1 - Rouge -->
  <rect x="120" y="270" width="30" height="100" rx="4" fill="#6d1b1b"/>
  <rect x="130" y="250" width="10" height="25" rx="3" fill="#6d1b1b"/>
  <rect x="122" y="300" width="26" height="30" rx="2" fill="#f5f5f5"/>
  <text x="135" y="320" font-family="Arial, sans-serif" font-size="7" fill="#424242" text-anchor="middle">ROUGE</text>
  <!-- Bottle 2 - Bio -->
  <rect x="280" y="270" width="30" height="100" rx="4" fill="#4a148c"/>
  <rect x="290" y="250" width="10" height="25" rx="3" fill="#4a148c"/>
  <rect x="282" y="300" width="26" height="30" rx="2" fill="#f5f5f5"/>
  <text x="295" y="320" font-family="Arial, sans-serif" font-size="7" fill="#424242" text-anchor="middle">BIO</text>
  <!-- Bottle 3 - Blanc -->
  <rect x="490" y="270" width="30" height="100" rx="4" fill="#c8b560"/>
  <rect x="500" y="250" width="10" height="25" rx="3" fill="#c8b560"/>
  <rect x="492" y="300" width="26" height="30" rx="2" fill="#f5f5f5"/>
  <text x="505" y="320" font-family="Arial, sans-serif" font-size="7" fill="#424242" text-anchor="middle">BLANC</text>
  <!-- Bottle 4 - Bordeaux -->
  <rect x="650" y="270" width="30" height="100" rx="4" fill="#1b5e20"/>
  <rect x="660" y="250" width="10" height="25" rx="3" fill="#1b5e20"/>
  <rect x="652" y="300" width="26" height="30" rx="2" fill="#f5f5f5"/>
  <text x="665" y="320" font-family="Arial, sans-serif" font-size="7" fill="#424242" text-anchor="middle">BRDX</text>
  <!-- Prices -->
  <text x="135" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e91e63" text-anchor="middle">8,93E</text>
  <text x="135" y="410" font-family="Arial, sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle" text-decoration="line-through">10,50E</text>
  <text x="295" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e91e63" text-anchor="middle">7,92E</text>
  <text x="295" y="410" font-family="Arial, sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle" text-decoration="line-through">9,90E</text>
  <text x="505" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e91e63" text-anchor="middle">8,80E</text>
  <text x="505" y="410" font-family="Arial, sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle" text-decoration="line-through">11,00E</text>
  <text x="665" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e91e63" text-anchor="middle">7,65E</text>
  <text x="665" y="410" font-family="Arial, sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle" text-decoration="line-through">8,50E</text>
  <!-- Footer -->
  <text x="400" y="442" font-family="Arial, sans-serif" font-size="10" fill="#9e9e9e" text-anchor="middle">L'abus d'alcool est dangereux pour la sante. A consommer avec moderation.</text>
</svg>
