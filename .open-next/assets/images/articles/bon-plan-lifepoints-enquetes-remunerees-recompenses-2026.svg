<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8eeff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00897b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00695c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Brand circle -->
  <circle cx="400" cy="55" r="30" fill="url(#blue)" stroke="white" stroke-width="2"/>
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Life</text>
  <text x="400" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">Points</text>

  <!-- Title -->
  <text x="400" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a">Des enquetes gratuites</text>
  <text x="400" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a">qui vous recompensent</text>

  <!-- Survey options cards -->
  <rect x="250" y="190" width="300" height="42" rx="21" fill="white" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="400" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Ici pour les recompenses</text>

  <rect x="250" y="245" width="300" height="42" rx="21" fill="white" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="400" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">A l'affut des reductions</text>

  <rect x="250" y="300" width="300" height="42" rx="21" fill="white" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="400" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">Adepte de shopping liste en main</text>

  <!-- App badges -->
  <rect x="230" y="370" width="150" height="38" rx="8" fill="#1a1a1a"/>
  <text x="305" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Telecharger dans</text>
  <text x="305" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">l'App Store</text>

  <rect x="420" y="370" width="150" height="38" rx="8" fill="#1a1a1a"/>
  <text x="495" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Disponible sur</text>
  <text x="495" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Google Play</text>

  <!-- Gratuit badge -->
  <rect x="330" y="425" width="140" height="20" rx="10" fill="url(#teal)"/>
  <text x="400" y="439" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">INSCRIPTION GRATUITE</text>
</svg>