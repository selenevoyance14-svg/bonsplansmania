<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e8b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f06eaa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb800;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative circles -->
  <circle cx="720" cy="60" r="70" fill="white" opacity="0.06"/>
  <circle cx="60" cy="390" r="50" fill="white" opacity="0.05"/>
  <circle cx="400" cy="30" r="8" fill="white" opacity="0.15"/>
  <circle cx="450" cy="20" r="5" fill="white" opacity="0.12"/>
  <circle cx="350" cy="15" r="6" fill="white" opacity="0.1"/>

  <!-- Badge -->
  <rect x="40" y="25" width="220" height="36" rx="18" fill="url(#badge)"/>
  <text x="150" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e91e8b" text-anchor="middle" letter-spacing="1">JEU CONCOURS</text>

  <!-- Brand -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="40" font-weight="900" fill="white">Daddy</text>
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.8">Sucres naturels depuis 40 ans</text>

  <!-- Main title -->
  <text x="40" y="190" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">Gagnez des coffrets</text>
  <text x="40" y="222" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffd700">de pots de confiture</text>
  <text x="40" y="254" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">a personnaliser</text>

  <!-- How to play -->
  <rect x="40" y="280" width="420" height="70" rx="14" fill="white" fill-opacity="0.15"/>
  <text x="60" y="305" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="bold">POUR JOUER :</text>
  <text x="60" y="325" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.9">Acheter un produit Daddy confitures et gelees</text>
  <text x="60" y="342" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.9">+ telecharger la preuve d'achat</text>

  <!-- Jar illustrations (right side) -->
  <rect x="540" y="100" width="60" height="80" rx="8" fill="white" opacity="0.25"/>
  <rect x="548" y="90" width="44" height="15" rx="4" fill="#ffd700" opacity="0.5"/>
  <text x="570" y="148" font-family="Arial, sans-serif" font-size="10" fill="#e91e8b" text-anchor="middle" font-weight="bold">Daddy</text>

  <rect x="620" y="110" width="60" height="80" rx="8" fill="white" opacity="0.2"/>
  <rect x="628" y="100" width="44" height="15" rx="4" fill="#ffd700" opacity="0.4"/>
  <text x="650" y="158" font-family="Arial, sans-serif" font-size="10" fill="#e91e8b" text-anchor="middle" font-weight="bold">Daddy</text>

  <rect x="700" y="95" width="60" height="80" rx="8" fill="white" opacity="0.22"/>
  <rect x="708" y="85" width="44" height="15" rx="4" fill="#ffd700" opacity="0.45"/>
  <text x="730" y="143" font-family="Arial, sans-serif" font-size="10" fill="#e91e8b" text-anchor="middle" font-weight="bold">Daddy</text>

  <!-- Fruit decorations -->
  <circle cx="580" cy="250" r="20" fill="#ff6b6b" opacity="0.3"/>
  <circle cx="650" cy="280" r="16" fill="#ff9f43" opacity="0.25"/>
  <circle cx="720" cy="250" r="14" fill="#ee5a24" opacity="0.2"/>

  <!-- Coffret badge -->
  <circle cx="660" cy="360" r="42" fill="white" opacity="0.2"/>
  <text x="660" y="352" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">COFFRETS</text>
  <text x="660" y="372" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">A GAGNER</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="white" opacity="0.15"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.4" text-anchor="middle">bonsplansmania.fr — Daddy</text>
</svg>