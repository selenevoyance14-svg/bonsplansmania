<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1210"/>
      <stop offset="50%" style="stop-color:#2C1A14"/>
      <stop offset="100%" style="stop-color:#1C1210"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#F5E6A3"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
    <linearGradient id="choco" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5C3317"/>
      <stop offset="100%" style="stop-color:#3E2010"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Elegant border -->
  <rect x="30" y="30" width="1140" height="570" rx="8" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  <rect x="40" y="40" width="1120" height="550" rx="6" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.15"/>
  <!-- Chocolate pieces -->
  <g transform="translate(130, 220)" opacity="0.3">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="url(#choco)"/>
    <rect x="0" y="0" width="40" height="3" fill="url(#gold)" opacity="0.3"/>
    <line x1="13" y1="0" x2="13" y2="40" stroke="url(#gold)" stroke-width="0.5" opacity="0.2"/>
    <line x1="27" y1="0" x2="27" y2="40" stroke="url(#gold)" stroke-width="0.5" opacity="0.2"/>
  </g>
  <g transform="translate(1030, 250)" opacity="0.25">
    <rect x="0" y="0" width="35" height="35" rx="4" fill="url(#choco)"/>
    <rect x="0" y="0" width="35" height="3" fill="url(#gold)" opacity="0.3"/>
  </g>
  <!-- Swiss cross -->
  <g transform="translate(555, 60)" opacity="0.4">
    <rect x="0" y="0" width="90" height="90" rx="4" fill="#DC2626"/>
    <rect x="35" y="15" width="20" height="60" fill="white"/>
    <rect x="15" y="35" width="60" height="20" fill="white"/>
  </g>
  <!-- Badge CONCOURS -->
  <rect x="400" y="175" width="400" height="50" rx="25" fill="url(#gold)" opacity="0.9"/>
  <text x="600" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#1C1210">CONCOURS CHOCOLAT</text>
  <!-- Brand -->
  <text x="600" y="290" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="url(#gold)" opacity="0.7" letter-spacing="8">GUILLAUME BICHET</text>
  <text x="600" y="318" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="url(#gold)" opacity="0.4" letter-spacing="4">ARTISAN CHOCOLATIER SUISSE</text>
  <!-- Main text -->
  <text x="600" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="white">Chocolats Artisanaux</text>
  <text x="600" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="url(#gold)">a Gagner pour Paques</text>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="url(#gold)" opacity="0.9"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1C1210">Participation gratuite par email — Chocolat suisse artisanal</text>
</svg>
