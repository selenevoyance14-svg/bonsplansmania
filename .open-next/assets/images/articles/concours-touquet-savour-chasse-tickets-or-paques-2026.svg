<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f8e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a017;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#80cbc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4db6ac;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Easter eggs decoration -->
  <ellipse cx="120" cy="380" rx="18" ry="24" fill="#f8bbd0" opacity="0.5"/>
  <ellipse cx="160" cy="390" rx="15" ry="20" fill="#c5e1a5" opacity="0.5"/>
  <ellipse cx="640" cy="385" rx="16" ry="22" fill="#b3e5fc" opacity="0.5"/>
  <ellipse cx="690" cy="375" rx="14" ry="19" fill="#fff9c4" opacity="0.6"/>

  <!-- Grass -->
  <ellipse cx="100" cy="400" rx="60" ry="12" fill="#81c784" opacity="0.4"/>
  <ellipse cx="400" cy="410" rx="80" ry="14" fill="#81c784" opacity="0.3"/>
  <ellipse cx="680" cy="405" rx="70" ry="12" fill="#81c784" opacity="0.4"/>

  <!-- Brand -->
  <rect x="260" y="20" width="280" height="40" rx="6" fill="url(#dark)"/>
  <text x="400" y="47" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="white" letter-spacing="2">Touquet Savour</text>

  <!-- Main title -->
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#mint)">Grand jeu de Paques !</text>

  <!-- Ticket d'or illustration -->
  <g transform="translate(280, 130)">
    <rect x="0" y="0" width="240" height="120" rx="10" fill="url(#gold)" stroke="#b8860b" stroke-width="2"/>
    <!-- Dashed border inside -->
    <rect x="8" y="8" width="224" height="104" rx="6" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="120" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="white">Ticket d'or</text>
    <text x="120" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="white">4</text>
    <text x="120" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.9">tickets caches dans vos sacs</text>
    <text x="120" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white" opacity="0.8">de Ratte du Touquet</text>
  </g>

  <!-- Prizes -->
  <g transform="translate(80, 275)">
    <rect x="0" y="0" width="280" height="55" rx="8" fill="white" stroke="#d4a017" stroke-width="1.5"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Weekend bien-etre + gastronomie</text>
    <text x="140" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">pour 2 personnes</text>
  </g>

  <g transform="translate(440, 275)">
    <rect x="0" y="0" width="280" height="55" rx="8" fill="white" stroke="#d4a017" stroke-width="1.5"/>
    <text x="140" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">3 cartes cadeaux</text>
    <text x="140" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">multi-enseignes de 100E</text>
  </g>

  <!-- Date -->
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">Depuis le 23 mars 2026 -- jusqu'a epuisement des tickets</text>

  <!-- Bottom accent -->
  <rect x="340" y="420" width="120" height="3" rx="1.5" fill="url(#gold)" opacity="0.5"/>
</svg>