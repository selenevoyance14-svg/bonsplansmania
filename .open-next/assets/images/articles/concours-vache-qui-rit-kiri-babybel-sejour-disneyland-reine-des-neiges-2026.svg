<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a3a6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a2a6e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c2185b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e91e8b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Snow/ice decorative -->
  <circle cx="100" cy="80" r="60" fill="#a0d8ef" opacity="0.08"/>
  <circle cx="700" cy="100" r="80" fill="#a0d8ef" opacity="0.06"/>
  <circle cx="400" cy="420" r="100" fill="#e0f0ff" opacity="0.04"/>

  <!-- Snowflakes -->
  <text x="60" y="60" font-family="Arial" font-size="18" fill="white" opacity="0.15">*</text>
  <text x="200" y="40" font-family="Arial" font-size="14" fill="white" opacity="0.12">*</text>
  <text x="720" y="80" font-family="Arial" font-size="20" fill="white" opacity="0.1">*</text>
  <text x="650" y="400" font-family="Arial" font-size="16" fill="white" opacity="0.1">*</text>

  <!-- Badge -->
  <rect x="40" y="25" width="220" height="36" rx="18" fill="url(#btn)"/>
  <text x="150" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">JEU CONCOURS</text>

  <!-- Brands -->
  <text x="40" y="105" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.7">La Vache qui rit x Kiri x Babybel</text>

  <!-- Main title -->
  <text x="40" y="155" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">Gagnez un sejour</text>
  <text x="40" y="190" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#a0d8ef">Disneyland Paris</text>

  <!-- Subtitle -->
  <text x="40" y="230" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.9">Le Monde de la Reine des Neiges</text>

  <!-- Info boxes -->
  <rect x="40" y="260" width="200" height="55" rx="12" fill="white" fill-opacity="0.1"/>
  <text x="140" y="283" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" fill-opacity="0.7">Periode</text>
  <text x="140" y="303" font-family="Arial, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="bold">16/03 au 19/07/2026</text>

  <rect x="260" y="260" width="220" height="55" rx="12" fill="white" fill-opacity="0.1"/>
  <text x="370" y="283" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle" fill-opacity="0.7">Condition</text>
  <text x="370" y="303" font-family="Arial, sans-serif" font-size="15" fill="white" text-anchor="middle" font-weight="bold">Achat produit porteur</text>

  <!-- Castle illustration (right side) -->
  <!-- Tower 1 -->
  <rect x="600" y="140" width="40" height="120" rx="4" fill="#a0d8ef" opacity="0.15"/>
  <polygon points="600,140 620,100 640,140" fill="#a0d8ef" opacity="0.2"/>
  <!-- Tower 2 -->
  <rect x="660" y="120" width="50" height="140" rx="4" fill="#a0d8ef" opacity="0.12"/>
  <polygon points="660,120 685,70 710,120" fill="#a0d8ef" opacity="0.18"/>
  <!-- Tower 3 -->
  <rect x="730" y="150" width="35" height="110" rx="4" fill="#a0d8ef" opacity="0.1"/>
  <polygon points="730,150 747,115 765,150" fill="#a0d8ef" opacity="0.15"/>
  <!-- Bridge -->
  <rect x="595" y="260" width="175" height="8" rx="4" fill="#a0d8ef" opacity="0.08"/>

  <!-- Price tag -->
  <circle cx="680" cy="340" r="45" fill="url(#btn)" opacity="0.9"/>
  <text x="680" y="330" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">SEJOURS</text>
  <text x="680" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">MAGIQUES</text>
  <text x="680" y="368" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">a gagner</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="white" opacity="0.1"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.3" text-anchor="middle">bonsplansmania.fr — Ribambel x Disneyland Paris</text>
</svg>