<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#2D2D44"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1A1A2E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fond sombre ambiance -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Lueur dorée centrale -->
  <circle cx="400" cy="200" r="200" fill="url(#glow)"/>
  <!-- Diffuseur -->
  <ellipse cx="400" cy="300" rx="70" ry="15" fill="#111" opacity="0.3"/>
  <!-- Corps du diffuseur -->
  <path d="M340 280 Q340 160 400 140 Q460 160 460 280 Z" fill="#3A3A3A"/>
  <path d="M340 280 Q340 160 400 140 Q460 160 460 280 Z" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>
  <!-- Motifs orientaux dorés -->
  <circle cx="370" cy="200" r="8" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
  <circle cx="400" cy="190" r="10" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.6"/>
  <circle cx="430" cy="200" r="8" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
  <circle cx="385" cy="230" r="7" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>
  <circle cx="415" cy="230" r="7" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>
  <circle cx="400" cy="260" r="9" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
  <circle cx="370" cy="255" r="6" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
  <circle cx="430" cy="255" r="6" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
  <!-- Col du diffuseur -->
  <ellipse cx="400" cy="145" rx="25" ry="8" fill="#444"/>
  <!-- Vapeur -->
  <path d="M390 130 Q385 100 395 80" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.2"/>
  <path d="M400 128 Q405 90 398 60" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.25"/>
  <path d="M410 130 Q415 95 405 70" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.2"/>
  <!-- Lueur LED couleur -->
  <ellipse cx="400" cy="285" rx="55" ry="8" fill="#7B68EE" opacity="0.3"/>
  <ellipse cx="400" cy="285" rx="35" ry="5" fill="#9B88FF" opacity="0.2"/>
  <!-- Petites étoiles ambiance -->
  <circle cx="150" cy="80" r="1.5" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="650" cy="60" r="1.5" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="200" cy="150" r="1" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="600" cy="130" r="1" fill="#FFFFFF" opacity="0.2"/>
  <!-- Feuille d'eucalyptus déco -->
  <ellipse cx="550" cy="220" rx="8" ry="20" fill="#4A7A5A" opacity="0.4" transform="rotate(-20 550 220)"/>
  <ellipse cx="565" cy="210" rx="7" ry="18" fill="#5A8A6A" opacity="0.3" transform="rotate(10 565 210)"/>
  <!-- Badge -13% -->
  <circle cx="690" cy="80" r="42" fill="#D4AF37"/>
  <text x="690" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#1A1A2E">-13%</text>
  <text x="690" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1A1A2E">31,34€</text>
  <!-- Badge note -->
  <rect x="30" y="60" width="100" height="45" rx="8" fill="#FF9900"/>
  <text x="80" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#FFFFFF">4,3/5</text>
  <text x="80" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFF4E0">2213 avis</text>
  <!-- Titre -->
  <rect x="140" y="350" width="520" height="70" rx="10" fill="rgba(212,175,55,0.85)"/>
  <text x="400" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#1A1A2E">SALKING Diffuseur 500ml</text>
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#3A3A3A">Huiles essentielles — 7 couleurs LED</text>
</svg>
