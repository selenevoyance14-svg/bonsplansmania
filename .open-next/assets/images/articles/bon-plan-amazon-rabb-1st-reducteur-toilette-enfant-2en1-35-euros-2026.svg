  <text x="400" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="#FFFFFF">RABB 1ST Réducteur Toilette Enfant 2 en 1</text>
  <text x="400" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#C8E6C9">Rehausseur + Tabouret — Antidérapant — Coussin — Fille/Garçon</text>
