  <ellipse cx="380" cy="250" rx="45" ry="18" fill="#66BB6A"/>
  <ellipse cx="380" cy="248" rx="42" ry="15" fill="#81C784"/>
  <ellipse cx="380" cy="248" rx="28" ry="10" fill="#4CAF50"/>
