  <rect x="330" y="308" width="100" height="18" rx="4" fill="#90A4AE"/>
  <rect x="320" y="326" width="120" height="18" rx="4" fill="#B0BEC5"/>
  <!-- Pieds antidérapants -->
  <rect x="325" y="344" width="20" height="6" rx="2" fill="#FF9800"/>
  <rect x="415" y="344" width="20" height="6" rx="2" fill="#FF9800"/>
  <!-- Badge -5% -->
  <circle cx="700" cy="80" r="45" fill="#F44336"/>
  <text x="700" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">35,14€</text>
  <text x="700" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#FFCDD2">Choix d'Amazon</text>
  <text x="700" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFCDD2">10% déjà vendus</text>
