  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Toilettes -->
  <ellipse cx="380" cy="260" rx="60" ry="25" fill="#E0E0E0"/>
  <rect x="320" y="180" width="120" height="85" rx="8" fill="#EEEEEE"/>
