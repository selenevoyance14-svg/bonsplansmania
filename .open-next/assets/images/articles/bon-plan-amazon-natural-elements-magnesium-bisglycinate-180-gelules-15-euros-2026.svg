  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="#FFFFFF">Natural Elements Magnésium Bisglycinate</text>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#C8E6C9">300 mg — 180 gélules — Vegan — Doux pour l'estomac</text>
