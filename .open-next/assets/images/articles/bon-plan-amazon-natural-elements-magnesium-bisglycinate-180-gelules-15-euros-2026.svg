  <text x="370" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#333">de magnésium</text>
  <text x="370" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">300 mg / dose</text>
  <text x="370" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#888">180 gélules</text>
  <rect x="340" y="222" width="20" height="12" rx="3" fill="#4CAF50" opacity="0.7"/>
  <text x="350" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#FFF">Vegan</text>
  <!-- Gélules -->
