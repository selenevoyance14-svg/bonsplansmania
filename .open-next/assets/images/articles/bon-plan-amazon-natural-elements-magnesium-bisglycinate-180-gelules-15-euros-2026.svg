  <text x="700" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">14,52€</text>
  <text x="700" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#C8E6C9">-39% prix conseillé</text>
  <text x="700" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C8E6C9">0,08€/gélule</text>
