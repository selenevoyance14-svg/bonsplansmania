  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Feuilles déco -->
  <ellipse cx="120" cy="150" rx="20" ry="45" fill="#81C784" opacity="0.2" transform="rotate(-15,120,150)"/>
  <ellipse cx="680" cy="180" rx="18" ry="40" fill="#81C784" opacity="0.2" transform="rotate(20,680,180)"/>
  <!-- Flacon -->
  <rect x="310" y="100" width="120" height="200" rx="14" fill="#1A1A1A"/>
  <rect x="315" y="105" width="110" height="190" rx="12" fill="#222"/>
