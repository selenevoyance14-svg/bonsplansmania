<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Badge -->
  <rect x="40" y="25" width="300" height="36" rx="18" fill="url(#badge)"/>
  <text x="190" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">OFFRE DUREE LIMITEE AMAZON</text>

  <!-- Brand -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2d3436">ZIPRO Eclipse X</text>
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="16" fill="#636e72">Velo d'appartement pliable magnetique</text>

  <!-- Price -->
  <rect x="40" y="165" width="200" height="65" rx="12" fill="white" stroke="#e67e22" stroke-width="2"/>
  <text x="55" y="190" font-family="Arial, sans-serif" font-size="14" fill="#636e72"><tspan text-decoration="line-through">119,00E</tspan></text>
  <text x="155" y="195" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#e67e22">89,10E</text>
  <text x="140" y="220" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" text-anchor="middle" font-weight="bold">-25%</text>

  <!-- Rating + stock -->
  <text x="260" y="190" font-family="Arial, sans-serif" font-size="15" fill="#f39c12" font-weight="bold">4,6/5</text>
  <text x="260" y="210" font-family="Arial, sans-serif" font-size="12" fill="#636e72">(58 avis)</text>
  <text x="260" y="230" font-family="Arial, sans-serif" font-size="12" fill="#e74c3c" font-weight="bold">15 exemplaires restants</text>

  <!-- Specs -->
  <text x="40" y="270" font-family="Arial, sans-serif" font-size="14" fill="#444">
    <tspan x="40" dy="0">Pliable - Resistance magnetique 8 niveaux</tspan>
    <tspan x="40" dy="24">Bluetooth + app - Silencieux - Jusqu'a 110 kg</tspan>
    <tspan x="40" dy="24">Ou 22,78E x4 mois - Livraison gratuite Prime</tspan>
  </text>

  <!-- Bike illustration (right side) -->
  <!-- Frame -->
  <line x1="580" y1="280" x2="640" y2="150" stroke="#2d3436" stroke-width="4" opacity="0.3"/>
  <line x1="640" y1="150" x2="700" y2="200" stroke="#2d3436" stroke-width="4" opacity="0.3"/>
  <line x1="700" y1="200" x2="700" y2="300" stroke="#2d3436" stroke-width="3" opacity="0.3"/>
  <line x1="580" y1="280" x2="700" y2="300" stroke="#2d3436" stroke-width="3" opacity="0.3"/>
  <!-- Seat -->
  <rect x="620" y="138" width="40" height="10" rx="5" fill="#2d3436" opacity="0.4"/>
  <!-- Handlebars -->
  <rect x="690" y="185" width="30" height="8" rx="4" fill="#2d3436" opacity="0.4"/>
  <!-- Wheel -->
  <circle cx="580" cy="300" r="30" fill="none" stroke="#2d3436" stroke-width="3" opacity="0.2"/>
  <circle cx="580" cy="300" r="5" fill="#2d3436" opacity="0.2"/>
  <!-- Pedal -->
  <rect x="620" y="290" width="25" height="8" rx="3" fill="#e67e22" opacity="0.4"/>
  <!-- Screen -->
  <rect x="695" y="160" width="30" height="20" rx="4" fill="#4a90d9" opacity="0.2"/>

  <!-- Choix Amazon badge -->
  <rect x="560" y="90" width="160" height="30" rx="8" fill="#232f3e" opacity="0.8"/>
  <text x="640" y="110" font-family="Arial, sans-serif" font-size="12" fill="#f39c12" text-anchor="middle" font-weight="bold">Choix d'Amazon</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#c0c0c0"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#b0b0b0" text-anchor="middle">bonsplansmania.fr — Amazon</text>
</svg>