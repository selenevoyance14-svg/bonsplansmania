<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2A4A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A4A6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A6A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background ocean -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Waves -->
  <path d="M0 480 Q150 450 300 470 Q450 490 600 460 Q750 430 900 460 Q1050 490 1200 470 L1200 630 L0 630 Z" fill="white" fill-opacity="0.06" />
  <path d="M0 510 Q150 480 300 500 Q450 520 600 490 Q750 460 900 490 Q1050 520 1200 500 L1200 630 L0 630 Z" fill="white" fill-opacity="0.04" />

  <!-- Stars -->
  <circle cx="900" cy="80" r="2" fill="white" fill-opacity="0.5" />
  <circle cx="950" cy="120" r="1.5" fill="white" fill-opacity="0.4" />
  <circle cx="1050" cy="60" r="2" fill="white" fill-opacity="0.45" />
  <circle cx="1100" cy="150" r="1.5" fill="white" fill-opacity="0.35" />
  <circle cx="800" cy="50" r="1.5" fill="white" fill-opacity="0.4" />

  <!-- Site badge -->
  <rect x="80" y="60" width="240" height="44" rx="22" fill="white" fill-opacity="0.15" />
  <text x="200" y="88" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">BonsPlansMania.fr</text>

  <!-- Concours badge -->
  <rect x="80" y="130" width="220" height="36" rx="18" fill="url(#badge)" />
  <text x="190" y="154" font-family="Georgia, serif" font-size="16" fill="#7B1A00" text-anchor="middle" font-weight="700">JEU CONCOURS</text>

  <!-- Main title -->
  <text x="80" y="255" font-family="Georgia, serif" font-size="60" fill="white" font-weight="700">LPG fête ses 40 ans</text>
  <text x="80" y="320" font-family="Georgia, serif" font-size="34" fill="white" font-weight="400" fill-opacity="0.92">Croisière en Méditerranée</text>

  <!-- Divider -->
  <rect x="80" y="345" width="120" height="3" rx="2" fill="white" fill-opacity="0.5" />

  <!-- Prize highlight -->
  <rect x="80" y="380" width="540" height="50" rx="10" fill="white" fill-opacity="0.12" />
  <text x="100" y="412" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">8 jours pour 2 personnes avec MSC Croisières</text>

  <rect x="80" y="445" width="480" height="50" rx="10" fill="white" fill-opacity="0.10" />
  <text x="100" y="477" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="600">Tarragone, Valencia, Rome, Portofino...</text>

  <!-- Ship icon -->
  <rect x="950" y="350" width="140" height="60" rx="8" fill="white" fill-opacity="0.1" />
  <rect x="970" y="330" width="100" height="25" rx="4" fill="white" fill-opacity="0.08" />
  <rect x="1000" y="310" width="40" height="25" rx="3" fill="white" fill-opacity="0.08" />

  <!-- Date -->
  <text x="80" y="550" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7">Jusqu'au 30 avril 2026 - Tirage le 5 mai</text>
</svg>
