<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f8f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Badge -->
  <rect x="40" y="25" width="300" height="36" rx="18" fill="url(#badge)"/>
  <text x="190" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">OFFRE DUREE LIMITEE AMAZON</text>

  <!-- Brand -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2d3436">ODK Bureau d'angle</text>
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="16" fill="#636e72">Bureau en L 140x80cm - 4 tiroirs - USB integre</text>

  <!-- Price -->
  <rect x="40" y="165" width="220" height="65" rx="12" fill="white" stroke="#e67e22" stroke-width="2"/>
  <text x="55" y="190" font-family="Arial, sans-serif" font-size="14" fill="#636e72"><tspan text-decoration="line-through">129,99E</tspan></text>
  <text x="170" y="195" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#e67e22">108,29E</text>
  <text x="150" y="220" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" text-anchor="middle" font-weight="bold">-17%</text>

  <!-- Rating -->
  <text x="280" y="190" font-family="Arial, sans-serif" font-size="15" fill="#f39c12" font-weight="bold">4,4/5</text>
  <text x="280" y="210" font-family="Arial, sans-serif" font-size="12" fill="#636e72">(1 776 avis)</text>

  <!-- Specs -->
  <text x="40" y="270" font-family="Arial, sans-serif" font-size="14" fill="#444">
    <tspan x="40" dy="0">4 tiroirs - Prise USB + prise de courant</tspan>
    <tspan x="40" dy="24">Support ecran integre - Reversible gauche/droite</tspan>
    <tspan x="40" dy="24">Blanc - Ou 27,69E x4 mois - Livraison gratuite</tspan>
  </text>

  <!-- Desk illustration (right side) -->
  <!-- L-shape desk top -->
  <rect x="520" y="140" width="180" height="10" rx="3" fill="white" stroke="#c0c0c0" stroke-width="1"/>
  <rect x="520" y="140" width="10" height="120" rx="3" fill="white" stroke="#c0c0c0" stroke-width="1"/>
  <rect x="520" y="250" width="120" height="10" rx="3" fill="white" stroke="#c0c0c0" stroke-width="1"/>
  <!-- Legs -->
  <rect x="525" y="150" width="6" height="120" rx="2" fill="#c0c0c0" opacity="0.5"/>
  <rect x="694" y="150" width="6" height="120" rx="2" fill="#c0c0c0" opacity="0.5"/>
  <rect x="525" y="260" width="6" height="40" rx="2" fill="#c0c0c0" opacity="0.5"/>
  <rect x="634" y="260" width="6" height="40" rx="2" fill="#c0c0c0" opacity="0.5"/>
  <!-- Drawers -->
  <rect x="640" y="155" width="55" height="25" rx="4" fill="white" stroke="#d0d0d0" stroke-width="1"/>
  <rect x="640" y="185" width="55" height="25" rx="4" fill="white" stroke="#d0d0d0" stroke-width="1"/>
  <rect x="640" y="215" width="55" height="25" rx="4" fill="white" stroke="#d0d0d0" stroke-width="1"/>
  <!-- Monitor on desk -->
  <rect x="555" y="110" width="50" height="30" rx="3" fill="#2d3436" opacity="0.3"/>
  <rect x="575" y="140" width="10" height="5" rx="1" fill="#2d3436" opacity="0.2"/>
  <!-- USB symbol -->
  <circle cx="620" cy="135" r="8" fill="#4a90d9" opacity="0.3"/>
  <text x="620" y="139" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">USB</text>

  <!-- Choix Amazon -->
  <rect x="560" y="310" width="160" height="30" rx="8" fill="#232f3e" opacity="0.8"/>
  <text x="640" y="330" font-family="Arial, sans-serif" font-size="12" fill="#f39c12" text-anchor="middle" font-weight="bold">Choix d'Amazon</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#c0c0c0"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#b0b0b0" text-anchor="middle">bonsplansmania.fr — Amazon</text>
</svg>