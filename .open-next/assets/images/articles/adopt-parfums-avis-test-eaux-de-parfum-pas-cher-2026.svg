<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A148C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6A1B9A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BA68C8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="80" r="220" fill="white" fill-opacity="0.04" />
  <circle cx="100" cy="560" r="180" fill="white" fill-opacity="0.04" />

  <!-- Site badge -->
  <rect x="80" y="60" width="220" height="44" rx="22" fill="white" fill-opacity="0.12" />
  <text x="190" y="88" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">BonsPlansMania.fr</text>

  <!-- Category badge -->
  <rect x="80" y="128" width="200" height="36" rx="18" fill="url(#badge)" />
  <text x="180" y="152" font-family="Arial, sans-serif" font-size="16" fill="#3E2723" text-anchor="middle" font-weight="700">TEST PRODUIT</text>

  <!-- Title -->
  <text x="80" y="248" font-family="Georgia, serif" font-size="42" fill="white" font-weight="400" fill-opacity="0.8">On a teste</text>
  <text x="80" y="348" font-family="Georgia, serif" font-size="100" fill="white" font-weight="700">Adopt'</text>

  <rect x="80" y="370" width="100" height="3" rx="2" fill="#FFD700" fill-opacity="0.8" />

  <text x="80" y="418" font-family="Arial, sans-serif" font-size="30" fill="#FFD700" fill-opacity="0.95" font-weight="600">Eaux de Parfum · Des 11,95€</text>

  <!-- Details -->
  <rect x="80" y="444" width="740" height="64" rx="12" fill="white" fill-opacity="0.08" />
  <text x="100" y="470" font-family="Arial, sans-serif" font-size="19" fill="white" fill-opacity="0.85">Wonderful · Fairy Land · Bahia Samba · Midnight for Her</text>
  <text x="100" y="496" font-family="Arial, sans-serif" font-size="22" fill="#FFD700" font-weight="700">4,4/5 · 14 000+ avis · 100+ fragrances · Made in France</text>

  <!-- Price badge -->
  <rect x="80" y="530" width="200" height="50" rx="25" fill="#FFD700" />
  <text x="180" y="562" font-family="Georgia, serif" font-size="26" fill="#4A148C" text-anchor="middle" font-weight="700">Des 11,95€</text>

  <text x="300" y="562" font-family="Arial, sans-serif" font-size="20" fill="white" fill-opacity="0.8">Eau de parfum 30 mL</text>

  <text x="80" y="606" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.6">Avril 2026 · Parfumerie francaise · 4 parfums testes</text>
