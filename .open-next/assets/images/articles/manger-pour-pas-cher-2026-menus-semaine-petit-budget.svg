  <text x="970" y="270" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.7" text-anchor="middle">par personne par repas</text>
  <line x1="870" y1="300" x2="1070" y2="300" stroke="white" stroke-opacity="0.15"/>
  <text x="970" y="340" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.9" text-anchor="middle">50€ la semaine</text>
