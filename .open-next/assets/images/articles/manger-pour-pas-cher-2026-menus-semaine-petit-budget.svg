  <text x="165" y="123" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">BON PLAN</text>
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white">Manger pour Pas Cher</text>
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="22" fill="white" fill-opacity="0.9">Menus de la semaine à moins</text>
  <text x="100" y="270" font-family="Arial, sans-serif" font-size="22" fill="white" fill-opacity="0.9">de 3€ par personne et par repas</text>
  <rect x="100" y="315" width="560" height="1" fill="white" fill-opacity="0.2"/>
