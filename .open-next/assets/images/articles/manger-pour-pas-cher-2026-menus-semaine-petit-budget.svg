  <text x="100" y="420" font-family="Arial, sans-serif" font-size="17" fill="white" fill-opacity="0.8">Les aliments les moins chers et les plus nutritifs</text>
  <rect x="100" y="470" width="200" height="50" rx="25" fill="#B45309"/>
  <text x="200" y="501" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">Voir les menus</text>
