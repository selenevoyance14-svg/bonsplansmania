<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- Brand name -->
  <text x="400" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#212121" text-anchor="middle" letter-spacing="4">MiiN COSMETICS</text>
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="14" fill="#757575" text-anchor="middle" letter-spacing="2">BEAUTE COREENNE</text>
  <!-- Central offer box -->
  <rect x="150" y="120" width="500" height="220" rx="16" fill="white" opacity="0.95"/>
  <rect x="150" y="120" width="500" height="60" rx="16" fill="#212121"/>
  <rect x="150" y="160" width="500" height="20" fill="#212121"/>
  <text x="400" y="158" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">CODE NOUVEAUX CLIENTS</text>
  <!-- Code -->
  <rect x="250" y="200" width="300" height="50" rx="8" fill="#f5f5f5" stroke="#212121" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="233" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#212121" text-anchor="middle" letter-spacing="3">NEWMIIN10</text>
  <!-- Discount -->
  <text x="400" y="290" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#e91e63" text-anchor="middle">-10 euros</text>
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="16" fill="#616161" text-anchor="middle">des 40 euros d'achat</text>
  <!-- Footer info -->
  <text x="400" y="390" font-family="Arial, sans-serif" font-size="14" fill="#9e9e9e" text-anchor="middle">Premiere commande uniquement</text>
  <text x="400" y="415" font-family="Arial, sans-serif" font-size="13" fill="#9e9e9e" text-anchor="middle">Valable jusqu'au 31 janvier 2027</text>
  <!-- K-beauty accent dots -->
  <circle cx="180" cy="400" r="4" fill="#e91e63" opacity="0.3"/>
  <circle cx="200" cy="410" r="3" fill="#e91e63" opacity="0.2"/>
  <circle cx="620" cy="400" r="4" fill="#e91e63" opacity="0.3"/>
  <circle cx="600" cy="410" r="3" fill="#e91e63" opacity="0.2"/>
</svg>
