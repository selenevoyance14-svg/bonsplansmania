<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5efe6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8ddd0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Badge BON PLAN -->
  <rect x="40" y="25" width="160" height="36" rx="18" fill="#2d2d2d"/>
  <text x="120" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">BON PLAN</text>

  <!-- Brand -->
  <text x="40" y="110" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#2d2d2d">Timberland</text>

  <!-- Discount -->
  <rect x="40" y="130" width="220" height="50" rx="10" fill="#8b5e3c"/>
  <text x="150" y="163" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">JUSQU'A -55%</text>

  <!-- Features -->
  <text font-family="Arial, sans-serif" font-size="15" fill="#555">
    <tspan x="40" y="225">&#x2714; Boots classiques cuir premium</tspan>
    <tspan x="40" y="251">&#x2714; Chaussures bateau printemps</tspan>
    <tspan x="40" y="277">&#x2714; Qualite intemporelle</tspan>
  </text>

  <!-- Expedition badge -->
  <rect x="40" y="305" width="200" height="35" rx="8" fill="#2d2d2d"/>
  <text x="140" y="328" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">EXPEDITION 72H</text>

  <!-- Boot illustration (right side) -->
  <!-- Boot sole -->
  <ellipse cx="600" cy="320" rx="80" ry="20" fill="#ddd" opacity="0.5"/>

  <!-- Boot body -->
  <path d="M540,310 L540,180 Q540,160 560,155 L640,155 Q660,160 660,180 L660,310 Q660,325 640,330 L560,330 Q540,325 540,310 Z" fill="#c8864a"/>
  <!-- Boot toe -->
  <path d="M530,310 L540,310 L540,330 Q540,340 555,340 L645,340 Q660,340 660,330 L660,310 L670,310 Q680,310 680,320 L680,340 Q680,355 665,355 L535,355 Q520,355 520,340 L520,320 Q520,310 530,310 Z" fill="#b87840"/>
  <!-- Boot sole bottom -->
  <rect x="518" y="350" width="164" height="15" rx="6" fill="white"/>
  <rect x="518" y="360" width="164" height="8" rx="4" fill="#ddd"/>
  <!-- Boot laces -->
  <line x1="580" y1="170" x2="620" y2="170" stroke="#5a3a1a" stroke-width="2"/>
  <line x1="580" y1="185" x2="620" y2="185" stroke="#5a3a1a" stroke-width="2"/>
  <line x1="580" y1="200" x2="620" y2="200" stroke="#5a3a1a" stroke-width="2"/>
  <line x1="580" y1="215" x2="620" y2="215" stroke="#5a3a1a" stroke-width="2"/>
  <line x1="580" y1="230" x2="620" y2="230" stroke="#5a3a1a" stroke-width="2"/>
  <!-- Boot collar -->
  <rect x="535" y="155" width="130" height="12" rx="4" fill="#b87840"/>
  <!-- Lace hooks -->
  <circle cx="578" cy="170" r="3" fill="#8b5e3c"/>
  <circle cx="622" cy="170" r="3" fill="#8b5e3c"/>
  <circle cx="578" cy="185" r="3" fill="#8b5e3c"/>
  <circle cx="622" cy="185" r="3" fill="#8b5e3c"/>
  <circle cx="578" cy="200" r="3" fill="#8b5e3c"/>
  <circle cx="622" cy="200" r="3" fill="#8b5e3c"/>

  <!-- Discount sticker -->
  <circle cx="710" cy="180" r="35" fill="#e53935"/>
  <text x="710" y="176" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">-55%</text>
  <text x="710" y="195" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">max</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#c8b8a0"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#999" text-anchor="middle">bonsplansmania.fr — Timberland, vente flash</text>
</svg>
