<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2a48;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8e038;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0c830;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Diagonal accent stripes -->
  <polygon points="0,350 100,450 0,450" fill="#c8e038" opacity="0.1"/>
  <polygon points="700,0 800,0 800,100" fill="#c8e038" opacity="0.08"/>

  <!-- Badge -->
  <rect x="40" y="25" width="160" height="36" rx="18" fill="url(#accent)"/>
  <text x="120" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0a1628" text-anchor="middle" letter-spacing="1">BON PLAN</text>

  <!-- ManoMano brand -->
  <text x="40" y="105" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="white">ManoMano</text>
  <text x="40" y="150" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#c8e038">Days</text>

  <!-- Discounts -->
  <text x="40" y="195" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">
    <tspan fill="#c8e038">-30%</tspan>
    <tspan fill="#aaa">  </tspan>
    <tspan fill="#c8e038">-40%</tspan>
    <tspan fill="#aaa">  </tspan>
    <tspan fill="#c8e038">-50%</tspan>
  </text>

  <!-- Features -->
  <text font-family="Arial, sans-serif" font-size="14" fill="#ccc">
    <tspan x="40" y="240">&#x2714; Karcher : robots, nettoyeurs -30%</tspan>
    <tspan x="40" y="264">&#x2714; Outsunny : jardin et exterieur -20%</tspan>
    <tspan x="40" y="288">&#x2714; Grohe, DeWalt, Scheppach, Practixx</tspan>
    <tspan x="40" y="312">&#x2714; Tondeuses, parasols, mobilier jardin</tspan>
  </text>

  <!-- Timer -->
  <rect x="40" y="340" width="250" height="40" rx="8" fill="rgba(200,224,56,0.15)" stroke="#c8e038" stroke-width="1.5"/>
  <text x="165" y="366" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c8e038" text-anchor="middle">OFFRE LIMITEE DANS LE TEMPS</text>

  <!-- Tool illustrations (right side) -->
  <!-- Karcher-style pressure washer -->
  <rect x="530" y="80" width="60" height="120" rx="8" fill="#f5c800"/>
  <rect x="540" y="90" width="40" height="30" rx="4" fill="#333"/>
  <rect x="555" y="60" width="10" height="25" rx="3" fill="#666"/>
  <line x1="560" y1="60" x2="600" y2="40" stroke="#666" stroke-width="3" stroke-linecap="round"/>
  <rect x="535" y="200" width="50" height="15" rx="4" fill="#444"/>
  <text x="560" y="175" font-family="Arial, sans-serif" font-size="8" fill="#333" text-anchor="middle" font-weight="bold">KARCHER</text>

  <!-- Drill -->
  <rect x="640" y="100" width="45" height="70" rx="6" fill="#e8c020"/>
  <rect x="655" y="70" width="15" height="35" rx="4" fill="#333"/>
  <circle cx="662" cy="75" r="4" fill="#666"/>
  <rect x="659" y="40" width="6" height="35" rx="2" fill="#999"/>
  <text x="662" y="150" font-family="Arial, sans-serif" font-size="7" fill="#333" text-anchor="middle" font-weight="bold">DeWalt</text>

  <!-- Garden parasol -->
  <line x1="730" y1="130" x2="730" y2="300" stroke="#8a6a4a" stroke-width="4"/>
  <path d="M670,130 Q730,80 790,130 Z" fill="#3a7a3a" opacity="0.7"/>
  <rect x="710" y="295" width="40" height="8" rx="3" fill="#666"/>

  <!-- Discount badges on products -->
  <circle cx="525" cy="85" r="18" fill="#c8e038"/>
  <text x="525" y="89" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0a1628" text-anchor="middle">-30%</text>

  <circle cx="690" cy="95" r="16" fill="#c8e038"/>
  <text x="690" y="99" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0a1628" text-anchor="middle">-50%</text>

  <!-- Footer -->
  <rect x="40" y="410" width="720" height="1" fill="#2a3a58"/>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="13" fill="#666" text-anchor="middle">bonsplansmania.fr — ManoMano Days, offre limitee</text>
</svg>
