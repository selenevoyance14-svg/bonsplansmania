<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Badge -->
  <rect x="40" y="25" width="300" height="36" rx="18" fill="url(#badge)"/>
  <text x="190" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">N1 MEILLEURE VENTE AMAZON</text>

  <!-- Brand -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">YOLEO</text>
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.7">Banc de musculation reglable inclinable</text>

  <!-- Price -->
  <rect x="40" y="165" width="200" height="65" rx="12" fill="white" fill-opacity="0.08" stroke="#e67e22" stroke-width="2"/>
  <text x="55" y="190" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.5"><tspan text-decoration="line-through">84,97E</tspan></text>
  <text x="155" y="195" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#e67e22">67,68E</text>
  <text x="140" y="220" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" text-anchor="middle" font-weight="bold">-20%</text>

  <!-- Rating -->
  <text x="260" y="190" font-family="Arial, sans-serif" font-size="15" fill="#f39c12" font-weight="bold">4,5/5</text>
  <text x="260" y="210" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.6">(5 971 avis)</text>
  <text x="260" y="230" font-family="Arial, sans-serif" font-size="12" fill="#e67e22" font-weight="bold">300+ achetes/mois</text>

  <!-- Specs -->
  <text x="40" y="275" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.8">
    <tspan x="40" dy="0">Entrainement complet du corps</tspan>
    <tspan x="40" dy="24">Inclinable multi-positions - Pliable</tspan>
    <tspan x="40" dy="24">Domicile/bureau - Livraison gratuite Prime</tspan>
  </text>

  <!-- Bench illustration (right side) -->
  <!-- Seat -->
  <rect x="540" y="200" width="120" height="18" rx="4" fill="#333" stroke="#555" stroke-width="1" transform="rotate(-15 600 209)"/>
  <rect x="640" y="160" width="80" height="18" rx="4" fill="#333" stroke="#555" stroke-width="1" transform="rotate(-40 680 169)"/>
  <!-- Frame legs -->
  <line x1="550" y1="220" x2="540" y2="300" stroke="#555" stroke-width="4"/>
  <line x1="650" y1="200" x2="660" y2="300" stroke="#555" stroke-width="4"/>
  <line x1="700" y1="160" x2="720" y2="300" stroke="#555" stroke-width="3"/>
  <!-- Base -->
  <line x1="520" y1="300" x2="740" y2="300" stroke="#555" stroke-width="3"/>
  <!-- Red accent -->
  <line x1="540" y1="198" x2="660" y2="198" stroke="#e74c3c" stroke-width="2" opacity="0.5"/>
  <!-- Foot pads -->
  <rect x="545" y="290" width="30" height="8" rx="3" fill="#444"/>
  <rect x="700" y="290" width="30" height="8" rx="3" fill="#444"/>

  <!-- Footer -->
  <rect x="40" y="408" width="720" height="1" fill="white" opacity="0.05"/>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.2" text-anchor="middle">bonsplansmania.fr — Amazon</text>
</svg>