<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
  </defs>
  <!-- Fond bleu tech -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Maison en arrière-plan -->
  <polygon points="400,50 250,150 550,150" fill="#90CAF9" opacity="0.3"/>
  <rect x="270" y="150" width="260" height="180" rx="4" fill="#90CAF9" opacity="0.2"/>
  <rect x="340" y="200" width="50" height="70" rx="3" fill="#BBDEFB" opacity="0.4"/>
  <!-- Caméra Blink Outdoor -->
  <rect x="180" y="120" width="100" height="130" rx="14" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <rect x="180" y="120" width="100" height="40" rx="14" fill="#1A1A2E"/>
  <rect x="180" y="145" width="100" height="15" rx="0" fill="#1A1A2E"/>
  <!-- Objectif caméra -->
  <circle cx="230" cy="145" r="20" fill="#333"/>
  <circle cx="230" cy="145" r="14" fill="#1A1A2E"/>
  <circle cx="230" cy="145" r="7" fill="#444"/>
  <circle cx="226" cy="141" r="2.5" fill="#666"/>
  <!-- LED status -->
  <circle cx="255" cy="128" r="3" fill="#2196F3" opacity="0.7"/>
  <!-- Support caméra -->
  <rect x="215" y="250" width="30" height="40" rx="4" fill="#F0F0F0"/>
  <ellipse cx="230" cy="290" rx="30" ry="8" fill="#E0E0E0"/>
  <!-- Sonnette vidéo -->
  <rect x="520" y="100" width="60" height="160" rx="30" fill="#1A1A2E" stroke="#333" stroke-width="2"/>
  <!-- Objectif sonnette -->
  <circle cx="550" cy="155" r="14" fill="#333"/>
  <circle cx="550" cy="155" r="9" fill="#222"/>
  <circle cx="550" cy="155" r="4" fill="#444"/>
  <!-- Bouton sonnette -->
  <circle cx="550" cy="210" r="10" fill="#333" stroke="#555" stroke-width="1.5"/>
  <circle cx="550" cy="210" r="6" fill="#444"/>
  <!-- Signal WiFi au-dessus -->
  <path d="M350 90 Q400 60 450 90" fill="none" stroke="#2196F3" stroke-width="1.5" opacity="0.3"/>
  <path d="M360 100 Q400 75 440 100" fill="none" stroke="#2196F3" stroke-width="1.5" opacity="0.4"/>
  <path d="M370 110 Q400 90 430 110" fill="none" stroke="#2196F3" stroke-width="1.5" opacity="0.5"/>
  <!-- Badge -40% -->
  <circle cx="700" cy="80" r="45" fill="#F44336"/>
  <text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF">-40%</text>
  <text x="700" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFCDD2">39,99€</text>
  <!-- Badge Choix Amazon -->
  <rect x="30" y="60" width="130" height="40" rx="8" fill="#FF9800"/>
  <text x="95" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">Choix d'Amazon</text>
  <text x="95" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFF3E0">Offre limitée</text>
  <!-- Titre -->
  <rect x="120" y="350" width="560" height="70" rx="10" fill="rgba(25,118,210,0.85)"/>
  <text x="400" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="19" fill="#FFFFFF">Blink Outdoor 4 + Sonnette Vidéo</text>
  <text x="400" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#BBDEFB">Caméra HD sans fil — 2 ans d'autonomie — Sync Module</text>
</svg>
