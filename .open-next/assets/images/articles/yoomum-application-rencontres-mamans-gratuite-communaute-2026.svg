<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef0f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0e6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e75480;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f48fb1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative hearts -->
  <text x="680" y="60" font-size="30" opacity="0.15">&#x2665;</text>
  <text x="720" y="120" font-size="20" opacity="0.1">&#x2665;</text>
  <text x="100" y="420" font-size="25" opacity="0.1">&#x2665;</text>

  <!-- Decorative circles -->
  <circle cx="700" cy="380" r="70" fill="#f48fb1" opacity="0.1"/>
  <circle cx="60" cy="60" r="40" fill="#ce93d8" opacity="0.1"/>

  <!-- Badge -->
  <rect x="40" y="25" width="200" height="36" rx="18" fill="url(#badge)"/>
  <text x="140" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">BON PLAN GRATUIT</text>

  <!-- Main title -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#2d2d2d">YooMum!</text>
  <text x="40" y="155" font-family="Arial, sans-serif" font-size="22" fill="#555">L'appli qui connecte les</text>
  <text x="40" y="185" font-family="Arial, sans-serif" font-size="22" fill="#555">futures et jeunes mamans</text>

  <!-- Features -->
  <text x="40" y="240" font-family="Arial, sans-serif" font-size="15" fill="#444">
    <tspan x="40" dy="0">&#x2714; 100% gratuite, sans abonnement</tspan>
    <tspan x="40" dy="26">&#x2714; Mamans pres de chez vous</tspan>
    <tspan x="40" dy="26">&#x2714; Echanges, sorties, entraide</tspan>
    <tspan x="40" dy="26">&#x2714; Communaute bienveillante</tspan>
    <tspan x="40" dy="26">&#x2714; Adossee a La Boite Rose</tspan>
  </text>

  <!-- Phone illustration -->
  <rect x="530" y="60" width="180" height="320" rx="24" fill="url(#phone)"/>
  <rect x="540" y="80" width="160" height="280" rx="16" fill="white"/>

  <!-- Phone screen content -->
  <rect x="540" y="80" width="160" height="50" rx="16" fill="#e75480"/>
  <text x="620" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">YooMum!</text>

  <!-- Profile cards on phone -->
  <rect x="555" y="145" width="130" height="45" rx="8" fill="#fef0f5" stroke="#f48fb1" stroke-width="1"/>
  <circle cx="575" cy="167" r="12" fill="#f48fb1" opacity="0.4"/>
  <rect x="595" y="157" width="70" height="8" rx="4" fill="#ddd"/>
  <rect x="595" y="170" width="50" height="6" rx="3" fill="#eee"/>

  <rect x="555" y="200" width="130" height="45" rx="8" fill="#f0e6ff" stroke="#ce93d8" stroke-width="1"/>
  <circle cx="575" cy="222" r="12" fill="#ce93d8" opacity="0.4"/>
  <rect x="595" y="212" width="70" height="8" rx="4" fill="#ddd"/>
  <rect x="595" y="225" width="50" height="6" rx="3" fill="#eee"/>

  <rect x="555" y="255" width="130" height="45" rx="8" fill="#fff5e6" stroke="#ffb74d" stroke-width="1"/>
  <circle cx="575" cy="277" r="12" fill="#ffb74d" opacity="0.4"/>
  <rect x="595" y="267" width="70" height="8" rx="4" fill="#ddd"/>
  <rect x="595" y="280" width="50" height="6" rx="3" fill="#eee"/>

  <!-- Connection lines between cards -->
  <line x1="690" y1="167" x2="720" y2="145" stroke="#f48fb1" stroke-width="1.5" opacity="0.3"/>
  <line x1="690" y1="222" x2="730" y2="222" stroke="#ce93d8" stroke-width="1.5" opacity="0.3"/>
  <line x1="690" y1="277" x2="720" y2="300" stroke="#ffb74d" stroke-width="1.5" opacity="0.3"/>
  <circle cx="720" cy="145" r="4" fill="#f48fb1" opacity="0.4"/>
  <circle cx="730" cy="222" r="4" fill="#ce93d8" opacity="0.4"/>
  <circle cx="720" cy="300" r="4" fill="#ffb74d" opacity="0.4"/>

  <!-- Phone notch -->
  <rect x="590" y="62" width="60" height="12" rx="6" fill="#1a1a1a"/>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#f0d0e0"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#999" text-anchor="middle">bonsplansmania.fr — Application gratuite via La Boite Rose</text>
</svg>
