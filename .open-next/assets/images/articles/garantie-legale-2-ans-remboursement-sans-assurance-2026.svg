<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9F1239;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F43F5E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE4E6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05)" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="960" cy="120" r="180" fill="white" fill-opacity="0.05"/>
  <circle cx="1060" cy="490" r="130" fill="white" fill-opacity="0.04"/>
  <rect x="60" y="60" width="700" height="510" rx="24" fill="url(#card)" stroke="white" stroke-opacity="0.2"/>
  <rect x="100" y="100" width="200" height="36" rx="18" fill="#E11D48"/>
  <text x="200" y="123" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">DROITS CONSOMMATEUR</text>
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="white">Garantie Légale 2 Ans</text>
  <text x="100" y="235" font-family="Arial, sans-serif" font-size="22" fill="white" fill-opacity="0.9">Comment te faire rembourser</text>
  <text x="100" y="265" font-family="Arial, sans-serif" font-size="22" fill="white" fill-opacity="0.9">sans payer d'assurance</text>
  <rect x="100" y="310" width="560" height="1" fill="white" fill-opacity="0.2"/>
  <text x="100" y="355" font-family="Arial, sans-serif" font-size="17" fill="white" fill-opacity="0.8">Tous les achats neufs sont couverts 2 ans</text>
  <text x="100" y="385" font-family="Arial, sans-serif" font-size="17" fill="white" fill-opacity="0.8">C'est le vendeur qui doit prouver, pas toi</text>
  <text x="100" y="415" font-family="Arial, sans-serif" font-size="17" fill="white" fill-opacity="0.8">Les phrases magiques à utiliser au SAV</text>
  <text x="100" y="445" font-family="Arial, sans-serif" font-size="17" fill="white" fill-opacity="0.8">Extensions de garantie souvent inutiles</text>
  <rect x="100" y="490" width="220" height="50" rx="25" fill="#E11D48"/>
  <text x="210" y="521" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">Connaître mes droits</text>
  <rect x="820" y="180" width="300" height="280" rx="20" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2"/>
  <text x="970" y="235" font-family="Arial, sans-serif" font-size="54" font-weight="900" fill="#FDE68A" text-anchor="middle">2 ans</text>
  <text x="970" y="270" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.7" text-anchor="middle">de protection gratuite</text>
  <line x1="870" y1="300" x2="1070" y2="300" stroke="white" stroke-opacity="0.15"/>
  <text x="970" y="340" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.9" text-anchor="middle">30 jours max</text>
  <text x="970" y="365" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.6" text-anchor="middle">pour réparer ou remplacer</text>
  <line x1="870" y1="390" x2="1070" y2="390" stroke="white" stroke-opacity="0.15"/>
  <text x="970" y="425" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.9" text-anchor="middle">Article L217-4</text>
  <text x="970" y="450" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.6" text-anchor="middle">Code de la consommation</text>
  <text x="1140" y="600" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.4" text-anchor="end">bonsplansmania.fr</text>
