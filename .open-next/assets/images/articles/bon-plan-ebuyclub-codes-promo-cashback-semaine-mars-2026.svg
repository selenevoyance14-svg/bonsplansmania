  <text x="112" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#red)">-15%</text>
  <text x="112" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e88e5">+4% cashback</text>

  <rect x="215" y="215" width="175" height="75" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="302" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Emma Matelas</text>
  <text x="302" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#red)">-10%</text>
  <text x="302" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e88e5">+10% cashback</text>

  <rect x="410" y="215" width="165" height="75" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="492" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Dyson</text>
  <text x="492" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#blue)">2%</text>
  <text x="492" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#888">au lieu de 0.2%</text>

  <rect x="595" y="215" width="175" height="75" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="682" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Stylevana</text>
  <text x="682" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#red)">-15%</text>
  <text x="682" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e88e5">+2.9% cashback</text>

  <!-- Bottom banner -->
