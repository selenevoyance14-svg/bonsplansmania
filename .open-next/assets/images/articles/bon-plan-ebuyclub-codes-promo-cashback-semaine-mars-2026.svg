  <text x="400" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">CODE PROMO + CASHBACK = DOUBLE ECONOMIE</text>

  <!-- Extra brands list -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#777">Shark -10% -- Olight -10% -- Kiko 5% -- Pull&amp;Bear 5% -- Fnac 5% -- Mango 1.5%</text>
  <text x="400" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999">Inscription gratuite -- Cashback reel en euros</text>
</svg>