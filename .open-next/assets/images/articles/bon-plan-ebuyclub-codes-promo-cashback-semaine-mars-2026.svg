  <text x="210" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">CODES PROMO</text>

  <!-- Promo cards -->
  <rect x="30" y="125" width="165" height="75" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="112" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Nocibe</text>
  <text x="112" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#red)">-20%</text>
  <text x="112" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e88e5">+5.5% cashback</text>

  <rect x="215" y="125" width="175" height="75" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="302" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Carrefour</text>
  <text x="302" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#red)">-20E</text>
  <text x="302" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1e88e5">+3.5E cashback</text>

  <!-- Cashback section -->
  <rect x="410" y="85" width="360" height="30" rx="6" fill="url(#blue)"/>
  <text x="590" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">CASHBACK</text>

  <!-- Cashback cards -->
  <rect x="410" y="125" width="165" height="75" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="492" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Temu</text>
  <text x="492" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#blue)">24%</text>
  <text x="492" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#888">au lieu de 0.8%</text>

  <rect x="595" y="125" width="175" height="75" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="682" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Smartbox</text>
