<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#43A047"/>
    </linearGradient>
  </defs>
  <!-- Fond vert jardin -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Ciel -->
  <circle cx="680" cy="70" r="35" fill="#FFF9C4" opacity="0.5"/>
  <!-- Pelouse -->
  <rect x="0" y="300" width="800" height="150" fill="url(#grass)" opacity="0.3"/>
  <!-- Tracteur tondeuse simplifié -->
  <!-- Corps principal -->
  <rect x="250" y="160" width="250" height="100" rx="10" fill="#333"/>
  <!-- Capot moteur -->
  <rect x="460" y="150" width="100" height="80" rx="8" fill="#2E7D32"/>
  <rect x="470" y="158" width="80" height="10" rx="2" fill="#1B5E20" opacity="0.5"/>
  <rect x="470" y="173" width="80" height="10" rx="2" fill="#1B5E20" opacity="0.5"/>
  <!-- Siège -->
  <rect x="300" y="115" width="60" height="50" rx="8" fill="#444"/>
  <rect x="305" y="100" width="50" height="20" rx="6" fill="#444"/>
  <!-- Volant -->
  <circle cx="400" cy="155" r="18" fill="none" stroke="#555" stroke-width="4"/>
  <rect x="397" y="155" width="6" height="25" rx="2" fill="#555"/>
  <!-- Roue arrière grande -->
  <circle cx="310" cy="280" r="45" fill="#222"/>
  <circle cx="310" cy="280" r="35" fill="#333"/>
  <circle cx="310" cy="280" r="10" fill="#555"/>
  <!-- Roue avant -->
  <circle cx="510" cy="280" r="30" fill="#222"/>
  <circle cx="510" cy="280" r="22" fill="#333"/>
  <circle cx="510" cy="280" r="7" fill="#555"/>
  <!-- Lignes de coupe sur la pelouse -->
  <rect x="0" y="320" width="800" height="3" fill="#4CAF50" opacity="0.3"/>
  <rect x="0" y="340" width="800" height="3" fill="#4CAF50" opacity="0.3"/>
  <rect x="0" y="360" width="800" height="3" fill="#4CAF50" opacity="0.3"/>
  <!-- Badge -15% -->
  <circle cx="700" cy="80" r="45" fill="#F44336"/>
  <text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF">-15%</text>
  <text x="700" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFCDD2">1 529€</text>
  <!-- Badge surface -->
  <rect x="30" y="60" width="130" height="40" rx="8" fill="#2E7D32"/>
  <text x="95" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">4 500 m²</text>
  <text x="95" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#C8E6C9">Largeur 98 cm</text>
  <!-- Titre -->
  <rect x="120" y="360" width="560" height="70" rx="10" fill="rgba(46,125,50,0.85)"/>
  <text x="400" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="19" fill="#FFFFFF">Alpina AT3 98 A Tracteur Tondeuse</text>
  <text x="400" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#C8E6C9">6,5 kW — Éjection latérale — Kit Mulching inclus</text>
</svg>
