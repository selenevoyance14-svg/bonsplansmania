<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ede0f5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b1fa2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c1580;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amazon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e68a00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Watch illustration -->
  <g transform="translate(280, 40)">
    <!-- Watch band top -->
    <rect x="85" y="0" width="70" height="50" rx="8" fill="url(#purple)" opacity="0.8"/>
    <!-- Watch body -->
    <rect x="60" y="45" width="120" height="140" rx="18" fill="url(#dark)"/>
    <!-- Screen -->
    <rect x="70" y="55" width="100" height="120" rx="12" fill="#1a1a3e"/>
    <!-- Time display -->
    <text x="120" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">10:28</text>
    <text x="120" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#aaa">WED 28</text>
    <!-- Stats on screen -->
    <text x="88" y="135" font-family="Arial, sans-serif" font-size="8" fill="#e040fb">785</text>
    <text x="115" y="135" font-family="Arial, sans-serif" font-size="8" fill="#66bb6a">16358</text>
    <text x="88" y="150" font-family="Arial, sans-serif" font-size="7" fill="#aaa">cal</text>
    <text x="115" y="150" font-family="Arial, sans-serif" font-size="7" fill="#aaa">pas</text>
    <!-- Watch band bottom -->
    <rect x="85" y="180" width="70" height="50" rx="8" fill="url(#purple)" opacity="0.8"/>
  </g>

  <!-- Promo badge -->
  <rect x="500" y="60" width="220" height="100" rx="12" fill="url(#amazon)"/>
  <text x="610" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">-57%</text>
  <text x="610" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.9">Offre a duree limitee</text>
  <text x="610" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.7">Amazon</text>

  <!-- Price -->
  <g transform="translate(500, 185)">
    <text x="110" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999" text-decoration="line-through">59,99E</text>
    <text x="110" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#c62828">25,99E</text>
  </g>

  <!-- Brand -->
  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" letter-spacing="3">IOWODO</text>

  <!-- Features -->
  <g transform="translate(100, 310)">
    <rect x="0" y="0" width="140" height="30" rx="15" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Appel Bluetooth</text>
  </g>
  <g transform="translate(260, 310)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Cardio + SpO2</text>
  </g>
  <g transform="translate(400, 310)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Etanche IP68</text>
  </g>
  <g transform="translate(540, 310)">
    <rect x="0" y="0" width="140" height="30" rx="15" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">100+ modes sport</text>
  </g>

  <!-- Rating -->
  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#d4a017">***** 4,9/5 (125 avis)</text>

  <!-- Bottom -->
  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Ecran 1.91" LCD -- Android et iOS -- Livraison gratuite</text>
</svg>