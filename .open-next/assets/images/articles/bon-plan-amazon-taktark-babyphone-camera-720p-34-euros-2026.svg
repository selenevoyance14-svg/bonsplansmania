<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F4FD"/>
      <stop offset="100%" stop-color="#D0E8F8"/>
    </linearGradient>
  </defs>
  <!-- Fond bleu bébé -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Étoiles et lune déco -->
  <circle cx="650" cy="60" r="25" fill="#FFF9C4" opacity="0.5"/>
  <circle cx="660" cy="50" r="20" fill="url(#bg)"/>
  <circle cx="150" cy="80" r="3" fill="#FFF9C4" opacity="0.4"/>
  <circle cx="200" cy="50" r="2" fill="#FFF9C4" opacity="0.4"/>
  <circle cx="550" cy="40" r="2.5" fill="#FFF9C4" opacity="0.3"/>
  <circle cx="720" cy="100" r="2" fill="#FFF9C4" opacity="0.3"/>
  <!-- Moniteur parent -->
  <rect x="300" y="100" width="140" height="180" rx="12" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <!-- Écran -->
  <rect x="315" y="115" width="110" height="90" rx="6" fill="#1A1A3E"/>
  <!-- Bébé sur l'écran (simplifié) -->
  <circle cx="370" cy="150" r="15" fill="#FDDCB5"/>
  <ellipse cx="370" cy="170" rx="20" ry="12" fill="#FFE4E1"/>
  <!-- Vision nocturne indicator -->
  <circle cx="408" cy="125" r="4" fill="#4CAF50"/>
  <!-- Boutons sous l'écran -->
  <circle cx="345" cy="225" r="6" fill="#E0E0E0"/>
  <circle cx="370" cy="225" r="6" fill="#E0E0E0"/>
  <circle cx="395" cy="225" r="6" fill="#E0E0E0"/>
  <!-- Pied du moniteur -->
  <rect x="355" y="280" width="30" height="20" rx="4" fill="#F0F0F0"/>
  <ellipse cx="370" cy="300" rx="30" ry="8" fill="#E8E8E8"/>
  <!-- Caméra -->
  <rect x="520" y="130" width="80" height="100" rx="10" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <!-- Objectif caméra -->
  <circle cx="560" cy="170" r="18" fill="#333"/>
  <circle cx="560" cy="170" r="12" fill="#1A1A3E"/>
  <circle cx="560" cy="170" r="6" fill="#444"/>
  <circle cx="556" cy="166" r="2" fill="#666"/>
  <!-- LED infrarouge -->
  <circle cx="540" cy="145" r="3" fill="#FF4444" opacity="0.6"/>
  <circle cx="580" cy="145" r="3" fill="#FF4444" opacity="0.6"/>
  <!-- Pied caméra -->
  <rect x="550" y="230" width="20" height="30" rx="4" fill="#F0F0F0"/>
  <ellipse cx="560" cy="260" rx="25" ry="7" fill="#E8E8E8"/>
  <!-- Signal sans fil entre les deux -->
  <path d="M460 180 Q480 170 500 180" fill="none" stroke="#4CAF50" stroke-width="1.5" opacity="0.4"/>
  <path d="M455 170 Q480 155 505 170" fill="none" stroke="#4CAF50" stroke-width="1.5" opacity="0.3"/>
  <path d="M450 160 Q480 140 510 160" fill="none" stroke="#4CAF50" stroke-width="1.5" opacity="0.2"/>
  <!-- Badge -51% -->
  <circle cx="700" cy="80" r="45" fill="#2196F3"/>
  <text x="700" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF">-51%</text>
  <text x="700" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E0F0FF">34,28€</text>
  <!-- Badge sans WiFi -->
  <rect x="30" y="60" width="110" height="40" rx="8" fill="#4CAF50"/>
  <text x="85" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#FFFFFF">Sans WiFi</text>
  <text x="85" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#D0FFD0">Plus sécurisé</text>
  <!-- Titre -->
  <rect x="140" y="350" width="520" height="70" rx="10" fill="rgba(33,150,243,0.85)"/>
  <text x="400" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF">TakTark Babyphone Caméra 720p</text>
  <text x="400" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E0F0FF">Vision nocturne — Mode VOX — Zoom 3x</text>
</svg>
