<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B6FCF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B48DE0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4B8F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7CC88A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5DB86A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative elements -->
  <circle cx="950" cy="150" r="180" fill="white" fill-opacity="0.06" />
  <circle cx="200" cy="500" r="140" fill="white" fill-opacity="0.05" />
  <circle cx="1050" cy="450" r="100" fill="white" fill-opacity="0.04" />

  <!-- Flower decorations -->
  <circle cx="1050" cy="280" r="8" fill="#E8D0F8" fill-opacity="0.4" />
  <circle cx="1080" cy="320" r="6" fill="#E8D0F8" fill-opacity="0.3" />
  <circle cx="1020" cy="310" r="5" fill="#E8D0F8" fill-opacity="0.35" />
  <circle cx="100" cy="400" r="7" fill="#E8D0F8" fill-opacity="0.3" />
  <circle cx="130" cy="430" r="5" fill="#E8D0F8" fill-opacity="0.25" />

  <!-- Site badge -->
  <rect x="80" y="60" width="240" height="44" rx="22" fill="white" fill-opacity="0.15" />
  <text x="200" y="88" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">BonsPlansMania.fr</text>

  <!-- Flash badge -->
  <rect x="80" y="130" width="200" height="36" rx="18" fill="url(#badge)" />
  <text x="180" y="154" font-family="Georgia, serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">OFFRE FLASH</text>

  <!-- Main title -->
  <text x="80" y="250" font-family="Georgia, serif" font-size="56" fill="white" font-weight="700">Biotyfull Box</text>
  <text x="80" y="310" font-family="Georgia, serif" font-size="34" fill="white" font-weight="400" fill-opacity="0.92">5 Routines pour 15 euros</text>

  <!-- Divider -->
  <rect x="80" y="335" width="120" height="3" rx="2" fill="white" fill-opacity="0.5" />

  <!-- Price highlight -->
  <circle cx="950" cy="250" r="120" fill="white" fill-opacity="0.12" stroke="white" stroke-opacity="0.2" stroke-width="2" />
  <text x="950" y="240" font-family="Georgia, serif" font-size="80" fill="white" font-weight="700" text-anchor="middle">15</text>
  <text x="950" y="240" font-family="Georgia, serif" font-size="30" fill="white" font-weight="700" text-anchor="middle" dx="55" dy="-20">euros</text>
  <text x="950" y="290" font-family="Arial, sans-serif" font-size="18" fill="white" font-weight="400" text-anchor="middle" fill-opacity="0.85">au lieu de 391 euros</text>

  <!-- Info lines -->
  <rect x="80" y="370" width="500" height="46" rx="10" fill="white" fill-opacity="0.12" />
  <text x="100" y="400" font-family="Arial, sans-serif" font-size="19" fill="white" font-weight="700">14 produits full size - Sans engagement</text>

  <rect x="80" y="430" width="520" height="46" rx="10" fill="white" fill-opacity="0.10" />
  <text x="100" y="460" font-family="Arial, sans-serif" font-size="19" fill="white" font-weight="600">Garancia, Huygens, KOS Paris, Cottan, Glatika...</text>

  <!-- Date -->
  <text x="80" y="540" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7">Avril 2026 - Offre verifiee</text>
</svg>
