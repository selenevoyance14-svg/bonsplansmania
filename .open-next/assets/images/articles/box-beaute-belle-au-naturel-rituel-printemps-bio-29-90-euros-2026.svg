<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF2F8"/>
      <stop offset="50%" style="stop-color:#FCE7F3"/>
      <stop offset="100%" style="stop-color:#FDF2F8"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#DB2777"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#16A34A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Leaf decorations -->
  <g transform="translate(100, 150)" opacity="0.15">
    <ellipse cx="20" cy="0" rx="8" ry="25" fill="#22C55E" transform="rotate(-30, 20, 0)"/>
    <ellipse cx="35" cy="5" rx="8" ry="22" fill="#22C55E" transform="rotate(10, 35, 5)"/>
    <ellipse cx="10" cy="15" rx="7" ry="20" fill="#22C55E" transform="rotate(-50, 10, 15)"/>
  </g>
  <g transform="translate(1050, 180)" opacity="0.12">
    <ellipse cx="20" cy="0" rx="8" ry="25" fill="#22C55E" transform="rotate(30, 20, 0)"/>
    <ellipse cx="5" cy="10" rx="7" ry="22" fill="#22C55E" transform="rotate(-10, 5, 10)"/>
  </g>
  <!-- Box illustration -->
  <g transform="translate(90, 220)" opacity="0.25">
    <rect x="0" y="15" width="120" height="80" rx="6" fill="#D4A574"/>
    <polygon points="0,15 20,0 140,0 120,15" fill="#C4956A"/>
    <rect x="45" y="0" width="30" height="95" rx="0" fill="url(#pink)" opacity="0.3"/>
  </g>
  <!-- Bio badges -->
  <g transform="translate(140, 430)" opacity="0.3">
    <circle cx="0" cy="0" r="22" fill="url(#green)"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="white">BIO</text>
  </g>
  <g transform="translate(200, 440)" opacity="0.25">
    <circle cx="0" cy="0" r="18" fill="url(#green)"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" font-weight="700" fill="white">VEGAN</text>
  </g>
  <!-- Badge BOX BEAUTE -->
  <rect x="410" y="50" width="380" height="50" rx="25" fill="url(#pink)"/>
  <text x="600" y="83" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="white">BOX BEAUTE 100% BIO</text>
  <!-- Brand -->
  <text x="600" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="26" fill="url(#pink)" font-style="italic">Belle au Naturel</text>
  <!-- Main text -->
  <text x="600" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="50" font-weight="900" fill="#1F2937">Rituel de Printemps</text>
  <!-- Price -->
  <text x="600" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="800" fill="url(#pink)">29,90E au lieu de 94E</text>
  <!-- Features -->
  <g transform="translate(220, 370)">
    <rect x="0" y="0" width="155" height="36" rx="18" fill="url(#green)" opacity="0.15"/>
    <text x="78" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#16A34A">Full Size</text>
  </g>
  <g transform="translate(395, 370)">
    <rect x="0" y="0" width="155" height="36" rx="18" fill="url(#green)" opacity="0.15"/>
    <text x="78" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#16A34A">Made in France</text>
  </g>
  <g transform="translate(570, 370)">
    <rect x="0" y="0" width="155" height="36" rx="18" fill="url(#green)" opacity="0.15"/>
    <text x="78" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#16A34A">Cruelty Free</text>
  </g>
  <g transform="translate(745, 370)">
    <rect x="0" y="0" width="185" height="36" rx="18" fill="url(#green)" opacity="0.15"/>
    <text x="93" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#16A34A">Livraison Gratuite</text>
  </g>
  <!-- Marques -->
  <text x="600" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#6B7280">Coslys · Kadalys · Marilou Bio · Royer Bio · Antonin B</text>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="url(#pink)" opacity="0.9"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">Jusqu'a -50% sur des cosmetiques bio francaises · Produits grand format</text>
</svg>
