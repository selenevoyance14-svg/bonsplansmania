<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8bbd0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- Brand -->
  <text x="400" y="55" font-family="Arial, sans-serif" font-size="16" fill="#ad1457" text-anchor="middle" letter-spacing="3">PIN UP SECRET</text>
  <!-- Pinup Days banner -->
  <rect x="250" y="70" width="300" height="40" rx="0" fill="none" stroke="#212121" stroke-width="1.5"/>
  <text x="400" y="97" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#212121" text-anchor="middle" letter-spacing="2">PINUP DAYS</text>
  <!-- Main offer -->
  <text x="400" y="175" font-family="Arial, sans-serif" font-size="20" fill="#424242" text-anchor="middle">CHOISISSEZ 3 PRODUITS :</text>
  <text x="400" y="230" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#212121" text-anchor="middle">2 ACHETES</text>
  <text x="400" y="275" font-family="Arial, sans-serif" font-size="22" fill="#757575" text-anchor="middle">=</text>
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ad1457" text-anchor="middle">LE 3e OFFERT</text>
  <!-- Sub info -->
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="14" fill="#616161" text-anchor="middle">Sur tout le site — le produit le moins cher offert</text>
  <!-- Footer perks -->
  <rect x="100" y="395" width="600" height="35" rx="8" fill="white" opacity="0.6"/>
  <text x="250" y="418" font-family="Arial, sans-serif" font-size="12" fill="#616161" text-anchor="middle">Livraison offerte des 49E</text>
  <line x1="400" y1="400" x2="400" y2="425" stroke="#e0e0e0" stroke-width="1"/>
  <text x="550" y="418" font-family="Arial, sans-serif" font-size="12" fill="#616161" text-anchor="middle">Paiement 3x sans frais</text>
</svg>
