<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="50%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E05A6D"/>
      <stop offset="100%" style="stop-color:#D94462"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Camera illustration -->
  <g transform="translate(120, 200)" opacity="0.3">
    <circle cx="40" cy="40" r="35" fill="#374151"/>
    <circle cx="40" cy="40" r="25" fill="none" stroke="url(#cyan)" stroke-width="2"/>
    <circle cx="40" cy="40" r="12" fill="url(#cyan)" opacity="0.3"/>
    <circle cx="40" cy="40" r="5" fill="url(#cyan)" opacity="0.6"/>
    <rect x="15" y="70" width="50" height="30" rx="6" fill="#374151"/>
  </g>
  <!-- Signal waves -->
  <g transform="translate(1020, 200)" opacity="0.15">
    <path d="M 0 40 Q 20 20, 40 40 Q 60 60, 80 40" stroke="url(#cyan)" stroke-width="2" fill="none"/>
    <path d="M 10 25 Q 30 5, 50 25 Q 70 45, 90 25" stroke="url(#cyan)" stroke-width="1.5" fill="none"/>
    <path d="M 20 55 Q 40 35, 60 55 Q 80 75, 100 55" stroke="url(#cyan)" stroke-width="1" fill="none"/>
  </g>
  <!-- Badge TEST GRATUIT -->
  <rect x="370" y="50" width="460" height="52" rx="26" fill="url(#red)"/>
  <text x="600" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="white">TEST GRATUIT · 12 EXEMPLAIRES</text>
  <!-- Brand -->
  <text x="600" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="white" opacity="0.4" letter-spacing="5">TESTER DES PRODUITS · IMOU</text>
  <!-- Main text -->
  <text x="600" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="50" font-weight="900" fill="white">Caméra de Surveillance</text>
  <text x="600" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="url(#cyan)">Connectée Imou</text>
  <!-- Features -->
  <g transform="translate(190, 365)">
    <rect x="0" y="0" width="150" height="38" rx="19" fill="white" opacity="0.08"/>
    <text x="75" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="white" opacity="0.7">Vidéo HD</text>
  </g>
  <g transform="translate(360, 365)">
    <rect x="0" y="0" width="180" height="38" rx="19" fill="white" opacity="0.08"/>
    <text x="90" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="white" opacity="0.7">Vision nocturne</text>
  </g>
  <g transform="translate(560, 365)">
    <rect x="0" y="0" width="200" height="38" rx="19" fill="white" opacity="0.08"/>
    <text x="100" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="white" opacity="0.7">Détection mouvements</text>
  </g>
  <g transform="translate(780, 365)">
    <rect x="0" y="0" width="210" height="38" rx="19" fill="white" opacity="0.08"/>
    <text x="105" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="white" opacity="0.7">Audio bidirectionnel</text>
  </g>
  <!-- Use cases -->
  <text x="600" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="white" opacity="0.5">Maison · Bébé · Animaux — Contrôle depuis smartphone</text>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="url(#red)" opacity="0.95"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">Tirage au sort le 1er juin 2026 — Inscription gratuite</text>
</svg>
