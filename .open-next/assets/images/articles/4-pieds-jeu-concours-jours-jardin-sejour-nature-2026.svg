<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A3D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3A7050;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A8A65;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8944A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D07830;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative leaves -->
  <circle cx="1050" cy="100" r="160" fill="white" fill-opacity="0.04" />
  <circle cx="150" cy="520" r="120" fill="white" fill-opacity="0.04" />
  <ellipse cx="1000" cy="400" rx="80" ry="120" fill="white" fill-opacity="0.03" transform="rotate(-15 1000 400)" />
  <ellipse cx="1100" cy="300" rx="60" ry="100" fill="white" fill-opacity="0.03" transform="rotate(10 1100 300)" />

  <!-- Site badge -->
  <rect x="80" y="60" width="240" height="44" rx="22" fill="white" fill-opacity="0.15" />
  <text x="200" y="88" font-family="Georgia, serif" font-size="18" fill="white" text-anchor="middle" font-weight="600">BonsPlansMania.fr</text>

  <!-- Concours badge -->
  <rect x="80" y="130" width="220" height="36" rx="18" fill="url(#badge)" />
  <text x="190" y="154" font-family="Georgia, serif" font-size="16" fill="white" text-anchor="middle" font-weight="700">JEU CONCOURS</text>

  <!-- Main title -->
  <text x="80" y="260" font-family="Georgia, serif" font-size="56" fill="white" font-weight="700">4 PIEDS</text>
  <text x="80" y="320" font-family="Georgia, serif" font-size="36" fill="#E8944A" font-weight="600">Les Jours Jardin</text>

  <!-- Divider -->
  <rect x="80" y="350" width="120" height="3" rx="2" fill="white" fill-opacity="0.5" />

  <!-- Info lines -->
  <rect x="80" y="385" width="520" height="50" rx="10" fill="white" fill-opacity="0.12" />
  <text x="100" y="417" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="700">Un sejour nature et evasion pour 2 personnes</text>

  <rect x="80" y="450" width="480" height="50" rx="10" fill="white" fill-opacity="0.10" />
  <text x="100" y="482" font-family="Arial, sans-serif" font-size="20" fill="white" font-weight="600">En ligne ou en magasin - 25 magasins en France</text>

  <!-- Date -->
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="18" fill="white" fill-opacity="0.7">Du 3 au 27 avril 2026 - Participation gratuite</text>
</svg>
