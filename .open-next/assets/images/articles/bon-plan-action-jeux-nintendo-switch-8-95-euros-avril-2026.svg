<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe8d0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0054a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2878c8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative -->
  <circle cx="700" cy="70" r="70" fill="#0054a6" opacity="0.05"/>
  <circle cx="80" cy="400" r="50" fill="#e87c1e" opacity="0.06"/>

  <!-- Badge Semaine d'Action -->
  <rect x="40" y="25" width="300" height="36" rx="18" fill="#e87c1e"/>
  <text x="190" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">SEMAINE D'ACTION 01-07/04</text>

  <!-- Brand -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#0054a6">ACTION</text>

  <!-- Product -->
  <text x="40" y="155" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2d3436">Jeux Nintendo Switch</text>
  <text x="40" y="185" font-family="Arial, sans-serif" font-size="16" fill="#636e72">Codes de telechargement - Divers modeles</text>

  <!-- Price -->
  <rect x="40" y="210" width="160" height="70" rx="14" fill="#0054a6"/>
  <text x="120" y="250" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="white" text-anchor="middle">8,95</text>
  <text x="120" y="272" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" fill-opacity="0.8">euros/piece</text>

  <!-- Games list -->
  <text x="40" y="320" font-family="Arial, sans-serif" font-size="14" fill="#444">
    <tspan x="40" dy="0">Jeux disponibles :</tspan>
    <tspan x="40" dy="24">L.O.L. Surprise - Sonic - My Little Pony</tspan>
    <tspan x="40" dy="24">LEGO - Totally Spies - et plus</tspan>
  </text>

  <!-- Game cards illustration (right side) -->
  <!-- Card 1 -->
  <rect x="500" y="80" width="80" height="110" rx="8" fill="white" stroke="#0054a6" stroke-width="2" opacity="0.9"/>
  <rect x="510" y="95" width="60" height="60" rx="4" fill="#ff69b4" opacity="0.25"/>
  <text x="540" y="172" font-family="Arial, sans-serif" font-size="9" fill="#0054a6" text-anchor="middle" font-weight="bold">L.O.L.</text>

  <!-- Card 2 -->
  <rect x="600" y="70" width="80" height="110" rx="8" fill="white" stroke="#0054a6" stroke-width="2" opacity="0.85"/>
  <rect x="610" y="85" width="60" height="60" rx="4" fill="#4a90d9" opacity="0.25"/>
  <text x="640" y="162" font-family="Arial, sans-serif" font-size="9" fill="#0054a6" text-anchor="middle" font-weight="bold">SONIC</text>

  <!-- Card 3 -->
  <rect x="700" y="90" width="70" height="100" rx="8" fill="white" stroke="#0054a6" stroke-width="2" opacity="0.8"/>
  <rect x="708" y="103" width="54" height="54" rx="4" fill="#dda0dd" opacity="0.25"/>
  <text x="735" y="172" font-family="Arial, sans-serif" font-size="8" fill="#0054a6" text-anchor="middle" font-weight="bold">MY LITTLE PONY</text>

  <!-- Switch logo area -->
  <rect x="540" y="230" width="200" height="50" rx="10" fill="white" opacity="0.6" stroke="#e0e0e0" stroke-width="1"/>
  <text x="640" y="250" font-family="Arial, sans-serif" font-size="11" fill="#636e72" text-anchor="middle">Compatible</text>
  <text x="640" y="268" font-family="Arial, sans-serif" font-size="14" fill="#e4000f" text-anchor="middle" font-weight="bold">Nintendo Switch 1 et 2</text>

  <!-- Price sticker -->
  <circle cx="660" cy="340" r="42" fill="#e87c1e"/>
  <text x="660" y="332" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">SEULEMENT</text>
  <text x="660" y="355" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">8,95E</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#e0d0c0"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#b0b0b0" text-anchor="middle">bonsplansmania.fr — Action</text>
</svg>