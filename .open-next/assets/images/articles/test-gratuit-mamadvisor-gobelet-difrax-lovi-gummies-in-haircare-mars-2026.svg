<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff3e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- MamAdvisor badge -->
  <rect x="250" y="20" width="300" height="40" rx="20" fill="#e91e63"/>
  <text x="400" y="47" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">MAMADVISOR</text>
  <!-- Title -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#212121" text-anchor="middle">2 Produits à Tester Gratuitement</text>
  <!-- Product 1 -->
  <rect x="50" y="130" width="330" height="260" rx="12" fill="white" opacity="0.95"/>
  <circle cx="100" cy="170" r="25" fill="#fdd835"/>
  <text x="100" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#212121" text-anchor="middle">À TESTER</text>
  <text x="215" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">Gobelet Genius Cup</text>
  <text x="215" y="200" font-family="Arial, sans-serif" font-size="13" fill="#e91e63" text-anchor="middle">Difrax LOVI</text>
  <text x="215" y="240" font-family="Arial, sans-serif" font-size="12" fill="#616161" text-anchor="middle">Gobelet éducatif pour enfant</text>
  <text x="215" y="260" font-family="Arial, sans-serif" font-size="12" fill="#616161" text-anchor="middle">Posture naturelle, poignées</text>
  <text x="215" y="280" font-family="Arial, sans-serif" font-size="12" fill="#616161" text-anchor="middle">ergonomiques, évolutif</text>
  <rect x="140" y="310" width="150" height="35" rx="8" fill="#e91e63"/>
  <text x="215" y="333" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Puériculture</text>
  <!-- Product 2 -->
  <rect x="420" y="130" width="330" height="260" rx="12" fill="white" opacity="0.95"/>
  <circle cx="470" cy="170" r="25" fill="#fdd835"/>
  <text x="470" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#212121" text-anchor="middle">À TESTER</text>
  <text x="585" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">Gummies Cheveux</text>
  <text x="585" y="200" font-family="Arial, sans-serif" font-size="13" fill="#e91e63" text-anchor="middle">In Haircare</text>
  <text x="585" y="240" font-family="Arial, sans-serif" font-size="12" fill="#616161" text-anchor="middle">Cure pousse et volume</text>
  <text x="585" y="260" font-family="Arial, sans-serif" font-size="12" fill="#616161" text-anchor="middle">Biotine, roquette, zinc</text>
  <text x="585" y="280" font-family="Arial, sans-serif" font-size="12" fill="#616161" text-anchor="middle">Vitamines B</text>
  <rect x="510" y="310" width="150" height="35" rx="8" fill="#e91e63"/>
  <text x="585" y="333" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Cheveux</text>
  <!-- Footer -->
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="14" fill="#9e9e9e" text-anchor="middle">Plateforme Magicmaman — Gratuit en échange d'un avis</text>
</svg>
