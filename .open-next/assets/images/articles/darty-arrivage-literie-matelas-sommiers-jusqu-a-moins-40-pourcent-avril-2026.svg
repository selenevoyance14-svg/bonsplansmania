<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#E8E0D8"/>
    </linearGradient>
  </defs>
  <!-- Fond beige doux -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Mur -->
  <rect x="0" y="0" width="800" height="250" fill="#EDE7E0"/>
  <!-- Sol parquet -->
  <rect x="0" y="250" width="800" height="200" fill="#D4C4B0"/>
  <line x1="0" y1="290" x2="800" y2="290" stroke="#C9B99A" stroke-width="0.5"/>
  <line x1="0" y1="330" x2="800" y2="330" stroke="#C9B99A" stroke-width="0.5"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#C9B99A" stroke-width="0.5"/>
  <!-- Lit - cadre -->
  <rect x="150" y="180" width="500" height="30" rx="4" fill="#8B6914" stroke="#6B4F10" stroke-width="1.5"/>
  <!-- Tête de lit -->
  <rect x="150" y="100" width="20" height="110" rx="4" fill="#8B6914" stroke="#6B4F10" stroke-width="1.5"/>
  <rect x="630" y="140" width="20" height="70" rx="4" fill="#8B6914" stroke="#6B4F10" stroke-width="1.5"/>
  <!-- Matelas -->
  <rect x="170" y="150" width="460" height="35" rx="6" fill="#FFFFFF" stroke="#DDD" stroke-width="1.5"/>
  <!-- Texture matelas -->
  <line x1="200" y1="155" x2="200" y2="180" stroke="#F0F0F0" stroke-width="0.5"/>
  <line x1="250" y1="155" x2="250" y2="180" stroke="#F0F0F0" stroke-width="0.5"/>
  <line x1="300" y1="155" x2="300" y2="180" stroke="#F0F0F0" stroke-width="0.5"/>
  <line x1="350" y1="155" x2="350" y2="180" stroke="#F0F0F0" stroke-width="0.5"/>
  <line x1="400" y1="155" x2="400" y2="180" stroke="#F0F0F0" stroke-width="0.5"/>
  <line x1="450" y1="155" x2="450" y2="180" stroke="#F0F0F0" stroke-width="0.5"/>
  <line x1="500" y1="155" x2="500" y2="180" stroke="#F0F0F0" stroke-width="0.5"/>
  <line x1="550" y1="155" x2="550" y2="180" stroke="#F0F0F0" stroke-width="0.5"/>
  <line x1="600" y1="155" x2="600" y2="180" stroke="#F0F0F0" stroke-width="0.5"/>
  <!-- Couette -->
  <rect x="250" y="130" width="300" height="55" rx="12" fill="#B3D9FF" opacity="0.7"/>
  <rect x="250" y="130" width="300" height="55" rx="12" fill="none" stroke="#8EC5FF" stroke-width="1"/>
  <!-- Oreillers -->
  <ellipse cx="210" cy="142" rx="35" ry="18" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
  <ellipse cx="280" cy="142" rx="35" ry="18" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
  <!-- Pieds du lit -->
  <rect x="170" y="210" width="15" height="45" rx="3" fill="#6B4F10"/>
  <rect x="615" y="210" width="15" height="45" rx="3" fill="#6B4F10"/>
  <!-- Table de nuit -->
  <rect x="50" y="170" width="70" height="70" rx="4" fill="#A0845C" stroke="#8B6914" stroke-width="1"/>
  <rect x="55" y="180" width="60" height="20" rx="2" fill="#8B7340"/>
  <circle cx="85" cy="190" r="3" fill="#D4AF37"/>
  <!-- Lampe -->
  <rect x="80" y="130" width="6" height="40" fill="#888"/>
  <path d="M65 130 Q83 110 101 130" fill="#FFE4B5" stroke="#DDD" stroke-width="1"/>
  <!-- Zzz -->
  <text x="680" y="100" font-family="Arial" font-size="28" fill="#8EC5FF" opacity="0.4" font-weight="bold">Z</text>
  <text x="700" y="75" font-family="Arial" font-size="22" fill="#8EC5FF" opacity="0.3" font-weight="bold">z</text>
  <text x="715" y="55" font-family="Arial" font-size="16" fill="#8EC5FF" opacity="0.2" font-weight="bold">z</text>
  <!-- Badge -40% -->
  <circle cx="710" cy="160" r="48" fill="#FF0040"/>
  <text x="710" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF">JUSQU'A</text>
  <text x="710" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="26" fill="#FFFFFF">-40%</text>
  <!-- Titre -->
  <rect x="140" y="350" width="520" height="70" rx="10" fill="rgba(139,105,20,0.85)"/>
  <text x="400" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF">Darty — Arrivage Literie</text>
  <text x="400" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FFE4B5">Matelas et sommiers jusqu'au 26 avril</text>
</svg>
