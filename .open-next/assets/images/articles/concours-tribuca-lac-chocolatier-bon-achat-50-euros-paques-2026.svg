<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3E1F0D"/>
      <stop offset="50%" style="stop-color:#5C2E0E"/>
      <stop offset="100%" style="stop-color:#3E1F0D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <linearGradient id="choco" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="100%" style="stop-color:#5C4510"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Easter egg decorations -->
  <g transform="translate(120, 180)" opacity="0.3">
    <ellipse cx="40" cy="55" rx="35" ry="50" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <path d="M 15 40 Q 40 25, 65 40" stroke="url(#gold)" stroke-width="1" fill="none"/>
    <path d="M 15 55 Q 40 70, 65 55" stroke="url(#gold)" stroke-width="1" fill="none"/>
  </g>
  <g transform="translate(1020, 160)" opacity="0.25">
    <ellipse cx="35" cy="45" rx="30" ry="42" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="5" y1="35" x2="65" y2="35" stroke="url(#gold)" stroke-width="1"/>
    <line x1="5" y1="55" x2="65" y2="55" stroke="url(#gold)" stroke-width="1"/>
  </g>
  <!-- Chocolate box silhouette -->
  <g transform="translate(100, 350)" opacity="0.2">
    <rect x="0" y="10" width="100" height="60" rx="4" fill="url(#gold)"/>
    <polygon points="0,10 15,0 115,0 100,10" fill="url(#gold)" opacity="0.7"/>
    <rect x="10" y="20" width="20" height="20" rx="8" fill="#3E1F0D"/>
    <rect x="40" y="20" width="20" height="20" rx="8" fill="#3E1F0D"/>
    <rect x="70" y="20" width="20" height="20" rx="8" fill="#3E1F0D"/>
  </g>
  <!-- Badge CONCOURS PAQUES -->
  <rect x="380" y="55" width="440" height="52" rx="26" fill="#DC2626"/>
  <text x="600" y="89" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="white">CONCOURS DE PAQUES</text>
  <!-- Main text -->
  <text x="600" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="url(#gold)" opacity="0.7" letter-spacing="5">LAC CHOCOLATIER</text>
  <text x="600" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="54" font-weight="900" fill="white">Bon d'Achat 50E</text>
  <text x="600" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="url(#gold)">Chocolats Artisanaux</text>
  <!-- Plus abonnement -->
  <text x="600" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white" opacity="0.6">+ 1 an d'abonnement Tribune Cote d'Azur</text>
  <!-- Countdown -->
  <rect x="470" y="430" width="260" height="40" rx="20" fill="white" opacity="0.1"/>
  <text x="600" y="457" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="white" opacity="0.7">Plus que 4 jours pour participer</text>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="url(#gold)" opacity="0.95"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#3E1F0D">Participation gratuite — Jusqu'au 31 mars 2026</text>
</svg>
