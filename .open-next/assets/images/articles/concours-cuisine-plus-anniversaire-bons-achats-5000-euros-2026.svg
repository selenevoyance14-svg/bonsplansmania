<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#efebe9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d7ccc8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8a45c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0824a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <!-- Brand -->
  <rect x="290" y="15" width="220" height="40" rx="4" fill="#c62828"/>
  <text x="400" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">CUISINE PLUS</text>
  <!-- Title -->
  <text x="400" y="95" font-family="Georgia, serif" font-size="18" fill="#757575" text-anchor="middle">Grand Jeu</text>
  <text x="400" y="130" font-family="Georgia, serif" font-size="30" font-weight="bold" fill="url(#gold)" text-anchor="middle">Le bel Anniversaire</text>
  <text x="400" y="160" font-family="Arial, sans-serif" font-size="13" fill="#9e9e9e" text-anchor="middle">DU 9 MARS AU 25 AVRIL 2026</text>
  <!-- Prize boxes -->
  <rect x="120" y="190" width="250" height="120" rx="10" fill="white" opacity="0.9" stroke="#c8a45c" stroke-width="1"/>
  <text x="245" y="225" font-family="Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">2 BONS D'ACHAT DE</text>
  <text x="245" y="270" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#c62828" text-anchor="middle">1000€</text>
  <rect x="430" y="190" width="250" height="120" rx="10" fill="white" opacity="0.9" stroke="#c8a45c" stroke-width="2"/>
  <text x="555" y="225" font-family="Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="middle" font-weight="bold">1 BON D'ACHAT DE</text>
  <text x="555" y="270" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#c62828" text-anchor="middle">3000€</text>
  <!-- Total -->
  <rect x="250" y="335" width="300" height="50" rx="8" fill="url(#gold)"/>
  <text x="400" y="367" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">TOTAL : 5000€ à gagner</text>
  <!-- Footer -->
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="13" fill="#9e9e9e" text-anchor="middle">Tirage au sort — Participation gratuite — 3 gagnants</text>
</svg>
