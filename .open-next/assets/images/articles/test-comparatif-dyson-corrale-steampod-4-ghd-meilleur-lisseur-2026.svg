<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative -->
  <circle cx="700" cy="70" r="80" fill="#c8a882" opacity="0.06"/>
  <circle cx="80" cy="400" r="50" fill="#e84393" opacity="0.04"/>

  <!-- Badge -->
  <rect x="40" y="25" width="260" height="36" rx="18" fill="#e84393"/>
  <text x="170" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">COMPARATIF / TEST</text>

  <!-- Title -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="white">Dyson Corrale vs Steampod 4</text>
  <text x="40" y="145" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="white">vs GHD : quel lisseur choisir ?</text>

  <!-- Product 1 : Dyson -->
  <rect x="40" y="175" width="220" height="110" rx="12" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="150" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e84393" text-anchor="middle">Dyson Corrale</text>
  <text x="150" y="222" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">~449E</text>
  <text x="150" y="245" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" fill-opacity="0.6">Sans fil - Plaques flexibles</text>
  <text x="150" y="262" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" fill-opacity="0.6">Polyvalent - Nomade</text>

  <!-- Product 2 : Steampod -->
  <rect x="280" y="175" width="220" height="110" rx="12" fill="white" fill-opacity="0.08" stroke="#ffd700" stroke-opacity="0.3" stroke-width="1"/>
  <text x="390" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffd700" text-anchor="middle">Steampod 4</text>
  <text x="390" y="222" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">~340E</text>
  <text x="390" y="245" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" fill-opacity="0.6">Vapeur - Cheveux epais/crepus</text>
  <text x="390" y="262" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" fill-opacity="0.6">Tenue longue duree</text>

  <!-- Product 3 : GHD -->
  <rect x="520" y="175" width="220" height="110" rx="12" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="630" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#a8e6cf" text-anchor="middle">GHD Platinum+</text>
  <text x="630" y="222" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">~250E</text>
  <text x="630" y="245" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" fill-opacity="0.6">185C fixe - Cheveux fins/normaux</text>
  <text x="630" y="262" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" fill-opacity="0.6">Leger - Rapport qualite/prix</text>

  <!-- Bottom verdict -->
  <text x="40" y="330" font-family="Arial, sans-serif" font-size="15" fill="white" fill-opacity="0.7">On a compare les 3 lisseurs stars du moment.</text>
  <text x="40" y="355" font-family="Arial, sans-serif" font-size="15" fill="white" fill-opacity="0.7">Lequel vaut vraiment son prix ? Notre verdict.</text>

  <!-- Footer -->
  <rect x="40" y="408" width="720" height="1" fill="white" opacity="0.08"/>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.2" text-anchor="middle">bonsplansmania.fr — Comparatif lisseurs 2026</text>
</svg>