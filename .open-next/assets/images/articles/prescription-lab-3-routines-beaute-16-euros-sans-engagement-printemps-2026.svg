<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f0fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0e6f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b5cc6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Decorative clouds -->
  <ellipse cx="650" cy="50" rx="80" ry="30" fill="white" opacity="0.4"/>
  <ellipse cx="150" cy="40" rx="60" ry="22" fill="white" opacity="0.3"/>

  <!-- Badge "OFFRE SPECIALE BEAUX JOURS" -->
  <rect x="40" y="25" width="330" height="36" rx="18" fill="url(#badge)"/>
  <text x="205" y="49" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1.5">OFFRE SPECIALE BEAUX JOURS</text>

  <!-- Main title -->
  <text x="40" y="105" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#1a1a2e">PRESCRIPTION LAB</text>
  <text x="40" y="150" font-family="Georgia, serif" font-size="30" fill="#1a1a2e">3 Routines pour</text>

  <!-- Price -->
  <rect x="40" y="170" width="160" height="55" rx="10" fill="#1a3a8a"/>
  <text x="120" y="207" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="white" text-anchor="middle">16 EUROS</text>

  <!-- Sans engagement -->
  <rect x="220" y="178" width="210" height="36" rx="18" fill="#f0c040"/>
  <text x="325" y="202" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e" text-anchor="middle">SANS ENGAGEMENT</text>

  <!-- 3 routine cards -->
  <!-- Card 1 - Glow -->
  <rect x="40" y="260" width="220" height="100" rx="10" fill="white" stroke="#d4c5f9" stroke-width="1.5"/>
  <rect x="40" y="260" width="220" height="30" rx="10" fill="#ffd6a5" opacity="0.5"/>
  <text x="150" y="281" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a3a8a" text-anchor="middle">100% GLOW</text>
  <text x="150" y="310" font-family="Arial, sans-serif" font-size="13" fill="#444" text-anchor="middle">Garancia, Polaar, Glamorama</text>
  <text x="150" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a3a8a" text-anchor="middle">Valeur : 65E</text>

  <!-- Card 2 - Normandie -->
  <rect x="280" y="260" width="220" height="100" rx="10" fill="white" stroke="#a8c8f0" stroke-width="2"/>
  <rect x="280" y="260" width="220" height="30" rx="10" fill="#a8c8f0" opacity="0.5"/>
  <text x="390" y="281" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a3a8a" text-anchor="middle">WEEK-END EN NORMANDIE</text>
  <text x="390" y="310" font-family="Arial, sans-serif" font-size="13" fill="#444" text-anchor="middle">Viogne, ErthSkin, Variations</text>
  <text x="390" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a3a8a" text-anchor="middle">Valeur : 107E</text>
  <!-- Best value indicator -->
  <circle cx="490" cy="265" r="18" fill="#e84393"/>
  <text x="490" y="262" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">BEST</text>
  <text x="490" y="273" font-family="Arial, sans-serif" font-size="7" fill="white" text-anchor="middle">VALUE</text>

  <!-- Card 3 - Make-Up -->
  <rect x="520" y="260" width="220" height="100" rx="10" fill="white" stroke="#f5b7c5" stroke-width="1.5"/>
  <rect x="520" y="260" width="220" height="30" rx="10" fill="#f5b7c5" opacity="0.5"/>
  <text x="630" y="281" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a3a8a" text-anchor="middle">ESSENTIELS MAKE-UP</text>
  <text x="630" y="310" font-family="Arial, sans-serif" font-size="13" fill="#444" text-anchor="middle">Beauty 3, vernis, levres</text>
  <text x="630" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a3a8a" text-anchor="middle">Valeur : 50E</text>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#d0d8e8"/>
  <text x="400" y="430" font-family="Georgia, serif" font-size="13" fill="#999" text-anchor="middle" font-style="italic">bonsplansmania.fr — Prescription Lab, ma parenthese beaute</text>
</svg>
