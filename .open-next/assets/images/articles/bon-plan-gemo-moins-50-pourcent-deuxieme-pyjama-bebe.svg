<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B08D7A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4B8A8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDE0D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1050" cy="80" r="220" fill="white" fill-opacity="0.06" />
  <circle cx="100" cy="560" r="180" fill="white" fill-opacity="0.06" />

  <!-- Site badge -->
  <rect x="80" y="60" width="220" height="44" rx="22" fill="white" fill-opacity="0.25" />
  <text x="190" y="88" font-family="Georgia, serif" font-size="18" fill="#5B3A28" text-anchor="middle" font-weight="600">BonsPlansMania.fr</text>

  <!-- Category badge -->
  <rect x="80" y="128" width="180" height="36" rx="18" fill="url(#badge)" />
  <text x="170" y="152" font-family="Arial, sans-serif" font-size="16" fill="#5B1A00" text-anchor="middle" font-weight="700">BON PLAN</text>

  <!-- Title -->
  <text x="80" y="248" font-family="Georgia, serif" font-size="48" fill="#3E2F1C" font-weight="400">Pyjamas Bebe</text>
  <text x="80" y="340" font-family="Georgia, serif" font-size="100" fill="#3E2F1C" font-weight="700">Gemo -50%</text>

  <rect x="80" y="360" width="100" height="3" rx="2" fill="#8B6914" fill-opacity="0.8" />

  <text x="80" y="410" font-family="Arial, sans-serif" font-size="28" fill="#3E2F1C" fill-opacity="0.9" font-weight="600">Sur le 2eme pyjama bebe achete</text>

  <!-- Details -->
  <rect x="80" y="440" width="680" height="64" rx="12" fill="white" fill-opacity="0.3" />
  <text x="100" y="465" font-family="Arial, sans-serif" font-size="18" fill="#3E2F1C" fill-opacity="0.85">Matieres douces · Motifs animaux · Confort nuit</text>
  <text x="100" y="492" font-family="Arial, sans-serif" font-size="22" fill="#8B6914" font-weight="700">En magasin et sur gemo.fr · Retrait gratuit</text>

  <!-- Badge -->
  <rect x="80" y="534" width="300" height="44" rx="10" fill="white" fill-opacity="0.25" />
  <text x="100" y="561" font-family="Arial, sans-serif" font-size="20" fill="#3E2F1C" font-weight="700">Offre en cours · Bebe</text>

  <text x="80" y="606" font-family="Arial, sans-serif" font-size="18" fill="#3E2F1C" fill-opacity="0.6">Avril 2026 · Gemo Pyjamas Bebe</text>
