<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338CA"/>
      <stop offset="50%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#4338CA"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FACC15"/>
      <stop offset="100%" style="stop-color:#EAB308"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Comic book style elements -->
  <!-- Book spines left -->
  <g transform="translate(60, 120)" opacity="0.3">
    <rect x="0" y="0" width="20" height="300" rx="2" fill="#EF4444"/>
    <rect x="25" y="20" width="18" height="280" rx="2" fill="#3B82F6"/>
    <rect x="48" y="10" width="22" height="290" rx="2" fill="#10B981"/>
    <rect x="75" y="30" width="16" height="270" rx="2" fill="#F59E0B"/>
    <rect x="96" y="5" width="20" height="295" rx="2" fill="#EC4899"/>
  </g>
  <!-- Book spines right -->
  <g transform="translate(1060, 140)" opacity="0.25">
    <rect x="0" y="0" width="18" height="280" rx="2" fill="#8B5CF6"/>
    <rect x="23" y="15" width="22" height="265" rx="2" fill="#F97316"/>
    <rect x="50" y="5" width="16" height="275" rx="2" fill="#14B8A6"/>
    <rect x="71" y="25" width="20" height="255" rx="2" fill="#E11D48"/>
  </g>
  <!-- Speech bubble decoration -->
  <g transform="translate(900, 80)" opacity="0.15">
    <ellipse cx="60" cy="40" rx="70" ry="45" fill="white"/>
    <polygon points="40,80 55,75 50,100" fill="white"/>
  </g>
  <!-- Badge -->
  <rect x="400" y="55" width="400" height="50" rx="25" fill="url(#yellow)"/>
  <text x="600" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="800" fill="#4338CA">CONCOURS GRATUIT · 5 LOTS</text>
  <!-- Event badge -->
  <rect x="460" y="130" width="280" height="38" rx="19" fill="white" opacity="0.15"/>
  <text x="600" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="white" opacity="0.8">48H DE LA BD · 3 et 4 AVRIL 2026</text>
  <!-- Main text -->
  <text x="600" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="900" fill="white">10 BD et Mangas</text>
  <text x="600" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="800" fill="url(#yellow)">a Gagner</text>
  <!-- Subtitle -->
  <text x="600" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="white" opacity="0.7">20 Minutes x 48H de la BD</text>
  <!-- Comic action words -->
  <text x="200" y="500" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="url(#yellow)" opacity="0.15" transform="rotate(-10, 200, 500)">POW!</text>
  <text x="950" y="480" font-family="Arial,sans-serif" font-size="32" font-weight="900" fill="url(#yellow)" opacity="0.12" transform="rotate(8, 950, 480)">BANG!</text>
  <!-- Bottom bar -->
  <rect x="0" y="530" width="1200" height="100" fill="url(#yellow)" opacity="0.95"/>
  <text x="600" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#4338CA">La BD est en fete en France et en Belgique — Participation gratuite</text>
</svg>
