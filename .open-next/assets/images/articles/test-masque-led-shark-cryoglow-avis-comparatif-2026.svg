<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e84393;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- LED glow effects -->
  <circle cx="620" cy="200" r="140" fill="url(#glow)"/>
  <circle cx="620" cy="200" r="80" fill="#e84393" opacity="0.05"/>
  <circle cx="620" cy="200" r="50" fill="#6c5ce7" opacity="0.04"/>

  <!-- Badge -->
  <rect x="40" y="25" width="260" height="36" rx="18" fill="#e84393"/>
  <text x="170" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">TEST PRODUIT / AVIS</text>

  <!-- Title -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">Masque LED Shark</text>
  <text x="40" y="145" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#e84393">CryoGlow</text>
  <text x="40" y="178" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.7">Notre avis apres analyse des tests et retours</text>

  <!-- Specs -->
  <rect x="40" y="205" width="180" height="50" rx="10" fill="white" fill-opacity="0.08"/>
  <text x="130" y="226" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.6" text-anchor="middle">Prix</text>
  <text x="130" y="245" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">300-350E</text>

  <rect x="235" y="205" width="180" height="50" rx="10" fill="white" fill-opacity="0.08"/>
  <text x="325" y="226" font-family="Arial, sans-serif" font-size="11" fill="white" fill-opacity="0.6" text-anchor="middle">Note clients</text>
  <text x="325" y="245" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">4,5/5</text>

  <!-- Key features -->
  <text x="40" y="300" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.7">
    <tspan x="40" dy="0">480 LED tri-meches (bleu, rouge, infrarouge)</tspan>
    <tspan x="40" dy="22">4 programmes : anti-age, imperfections, entretien, yeux</tspan>
    <tspan x="40" dy="22">Seances de 4 a 8 minutes - Froid localise contour yeux</tspan>
  </text>

  <!-- Mask illustration (right side) -->
  <ellipse cx="620" cy="180" rx="70" ry="90" fill="white" opacity="0.06" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
  <!-- LED dots -->
  <circle cx="590" cy="155" r="4" fill="#e84393" opacity="0.4"/>
  <circle cx="650" cy="155" r="4" fill="#e84393" opacity="0.4"/>
  <circle cx="590" cy="175" r="3" fill="#6c5ce7" opacity="0.3"/>
  <circle cx="650" cy="175" r="3" fill="#6c5ce7" opacity="0.3"/>
  <circle cx="620" cy="200" r="3" fill="#e84393" opacity="0.3"/>
  <circle cx="605" cy="220" r="3" fill="#6c5ce7" opacity="0.25"/>
  <circle cx="635" cy="220" r="3" fill="#6c5ce7" opacity="0.25"/>

  <!-- Results badge -->
  <circle cx="680" cy="340" r="42" fill="#e84393" opacity="0.8"/>
  <text x="680" y="332" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">ECLAT</text>
  <text x="680" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">+34%</text>
  <text x="680" y="366" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">en 8 sem.</text>

  <!-- Footer -->
  <rect x="40" y="408" width="720" height="1" fill="white" opacity="0.05"/>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.2" text-anchor="middle">bonsplansmania.fr — Test produit beaute</text>
</svg>