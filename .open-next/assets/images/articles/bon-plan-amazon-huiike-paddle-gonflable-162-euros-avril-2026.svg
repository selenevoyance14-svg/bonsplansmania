<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b2e8e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Water decoration -->
  <ellipse cx="400" cy="430" rx="380" ry="30" fill="#88d8d8" opacity="0.3"/>
  <circle cx="700" cy="70" r="60" fill="white" opacity="0.2"/>

  <!-- Badge -->
  <rect x="40" y="25" width="260" height="36" rx="18" fill="url(#badge)"/>
  <text x="170" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">OFFRE ECLAIR AMAZON</text>

  <!-- Brand -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2d3436">HUIIKE Paddle</text>
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="16" fill="#636e72">Paddle gonflable adulte - Kit complet</text>

  <!-- Price -->
  <rect x="40" y="165" width="200" height="65" rx="12" fill="white" stroke="#e67e22" stroke-width="2"/>
  <text x="55" y="190" font-family="Arial, sans-serif" font-size="14" fill="#636e72"><tspan text-decoration="line-through">239,99E</tspan></text>
  <text x="155" y="195" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#e67e22">162,49E</text>
  <text x="140" y="220" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" text-anchor="middle" font-weight="bold">-32%</text>

  <!-- Rating -->
  <text x="260" y="190" font-family="Arial, sans-serif" font-size="15" fill="#f39c12" font-weight="bold">4,5/5</text>
  <text x="260" y="210" font-family="Arial, sans-serif" font-size="12" fill="#636e72">(2 500 avis)</text>

  <!-- Specs -->
  <text x="40" y="270" font-family="Arial, sans-serif" font-size="14" fill="#444">
    <tspan x="40" dy="0">305 x 84 x 15 cm - Jusqu'a 130 kg</tspan>
    <tspan x="40" dy="24">Pagaie + ailerons + pompe + siege inclus</tspan>
    <tspan x="40" dy="24">Livraison gratuite Prime</tspan>
  </text>

  <!-- Paddle illustration (right side) -->
  <!-- Board -->
  <rect x="580" y="60" width="50" height="280" rx="25" fill="#7ecec0" stroke="white" stroke-width="2"/>
  <rect x="592" y="80" width="26" height="40" rx="4" fill="white" opacity="0.3"/>
  <text x="605" y="105" font-family="Arial, sans-serif" font-size="8" fill="#2d3436" text-anchor="middle" font-weight="bold">HUIIKE</text>
  <!-- Grip pad -->
  <rect x="590" y="160" width="30" height="80" rx="4" fill="#5ab8a8" opacity="0.5"/>

  <!-- Paddle -->
  <line x1="680" y1="80" x2="680" y2="320" stroke="#c8a060" stroke-width="4"/>
  <rect x="668" y="60" width="24" height="40" rx="4" fill="#c8a060" opacity="0.6"/>

  <!-- Pump -->
  <rect x="720" y="180" width="25" height="60" rx="4" fill="#f39c12" opacity="0.3"/>
  <rect x="726" y="160" width="13" height="25" rx="3" fill="#636e72" opacity="0.3"/>

  <!-- Footer -->
  <rect x="40" y="400" width="720" height="1" fill="#88b8b8"/>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="13" fill="#88b8b8" text-anchor="middle">bonsplansmania.fr — Amazon</text>
</svg>