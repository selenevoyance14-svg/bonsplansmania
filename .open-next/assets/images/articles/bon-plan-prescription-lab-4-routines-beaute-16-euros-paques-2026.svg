  <text x="320" y="255" font-family="Arial, sans-serif" font-size="7" fill="#7B1FA2" opacity="0.5">Cottan</text>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="7" fill="#7B1FA2" opacity="0.5">Huygens</text>
  <text x="480" y="255" font-family="Arial, sans-serif" font-size="7" fill="#7B1FA2" opacity="0.5">Weleda</text>
  <text x="555" y="250" font-family="Arial, sans-serif" font-size="7" fill="#7B1FA2" opacity="0.5">grüum</text>
