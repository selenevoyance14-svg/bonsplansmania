  <rect x="140" y="160" width="20" height="60" rx="5" fill="#FFFFFF" opacity="0.7"/>
  <rect x="143" y="175" width="14" height="20" rx="3" fill="#E1BEE7" opacity="0.5"/>
  <!-- Tube 2 -->
  <rect x="380" y="130" width="18" height="55" rx="5" fill="#C8E6C9" opacity="0.7"/>
  <!-- Flacon 3 -->
