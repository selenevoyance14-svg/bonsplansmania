  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="#FFFFFF">Prescription Lab — 4 Routines pour 16€</text>
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E1BEE7">Box Mille Eclats + Trousse 100% Marques Stars — Sans engagement</text>
