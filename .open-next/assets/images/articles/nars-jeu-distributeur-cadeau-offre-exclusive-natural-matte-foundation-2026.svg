  <rect x="590" y="115" width="12" height="32" rx="2" fill="#c8a882" opacity="0.5"/>
  <rect x="607" y="115" width="12" height="32" rx="2" fill="#b88a64" opacity="0.45"/>
  <rect x="624" y="115" width="12" height="32" rx="2" fill="#c09a74" opacity="0.4"/>
  <rect x="641" y="115" width="12" height="32" rx="2" fill="#d4b896" opacity="0.45"/>

  <rect x="505" y="175" width="12" height="32" rx="2" fill="#d4b896" opacity="0.4"/>
  <rect x="522" y="175" width="12" height="32" rx="2" fill="#c09a74" opacity="0.45"/>
  <rect x="539" y="175" width="12" height="32" rx="2" fill="#b88a64" opacity="0.5"/>
  <rect x="556" y="175" width="12" height="32" rx="2" fill="#c8a882" opacity="0.45"/>
  <rect x="573" y="175" width="12" height="32" rx="2" fill="#d4b896" opacity="0.4"/>
  <rect x="590" y="175" width="12" height="32" rx="2" fill="#c09a74" opacity="0.5"/>
  <rect x="607" y="175" width="12" height="32" rx="2" fill="#b88a64" opacity="0.45"/>
  <rect x="624" y="175" width="12" height="32" rx="2" fill="#c8a882" opacity="0.4"/>
  <rect x="641" y="175" width="12" height="32" rx="2" fill="#d4b896" opacity="0.45"/>

  <!-- Keypad -->
  <rect x="680" y="140" width="28" height="40" rx="4" fill="#222" stroke="#333" stroke-width="1"/>
  <rect x="680" y="195" width="28" height="28" rx="4" fill="#222" stroke="#333" stroke-width="1"/>

  <!-- Dispensing slot -->
