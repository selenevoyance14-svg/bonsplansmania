<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Subtle light effects -->
  <circle cx="400" cy="200" r="200" fill="white" opacity="0.02"/>
  <circle cx="400" cy="250" r="120" fill="white" opacity="0.015"/>

  <!-- Badge -->
  <rect x="40" y="25" width="260" height="36" rx="18" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.2" stroke-width="1"/>
  <text x="170" y="49" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">JEU EN LIGNE GRATUIT</text>

  <!-- Brand -->
  <text x="40" y="115" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="white" letter-spacing="8">NARS</text>

  <!-- Main title -->
  <text x="40" y="165" font-family="Arial, sans-serif" font-size="22" fill="white" fill-opacity="0.9">Relevez tous les defis.</text>

  <!-- Description -->
  <text x="40" y="210" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.6">
    <tspan x="40" dy="0">Secouez le distributeur automatique</tspan>
    <tspan x="40" dy="22">pour debloquer le Natural Matte</tspan>
    <tspan x="40" dy="22">Longwear Foundation et remporter</tspan>
    <tspan x="40" dy="22">un cadeau ou une offre exclusive</tspan>
  </text>

