  <text x="110" y="365" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" letter-spacing="2">JOUER</text>

  <!-- Footer -->
  <rect x="40" y="410" width="720" height="1" fill="white" opacity="0.05"/>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.2" text-anchor="middle">bonsplansmania.fr — NARS Cosmetics</text>
