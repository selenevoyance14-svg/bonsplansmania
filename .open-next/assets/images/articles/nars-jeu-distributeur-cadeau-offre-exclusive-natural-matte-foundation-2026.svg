  <text x="600" y="90" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" letter-spacing="4" fill-opacity="0.7">NARS</text>
  <!-- Shelves -->
  <rect x="495" y="105" width="170" height="50" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="495" y="165" width="170" height="50" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="495" y="225" width="170" height="50" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <rect x="495" y="285" width="170" height="50" rx="4" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Products on shelves -->
  <rect x="505" y="115" width="12" height="32" rx="2" fill="#c8a882" opacity="0.5"/>
  <rect x="522" y="115" width="12" height="32" rx="2" fill="#d4b896" opacity="0.45"/>
  <rect x="539" y="115" width="12" height="32" rx="2" fill="#c09a74" opacity="0.5"/>
