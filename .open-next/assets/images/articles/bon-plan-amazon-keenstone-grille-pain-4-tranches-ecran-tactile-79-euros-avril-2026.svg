<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" rx="12"/>

  <!-- Badge -->
  <rect x="40" y="25" width="220" height="36" rx="18" fill="url(#badge)"/>
  <text x="150" y="49" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">CHOIX D'AMAZON</text>

  <!-- Brand -->
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">KEENSTONE</text>
  <text x="40" y="140" font-family="Arial, sans-serif" font-size="16" fill="white" fill-opacity="0.7">Grille-pain 4 tranches - Ecran tactile intelligent</text>

  <!-- Price -->
  <rect x="40" y="165" width="200" height="65" rx="12" fill="white" fill-opacity="0.08" stroke="#e67e22" stroke-width="2"/>
  <text x="55" y="190" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.5"><tspan text-decoration="line-through">99,99E</tspan></text>
  <text x="155" y="195" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#e67e22">79,99E</text>
  <text x="140" y="220" font-family="Arial, sans-serif" font-size="14" fill="#e74c3c" text-anchor="middle" font-weight="bold">-20%</text>

  <!-- Rating -->
  <text x="260" y="190" font-family="Arial, sans-serif" font-size="15" fill="#f39c12" font-weight="bold">4,5/5</text>
  <text x="260" y="210" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.6">(99 avis)</text>
  <text x="260" y="230" font-family="Arial, sans-serif" font-size="12" fill="#e67e22" font-weight="bold">1400W - Acier inox</text>

  <!-- Specs -->
  <text x="40" y="275" font-family="Arial, sans-serif" font-size="14" fill="white" fill-opacity="0.8">
    <tspan x="40" dy="0">Ecran tactile - 6 niveaux de brunissage</tspan>
    <tspan x="40" dy="24">Memoire - Rechauffage - Degivrage</tspan>
    <tspan x="40" dy="24">Bagels/Muffins - Livraison gratuite Prime</tspan>
  </text>

  <!-- Toaster illustration (right side) -->
  <!-- Body -->
  <rect x="540" y="150" width="180" height="120" rx="10" fill="#444" stroke="#666" stroke-width="2"/>
  <!-- Top slots -->
  <rect x="560" y="145" width="30" height="12" rx="4" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="600" y="145" width="30" height="12" rx="4" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="650" y="145" width="30" height="12" rx="4" fill="#333" stroke="#555" stroke-width="1"/>
  <rect x="690" y="145" width="30" height="12" rx="4" fill="#333" stroke="#555" stroke-width="1"/>
  <!-- Screen -->
  <rect x="580" y="180" width="100" height="40" rx="6" fill="#1a1a2e" stroke="#e67e22" stroke-width="1"/>
  <text x="630" y="205" font-family="Arial, sans-serif" font-size="16" fill="#e67e22" text-anchor="middle" font-weight="bold">2:30</text>
  <!-- Lever -->
  <rect x="555" y="190" width="10" height="30" rx="3" fill="#888"/>
  <!-- Base -->
  <rect x="535" y="270" width="190" height="8" rx="4" fill="#333"/>
  <!-- Toast peeking out -->
  <rect x="563" y="130" width="24" height="20" rx="3" fill="#d4a054"/>
  <rect x="653" y="135" width="24" height="15" rx="3" fill="#c89040"/>
  <!-- Orange accent glow -->
  <line x1="560" y1="157" x2="720" y2="157" stroke="#e67e22" stroke-width="1" opacity="0.4"/>

  <!-- Footer -->
  <rect x="40" y="408" width="720" height="1" fill="white" opacity="0.05"/>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="13" fill="white" fill-opacity="0.2" text-anchor="middle">bonsplansmania.fr — Amazon</text>
</svg>